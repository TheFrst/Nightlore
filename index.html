<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nightlore</title><meta name="description" content="A world map of ghosts and legends, and a game where folklore decides whether you survive the night.">
<meta name="theme-color" content="#0e1326">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0e1326;--deep:#080b18;--land:#1b2347;--edge:#36437a;--bone:#ece4cf;--dim:#a3a8c3;--faint:#6d7396;--candle:#f2b54a;--spirit:#8ff0dc;--blood:#e0344f;--f-old:'IM Fell English',Georgia,serif;--f-sc:'IM Fell English SC',Georgia,serif;--f-ui:'Karla',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--bone)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;min-height:100vh;background:radial-gradient(120% 80% at 70% -10%,#1d2550 0%,var(--night) 55%,var(--deep) 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--spirit);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{background:transparent;border:1px solid var(--edge);border-radius:999px;padding:11px 22px;font-weight:600;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--candle)}.btn.primary{background:var(--candle);border-color:var(--candle);color:#1b1206}.btn.primary:hover{background:#ffc768}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 18px;background:rgba(8,11,24,.86);backdrop-filter:blur(8px);border-bottom:1px solid #222a50}
.brand{background:none;border:0;font-family:var(--f-sc);font-size:24px;letter-spacing:.08em;padding:0;color:var(--bone)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--dim);white-space:nowrap;font-weight:600}
.tabs button.on{color:var(--bone);box-shadow:inset 0 -2px var(--candle)}.tabs button:hover{color:var(--bone)}
.set{background:none;border:1px solid #2b3463;border-radius:999px;padding:6px 12px;color:var(--dim);font-size:13px;white-space:nowrap}
main{outline:none}
/* map */
.mapwrap{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 57px)}
.map{position:relative;overflow:hidden;background:radial-gradient(90% 90% at 50% 50%,#0f1633,#070a17);touch-action:none}
#msvg{width:100%;height:100%;display:block;cursor:grab}#msvg:active{cursor:grabbing}
.grat line{stroke:#1a2247;stroke-width:.4}.land{fill:var(--land);stroke:var(--edge);stroke-width:.35;stroke-linejoin:round}
.pin{cursor:pointer}.pin .dot{fill:var(--candle);stroke:#1b1206;stroke-width:.3}.pin.rev .dot{fill:var(--spirit)}
.pin.dim{opacity:.13;pointer-events:none}.pin.sel .dot{fill:#fff}.pin:hover .dot,.pin:focus .dot{fill:#fff}.pin:focus{outline:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--edge);background:rgba(8,11,24,.85);font-size:18px}
.hint{position:absolute;left:14px;bottom:8px;margin:0;font-size:12px;color:var(--faint)}
.side{overflow-y:auto;border-left:1px solid #222a50;background:rgba(8,11,24,.6);padding:16px}
.filters{display:flex;flex-direction:column;gap:10px}
.srch input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--edge);background:#0a0e20;color:var(--bone);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #2b3463;background:none;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--dim)}.chip.on{border-color:var(--candle);color:var(--bone);background:rgba(242,181,74,.12)}
.count{color:var(--faint);font-size:13px;margin:12px 0 6px}
.glist{list-style:none;margin:0;padding:0}.glist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #1a2147;padding:8px 4px}
.glist button:hover{background:rgba(143,240,220,.05)}.glist b{display:block;font-family:var(--f-old);font-size:19px;font-weight:400;line-height:1.15}.glist small{color:var(--dim)}
.mini{width:42px;height:42px;flex:none;border-radius:50%;overflow:hidden;background:#05060c;display:block}.mini svg{width:100%;height:100%}
.met{margin-left:auto;font-style:normal;font-size:11px;color:var(--spirit);border:1px solid rgba(143,240,220,.4);border-radius:999px;padding:1px 7px}
.empty{color:var(--dim);padding:16px 0}
.back{background:none;border:0;color:var(--dim);padding:0 0 10px;font-weight:600}.back::before{content:'‹ '}
.gcard h2{font-family:var(--f-old);font-weight:400;font-size:38px;line-height:1;margin:12px 0 4px;outline:none}
.gart{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#05060c;box-shadow:0 0 0 1px #2b3463,0 20px 60px -20px rgba(224,52,79,.5)}.gart svg{width:100%;height:100%}
.place{margin:0;color:var(--dim)}.place span{display:block;font-size:13px;color:var(--faint)}
.danger{display:inline-flex;gap:4px;margin:10px 0}.danger i{width:7px;height:14px;border-radius:50% 50% 40% 40%;background:#2b3463}.danger i.on{background:var(--candle);box-shadow:0 0 8px var(--candle)}
.story{font-family:var(--f-old);font-size:19px;line-height:1.55}
.rev{border-left:2px solid var(--spirit);padding-left:12px;color:var(--spirit);font-size:14px}
.lore{margin:18px 0;display:grid;gap:12px}.lore div{padding-left:12px;border-left:2px solid #2b3463}.lore .ok{border-color:var(--spirit)}.lore .no{border-color:var(--blood)}
.lore dt{font-size:13px;color:var(--faint);font-weight:600}.lore dd{margin:2px 0 0;font-family:var(--f-old);font-size:18px}
.status{color:var(--dim);font-size:14px}
/* bestiary */
.book{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.bhead h1,.setup h1,.stage h1{font-family:var(--f-old);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1;margin:0 0 8px}
.bhead p{color:var(--dim);margin:0 0 20px}.book h2{font-family:var(--f-old);font-weight:400;font-size:26px;margin:30px 0 10px;border-bottom:1px solid #222a50;padding-bottom:6px}.book h2 small{font-family:var(--f-ui);font-size:13px;color:var(--faint)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.grid button{width:100%;background:none;border:0;text-align:center;padding:6px}.grid .art{display:block;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#05060c;filter:grayscale(.85) brightness(.55);transition:filter .3s;margin-bottom:6px}
.grid .got .art,.grid button:hover .art{filter:none}.grid .art svg{width:100%;height:100%}.grid b{display:block;font-family:var(--f-old);font-weight:400;font-size:17px;line-height:1.15}.grid small{color:var(--faint);font-size:12px}
/* survive */
.stage{max-width:640px;margin:0 auto;padding:30px 18px 60px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--faint);font-size:13px;border-bottom:1px solid #222a50;padding-bottom:10px;margin-bottom:26px}
.nerve{display:inline-flex;gap:6px}.nerve i{width:9px;height:18px;border-radius:50% 50% 40% 40%;background:#2b3463}.nerve i.lit{background:var(--candle);box-shadow:0 0 10px var(--candle);animation:flick 2.4s infinite}
.nerve i:nth-child(2){animation-delay:.7s}.nerve i:nth-child(3){animation-delay:1.3s}@keyframes flick{0%,100%{opacity:1}45%{opacity:.75}50%{opacity:1}}
.lede{font-family:var(--f-old);font-size:20px;color:var(--dim)}
.scene:focus{outline:none}.scene{font-family:var(--f-old);font-size:clamp(22px,4.2vw,28px);line-height:1.4;margin:0 0 18px}.scene.sign{color:#fff}.scene.ok{color:var(--spirit)}.scene.bad{color:#ff8a9b}
.air{font-style:italic;font-family:var(--f-old);color:var(--faint);margin:0 0 14px}
.q{font-weight:600;color:var(--dim);margin:22px 0 10px}
.choices{display:flex;flex-direction:column;gap:10px}.choices button{text-align:left;background:rgba(8,11,24,.6);border:1px solid #2b3463;border-radius:12px;padding:14px 16px;font-size:17px}
.choices button:hover:not(:disabled){border-color:var(--candle);background:rgba(242,181,74,.07)}.choices button:disabled{opacity:.5;cursor:default}
.you{color:var(--faint);font-size:14px}.lorehint{border-left:2px solid var(--spirit);padding-left:12px;color:var(--dim)}.lorehint b{color:var(--bone);font-weight:600}
.where{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.where button{text-align:left;background:rgba(8,11,24,.6);border:1px solid #2b3463;border-radius:12px;padding:12px 14px}.where button:hover{border-color:var(--candle)}
.where b{display:block}.where small{color:var(--faint);font-size:13px}.small{color:var(--faint);font-size:13px;margin-top:20px}
.nlog{list-style:none;padding:0;margin:20px 0;display:grid;gap:6px}.nlog li{display:grid;grid-template-columns:80px 1fr;column-gap:12px;padding:8px 12px;border-radius:10px;background:rgba(8,11,24,.6)}.nlog span{color:var(--faint);font-size:13px;grid-row:span 2}
.nlog b{font-family:var(--f-old);font-weight:400;font-size:18px}.nlog small{color:var(--faint)}.nlog li.ok{box-shadow:inset 2px 0 var(--spirit)}.nlog li.bad{box-shadow:inset 2px 0 var(--blood)}
.sun{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ffe0a8,#f2b54a 60%,transparent 70%);margin:0 0 10px;box-shadow:0 0 80px #f2b54a}
.lost{color:var(--blood)}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,4,10,.8);display:grid;place-items:center;padding:16px}
.mbox{max-width:480px;width:100%;background:#0d1228;border:1px solid var(--edge);border-radius:16px;padding:24px}.mbox h2{font-family:var(--f-old);font-weight:400;font-size:30px;margin:0 0 6px}.mbox p{color:var(--dim)}
.lv{display:grid;gap:8px;margin:14px 0}.lv label{display:flex;gap:12px;align-items:flex-start;border:1px solid #2b3463;border-radius:12px;padding:10px 12px;cursor:pointer}.lv label:has(input:checked){border-color:var(--candle)}
.lv input{accent-color:var(--candle);margin-top:5px}.lv small{display:block;color:var(--faint)}.snd{display:flex;gap:8px;align-items:center;color:var(--dim);margin:0 0 16px}.snd input{accent-color:var(--candle)}
/* title */
#title{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 70% at 50% 0%,#202a5c,#0b0f22 60%,#05060d);display:grid;place-items:center;overflow:hidden;transition:opacity .6s}
#title.out{opacity:0;pointer-events:none}#tc{position:absolute;inset:0;width:100%;height:100%}
.tin{position:relative;text-align:center;padding:24px 18px;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{font-family:var(--f-sc);font-weight:400;font-size:clamp(50px,13vw,128px);letter-spacing:.06em;line-height:.9;margin:0;display:flex}
.logo span{display:inline-block;animation:rise 1.2s calc(var(--i)*.07s) cubic-bezier(.2,.8,.2,1) both,haunt 7s calc(2s + var(--i)*.4s) infinite}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(8px)}}
@keyframes haunt{0%,92%,100%{transform:none;text-shadow:none}93%{transform:translate(2px,-1px);text-shadow:-3px 0 var(--blood),3px 0 var(--spirit)}95%{transform:translate(-2px,1px);text-shadow:3px 0 var(--blood),-3px 0 var(--spirit)}}
.tag{font-family:var(--f-old);font-size:20px;color:var(--dim);margin:0}
.whisper{font-size:14px;color:var(--faint);max-width:460px;margin:0}.whisper i{font-family:var(--f-old);font-size:16px;color:var(--dim)}
.made{margin:10px 0 0;color:var(--dim)}.made b{color:var(--candle)}.ver{font-size:12px;color:var(--faint);margin:0;max-width:440px}
/* jumpscare */
#scare{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden;cursor:pointer;outline:none}
#scare.pre{background:#000!important}#scare.pre .sc-stage,#scare.pre .sc-name{opacity:0}
.sc-stage{position:relative;width:min(92vmin,760px);aspect-ratio:1}.sc-l,.sc-slice{position:absolute;inset:0}.sc-l svg,.sc-slice svg{width:100%;height:100%}
.glow{filter:drop-shadow(0 0 3px currentColor)}
.full.go .sc-l.r{mix-blend-mode:screen;filter:sepia(1) saturate(9) hue-rotate(-50deg);opacity:.7;animation:chR .6s steps(3) both}
.full.go .sc-l.c{mix-blend-mode:screen;filter:sepia(1) saturate(6) hue-rotate(130deg);opacity:.6;animation:chC .6s steps(3) both}
@keyframes chR{0%{transform:translate(-30px,6px)}60%{transform:translate(-8px,0)}100%{transform:translate(-3px,0)}}@keyframes chC{0%{transform:translate(30px,-6px)}60%{transform:translate(8px,0)}100%{transform:translate(3px,0)}}
.sc-tear{position:absolute;inset:0;opacity:0}.full.go .sc-tear{animation:tearOn .7s .05s both}@keyframes tearOn{0%,90%{opacity:1}100%{opacity:0}}
.sc-slice{clip-path:inset(calc(var(--i)*16.6%) 0 calc(100% - (var(--i) + 1)*16.6%) 0);animation:slice .7s steps(5) both;animation-delay:calc(var(--i)*-.07s)}
@keyframes slice{0%{transform:translateX(-40px)}25%{transform:translateX(50px)}50%{transform:translateX(-20px)}75%{transform:translateX(12px)}100%{transform:none}}
.full.go::before{content:'';position:fixed;inset:0;background:#fff;animation:flash .16s both;z-index:3;pointer-events:none}@keyframes flash{from{opacity:.85}to{opacity:0}}
.go .sc-stage{animation:var(--ent) .26s cubic-bezier(.1,.9,.2,1.2) both,breathe 2.8s .3s ease-in-out infinite}
.e-rush{--ent:rush}.e-drop{--ent:drop}.e-rise{--ent:riseU}.e-split{--ent:split}.e-stretch{--ent:stretch}.e-burst{--ent:burst}.e-swarm{--ent:swarm}.e-slide{--ent:slide}
@keyframes rush{from{transform:scale(.15)}to{transform:scale(1.12)}}@keyframes drop{from{transform:translateY(-110%) scale(1.2)}to{transform:translateY(0) scale(1.12)}}
@keyframes riseU{from{transform:translateY(100%) scale(.9)}to{transform:scale(1.12)}}@keyframes split{from{clip-path:inset(0 50% 0 50%);transform:scale(1.4)}to{clip-path:inset(0);transform:scale(1.12)}}
@keyframes stretch{from{transform:scaleY(.1) scaleX(1.6)}to{transform:scaleY(1.25) scaleX(.95)}}@keyframes burst{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1.15) rotate(0)}}
@keyframes swarm{from{transform:scale(3);opacity:0}to{transform:scale(1.12);opacity:1}}@keyframes slide{from{transform:translateX(-120%) skewX(30deg)}to{transform:translateX(0) scale(1.12)}}
#scare.again .sc-stage{animation:snap .18s cubic-bezier(.1,.9,.2,1.3) both}@keyframes snap{from{transform:scale(1.12)}to{transform:scale(1.75)}}
@keyframes breathe{0%,100%{transform:scale(1.12)}50%{transform:scale(1.16)}}
.sc-name{position:absolute;bottom:5vh;left:16px;right:16px;text-align:center;font-family:var(--f-sc);font-size:clamp(26px,6.5vw,72px);line-height:1;letter-spacing:.1em;color:#fff;mix-blend-mode:difference;transition:opacity .2s}
.full.go .sc-name{animation:nm .9s steps(6) both}@keyframes nm{0%{letter-spacing:1em;opacity:0;transform:scaleY(3)}40%{opacity:1}100%{letter-spacing:.12em;transform:none}}
.sc-grain{position:absolute;inset:-50%;pointer-events:none;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;animation:grain .3s steps(3) infinite}@keyframes grain{to{transform:translate(7px,-5px)}}
.sc-tap{position:absolute;bottom:14px;color:#777;font-size:12px}
.mild.go .sc-stage{animation:mildIn 1s ease-out both}@keyframes mildIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.mild .sc-grain{display:none}
#scare.out{opacity:0;transition:opacity .35s}
#scare.calm{background:rgba(3,4,10,.92)}.sc-calm{text-align:center}.sc-calm svg{width:200px;height:200px;border-radius:50%;background:#05060c}.sc-calm p{font-family:var(--f-old);font-size:26px;margin:10px 0 4px}.sc-calm small{color:var(--faint)}
body.shake #app{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}#scare.go .sc-stage{will-change:transform}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-3px)}}
body.shake #scare{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}

/* ---- wave 2 ---- */
.maptools{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}.maptools button{background:rgba(8,11,24,.88);border:1px solid var(--edge);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}.maptools button:hover{border-color:var(--candle)}
.placing #msvg{cursor:crosshair}.placebar{position:absolute;left:50%;top:60px;transform:translateX(-50%);margin:0;background:var(--blood);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.pin.mine .dot{fill:#ff8aa0}.pin .ring{fill:none;stroke:var(--spirit);stroke-width:.25;opacity:.7}
.lore .ch{border-color:var(--candle)}
.row.left{justify-content:flex-start}.btn.danger{border-color:#5a2030;color:#ff9aab}.btn.danger:hover{border-color:var(--blood)}
.gcard h3{font-family:var(--f-old);font-weight:400;font-size:20px;margin:26px 0 8px;color:var(--dim)}
.rel{display:flex;flex-wrap:wrap;gap:8px}.rel button{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;background:none;border:1px solid #222a50;border-radius:12px;padding:8px 4px;font-family:var(--f-old);font-size:15px;line-height:1.1;text-align:center}.rel button:hover{border-color:var(--candle)}.rel small{font-family:var(--f-ui);font-size:11px;color:var(--faint)}
.meter{height:6px;border-radius:9px;background:#1a2147;overflow:hidden;margin:-8px 0 10px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--spirit),var(--candle))}
.passport,.achs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.passport li,.achs li{border:1px dashed #2b3463;border-radius:12px;padding:10px 12px;color:var(--faint)}.passport li.on,.achs li.on{border-style:solid;border-color:var(--candle);color:var(--bone);background:rgba(242,181,74,.06)}
.passport b,.achs b{display:block;font-family:var(--f-old);font-weight:400;font-size:18px}.passport small,.achs small{font-size:12px;color:var(--faint)}
.stamp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border:1.5px solid currentColor;border-radius:6px;padding:1px 6px;transform:rotate(-4deg);margin-bottom:4px}.passport li.on .stamp{color:var(--candle)}
.bf{margin:30px 0 0}.fold summary{cursor:pointer;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary h2::after{content:' +';color:var(--faint);font-family:var(--f-ui);font-size:16px}.fold[open] summary h2::after{content:' −'}
.daily{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(120deg,rgba(143,240,220,.08),rgba(242,181,74,.06));border:1px solid #2f4a6a;border-radius:16px;padding:14px 16px;margin:6px 0 10px}.daily:hover{border-color:var(--spirit)}.daily b{display:block;font-family:var(--f-old);font-weight:400;font-size:22px}.daily small{color:var(--dim)}
.moon{flex:none;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7e0,#d9cfae 60%,#8a8470);box-shadow:0 0 24px rgba(255,247,224,.35)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{text-align:left;background:rgba(8,11,24,.6);border:1px solid #2b3463;border-radius:12px;padding:10px 12px}.seg button.on{border-color:var(--candle);background:rgba(242,181,74,.08)}.seg b{display:block}.seg small{color:var(--faint);font-size:12px;line-height:1.3;display:block}
.where button{position:relative}.st{position:absolute;right:8px;top:8px;font-style:normal;font-size:10px;font-weight:700;color:var(--candle);border:1.5px solid var(--candle);border-radius:5px;padding:0 5px;transform:rotate(6deg)}
.pocket{font-size:14px;color:var(--faint)}.pocket span{display:inline-block;margin:2px 4px;padding:2px 9px;border:1px solid #4a4020;border-radius:999px;color:var(--candle)}
.timer{height:4px;border-radius:9px;background:#1a2147;overflow:hidden;margin:-4px 0 6px}.timer i{display:block;height:100%;width:100%;background:var(--candle);transition:width .1s linear}.timer i.low{background:var(--blood)}

["pocong","Pocong","Central Java, Indonesia","sea",-7.0,110.4,"shroud",3,"A corpse whose burial shroud was never untied. Bound at the feet, it cannot walk, so it hops, and it wants the knot loosened so it can finally rest.","Thump. Thump. Something wrapped in white hops down the alley toward you.","Untie the knot at the top of its head","Run down the alley"],
["genderuwo","Genderuwo","Central Java, Indonesia","sea",-7.3,110.0,"beast",3,"A huge, hairy spirit of old banyan trees and abandoned buildings. It is a gifted mimic and likes to borrow the voices of people you trust.","Your friend's voice calls from the dark banyan tree. Your friend went home an hour ago.","Answer no one and leave the tree behind","Follow the familiar voice"],
["tuyul","Tuyul","West Java, Indonesia","sea",-6.9,107.6,"imp",1,"A small, bald child spirit kept by greedy people to steal money. It is still a child, and toys distract it from its errand.","Coins vanish from the table one by one. Tiny wet footprints cross the floor.","Leave toys and a crab out to distract it","Crawl under the bed to grab it"],
["wewegombel","Wewe Gombel","Semarang, Indonesia","sea",-7.03,110.4,"hair",2,"A long-armed spirit of Bukit Gombel who hides children that are mistreated at home, and gives them back once the parents change their ways.","A child stands at the edge of the palm grove. A long arm beckons from the dark.","Call the child home gently and promise to do better","Shout and scold the child"],
["leak","Leak","Bali, Indonesia","sea",-8.65,115.2,"head",4,"A practitioner of dark magic whose head roams the night trailing glowing organs. People see it as a floating light over cemeteries.","A pale light bobs over the cemetery. Then a head lifts with it.","Stay inside the temple courtyard until dawn","Follow the floating light"],
["susterngesot","Suster Ngesot","Jakarta, Indonesia","sea",-6.2,106.8,"hair",3,"The ghost of a nurse who drags herself along the corridors of old hospitals, still doing her rounds.","In the empty ward, something drags across the tiles. Scrape. Scrape.","Climb onto a bed and keep your feet off the floor","Hide under the bed"],
["sundelbolong","Sundel Bolong","Yogyakarta, Indonesia","sea",-7.8,110.36,"hair",3,"A beautiful woman in white whose long hair hides a hollow in her back. She is said to stop men on dark roads.","A beautiful woman asks to share your umbrella. Her hair hangs strangely heavy at the back.","Politely decline and keep to the lit street","Brush her hair aside"],
["banaspati","Banaspati","East Java, Indonesia","sea",-7.6,112.7,"fire",3,"A fire spirit that rolls along dark roads like a burning ball, and sometimes walks on its hands. It fears water.","A ball of fire rolls along the road, then rises on two flaming hands.","Step into the stream beside the road","Try to stamp it out"],
["babingepet","Babi Ngepet","West Java, Indonesia","sea",-6.6,106.8,"beast",2,"A person who turns into a black pig to steal from neighbours, while a partner at home guards a candle. If the flame shakes, the pig is in danger.","A black pig rubs against the shop door. Through a window, a single candle flickers.","Find the candle and blow it out","Corner the pig with a broom"],
["nyiroro","Nyi Roro Kidul","Parangtritis, Indonesia","sea",-8.02,110.33,"water",2,"The Queen of the Southern Sea in Javanese tradition, honoured with offerings to this day. Visitors to the south coast are asked not to wear green, her colour.","On the southern beach the waves turn emerald. You are wearing green.","Step back from the surf and bow your head","Wade in for a closer look","r"],
["palasik","Palasik","West Sumatra, Indonesia","sea",-0.95,100.35,"head",3,"A Minangkabau tale of a person who sends out their head at night to prey on infants. Families keep babies close and lamps lit.","A neighbour admired the baby too long today. Tonight, something taps at the window.","Keep the shutters closed and the lamp burning","Open the window to see"],
["begu","Begu Ganjang","North Sumatra, Indonesia","sea",2.7,98.9,"tall",4,"A Batak spirit that grows taller the longer you stare at it. Those who keep looking are said to fall sick.","A figure stands by the road. Each time you blink it is taller.","Look at your feet and walk away","Keep watching it"],
["bunian","Orang Bunian","Riau, Indonesia","sea",0.5,101.4,"void",2,"Invisible people of the deep forest who live in a hidden village. Travellers who wander toward their music may not come back for years.","Music drifts from deep in the jungle: a wedding you were never invited to.","Ask permission aloud and turn back","Follow the music"],
["pontianak","Pontianak","Selangor, Malaysia","sea",3.14,101.69,"hair",4,"The Malay cousin of the kuntilanak, announced by the scent of frangipani. A nail pressed into the nape of her neck is said to tame her.","Sweet frangipani hangs in the air, where no flowers grow.","Grip an iron nail and leave quickly","Search for the flowers"],
["toyol","Toyol","Perak, Malaysia","sea",4.6,101.1,"imp",1,"A tiny green child spirit sent to steal. It loves to play, and marbles scattered on the floor will keep it busy until dawn.","Your purse is lighter every morning. Something giggles under the cupboard.","Scatter marbles across the floor","Lock the money away and sleep"],
["penanggal","Penanggalan","Kelantan, Malaysia","sea",6.1,102.2,"head",4,"A woman whose head flies off at night with her organs dangling. Thorny leaves on windowsills catch the trailing entrails.","A wet, dragging sound outside. Something glistens as it rises past the window.","Put thorny pandan leaves on the windowsill","Leave the window open for the breeze"],
["manananggal","Manananggal","Capiz, Philippines","sea",11.58,122.75,"bird",4,"She splits at the waist and flies on bat wings, leaving her lower half behind. Salt or ash on the standing half means she cannot rejoin it.","Bat wings beat overhead. Behind the hut, half a body stands alone.","Pour salt on the standing lower half","Hide in the hut and wait"],
["aswang","Aswang","Capiz, Philippines","sea",11.4,122.6,"beast",4,"A shapeshifter of Visayan folklore. Its call goes 'tik-tik': the fainter it sounds, the closer it really is.","Tik-tik... tik-tik. The sound is faint. Something lands on the roof.","Rub garlic on the door and keep watch","Relax, it sounds far away"],
["tikbalang","Tikbalang","Batangas, Philippines","sea",14.0,121.0,"horned",2,"A tall horse-headed trickster that leads travellers in circles. Turning your shirt inside out breaks the spell.","You have passed this same tree three times. Hooves clop behind you.","Turn your shirt inside out","Keep walking the same path"],
["balete","White Lady of Balete Drive","Quezon City, Philippines","sea",14.61,121.03,"hair",3,"Drivers on Balete Drive tell of a woman in white who appears in the back seat, or steps out in front of the car.","Driving past the old balete trees, you see a woman in white in your rear-view mirror.","Eyes on the road, and don't stop","Pull over to offer her a ride"],
["kapre","Kapre","Cebu, Philippines","sea",10.3,123.9,"beast",2,"A tree giant who sits in old acacia and balete trees smoking a huge cigar. Polite people say 'tabi-tabi po' as they pass.","Cigar smoke drifts from an acacia. Two embers glow, too high to be human.","Say 'tabi-tabi po' and pass politely","Shout an insult at the tree"],
["tiyanak","Tiyanak","Pampanga, Philippines","sea",15.0,120.7,"imp",3,"A creature that cries like a lost baby in the forest, then shows its true face to whoever picks it up.","A baby is crying alone in the forest. It stops when you get close.","Turn your clothes inside out and walk on","Pick up the crying baby"],
["krasue","Krasue","Surin, Thailand","sea",15.2,104.85,"head",4,"A floating woman's head with glowing organs hanging beneath. Villagers fence their homes with thorny bamboo, which tangles her.","A greenish glow floats along the rice paddies, low, swaying.","Stay behind the thorn fence","Leave food scraps out for it"],
["phipop","Phi Pop","Udon Thani, Thailand","sea",16.4,102.8,"void",3,"A spirit from Isan that slips inside a person and eats them from within. Only a village healer, the mor phi, can drive it out.","Your travel companion is speaking in a voice that isn't theirs.","Fetch the village healer","Let them sleep it off"],
["maenak","Mae Nak","Phra Khanong, Bangkok","sea",13.7,100.6,"hair",3,"A devoted wife who died while her husband was at war, and kept house as if nothing had changed. Her arm stretched impossibly to fetch a dropped lime.","Your hostess drops a lime through the floorboards, and her arm reaches down. Longer. Longer.","Act as if you saw nothing, and leave at dawn","Scream and run through the house"],
["mada","Ma Da","Mekong Delta, Vietnam","sea",10.0,105.8,"water",3,"The spirits of the drowned, said to wait in rivers for someone to take their place.","At dusk, someone calls your name from the middle of the river.","Stay out of the river until morning","Swim toward the voice"],
["ap","Ahp","Kampong Speu, Cambodia","sea",11.55,104.3,"head",3,"The Khmer floating head, a close relative of the krasue, that hunts by night and hides its body by day.","Something hovers over the village well, dripping light.","Hang thorny branches over the doorway","Go out to draw water"],
["kuchisake","Kuchisake-onna","Gifu, Japan","ea",35.4,136.76,"mouth",4,"A woman in a surgical mask asks 'Am I pretty?' Yes and no are both fatal answers. Telling her she looks average confuses her long enough to escape.","A woman in a mask blocks the path. 'Am I pretty?' She reaches for the mask.","Say 'You look average'","Say 'No'"],
["teketeke","Teke Teke","Hokkaido, Japan","ea",43.06,141.35,"hair",4,"The upper half of a girl who scrapes along on her elbows near railway lines: teke, teke, teke.","Teke. Teke. Teke. Something is clattering along the tracks behind you.","Get off the tracks and into the lit station","Look back to see what it is"],
["hanako","Hanako-san","Tokyo, Japan","ea",35.68,139.69,"void",2,"A girl who lives in the third stall of a school's third-floor toilet. Knock three times and say her name, and she answers.","Third floor, third stall. The door is closed. Someone is waiting.","Leave the third stall alone","Knock three times and say her name"],
["yukionna","Yuki-onna","Niigata, Japan","ea",37.9,139.0,"hair",3,"The snow woman, pale as a blizzard. In the famous tale she spares a young man on one condition: he must never speak of her.","Snow fills the hut's doorway. A pale woman bends over you, breath like frost.","Promise never to speak of her","Fall back asleep"],
["kappa","Kappa","Tono, Iwate, Japan","ea",39.33,141.53,"water",2,"A river creature with a dish of water on its head that gives it strength. It is very polite: bow, and it bows back, spilling the water.","Something with a shell and a beak rises from the river and stares at you.","Bow deeply","Wade in to grab it"],
["rokurokubi","Rokurokubi","Kyoto, Japan","ea",35.0,135.77,"head",2,"By day a normal person. At night, as they sleep, their neck stretches across the room.","In the inn, the guest beside you is asleep, and her neck is sliding across the ceiling.","Pretend to sleep until dawn","Grab the stretching neck"],
["akamanto","Aka Manto","Osaka, Japan","ea",34.69,135.5,"void",3,"A voice in the last school toilet asks: 'Red paper or blue paper?' Every colour ends badly, so you need no paper at all.","'Red paper... or blue paper?' a voice asks from the next stall.","Say you need no paper","Choose red paper"],
["noppera","Noppera-bo","Akasaka, Tokyo","ea",35.67,139.73,"void",2,"A faceless ghost that likes to frighten more than harm. In the classic tale, the noodle seller you run to for help is faceless too.","A woman crouches by the moat, crying. She turns. There is no face, only smooth skin.","Stay calm and walk toward the lit street","Run to the noodle seller for help"],
["jorogumo","Jorogumo","Joren Falls, Shizuoka","ea",34.85,138.92,"eyes",3,"A spider that becomes a beautiful woman and invites tired travellers to rest by the waterfall, then binds them in silk.","By the waterfall, a lovely woman invites you to rest. Fine threads glint around your ankles.","Cut the threads and leave the falls","Accept her invitation to rest"],
["gumiho","Gumiho","Gyeongsang, Korea","ea",35.8,128.6,"fox",3,"A nine-tailed fox that takes the shape of a beautiful woman and tries to steal a human's life energy.","A striking stranger insists you walk with her into the hills. Her shadow has nine tails.","Make an excuse and stay among people","Walk with her into the hills"],
["cheonyeo","Cheonyeo Gwishin","Miryang, Korea","ea",35.5,128.75,"hair",3,"The ghost of a young woman in a white hanbok who died with a grievance no one heard. In old tales she only wants someone brave enough to listen.","A girl in white with loose black hair stands at the foot of your sleeping mat, crying.","Listen to her story and promise to tell it","Flee screaming"],
["dokkaebi","Dokkaebi","Chungcheong, Korea","ea",36.35,127.38,"horned",1,"A mischievous Korean goblin who loves buckwheat jelly and wrestling. Its left leg is weak: hook it and you win.","A horned goblin blocks the mountain path and demands a wrestling match.","Wrestle it and hook its left leg","Hand over your purse"],
["jiangshi","Jiangshi","Xiangxi, Hunan, China","ea",28.3,109.7,"shroud",3,"A stiff, hopping corpse in Qing official robes. It finds the living by their breath, so holding yours makes you invisible.","A stiff figure in old robes hops through the moonlit courtyard, sniffing the air.","Hold your breath and stand still","Run away, panting"],
["egui","Hungry Ghosts","Guangzhou, China","ea",23.13,113.26,"mouth",2,"During Ghost Month the gates of the underworld open and hungry ghosts roam. Offerings are left by the road. Money found on the ground is never picked up.","Ghost Month. Red banknotes lie scattered on the empty street.","Leave food by the road and keep walking","Pick up the money"],
["girlinred","The Little Girl in Red","Taichung, Taiwan","ea",24.1,120.7,"imp",3,"A small girl in red who appears in a hiking group's home video, walking just behind them, when no child was with them.","On the mountain trail, a little girl in red waves for you to follow her into the trees.","Stay with the group on the trail","Follow her into the trees"],
["chudail","Chudail","Rajasthan, India","sa",26.9,75.8,"hair",4,"A spirit who appears as a lovely woman calling travellers to the well. Her feet point backwards.","A woman at the well calls you by name. Her footprints point the wrong way.","Check her feet, then leave without answering","Follow her to the well"],
["vetala","Vetala","Ujjain, India","sa",23.18,75.78,"skull",3,"A spirit that lives in corpses on cremation grounds. In the Vikram-Betal tales it tells riddles, and if you speak, it flies back to its tree.","The corpse on your shoulder starts telling a riddle. You know the answer.","Stay silent, even though you know it","Answer the riddle"],
["bhangarh","Bhangarh Fort","Rajasthan, India","sa",27.1,76.29,"void",2,"A ruined fort said to be cursed. A sign from the Archaeological Survey of India bans entry between sunset and sunrise.","Bhangarh. The sun is setting. A guard's whistle sounds far away.","Leave before sunset, as the sign says","Stay inside after dark"],
["nishi","Nishi","West Bengal, India","sa",22.57,88.36,"void",3,"A Bengali night spirit that calls your name in a loved one's voice. It only calls twice, so people wait for a third call before answering.","Late at night, your mother's voice calls your name. Twice. Then silence.","Wait, and answer only a third call","Answer straight away"],
["mohini","Mohini","Kandy, Sri Lanka","sa",7.29,80.63,"hair",3,"A woman in white holding a baby who appears on lonely roads, asking strangers to hold the child for a moment.","A woman in white steps from the dark holding a baby. 'Please, hold her for me.'","Refuse kindly and walk on","Take the baby"],
["pichalperi","Pichal Peri","Gilgit-Baltistan, Pakistan","sa",35.9,74.3,"hair",2,"A mountain fairy with backward-facing feet. Hunters who follow her tracks walk the wrong way, away from home.","Small footprints in the snow lead up the pass. They point down it.","Go down the mountain the way you came","Follow her footprints"],
["yeti","Yeti","Khumbu, Nepal","sa",27.98,86.92,"beast",2,"The snowman of the high Himalaya, known to Sherpa tradition long before climbers arrived.","Huge prints in fresh snow, and a whistle carried on the wind.","Head back down to the monastery","Follow the tracks into the clouds"],
["mechho","Mechho Bhoot","Dhaka, Bangladesh","sa",23.8,90.4,"water",1,"A Bengali ghost that craves fish. It follows people home from the market at night and begs, or snatches, their catch.","A thin voice from the pond: 'Give me your fish...'","Hand over the fish and walk on","Clutch your basket and refuse"],
["ghoul","Ghul","Najd, Arabia","me",24.0,45.0,"beast",4,"A desert shapeshifter from old Arabian tales. Strike it only once: a second blow brings it back to life.","A hyena-shaped thing rises from the dunes. You land one blow, and it falls.","Leave it after one strike","Strike it again to be sure"],
["ummduwais","Umm al-Duwais","Dubai, UAE","me",25.2,55.27,"hair",4,"An Emirati legend: a beautiful woman wrapped in perfume who lures men away. Under her robe are donkey's hooves and a sickle for a hand.","A veiled woman wrapped in rich perfume beckons you down a dark lane.","Look at her feet before you take a step","Follow the perfume"],
["al","Al","Yerevan, Armenia","me",40.18,44.51,"hair",3,"A spirit feared across Armenia and Iran for troubling new mothers. Iron kept near the bed drives it off.","A new mother sleeps. Something with copper nails stands at the foot of her bed.","Lay an iron blade under her pillow","Let her rest alone"],
["karakoncolos","Karakoncolos","Anatolia, Turkey","me",39.9,32.86,"beast",2,"A winter creature that roams in the coldest weeks, calling people out by name. Those who answer are struck dumb.","Deep snow. A voice outside calls your name, again and again.","Stay inside and don't answer","Open the door and answer"],
["naddaha","El Naddaha","Nile, Egypt","me",30.04,31.24,"water",3,"A siren of the Nile who calls men by name from the water at night.","A woman's voice calls your name from the Nile.","Cover your ears and walk away from the bank","Answer her call"],
["aisha","Aisha Kandisha","Rabat, Morocco","me",34.02,-6.83,"hair",3,"A beautiful spirit with goat's hooves who haunts riverbanks. A steel knife planted in the ground keeps her back.","By the river, a woman in a long robe smiles at you. You hear hooves on stone.","Plant a steel knife in the ground","Say her name aloud"],
["dybbuk","Dybbuk","Lublin, Poland","eu",51.25,22.57,"void",3,"In Ashkenazi Jewish folklore, a restless soul that clings to a living person, made famous by An-sky's play. It leaves when its unfinished business is set right.","The bride at the wedding speaks in a dead man's voice.","Ask the spirit what it needs to rest","Mock the voice"],
["tokoloshe","Tokoloshe","KwaZulu-Natal, South Africa","af",-29.6,30.4,"imp",3,"A small mischievous creature in Zulu and Xhosa folklore. Many people still raise their beds on bricks to stay out of its reach.","Something small scratches under the bed. It giggles.","Raise your bed up on bricks","Sleep on the floor"],
["adze","Adze","Volta, Ghana","af",6.6,0.47,"fire",3,"An Ewe spirit that flies as a firefly and slips into homes. Caught, it turns into a person.","A firefly drifts through the mosquito net and hovers over the sleeping child.","Close the net and wake the house","Catch the firefly in your hand"],
["ninkinanka","Ninki Nanka","Gambia River, Gambia","af",13.45,-15.3,"beast",4,"A huge dragon-like creature of the Gambian swamps. Seeing it is said to be deadly, so people look away.","Something huge, horse-headed and scaled, lifts from the mangroves.","Look away and leave the swamp","Take a photo"],
["asanbosam","Asanbosam","Ashanti, Ghana","af",6.69,-1.62,"beast",4,"An Ashanti creature that hangs from high branches with iron hooks for feet, waiting for hunters to pass below.","Something creaks in the canopy. A glint of iron, high overhead.","Keep away from under the branches","Climb the tree to look"],
["grootslang","Grootslang","Richtersveld, South Africa","af",-28.4,17.2,"beast",3,"An ancient giant serpent that lives in a bottomless cave full of diamonds. It may let you live in exchange for its gems.","Deep in the cave, diamonds glitter around a coil as thick as a tree.","Leave the diamonds and back out slowly","Pocket a diamond"],
["popobawa","Popobawa","Zanzibar, Tanzania","af",-6.16,39.2,"bird",3,"A one-eyed, bat-winged shadow of Pemba and Zanzibar. During scares, whole neighbourhoods slept outside together.","A shadow with bat wings settles on the roof. The smell of sulphur.","Sleep outside with your neighbours","Sleep alone inside"],
["kalanoro","Kalanoro","Antananarivo, Madagascar","af",-18.9,47.5,"imp",1,"Small forest dwellers of Malagasy folklore with backward feet and long nails. They accept offerings, and dislike being followed.","Tiny backward footprints, and something stealing rice from the pot.","Leave a little rice and go","Track the backward footprints"],
["mamiwata","Mami Wata","Lagos, Nigeria","af",6.45,3.39,"water",2,"A water spirit honoured across West and Central Africa, a giver of wealth who demands respect. Things she leaves behind are not yours to keep.","On the rocks by the lagoon lies a beautiful golden comb.","Leave a gift on the shore and walk away","Take the comb","r"],
["impundulu","Impundulu","Eastern Cape, South Africa","af",-32.9,27.4,"bird",3,"The lightning bird of Xhosa and Zulu tradition, who strikes as a bolt from the sky.","A black-and-white bird circles above. Thunder rolls closer.","Get off the hill before it strikes","Shelter under the lone tree"],
["mokele","Mokele-mbembe","Likouala, Congo","af",-1.0,17.0,"beast",2,"A great river creature said to block the waterways of the Congo Basin.","The river bulges ahead of your canoe. Something big moves under it.","Paddle quietly back past the bend","Go after it"],
["dhegdheer","Dhegdheer","Somaliland","af",9.56,44.06,"beast",4,"A long-eared woman from Somali folk tales who hunts travellers, and can hear them from miles away.","A woman with long ears turns her head toward you across the valley.","Run for the river crossing","Hide in her hut"],
["bloodymary","Bloody Mary","Birmingham, England","eu",52.5,-1.9,"mirror",3,"A sleepover dare: say her name three times in a dark mirror. Most people stop at two.","Dark bathroom. Candle. You have said her name twice. The mirror ripples.","Switch on the light and walk away","Say her name a third time"],
["banshee","Banshee","Co. Kerry, Ireland","eu",52.15,-9.57,"hair",2,"A messenger, not a killer. Her keening at night warns that someone in an old family will soon die.","A wailing woman with streaming hair stands by the gate, combing.","Stay inside and let her pass","Open the door to see her"],
["blackshuck","Black Shuck","Bungay, Suffolk","eu",52.45,1.43,"beast",3,"A huge black dog with burning eyes. In 1577 it is said to have burst into Bungay church in a storm.","A black dog the size of a calf stands on the coast road, eyes like coals.","Don't meet its eyes, and get to the church porch","Stare it down"],
["dullahan","Dullahan","Co. Galway, Ireland","eu",53.27,-9.05,"skull",4,"A headless rider who holds his own head high to see. He fears only gold.","Hooves. A rider holds his head up like a lantern, scanning the road.","Throw a gold coin in his path","Stand still and watch him pass"],
["krampus","Krampus","Tyrol, Austria","eu",47.27,11.4,"horned",2,"St Nicholas's horned companion, who visits naughty children in December with chains and birch switches.","Chains rattle in the snow. A horned shape is checking the doors on your street.","Admit what you did this year","Lie about being good"],
["babayaga","Baba Yaga","Moscow region, Russia","eu",55.75,37.6,"hair",3,"The witch of the forest whose hut walks on chicken legs. The right words make the hut turn to face you.","A hut on chicken legs turns its back on you in the clearing.","Say: 'Hut, turn your back to the forest, your front to me'","Sneak in around the back"],
["rusalka","Rusalka","Dnipro, Ukraine","eu",50.45,30.52,"water",3,"A drowned maiden who tickles travellers near rivers in early summer. She asks 'wormwood or parsley?' Only one answer is safe.","A pale girl in the reeds asks: 'Wormwood or parsley?'","Say 'Wormwood'","Say 'Parsley'"],
["strigoi","Strigoi","Transylvania, Romania","eu",45.9,25.0,"skull",4,"The troubled dead of Romanian lore who rise to visit their families. Garlic on doors and windows keeps them out.","Someone who was buried last week is knocking politely at the door.","Rub garlic on the door and windows","Invite the visitor in"],
["kikimora","Kikimora","Vologda, Russia","eu",59.2,39.9,"imp",1,"A house spirit who punishes messy households by tangling yarn and banging pots. A clean home calms her.","Pots crash in the kitchen at midnight. The yarn is in knots.","Clean the house and wash the pots in fern tea","Ignore the mess"],
["nokken","Nokken","Telemark, Norway","eu",59.4,8.5,"water",3,"A shape-shifter who plays sweet music by rivers or appears as a white horse. The old charm: 'Nyk, nyk, needle in water.'","A white horse stands in the river, waiting for a rider. A violin plays somewhere.","Drop a steel needle in, saying 'Nyk, nyk'","Climb onto the white horse"],
["draugr","Draugr","Iceland","eu",64.1,-21.9,"skull",4,"The undead guardian of a burial mound, swollen and strong. Open iron scissors were laid on the dead to keep them down.","The burial mound has cracked open. Treasure glints inside.","Lay iron scissors on the grave and leave","Take the treasure"],
["huldra","Huldra","Hedmark, Norway","eu",61.1,10.5,"hair",2,"A forest woman with a cow's tail she tries to hide. Point it out rudely and she turns on you; mention it kindly and she may bless you.","A beautiful herder sings at the edge of the forest. A cow's tail peeks from her skirt.","Kindly tell her that her tail is showing","Laugh at her tail"],
["mara","Mara","Uppland, Sweden","eu",59.86,17.64,"void",2,"The night-mare who sits on sleepers' chests. Shoes placed by the bed pointing away send her back out.","You wake but can't move. Something heavy sits on your chest.","Before sleeping, point your shoes away from the bed","Sleep on your back again"],
["wisp","Will-o'-the-wisp","Somerset Levels, England","eu",51.1,-2.9,"fire",2,"Ghost lights over marshes that lead travellers off the path and into bogs.","A soft light glows across the marsh, as if someone is waiting with a lantern.","Stay on the path","Follow the light"],
["compana","Santa Compana","Galicia, Spain","eu",42.88,-8.54,"shroud",3,"A night procession of souls in hoods, carrying candles. A living person at the front must carry the cross until they pass it to someone else.","Hooded figures with candles walk silently toward you. One offers you a candle.","Draw a circle on the ground and stand inside","Take the candle they offer"],
["damblanche","La Dame Blanche","Normandy, France","eu",49.2,-0.37,"hair",2,"A white lady who waits on narrow bridges and ravines. She lets you pass if you dance with her.","On the narrow bridge, a woman in white holds out her hand for a dance.","Dance with her for one song","Shove past her on the bridge"],
["kelpie","Kelpie","Loch Ness, Scotland","eu",57.3,-4.45,"water",3,"A water horse with sticky skin. Touch it and you're stuck as it gallops into the loch.","A handsome black horse stands by the loch, saddled and wet.","Never touch the horse","Stroke its mane"],
["beannighe","Bean Nighe","Isle of Skye, Scotland","eu",57.3,-6.2,"hair",2,"The washer at the ford, scrubbing the clothes of those about to die. Bold people who reach her before she sees them may ask her questions.","A small woman kneels at the stream, washing bloodstained shirts.","Slip between her and the stream and ask your question","Look closer at whose shirts they are"],
["vrykolakas","Vrykolakas","Mani, Greece","eu",36.6,22.4,"skull",3,"Greek undead who knock on doors at night and call a name. They never knock twice, so wise families wait for the second knock.","One knock at the door. A voice says your name.","Wait for a second knock","Open at the first knock"],
["monaciello","Munaciello","Naples, Italy","eu",40.85,14.27,"imp",1,"A little monk spirit in old Neapolitan houses who leaves coins, or causes chaos. You must never tell anyone about his gifts.","Coins appear on your pillow. A small hooded figure watches from the stairwell.","Keep quiet about the coins","Brag about them to the neighbours"],
["nachtkrapp","Nachtkrapp","Swabia, Germany","eu",48.78,9.18,"bird",3,"The night raven of German nursery warnings, who takes children still awake after dark.","Huge wings beat at the window. It's long past bedtime.","Get into bed and pull the covers up","Stay up watching the window"],

["gwrach","Gwrach-y-Rhibyn","Snowdonia, Wales","eu",52.9,-3.9,"bird",3,"A hag with leathery wings who taps at windows and calls names before a death.","Leathery wings tap on the window. A voice calls a name.","Keep the window shut and stay inside","Go out to see who's calling"],
["llorona","La Llorona","Mexico City, Mexico","la",19.43,-99.13,"hair",4,"A weeping woman who searches rivers for her lost children. When her cry 'Ay, mis hijos!' is loud, she's far; when it's quiet, she's close.","By the river: a quiet sob. 'Ay... mis hijos...' Very quiet.","Get away from the water now","Go toward the crying"],

["silbon","El Silbon","Venezuelan Llanos","la",7.9,-67.5,"tall",4,"A tall figure carrying a sack of bones, whistling notes. When the whistle sounds far, he is near.","A whistle on the plains: do-re-mi-fa-sol-la-si. It sounds very far away.","He's close: get to the dogs and make noise","Relax, he's far away"],

["chonchon","Chonchon","Chiloe, Chile","la",-42.6,-73.9,"head",3,"A sorcerer's flying head with ears like wings. Its call goes 'tue tue'. Never mock it.","Flapping overhead: 'Tue... tue...'","Stay quiet indoors until it passes","Mock its call"],

["rougarou","Rougarou","Louisiana Bayou","na",29.95,-90.07,"beast",3,"A wolf-headed creature of Cajun bayous. It is said to be compelled to count, so thirteen coins on the step keep it busy until dawn.","Something with a wolf's head is pacing the porch.","Leave thirteen pennies on the step","Go into the swamp to look"],

function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function screech(kind){const a=audio();if(!a||SET.level!=='full'||!SET.sound)return;const t=a.currentTime,out=a.createGain();out.gain.value=.75;const comp=a.createDynamicsCompressor();out.connect(comp);comp.connect(a.destination);
  const len=a.sampleRate*1.3,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource();n.buffer=buf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=3;bp.frequency.setValueAtTime(kind==='water'?900:3200,t);bp.frequency.exponentialRampToValueAtTime(500,t+1.1);
  const ng=a.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.9,t+.015);ng.gain.exponentialRampToValueAtTime(.001,t+1.2);n.connect(bp);bp.connect(ng);ng.connect(out);n.start(t);n.stop(t+1.3);
  const ws=a.createWaveShaper(),cur=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cur[i]=Math.tanh(x*6)}ws.curve=cur;
  const base=kind==='beast'||kind==='horned'?240:kind==='imp'?1400:880;
  [1,1.063,1.5].forEach((m,i)=>{const o=a.createOscillator();o.type=i===2?'square':'sawtooth';o.frequency.setValueAtTime(base*m,t);o.frequency.exponentialRampToValueAtTime(base*m*.25,t+1);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.05);o.connect(ws);ws.connect(g);g.connect(out);o.start(t);o.stop(t+1.1)});
  const s=a.createOscillator();s.frequency.setValueAtTime(95,t);s.frequency.exponentialRampToValueAtTime(35,t+.35);const sg=a.createGain();sg.gain.setValueAtTime(1,t);sg.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(sg);sg.connect(out);s.start(t);s.stop(t+.45)}
function thump(v=.5){const a=audio();if(!a||!SET.sound||SET.level==='off')return;const t=a.currentTime;[0,.22].forEach((dt,i)=>{const o=a.createOscillator();o.frequency.setValueAtTime(70,t+dt);o.frequency.exponentialRampToValueAtTime(38,t+dt+.18);const g=a.createGain();g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v*(i?.6:1),t+dt+.01);g.gain.exponentialRampToValueAtTime(.001,t+dt+.25);o.connect(g);g.connect(a.destination);o.start(t+dt);o.stop(t+dt+.3)})}
let drone=null;

  if(!on||!SET.sound||SET.level==='off')return;const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
  const n=a.createBufferSource();n.buffer=buf;n.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const o=a.createOscillator();o.frequency.value=55;const og=a.createGain();og.gain.value=.025;const g=a.createGain();g.gain.value=0;g.gain.setTargetAtTime(.5,a.currentTime,1.5);n.connect(lp);lp.connect(g);o.connect(og);og.connect(g);g.connect(a.destination);n.start();o.start();drone={n,o,g}}

function scare(g,big=true){return new Promise(res=>{
  const lvl=SET.level,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=document.createElement('div');el.id='scare';el.setAttribute('role','alertdialog');el.setAttribute('aria-label',g.name);
  const art=portrait(g,lvl!=='off'),ent=ENTRY[g.look]||'rush';
  if(lvl==='off'){el.className='calm';el.innerHTML=`<div class="sc-calm">${art}<p>${esc(g.name)} found you.</p><small>Tap to continue</small></div>`;document.body.appendChild(el);const done=()=>{el.remove();res()};el.onclick=done;el.onkeydown=done;el.tabIndex=0;el.focus();return}
  const mild=lvl==='mild'||reduce||!big;
  el.className=`pre ${mild?'mild':'full'} e-${ent}`;
  el.innerHTML=`<div class="sc-stage"><div class="sc-l base">${art}</div>${mild?'':`<div class="sc-l r">${art}</div><div class="sc-l c">${art}</div><div class="sc-tear">${[0,1,2,3,4,5].map(i=>`<div class="sc-slice" style="--i:${i}">${art}</div>`).join('')}</div>`}</div><div class="sc-name" data-t="${esc(g.name)}">${esc(g.name)}</div><div class="sc-grain"></div><small class="sc-tap">Tap to continue</small>`;
  el.style.background=`radial-gradient(circle at 50% 45%,${BGC[g.look]||'#1a2250'},#000 72%)`;document.body.appendChild(el);
  const wait=mild?350:650+Math.random()*900;if(!mild)thump(.6);
  setTimeout(()=>{el.classList.remove('pre');el.classList.add('go');if(!mild){screech(g.look);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),520)}},wait);
  if(!mild&&g.danger>=4)setTimeout(()=>{if(!el.isConnected)return;el.classList.add('again');screech('imp');document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),520)},wait+1250);
  let can=false;setTimeout(()=>can=true,wait+700);
  const done=()=>{if(!can)return;el.classList.add('out');setTimeout(()=>{el.remove();res()},380)};
  el.onclick=done;el.tabIndex=0;el.onkeydown=done;el.focus();setTimeout(()=>{can=true;done()},wait+3200);
})}

/* ---------- survive the night ---------- */
const SETTING={sea:'a stilt house at the edge of the rice paddies',ea:'an old mountain inn with paper doors',sa:'a guesthouse at the edge of a sleeping village',me:'a desert camp beyond the last town',af:'a riverside village after the generator cuts out',eu:'a stone cottage at the end of a forest road',na:'a motel off an empty highway',la:'a farmhouse past the last bus stop',cb:'a wooden house on stilts above a dark beach',ca:'a yurt on the open steppe',oc:'a camp at the edge of the bush',all:'a borrowed house you have never seen in daylight'};

function hoursFor(n){const out=[],s=23*60+20,e=29*60+40;for(let i=0;i<n;i++){const m=Math.round(s+(e-s)*(i/(Math.max(1,n-1)))),h=Math.floor(m/60)%24,mm=String(m%60).padStart(2,'0');out.push(`${h%12||12}:${mm} ${h<12?'AM':'PM'}`)}return out}
const WILD=['Run as fast as you can','Hide and hold perfectly still','Shine your phone light straight at it','Shout "Who\'s there?"','Pray out loud','Call someone on your phone','Throw the nearest thing at it','Close your eyes and count to ten','Pretend to be asleep','Back away without turning around','Lock yourself in the bathroom','Film it on your phone'];

let N=null,TMR=null;
function surviveSetup(m){const r=ST.dawns,dk=today(),dl=ST.daily[dk];

  $$('[data-c]').forEach(b=>b.onclick=()=>choose(g,b.dataset.c,b.textContent));

function useCharm(g,c){N.charms=N.charms.filter(x=>x!==c);if(g.charm===c){ST.charmsRight++;save();checkAch();clearInterval(TMR);outcome(g,'rule',`You used the ${CHARMS[c].toLowerCase()}`,`The ${CHARMS[c].toLowerCase()} works. Every story agrees on this one.`,'ok')}else{const b=$(`[data-ch="${c}"]`);b&&b.remove();toast(`The ${CHARMS[c].toLowerCase()} does nothing here. It's gone.`,'bad');if(!$('[data-ch]')){const w=$('.charms');w&&w.remove()}}}
async function choose(g,k,txt,froze){clearInterval(TMR);$$('[data-c],[data-ch],[data-hint]').forEach(b=>b.disabled=true);let msg,cls='ok';

  outcome(g,k,txt,msg,cls)}
function followUp(g,txt){frame(`<p class="scene bad">It hasn't gone.</p><p class="scene sign">You did the right thing, but it is still here, closer now. You can feel it right beside you.</p><p class="q">Do you hold your nerve?</p><div class="choices">${shuf([['hold','Keep doing exactly what the stories say'],['look','Turn and look at it'],['run','Make a run for it']]).map(([k,t])=>`<button data-f="${k}">${t}</button>`).join('')}</div>`);
  $$('[data-f]').forEach(b=>b.onclick=async()=>{$$('[data-f]').forEach(x=>x.disabled=true);const k=b.dataset.f;
    if(k==='hold'){ST.followUps++;save();checkAch();outcome(g,'rule',txt,'Minutes pass like hours. Then it loses interest, and is gone. You held your nerve.','ok')}
    else if(k==='run'&&Math.random()<.5)outcome(g,'wild',b.textContent,'You run, and somehow you make it. Your heart will not slow down.','ok');
    else{N.nerve--;await scare(g,true);outcome(g,'wild',b.textContent,k==='look'?'You looked. It was waiting for that.':'It was faster.','bad')}})}
function outcome(g,k,txt,msg,cls){N.log.push({id:g.id,k,ok:cls==='ok'});
  if(N.nerve<=0)return taken(g);
  ST.met.includes(g.id)||g.mine||ST.met.push(g.id);save();checkAch();
  frame(`<p class="scene ${cls}">${esc(msg)}</p><p class="you">You chose: ${esc(txt)}</p>${k!=='rule'?`<p class="lorehint">The lore says: <b>${esc(g.rule)}</b>.</p>`:''}${N.solo?`<button class="btn primary" data-n autofocus>See the dawn</button>`:`<p class="q">Do you know what that was?</p><div class="choices" id="nm"></div>`}`);
  if(N.solo){$('[data-n]').onclick=dawn;return}
  const same=GHOSTS.filter(x=>x.reg===g.reg&&x.id!==g.id),others=shuf(same.length>=3?same:GHOSTS.filter(x=>x.id!==g.id)).slice(0,N.dd===DIFF.hard?3:2);
  $('#nm').innerHTML=shuf([g,...others]).map(x=>`<button data-g="${x.id}">${esc(x.name)}</button>`).join('');
  $$('[data-g]').forEach(b=>b.onclick=()=>{const right=b.dataset.g===g.id;if(right&&!ST.named.includes(g.id))ST.named.push(g.id);save();checkAch();
    let found='';if(N.i+1<N.list.length&&Math.random()<.4){const f=pick(FIND.filter(([c])=>!N.charms.includes(c)));if(f){N.charms.push(f[0]);found=`<p class="find">${f[1]}</p>`}}
    frame(`<div class="reveal"><span class="mini big">${portrait(g)}</span><div><p class="scene ${right?'ok':''}">${right?'Yes.':'No.'} It was <b>${esc(g.name)}</b>, from ${esc(g.place)}.</p></div></div><p class="story">${esc(g.story)}</p>${found}${pocket()}<button class="btn primary" data-n autofocus>${N.i+1<N.list.length?'Keep waiting':'Wait for dawn'}</button>`);
    $('[data-n]').onclick=()=>{N.i++;N.i<N.list.length?encounter():dawn()}})}
function shareText(ok){const marks=N.log.map(l=>l.ok?'🕯️':'💀').join('');return`NIGHTLORE${N.daily?' · Tonight\'s night '+N.daily:''}\n${ok?'I saw dawn':'I was taken'} ${N.daily?'':'in '+(REGIONS[N.reg]||'the world')} ${marks}\n${N.log.map(l=>(l.ok?'✓ ':'✗ ')+GBY[l.id].name).join('\n')}\n${location.href.split('#')[0]}`}
function endButtons(g){return`<div class="row"><button class="btn primary" data-a autofocus>${g?'Try another night':'Another night'}</button><button class="btn" data-share>Share my night</button><button class="btn" data-m>${g?'Read about '+esc(g.name):'Back to the map'}</button></div>`}
function dawn(){ambience(false);lantern(false);if(!N.solo){ST.dawns++;ST.best=Math.max(ST.best,N.list.length);if(N.reg!=='all'&&!N.daily)ST.stamps[N.reg]=1;if(N.nerve===N.max)ST.perfect++;if(N.dd===DIFF.hard)ST.hardDawns++;if(N.daily)ST.daily[N.daily]={ok:true,n:N.nerve}}save();checkAch();
  frame(`<div class="sun" aria-hidden="true"></div><h1>Dawn</h1><p class="scene">Grey light at the window. Birds. You made it through ${N.solo?'your encounter':'the night'} with ${N.nerve} candle${N.nerve===1?'':'s'} of nerve left.</p>${!N.solo&&N.reg!=='all'&&!N.daily?`<p class="find">Passport stamped: ${REGIONS[N.reg]}.</p>`:''}${log()}${endButtons()}`);binds(null,true)}
function taken(g){ambience(false);lantern(false);ST.taken++;ST.best=Math.max(ST.best,N.i);if(N.daily)ST.daily[N.daily]={ok:false,n:N.i};save();checkAch();
  frame(`<h1 class="lost">Taken</h1><p class="scene">${esc(g.name)} of ${esc(g.place)} found you at ${hour()}. Your last candle is out.</p><p class="lorehint">What would have saved you: <b>${esc(g.rule)}</b>.</p>${log()}${endButtons(g)}`);binds(g,false)}
function log(){return`<ol class="nlog">${N.log.map((l,i)=>{const g=GBY[l.id];return g?`<li class="${l.ok?'ok':'bad'}"><span>${N.hours[i]||''}</span><b>${esc(g.name)}</b><small>${esc(g.place)}</small></li>`:''}).join('')}</ol>`}
function binds(g,ok){$('[data-a]').onclick=()=>{view='survive';shell();render()};$('[data-m]').onclick=()=>{g?openGhost(g.id):(view='map',shell(),render())};
  $('[data-share]').onclick=async()=>{const t=shareText(ok);try{if(navigator.share){await navigator.share({text:t});return}await navigator.clipboard.writeText(t);toast('Copied. Paste it to your friends.')}catch(e){toast('Could not share from this browser.')}}}
/* hard mode lantern */
function lantern(on){let l=$('#lantern');if(!on){l&&l.remove();return}if(!l){l=document.createElement('div');l.id='lantern';l.setAttribute('aria-hidden','true');document.body.appendChild(l)}
  const mv=e=>{const p=e.touches?e.touches[0]:e;l.style.setProperty('--lx',p.clientX+'px');l.style.setProperty('--ly',p.clientY+'px')};
  l.style.setProperty('--lx','50%');l.style.setProperty('--ly','40%');addEventListener('pointermove',mv);addEventListener('touchmove',mv,{passive:true})}

/* ---------- Rule or Ruin quiz ---------- */
let QZ=null;
function quizSetup(m){m.innerHTML=`<section class="stage setup"><h1>Rule or Ruin</h1><p class="lede">60 seconds. A ghost is near: pick what saves you, or name what it is. Right answers build a streak. Wrong ones cost 5 seconds and something may look back at you.</p>
  <div class="qstats"><span><b>${ST.quizBest}</b> best score</span><span><b>${ST.quizGames}</b> games</span></div>
  <p class="q">Which legends?</p><div class="where">${[['all','The whole world'],...Object.entries(REGIONS)].map(([k,l])=>`<button data-qz="${k}"><b>${l}</b><small>${(k==='all'?GHOSTS:GHOSTS.filter(g=>g.reg===k)).length} legends</small></button>`).join('')}</div></section>`;
  m.querySelectorAll('[data-qz]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.qz))}
function startQuiz(reg){const pool=reg==='all'?GHOSTS:GHOSTS.filter(g=>g.reg===reg);QZ={pool,reg,score:0,streak:0,end:Date.now()+60000,miss:[],seen:new Set(),t:0};ST.quizGames++;save();qNext();QZ.t=setInterval(qTick,100)}
function stopQuiz(){if(QZ){clearInterval(QZ.t);QZ=null}}
function qTick(){if(!QZ)return;const left=Math.max(0,QZ.end-Date.now()),b=$('.qtime i'),s=$('.qtime span');if(b)b.style.width=(left/600)+'%';if(s)s.textContent=Math.ceil(left/1000)+'s';if(left<=0)qEnd()}
function qNext(){const avail=QZ.pool.filter(g=>!QZ.seen.has(g.id)),g=pick(avail.length?avail:QZ.pool);QZ.seen.add(g.id);const type=Math.random()<.55?'rule':'name';
  let opts,prompt;
  if(type==='rule'){prompt=`<p class="scene sign">${esc(g.sign)}</p><p class="q">What saves you?</p>`;opts=shuf([{ok:1,t:g.rule},...shuf(GHOSTS.filter(x=>x.id!==g.id&&x.rule!==g.rule)).slice(0,3).map(x=>({t:x.rule}))])}
  else{prompt=`<p class="scene">${esc(g.story.replace(new RegExp(g.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'This one'))}</p><p class="q">What is it? <small>${esc(g.place.split(', ').pop())}</small></p>`;const sm=GHOSTS.filter(x=>x.id!==g.id&&x.reg===g.reg);opts=shuf([{ok:1,t:g.name},...shuf(sm.length>=3?sm:GHOSTS.filter(x=>x.id!==g.id)).slice(0,3).map(x=>({t:x.name}))])}
  $('#main').innerHTML=`<section class="stage quiz"><div class="hud"><span>Rule or Ruin</span><span class="qscore"><b>${QZ.score}</b> ${QZ.streak>1?`· streak ×${QZ.streak}`:''}</span><span class="qtime"><span>60s</span><i></i></span></div>${prompt}<div class="choices">${opts.map((o,i)=>`<button data-q="${o.ok?1:0}">${esc(o.t)}</button>`).join('')}</div><button class="btn ghosty" data-qx>Stop</button></section>`;qTick();
  $$('[data-q]').forEach(b=>b.onclick=()=>{$$('[data-q]').forEach(x=>{x.disabled=true;if(x.dataset.q==='1')x.classList.add('right')});
    if(b.dataset.q==='1'){QZ.streak++;QZ.score+=QZ.streak>=5?2:1;b.classList.add('right');setTimeout(()=>QZ&&qNext(),450)}
    else{QZ.streak=0;QZ.end-=5000;QZ.miss.push(g.id);b.classList.add('wrong');document.body.classList.add('shake','redflash');setTimeout(()=>document.body.classList.remove('shake','redflash'),520);if(SET.level==='full'&&Math.random()<.18&&!g.rev){clearInterval(QZ.t);const pause=QZ.end-Date.now();scare(g,false).then(()=>{if(!QZ)return;QZ.end=Date.now()+pause;QZ.t=setInterval(qTick,100);qNext()})}else setTimeout(()=>QZ&&qNext(),900)}});
  $('[data-qx]').onclick=qEnd}
function qEnd(){if(!QZ)return;clearInterval(QZ.t);const z=QZ;QZ=null;const best=z.score>ST.quizBest;ST.quizBest=Math.max(ST.quizBest,z.score);save();checkAch();
  $('#main').innerHTML=`<section class="stage"><h1>${z.score}</h1><p class="scene">${best?'A new best. The old stories are in your blood.':z.score>=10?'The villagers would trust you with their children.':'You would not last long out there. Yet.'}</p>${z.miss.length?`<p class="q">Read up on the ones that got you</p><div class="rel">${[...new Set(z.miss)].map(id=>{const g=GBY[id];return`<button data-rel="${id}"><span class="mini">${portrait(g)}</span>${esc(g.name)}<small>${esc(g.place.split(', ').pop())}</small></button>`}).join('')}</div>`:''}<div class="row"><button class="btn primary" data-again autofocus>Play again</button><button class="btn" data-back2>Choose legends</button></div></section>`;
  $('[data-again]').onclick=()=>startQuiz(z.reg);$('[data-back2]').onclick=()=>quizSetup($('#main'));$$('[data-rel]').forEach(b=>b.onclick=()=>openGhost(b.dataset.rel))}

/* ---------- settings + title ---------- */
function openSettings(first){const d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Settings');
  d.innerHTML=`<div class="mbox"><h2>${first?'Before you go in':'Settings'}</h2><p>NIGHTLORE has sudden jumpscares with loud sounds and screen shake. There is a single bright flash in full mode, never a strobe. Choose what you can handle.</p>
  <div class="lv" role="radiogroup">${[['full','Full','Sound, shake, glitch and the slow build before it hits'],['mild','Mild','The ghost still appears, quietly, with no sound or shake'],['off','Off','No jumpscares at all, just a still picture']].map(([k,l,s])=>`<label><input type="radio" name="lv" value="${k}" ${SET.level===k?'checked':''}><span><b>${l}</b><small>${s}</small></span></label>`).join('')}</div>
  <label class="snd"><input type="checkbox" id="snd" ${SET.sound?'checked':''}> Ambient night sound and heartbeat</label>
  ${canSpeak?`<label class="snd"><input type="checkbox" id="vc" ${SET.voice?'checked':''}> Narrator voice on night walks</label>`:''}
  <div class="row"><button class="btn primary" data-ok>${first?'Enter':'Save'}</button>${first?'':'<button class="btn" data-test>Test a scare</button><button class="btn danger" data-reset>Erase progress</button>'}</div></div>`;
  document.body.appendChild(d);d.querySelector('[data-ok]').focus();
  const read=()=>{SET.level=d.querySelector('[name=lv]:checked').value;SET.sound=d.querySelector('#snd').checked;const v=d.querySelector('#vc');if(v)SET.voice=v.checked;save()};
  d.querySelector('[data-ok]').onclick=()=>{read();audio();ST.warned=true;save();d.remove();shell();render()};
  const t=d.querySelector('[data-test]');t&&(t.onclick=()=>{read();audio();scare(pick(GHOSTS.filter(g=>!g.rev)))});
  const r=d.querySelector('[data-reset]');r&&(r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent='Tap again: erase everything';return}const keep=ST.custom;ST={met:[],named:[],nights:0,dawns:0,taken:0,best:0,warned:true,stamps:{},ach:[],daily:{},quizBest:0,quizGames:0,charmsRight:0,hardDawns:0,perfect:0,custom:keep,respect:0,followUps:0,tours:0,spoken:0};save();d.remove();shell();render();toast('Progress erased. Your own legends were kept.')})}
function title(){const el=document.createElement('div');el.id='title';
  const g=pick(GHOSTS.filter(x=>!x.rev&&!x.mine)),dl=ST.daily[today()];
  el.innerHTML=`<canvas id="tc" aria-hidden="true"></canvas><div class="tin"><h1 class="logo" aria-label="Nightlore">${'NIGHTLORE'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</h1>
  <p class="tag">${GHOSTS.length} ghosts, spirits and legends from ${countries()} places. Learn their rules. Survive the night.</p>
  <p class="whisper">Tonight, somewhere in ${esc(g.place)}: <i>${esc(g.sign)}</i></p>
  <div class="row"><button class="btn primary" data-t="survive">Survive the night</button><button class="btn" data-t="daily">${dl?'Tonight\'s night: played':'Tonight\'s night'}</button><button class="btn" data-t="map">Explore the map</button><button class="btn" data-t="quiz">Rule or Ruin</button></div>
  ${ST.nights?`<p class="tstat">${ST.met.length} legends survived · ${ST.ach.length} achievements · ${Object.keys(ST.stamps).length} passport stamps</p>`:''}
  <p class="made">Made by <b>TheFrst</b></p><p class="ver">Folklore retold for fun. Many of these stories are part of living cultures; respect the places they come from.<br>version ${BUILD}</p></div>`;
  document.body.appendChild(el);el.querySelector('.btn').focus();
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;view=k==='daily'?'survive':k;el.classList.add('out');setTimeout(()=>el.remove(),600);shell();render();const go=()=>{if(k==='daily'&&!dl)startNight({daily:today()})};if(!ST.warned){openSettings(true);const ok=$('.modal [data-ok]');const o=ok.onclick;ok.onclick=()=>{o();go()}}else{audio();go()}});
  const c=$('#tc'),x=c.getContext('2d');let W,H;const sz=()=>{W=c.width=innerWidth;H=c.height=innerHeight};sz();addEventListener('resize',sz);
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches,motes=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),v:.0003+Math.random()*.0008,r:.5+Math.random()*1.6,p:Math.random()*6}));let t=0;
  const eyes=Array.from({length:9},()=>({x:Math.random(),y:.55+Math.random()*.4,s:.6+Math.random(),o:Math.random()*400,c:pick(['255,42,74','143,240,220','255,176,46'])}));
  (function f(){if(!c.isConnected)return;x.clearRect(0,0,W,H);
    for(let i=0;i<5;i++){x.fillStyle=`rgba(8,11,24,${.5+i*.1})`;x.beginPath();x.moveTo(0,H);for(let k=0;k<=20;k++){const X=k/20*W,Y=H*(.72+i*.06)-Math.abs(Math.sin(k*1.7+i*3))*H*(.12-i*.015)-((k*37+i*11)%7)*6;x.lineTo(X,Y)}x.lineTo(W,H);x.fill()}
    motes.forEach(m=>{m.y-=m.v;if(m.y<0)m.y=1;x.fillStyle=`rgba(143,240,220,${.25+.25*Math.sin(t/30+m.p)})`;x.beginPath();x.arc(m.x*W+Math.sin(t/60+m.p)*8,m.y*H,m.r,0,6.3);x.fill()});
    eyes.forEach(e=>{const ph=(t+e.o)%420,a=ph<40?ph/40:ph<90?1:ph<120?(120-ph)/30:0;if(a<=0)return;const ex=e.x*W,ey=e.y*H,s=3*e.s,bl=ph>60&&ph<66?.15:1;x.fillStyle=`rgba(${e.c},${a*.85})`;[-1,1].forEach(d=>{x.beginPath();x.ellipse(ex+d*s*3,ey,s,s*bl,0,0,6.3);x.fill()})});
    t++;if(!red)requestAnimationFrame(f)})()}
function boot(){shell();render();title()}

boot();
</script></body></html>
