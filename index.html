  side();bindMap();requestAnimationFrame(()=>{if(!mapView.done){mapView.done=1;home()}else setVB()});
  $$('[data-mt]').forEach(b=>b.onclick=()=>{const k=b.dataset.mt;if(k==='rand'){stopTour();openGhost(pick(filtered().length?filtered():GHOSTS).id)}else if(k==='tour'){TOUR?stopTour():startTour()}else{stopTour();placing=!placing;mapView($('#main'))}})}
addEventListener('resize',()=>{if($('#msvg'))setVB()});
function drawPins(){const k=vb.w/1000,ids=new Set(filtered().map(g=>g.id));
  $('#pins').innerHTML=GHOSTS.map(g=>{const[x,y]=XY(g),on=ids.has(g.id),s=g.id===sel,met=ST.met.includes(g.id);return`<g class="pin ${on?'':'dim'} ${s?'sel':''} ${g.rev?'rev':''} ${g.mine?'mine':''} ${met?'got':''}" data-id="${g.id}" tabindex="${on?0:-1}" role="button" aria-label="${esc(g.name)}, ${esc(g.place)}"><circle r="${(s?16:9)*k}" cx="${x}" cy="${y}" fill="url(#${g.mine?'pm':g.rev?'pc':'pg'})"/><circle r="${(1.6+g.danger*.45)*k*(s?1.6:1)}" cx="${x}" cy="${y}" class="dot"/>${met?`<circle r="${(3.4+g.danger*.45)*k}" cx="${x}" cy="${y}" class="ring"/>`:''}</g>`}).join('');
  $$('.pin').forEach(p=>{p.onclick=e=>{if(placing)return;e.stopPropagation();stopTour();openGhost(p.dataset.id)};p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGhost(p.dataset.id)}}})}
function setVB(){const s=$('#msvg');if(!s)return;const r=ratio();vb.w=Math.max(40,Math.min(1000,vb.w));vb.h=vb.w*r;vb.x=Math.max(0,Math.min(1000-vb.w,vb.x));vb.y=Math.max(-40,Math.min(480-vb.h,vb.y));s.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);drawPins()}
function zoomAt(f,cx=.5,cy=.5){const nw=vb.w*f;vb.x+=(vb.w-nw)*cx;vb.y+=(vb.h-nw*ratio())*cy;vb.w=nw;setVB()}
function bindMap(){const s=$('#msvg'),P=new Map();let moved=0,pd=0;
  $$('[data-z]').forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='in')zoomAt(.6);else if(z==='out')zoomAt(1.6);else home()});
  s.addEventListener('wheel',e=>{e.preventDefault();const r=s.getBoundingClientRect();zoomAt(e.deltaY>0?1.15:.87,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
  s.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
  s.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const r=s.getBoundingClientRect(),prev=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===1){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){s.setPointerCapture&&s.setPointerCapture(e.pointerId);vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;setVB()}}
    else if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){zoomAt(pd/d,((a[0]+b[0])/2-r.left)/r.width,((a[1]+b[1])/2-r.top)/r.height)}pd=d;moved=99}});
  const up=e=>{const was=P.size;P.delete(e.pointerId);pd=0;if(placing&&was===1&&moved<6){const pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(s.getScreenCTM().inverse());placing=false;legendForm(+(90-p.y/500*180).toFixed(2),+(p.x/1000*360-180).toFixed(2))}};
  s.addEventListener('pointerup',up);s.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pd=0})}
function side(){const el=$('#side');if(!el)return;if(countryF&&!sel)return countryPage(countryF);
  if(sel&&GBY[sel]){const g=GBY[sel];el.innerHTML=card(g,true);bindCard(el,g);return}
  const list=filtered();
  el.innerHTML=`<div class="filters"><label class="srch"><span class="sr">Search legends</span><input id="q" type="search" placeholder="Search a ghost, country or word" value="${esc(q)}"></label>
  <div class="chips" role="group" aria-label="Region">${[['all','Everywhere'],...Object.entries(REGIONS),...(ST.custom.length?[['mine','Your legends']]:[])].map(([k,l])=>`<button class="chip ${regF===k?'on':''}" data-r="${k}" aria-pressed="${regF===k}">${l}</button>`).join('')}</div></div>

  <ul class="glist">${list.map(g=>`<li><button data-id="${g.id}"><span class="mini">${portrait(g)}</span><span><b>${esc(g.name)}</b><small>${esc(g.place)}</small></span>${g.mine?'<i class="met mine">yours</i>':ST.met.includes(g.id)?'<i class="met" title="You survived it">survived</i>':''}</button></li>`).join('')||'<li class="empty">No legend matches that. Try another country or clear the search.</li>'}</ul>`;
  const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;side();drawPins();const n=$('#q');n.focus();n.setSelectionRange(p,p)};

function flyRegion(){const l=filtered();if(!l.length||regF==='all')return home();const xs=l.map(g=>XY(g)[0]),ys=l.map(g=>XY(g)[1]);const w=Math.max(120,(Math.max(...xs)-Math.min(...xs))*1.5,(Math.max(...ys)-Math.min(...ys))*1.5/ratio());vb.w=w;vb.x=(Math.min(...xs)+Math.max(...xs))/2-w/2;vb.y=(Math.min(...ys)+Math.max(...ys))/2-w*ratio()/2;setVB()}
function openGhost(id,quiet){countryF=null;if(view!=='map'){view='map';shell();render()}sel=id;const g=GBY[id],[x,y]=XY(g);if(vb.w>400){vb.w=320}vb.x=x-vb.w/2;vb.y=y-vb.w*ratio()/2;setVB();side();const sd=$('#side');sd.scrollTop=0;if(!quiet&&innerWidth<860)sd.scrollIntoView({behavior:'smooth',block:'start'});if(!quiet){const h=sd.querySelector('h2');h&&h.focus({preventScroll:innerWidth<860})}}
const flames=n=>`<span class="danger" aria-label="Danger ${n} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;
function nearby(g){return GHOSTS.filter(x=>x.id!==g.id).map(x=>[x,Math.hypot(x.lat-g.lat,(x.lon-g.lon)*Math.cos(g.lat*Math.PI/180))]).sort((a,b)=>a[1]-b[1]).slice(0,3).map(a=>a[0])}
function cousins(g){return GHOSTS.filter(x=>x.id!==g.id&&x.look===g.look&&x.reg!==g.reg).slice(0,40).sort(()=>Math.random()-.5).slice(0,3)}
function card(g,back){const met=ST.met.includes(g.id),nm=ST.named.includes(g.id);
  return`${back?`<button class="back" data-back>All legends</button>`:''}<article class="gcard"><div class="gart">${portrait(g)}</div>

  <p class="status">${met?'You have survived it'+(nm?' and named it.':'.'):'You have not met it yet.'}</p>
  <div class="row left"><button class="btn primary" data-face>Face ${esc(g.name)}</button>${canSpeak?'<button class="btn" data-speak>Read it aloud</button>':''}<button class="btn" data-book>${T('Open in the Book')}</button><button class="btn" data-shimg>${T('Share as image')}</button>${g.mine?'<button class="btn danger" data-del>Delete</button>':''}</div>
  <h3>Nearby legends</h3><div class="rel">${nearby(g).map(x=>`<button data-rel="${x.id}"><span class="mini">${portrait(x)}</span>${esc(x.name)}<small>${esc(x.place.split(', ').pop())}</small></button>`).join('')}</div>

let QZ=null;
function quizSetup(m){m.innerHTML=`<section class="stage setup"><h1>Rule or Ruin</h1><p class="lede">60 seconds. A ghost is near: pick what saves you, or name what it is. Right answers build a streak. Wrong ones cost 5 seconds and something may look back at you.</p>
  <div class="qstats"><span><b>${ST.quizBest}</b> best score</span><span><b>${ST.quizGames}</b> games</span></div>
  <p class="q">Which legends?</p><div class="where">${[['all','The whole world'],...Object.entries(REGIONS)].map(([k,l])=>`<button data-qz="${k}"><b>${l}</b><small>${(k==='all'?GHOSTS:GHOSTS.filter(g=>g.reg===k)).length} legends</small></button>`).join('')}</div></section>`;

function startQuiz(reg){const pool=reg==='all'?GHOSTS:GHOSTS.filter(g=>g.reg===reg);QZ={pool,reg,score:0,streak:0,end:Date.now()+60000,miss:[],seen:new Set(),t:0};ST.quizGames++;save();qNext();QZ.t=setInterval(qTick,100)}

function qTick(){if(!QZ)return;const left=Math.max(0,QZ.end-Date.now()),b=$('.qtime i'),s=$('.qtime span');if(b)b.style.width=(left/600)+'%';if(s)s.textContent=Math.ceil(left/1000)+'s';if(left<=0)qEnd()}
function qNext(){const avail=QZ.pool.filter(g=>!QZ.seen.has(g.id)),g=pick(avail.length?avail:QZ.pool);QZ.seen.add(g.id);const type=Math.random()<.55?'rule':'name';
  let opts,prompt;
  if(type==='rule'){prompt=`<p class="scene sign">${esc(g.sign)}</p><p class="q">What saves you?</p>`;opts=shuf([{ok:1,t:g.rule},...shuf(GHOSTS.filter(x=>x.id!==g.id&&x.rule!==g.rule)).slice(0,3).map(x=>({t:x.rule}))])}
  else{prompt=`<p class="scene">${esc(g.story.replace(new RegExp(g.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'This one'))}</p><p class="q">What is it? <small>${esc(g.place.split(', ').pop())}</small></p>`;const sm=GHOSTS.filter(x=>x.id!==g.id&&x.reg===g.reg);opts=shuf([{ok:1,t:g.name},...shuf(sm.length>=3?sm:GHOSTS.filter(x=>x.id!==g.id)).slice(0,3).map(x=>({t:x.name}))])}
  $('#main').innerHTML=`<section class="stage quiz"><div class="hud"><span>Rule or Ruin</span><span class="qscore"><b>${QZ.score}</b> ${QZ.streak>1?`· streak ×${QZ.streak}`:''}</span><span class="qtime"><span>60s</span><i></i></span></div>${prompt}<div class="choices">${opts.map((o,i)=>`<button data-q="${o.ok?1:0}">${esc(o.t)}</button>`).join('')}</div><button class="btn ghosty" data-qx>Stop</button></section>`;qTick();
  $$('[data-q]').forEach(b=>b.onclick=()=>{$$('[data-q]').forEach(x=>{x.disabled=true;if(x.dataset.q==='1')x.classList.add('right')});
    if(b.dataset.q==='1'){QZ.streak++;QZ.score+=QZ.streak>=5?2:1;b.classList.add('right');setTimeout(()=>QZ&&qNext(),450)}
    else{QZ.streak=0;QZ.end-=5000;QZ.miss.push(g.id);b.classList.add('wrong');document.body.classList.add('shake','redflash');setTimeout(()=>document.body.classList.remove('shake','redflash'),520);if(SET.level==='full'&&Math.random()<.18&&!g.rev){clearInterval(QZ.t);const pause=QZ.end-Date.now();scare(g,false).then(()=>{if(!QZ)return;QZ.end=Date.now()+pause;QZ.t=setInterval(qTick,100);qNext()})}else setTimeout(()=>QZ&&qNext(),900)}});
  $('[data-qx]').onclick=qEnd}
function qEnd(){if(!QZ)return;clearInterval(QZ.t);const z=QZ;QZ=null;const best=z.score>ST.quizBest;ST.quizBest=Math.max(ST.quizBest,z.score);save();addXP(z.score*3);checkAch();

inyiakbalang:['Si kakek belang: roh harimau yang dihormati dalam tradisi Minangkabau sebagai penjaga kampung dan hutan. Di hutan orang tidak menyebut "harimau"; mereka menyebut Inyiak.','Di jalan hutan, seekor harimau besar berdiri diam, menatapmu dengan tenang.','Sapa ia dengan hormat sebagai "Inyiak" dan menepi','Teriak "harimau!" dan lempari batu'],
geunteut:['Makhluk raksasa berbulu di hutan dalam cerita Aceh dan Gayo, dengan jejak kaki sangat besar.','Jejak kaki lebih panjang dari lenganmu melintasi sungai hutan.','Tinggalkan hutan sebelum senja','Ikuti jejaknya lebih dalam'],
poppo:['Makhluk Bugis bermata merah menyala yang terbang malam hari dan memangsa orang sakit.','Temanmu yang demam tertidur. Mata merah menyala di kasau.','Biarkan lampu menyala dan duduk di sampingnya','Tinggalkan ia sendirian dalam gelap'],
orangpendek:['"Orang pendek" dari hutan Kerinci di Sumatra: makhluk kecil berbulu yang berjalan tegak, masih dilaporkan petani dan jagawana.','Sosok kecil berbulu berjalan tegak melintasi jalur dan menoleh padamu.','Biarkan ia pergi dan tetap di jalur','Kejar ia ke hutan'],
wongsamar:['"Orang samar" dalam kepercayaan Bali yang hidup tak kasatmata di hutan, jurang dan pohon besar. Bersikap kasar di tempat mereka mendatangkan sial.','Di jurang terdengar tawa dan gamelan, tapi tak ada siapa pun.','Minta izin pelan-pelan dan tinggalkan sesaji','Teriak dan buang sampah ke jurang'],
ebugogo:['Makhluk kecil berbulu dari cerita orang Nage di Flores, katanya memakan semua yang disajikan dan menirukan apa yang mereka dengar.','Sesuatu yang kecil menggumamkan ulang kata-katamu dari tepi ladang.','Bawa anak-anak masuk dan tetap diam','Tawarkan makanan desa padanya'],
pontianak:['Sepupu Melayu kuntilanak, ditandai harum bunga kemboja. Paku yang ditancapkan di tengkuknya konon menjinakkannya.','Harum bunga kemboja di udara, padahal tak ada bunga.','Genggam paku besi dan cepat pergi','Cari bunganya'],
toyol:['Makhluk kecil hijau seperti anak yang disuruh mencuri. Ia suka bermain, dan kelereng yang ditebar di lantai membuatnya sibuk sampai pagi.','Dompetmu makin ringan setiap pagi. Sesuatu terkikik di bawah lemari.','Tebar kelereng di lantai','Kunci uangmu dan tidur'],
penanggal:['Perempuan yang kepalanya lepas malam hari dengan organ menjuntai. Daun berduri di ambang jendela menjerat isi perutnya.','Suara basah terseret di luar. Sesuatu berkilau saat naik melewati jendela.','Taruh daun pandan berduri di ambang jendela','Biarkan jendela terbuka agar sejuk'],
orangminyak:['"Orang minyak" dalam kepanikan di Malaysia tahun 1960-an dan 2000-an: sosok hitam licin yang lolos dari genggaman mana pun dan menyusup ke rumah malam hari.','Seorang lelaki berkilat minyak hitam berjongkok di ambang jendela. Tanganmu meleset darinya.','Nyalakan semua lampu dan bangunkan seisi rumah','Coba tangkap dia'],
hanturaya:['Roh kuat yang terikat pada garis keluarga dan bisa menyerupai tuannya. Saat pemiliknya meninggal ia mencari tuan baru, dan menerimanya berarti terikat.','Lelaki tua yang sekarat menekan sesuatu ke tanganmu. "Ambillah. Ia akan melayanimu."','Tolak apa yang ia coba wariskan','Terima pemberiannya'],
bajang:['Makhluk peliharaan yang disimpan dalam tabung bambu tertutup, berwujud musang, membawa penyakit pada anak-anak.','Bayangan berbentuk musang menyelinap keluar dari tabung bambu di rak.','Tutup tabungnya dan bawa ke bomoh','Buka tabung untuk melihat isinya'],
hantupemburu:['Pemburu Hantu Melayu yang berkuda melintasi langit malam bersama anjing-anjingnya, terus berburu selamanya.','Anjing melolong tinggi di atas pucuk pohon, dan bunyi terompet.','Berlindung di bawah atap sampai anjingnya lewat','Berdiri di tempat terbuka untuk melihat perburuan'],
hantugalah:['Hantu galah Melayu, kurus seperti tongkat dan lebih tinggi dari pepohonan, yang makin tinggi kalau kamu mendongak.','Sesuatu setipis galah membungkuk di atas jalan kampung, lebih tinggi dari pohon kelapa.','Menunduk dan lewati dengan tenang','Mendongak untuk melihat wajahnya'],
langsuir:['Hantu Melayu berkuku panjang dengan lubang di leher yang tertutup rambut. Memotong kukunya dan menyumpal lubangnya dengan rambut akan menjinakkannya.','Perempuan berkuku hijau sangat panjang bertengger di pagar. Rambutnya menutupi lehernya.','Potong kukunya dan sumpal lubang dengan rambutnya','Lari ke hutan'],
polong:['Makhluk kecil yang disimpan dalam botol dan diberi darah dari jari pemiliknya, dikirim untuk mencelakai orang.','Botol kaca kecil di rak bergetar sendiri.','Bawa botolnya ke bomoh','Buka sumbat botolnya']};
