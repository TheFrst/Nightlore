["berberoka","Berberoka","Ifugao, Philippines","sea",16.83,121.1,"water",3,"A Philippine swamp creature that drinks a river dry to strand the fish, then releases the water to drown whoever wades in.","The river suddenly empties. Fish flap on the mud. It's easy to walk out and pick them up.","Stay on the bank and climb higher","Walk out onto the dry riverbed"],
["bungisngis","Bungisngis","Tagalog provinces, Philippines","sea",14.3,121.4,"beast",2,"A one-eyed giant with huge tusks who laughs all the time. If you laugh with it, it laughs harder and grabs you.","A one-eyed giant laughs so hard its tusks rattle. It wants you to laugh too.","Keep a straight face and back away","Laugh along with it"],
["wakwak","Wakwak","Surigao, Philippines","sea",9.78,125.5,"bird",4,"A bird-like aswang named for its cry. Like the tik-tik, a loud 'wak-wak' means it's far; a soft one means it's close.","'Wak... wak...' The call is soft now. Wings brush the thatch.","It's close: rub garlic on the door and stay in","Relax, it sounds far away"],
["phiam","Phi Am","Chiang Mai, Thailand","sea",18.79,98.98,"void",2,"The Thai spirit blamed for sleep paralysis, which sits on sleepers' chests.","You can't move. Something heavy and cold is sitting on you.","Stay calm and move your toes, then your fingers","Fight and panic"],
["phihuakat","Phi Hua Khat","Nakhon Pathom, Thailand","sea",13.82,100.06,"void",3,"A headless ghost of Thai stories who wanders where he died, looking for his head.","A figure without a head stumbles along the canal path, arms reaching.","Walk calmly back to the temple","Follow him along the canal"],
["matranh","Ma Tranh","Nghe An, Vietnam","sea",19.2,104.9,"beast",3,"The ghost of a tiger's victim who becomes its servant and leads other travellers to the tiger.","A friendly stranger offers to show you a shortcut through the forest at dusk.","Refuse and stay on the main road","Take the shortcut with him"],
["changi","Old Changi Hospital","Changi, Singapore","sea",1.39,103.98,"void",2,"An abandoned military hospital where explorers report footsteps, voices and figures in the empty wards.","Footsteps echo in the empty ward above you. A trolley rolls by itself.","Leave the building with your group","Go upstairs to check"],
/* ---- East Asia ---- */
["yamauba","Yamauba","Mount Ashigara, Japan","ea",35.33,139.03,"hair",3,"The mountain hag. In the tale of the three talismans, a young monk escapes her by throwing charms that become a river and a mountain.","The kind old woman of the mountain hut is sharpening a knife. She smiles too wide.","Throw the temple talismans and run","Fall asleep in her hut"],
["futakuchi","Futakuchi-onna","Fukushima, Japan","ea",37.75,140.47,"mouth",3,"A woman with a second mouth on the back of her head, hidden under her hair, which eats greedily with strands of hair for hands.","Your host eats nothing, but rice keeps disappearing. Her hair is moving.","Leave quietly in the night","Lift her hair to look"],
["hachishaku","Hachishakusama","Rural Japan","ea",36.2,138.0,"tall",4,"An internet legend from 2008: a woman eight feet tall in white who says 'po po po'. In the story, a boy survives one night in a room sealed with salt while voices try to trick him into opening the door.","'Po... po... po...' Your grandfather's voice calls from outside: 'Open up, it's me.'","Stay in the salted room until morning","Open the door for your grandfather"],
["kunekune","Kunekune","Akita, Japan","ea",39.72,140.1,"void",3,"A white shape that wiggles far away in rice fields on hot days. People say anyone who understands what it is goes mad.","Far across the rice field, something white is twisting in the heat.","Look away and don't think about it","Look through the binoculars"],
["tomino","Tomino's Hell","Tokyo, Japan","ea",35.71,139.76,"void",2,"A 1919 poem by Saijo Yaso, with an internet legend that reading it aloud brings misfortune.","Someone hands you a page with an old poem titled 'Tomino's Hell'. 'Read it out loud,' they dare you.","Read it in your head, not aloud","Read the whole poem out loud"],
["kokkuri","Kokkuri-san","Osaka, Japan","ea",34.69,135.52,"fox",2,"A Japanese spirit-board game played with a coin. The spirit must be asked to leave politely before anyone lets go.","The coin is sliding across the paper by itself. Your friend wants to stop.","Ask 'Kokkuri-san, please go home' before letting go","Let go of the coin and walk away"],
["umibozu","Umibozu","Niigata coast, Japan","ea",37.9,139.05,"water",4,"A huge black sea monk who rises beside boats and asks for a bucket. Give it one with no bottom, or it will fill your boat and sink it.","A huge black shape rises next to the boat. 'Give me a bucket.'","Hand over a bucket with no bottom","Hand over a normal bucket"],
["tsurube","Tsurube-otoshi","Kyoto, Japan","ea",35.03,135.78,"head",3,"A giant head that waits in tall trees and drops onto travellers walking beneath.","The tree above the road creaks. A huge face peers down through the leaves.","Cross to the other side of the road","Walk under the tree"],
["dalgyal","Dalgyal Gwishin","Gangwon, Korea","ea",37.8,128.2,"void",3,"The Korean egg ghost: a spirit with no face, no eyes, no mouth, the restless soul of someone with no one to remember them.","A figure in white turns. Its face is smooth as an egg.","Bow and say a prayer for the forgotten","Shine a light in its face"],
["bulgasari","Bulgasari","Songdo, Korea","ea",37.97,126.55,"beast",2,"A legendary beast of the late Goryeo period that ate iron and grew bigger with every bite.","Something is chewing through the iron gate. It's bigger than yesterday.","Hide the iron and keep away","Feed it more iron"],
["nian","Nian","Henan, China","ea",34.75,113.65,"beast",3,"The New Year beast. It fears the colour red, fire and loud noises, which is why families hang red banners and light firecrackers.","New Year's Eve. Something huge with a single horn prowls the village.","Hang red banners and light firecrackers","Hide in the dark and keep quiet"],
["yeren","Yeren","Shennongjia, China","ea",31.6,110.5,"beast",1,"The wild man of the Shennongjia mountains, a reddish-haired figure locals have reported for centuries.","Red hair snagged on a branch, high above the ground.","Leave it in peace","Set a trap"],
["tigeraunt","Tiger Aunt","Changhua, Taiwan","ea",24.08,120.54,"beast",3,"Hoo-ko-po: a tiger spirit who knocks pretending to be your aunt and eats children's fingers at night. In the tale, a clever sister escapes up a tree.","At night your 'aunt' is crunching something in the dark. 'Just peanuts, dear.'","Say you need the toilet, then climb a tree","Ask her for some peanuts"],
/* ---- South Asia ---- */
["yakshi","Yakshi","Thiruvananthapuram, Kerala","sa",8.52,76.94,"hair",4,"A beautiful spirit of Kerala who smells of pala flowers and asks lone travellers for lime. An iron nail is said to keep her away.","The scent of pala flowers on a dark road. A woman in white asks for a little lime.","Grip an iron nail and walk on","Give her the lime"],
["kuttichathan","Kuttichathan","Kerala, India","sa",10.0,76.3,"imp",1,"A mischievous little spirit of Kerala who throws stones, hides things and sets small fires. Offerings calm him.","Pebbles fall on the roof. Your keys are in the fridge again.","Leave a small offering and ask him to stop","Yell at the empty room"],
["naleba","Nale Ba","Bengaluru, India","sa",12.97,77.59,"void",3,"In 1990s Bangalore, people wrote 'Nale ba' ('come tomorrow' in Kannada) on their doors to fool a witch who knocked at night calling in a loved one's voice.","A knock at night. Your mother's voice: 'Open the door.' Your mother lives in another city.","Write 'Nale ba' on the door","Open the door"],
["murkatta","Murkatta","Uttar Pradesh, India","sa",26.85,80.95,"void",3,"A headless ghost of North India and Nepal, said to be someone beheaded, wandering near the place they died.","On the dark village road, a headless figure walks toward you.","Turn back and take another road","Keep walking toward it"],
["kalukumara","Kalu Kumaraya","Galle, Sri Lanka","sa",6.05,80.22,"horned",3,"The Black Prince of Sinhalese folk belief, a demon said to bother young women and cause bad dreams.","A dark princely figure stands in the doorway of your dream, smiling.","Light a lamp and call the family","Go back to sleep alone"],
["petni","Petni","Kolkata, India","sa",22.57,88.36,"hair",3,"The Bengali ghost of a woman who died unmarried, who lives in trees and calls to passers-by.","A woman sits on a high branch of the old tree, legs dangling and impossibly long.","Walk past without answering","Stop under the tree to talk"],
["beghobhoot","Begho Bhoot","Sundarbans, India","sa",21.95,88.85,"beast",4,"The ghost of someone killed by a tiger, said to roar like one to lure people into the mangroves. Sundarbans villagers call on Bonbibi for protection.","A tiger roars in the mangroves. Then it calls your name.","Call on Bonbibi and stay in the boat","Step off the boat into the mud"],
["kuldhara","Kuldhara","Jaisalmer, India","sa",26.8,70.8,"void",2,"A Rajasthani village said to have been abandoned in a single night by its people, who cursed it so no one could ever live there again.","Empty stone houses in the desert. A door creaks open in the dusk.","Leave before sunset","Spend the night in a house"],
["naag","Ichchhadhari Naag","Madhya Pradesh, India","sa",23.25,77.4,"water",3,"A shape-shifting cobra of Indian legend. In the stories, harm its mate and it will hunt you in human form.","A cobra lies hurt on the road. Its mate is watching from the grass.","Leave both snakes in peace","Kill the injured snake"],
/* ---- Middle East & North Africa ---- */
["bakhtak","Bakhtak","Tehran, Iran","me",35.69,51.39,"void",2,"The Persian nightmare spirit who sits on a sleeper's chest.","Something heavy presses on you. You can't call out.","Stay calm and move one finger at a time","Struggle and scream"],
["hortlak","Hortlak","Konya, Turkey","me",37.87,32.48,"skull",3,"The restless dead of Turkish folklore, said to rise from graves near crossroads.","A figure in a burial shroud stands at the crossroads, waiting.","Go home the long way","Cut across the old graveyard"],
["tepegoz","Tepegoz","Kazilik Mountain, Turkey","me",40.0,39.0,"beast",4,"The one-eyed giant from the Book of Dede Korkut. The hero Basat defeats him with cunning.","An enormous one-eyed giant sleeps across the mountain path.","Wrap yourself in a sheepskin and slip past","Climb over him"],
["sahmaran","Sahmaran","Tarsus, Turkey","me",36.92,34.9,"water",1,"A wise queen of snakes with a woman's head in Anatolian legend, betrayed by a man she trusted. Her image still hangs in many homes.","In the cave, a queen with a serpent's body asks you to keep her secret.","Promise to keep her secret","Tell the king where she is","r"],
["aburigl","Abu Rigl Masloukha","Cairo, Egypt","me",30.05,31.25,"imp",2,"The man with the skinned leg, a bogeyman Egyptian parents warn children about if they go out at nap time.","The street is empty at siesta. A shuffling, limping step comes closer.","Go home and lie down for the siesta","Keep playing outside"],
["teryel","Teryel","Hoggar, Algeria","me",23.3,5.5,"hair",3,"A Tuareg ogress of the desert who lures travellers. Tales say the clever ones outwit her.","A woman calls from the dark rocks: she has water, come closer.","Stay with the camels and the camp","Walk to the rocks for water"],
["tantal","Tantal","Basra, Iraq","me",30.5,47.8,"tall",3,"An Iraqi shapeshifter of marshes and dark alleys who stretches taller and taller to frighten people walking at night.","In the dark alley, a figure grows until it blocks out the stars.","Turn back to the lit street","Push past it"],
["div","Div","Mazandaran, Iran","me",36.5,52.5,"horned",3,"Giant demons of Persian legend, like the White Div defeated by the hero Rostam in the Shahnameh.","A white-haired giant with horns blocks the mountain pass. 'What will you give me?'","Turn back and find another pass","Make a deal with him"],
/* ---- Sub-Saharan Africa ---- */
["lukwata","Lukwata","Lake Victoria, Uganda","af",0.3,32.9,"water",2,"A great serpent said to live in Lake Victoria and to overturn fishing canoes.","The canoe rocks. Something long rolls beneath the water.","Paddle calmly back to the shore","Lean over the side to look"],
["kongamato","Kongamato","Jiundu Swamp, Zambia","af",-11.3,24.3,"bird",2,"An 'overwhelmer of boats': a winged creature said to attack canoes in Zambian swamps.","Leathery wings beat above the swamp. Something dives at the canoe.","Duck low and paddle out of the swamp","Stand up and swat at it"],
["mamlambo","Mamlambo","Mzintlava River, South Africa","af",-30.7,29.4,"water",3,"A river serpent in Zulu and Xhosa belief, sometimes said to bring wealth to those who keep it, at a terrible price.","A stranger offers you a 'lucky' snake in a box. It will make you rich, he says.","Refuse the snake","Take the box home"],
["mmoatia","Mmoatia","Kumasi, Ghana","af",6.7,-1.63,"imp",1,"Small forest folk of Akan belief with backward feet who talk by whistling.","Whistles answer each other in the forest. Tiny backward footprints.","Leave a little food and keep walking","Whistle back to them"],
["fanany","Fanany","Betsileo, Madagascar","af",-21.5,47.0,"water",3,"A Malagasy serpent with seven heads said to be born from the body of the dead, guarding the tombs.","Something with seven heads coils around the family tomb.","Leave the tomb and come back by day","Go closer at night"],
["kianda","Kianda","Luanda, Angola","af",-8.8,13.23,"water",1,"A sea spirit honoured by Angolan fishermen. When the sea is disrespected, the catch disappears.","The Luanda bay is calm and empty. Fishermen are laying offerings at the water.","Join the offering quietly","Throw rubbish into the bay","r"],
["agogwe","Agogwe","Usambara, Tanzania","af",-4.75,38.45,"imp",1,"Small hairy people of Tanzanian forests, reported by hunters and travellers.","Two small hairy figures watch from the long grass, then vanish.","Let them go","Chase them into the grass"],
["chemosit","Chemosit","Nandi, Kenya","af",0.2,35.0,"bird",3,"A half-man, half-bird devil of Nandi folklore who sings at night with a glowing mouth.","A song drifts from the bush. A red light glows where a mouth should be.","Stay inside and cover your ears","Go out to find the singer"],
["flyingdutchman","The Flying Dutchman","Cape of Good Hope, South Africa","af",-34.36,18.47,"fire",3,"A ghost ship doomed to sail forever, said to be seen off the Cape before a disaster.","A glowing ship with ragged sails moves against the wind, straight toward you.","Turn the bow away and make for the harbour","Signal it to come closer"],
["ojuju","Ojuju Calabar","Calabar, Nigeria","af",4.95,8.32,"mouth",2,"A huge-headed figure that Nigerian parents and older siblings warn children about, to keep them indoors after dark.","Something with a huge head lurks by the gate after dark.","Go back inside before dark","Sneak out to look"],
/* ---- Europe: east ---- */
["mavka","Mavka","Carpathians, Ukraine","eu",48.3,24.5,"hair",3,"A forest maiden of Ukrainian folklore with no back: behind her you can see her insides. She tickles travellers and leads them into the woods.","A beautiful girl dances in the clearing. When she turns, you can see through her back.","Keep walking without dancing","Join her dance"],
["vii","Viy","Poltava, Ukraine","eu",49.59,34.55,"eyes",4,"From Gogol's 1835 tale based on Ukrainian folklore: a monster whose eyelids reach the ground. Whatever it looks at, dies.","In the church, they are lifting the eyelids of something huge. 'Look at it,' a voice says.","Keep your eyes shut and don't look","Look into its eyes"],
["boruta","Boruta","Leczyca, Poland","eu",52.06,19.2,"horned",2,"A devil who lives in the cellars of Leczyca castle, guarding treasure. He sometimes appears as a nobleman.","A nobleman in old clothes shows you the castle's treasure. 'Take a coin, take two.'","Leave the treasure and go upstairs","Fill your pockets"],
["golem","Golem of Prague","Prague, Czechia","eu",50.09,14.42,"tall",2,"A clay giant made by Rabbi Loew to protect the Jewish quarter of Prague, brought to life by a holy word.","The clay giant is still walking at dusk on Friday. It must rest for the Sabbath.","Remove the word from its mouth","Order it to keep working"],
["moroi","Moroi","Wallachia, Romania","eu",44.43,26.1,"skull",3,"A Romanian restless dead, pale and hungry, said to visit family at night.","Your late uncle is sitting at the kitchen table. He looks very pale.","Rub garlic on the doors and windows","Sit and eat with him"],
["mumapadurii","Muma Padurii","Maramures, Romania","eu",47.65,23.6,"hair",3,"The Mother of the Forest, a hag who leads lost children deeper into the trees.","An old woman with bark for skin waves you deeper into the forest.","Turn your coat inside out and follow the stream out","Follow her"],
["pricolici","Pricolici","Oltenia, Romania","eu",44.32,23.8,"beast",3,"A Romanian werewolf spirit of the restless dead.","A wolf too large for any forest watches you from the road.","Walk to the village church","Run into the forest"],
["talasum","Talasum","Rhodopes, Bulgaria","eu",41.6,24.7,"void",3,"A Bulgarian spirit of someone whose shadow was built into a new house's foundation. Builders avoid letting a person's shadow fall on the stones.","The builders are laying the foundation. Your shadow is about to fall across it.","Step out of the sun and away from the stones","Stand there and watch"],
["sava","Sava Savanovic","Zarozje, Serbia","eu",44.05,19.65,"skull",3,"One of Serbia's most famous vampires, said to live in an old watermill and attack the millers.","The old mill on the river. The miller offers you a bed for the night.","Thank him and sleep somewhere else","Stay the night in the mill"],
["aitvaras","Aitvaras","Samogitia, Lithuania","eu",55.9,22.3,"fire",2,"A flying fiery rooster in Lithuanian folklore that brings its owner stolen wealth, and trouble.","A rooster with a burning tail lands on your roof holding gold.","Refuse the gold and send it away","Feed it and keep the gold"],
["koschei","Koschei the Deathless","Ryazan, Russia","eu",54.63,39.73,"skull",4,"A Russian sorcerer who cannot die because his death is hidden: in a needle, in an egg, in a duck, in a hare, in a chest under an oak.","The skeletal king laughs. 'You cannot kill me.' His death is somewhere far away.","Find the needle in the egg and break it","Fight him with your sword"],
["vodyanoy","Vodyanoy","Tver, Russia","eu",56.86,35.9,"water",3,"The old man of Russian rivers and mill ponds, with a green beard and webbed hands, who drags swimmers down.","An old man with a weedy green beard waits beside the mill wheel.","Stay out of the mill pond after sunset","Swim across the pond"],
["bukavac","Bukavac","Lika, Croatia","eu",44.75,15.3,"beast",3,"A six-legged lake monster of Croatian folklore with twisted horns that bellows at night.","A terrible bellowing comes from the lake. Something with six legs climbs onto the bank.","Get away from the lake","Wade in to look"],
["vilkacis","Vilkacis","Vidzeme, Latvia","eu",57.3,25.3,"beast",3,"A Latvian werewolf. Some stories say it guards treasure and helps those who treat it kindly.","A wolf with a man's eyes sits by your campfire.","Speak to it kindly and share your bread","Throw a burning stick at it"],
["shtriga","Shtriga","Shkoder, Albania","eu",42.07,19.5,"bird",3,"An Albanian witch who drains the life of sleeping children and flies as a moth or bird at night.","A large moth beats at the window over the sleeping baby.","Keep the window shut and stay awake","Open the window to let it out"],
["polevik","Polevik","Smolensk, Russia","eu",54.78,32.05,"imp",2,"A Slavic field spirit who punishes farmers working at noon or drinking in the fields.","Noon in the rye. A little man with grass for hair glares at your bottle.","Put down the bottle and rest in the shade","Keep drinking in the field"],
/* ---- Europe: west ---- */
["blackannis","Black Annis","Leicester, England","eu",52.64,-1.13,"hair",3,"A blue-faced hag with iron claws said to live in a cave in the Dane Hills.","Iron claws scrape on stone. A blue face peers out of a cave.","Go home before dark","Look inside the cave"],
["jennyg","Jenny Greenteeth","Lancashire, England","eu",53.8,-2.6,"water",3,"A river hag who pulls children under. Ponds covered in green duckweed are where she waits.","A pond is covered in bright green duckweed. It looks like solid ground.","Stay away from the duckweed water","Step onto the green"],
["redcap","Redcap","Scottish Borders","eu",55.55,-2.8,"imp",3,"A goblin of ruined border castles who dyes his cap in travellers' blood. Iron boots and scripture drive him off.","In the ruined tower, a little man in a dripping red cap grins at you.","Read out holy words and leave","Sleep in the ruined tower"],
["nuckelavee","Nuckelavee","Orkney, Scotland","eu",59.0,-3.0,"beast",4,"A skinless horse-demon from the sea in Orcadian legend. It cannot cross fresh running water.","Something skinless, half horse, half man, rises from the shore.","Run for the stream: it can't cross fresh water","Hide in the seaweed"],
["deargdue","Dearg Due","Waterford, Ireland","eu",52.26,-7.11,"skull",3,"An Irish revenant who rises from her grave to drain men. Villagers piled stones on her grave to keep her down.","A grave in the churchyard has been disturbed. The stones have rolled away.","Pile the stones back on the grave","Leave the grave open"],
["greyman","Grey Man of Ben Macdui","Cairngorms, Scotland","eu",57.07,-3.67,"tall",2,"A huge grey presence climbers report on the summit of Ben Macdui, with heavy footsteps behind them and a feeling of dread.","Fog on the summit. Footsteps behind you, much bigger than yours.","Walk down carefully, without running","Run blindly into the fog"],
["perchta","Perchta","Salzburg, Austria","eu",47.8,13.04,"hair",2,"An Alpine Christmas spirit who rewards hard workers and punishes the lazy. Eat the traditional fish and porridge on her night.","Twelfth Night. A tall woman with one goose foot inspects your kitchen.","Eat the porridge and fish of her night","Leave your chores undone"],
["piedpiper","Pied Piper","Hamelin, Germany","eu",52.1,9.36,"tall",2,"A piper in bright colours who rid Hamelin of rats in 1284. When the town refused to pay, he led its children away.","The piper has cleared the rats. Now he wants his pay.","Pay the piper","Refuse to pay him"],
["lorelei","Lorelei","St Goarshausen, Germany","eu",50.14,7.73,"water",3,"A siren on a high rock over the Rhine whose song makes boatmen forget the dangerous rocks below.","A golden-haired woman sings on the cliff. The boat drifts toward the rocks.","Keep your eyes on the river and steer","Look up at the singer"],
["tatzelwurm","Tatzelwurm","Bavarian Alps, Germany","eu",47.5,11.0,"beast",2,"A stubby lizard-like creature of Alpine legend with a cat's face and a deadly hiss.","A thick worm with a cat's face hisses from under the rock.","Back away slowly","Poke it with your stick"],
["belliegha","Il-Belliegha","Valletta, Malta","eu",35.9,14.51,"water",2,"A Maltese monster that lives at the bottom of wells and swallows children who lean over.","The well is very deep. Something below calls your name.","Step back from the well","Lean over to look"],
["melusine","Melusine","Lusignan, France","eu",46.43,0.12,"water",2,"A water fairy who married a nobleman on one condition: he must never look at her on Saturdays, when her legs became a serpent's tail.","It's Saturday. Your wife is locked in her bath. Water splashes oddly.","Respect the promise and stay away","Peek through the keyhole"],
["nutons","Nutons","Ardennes, Belgium","eu",50.0,5.7,"imp",1,"Little people of the Belgian Ardennes who mend shoes and tools at night in return for a bowl of food. Insult them and they never return.","In the morning your broken tools are fixed. Tiny footprints lead to the hills.","Leave a bowl of food out tonight","Hide and try to catch them"],
["huldufolk","Huldufolk","Hafnarfjordur, Iceland","eu",64.07,-21.95,"void",1,"The hidden people of Iceland, who live in rocks. Roads have been bent around their homes.","The digger is about to break the big rock. Workers' machines keep failing.","Build around the elf rock","Smash the rock anyway","r"],
["nisse","Nisse","Telemark, Norway","eu",59.3,9.0,"imp",1,"A farm spirit who protects the farm and its animals. On Christmas Eve he must have porridge with a pat of butter.","Christmas Eve. The cows are restless and the barn door is banging.","Leave porridge with butter in the barn","Forget the butter"],
["loupgarou","Loup-garou","Normandy, France","eu",49.1,0.3,"beast",3,"The French werewolf, said to roam the countryside at night for a set number of years.","A wolf on two legs crosses the moonlit lane.","Call his human name aloud","Shoot at him"],
/* ---- Central Asia, Caucasus & Siberia ---- */
["chuchuna","Chuchuna","Yakutia, Russia","ca",64.0,126.0,"beast",2,"A tall wild man of Yakut and Evenk stories, dressed in skins, said to steal food from hunters.","Someone has been eating from your cache in the taiga. Huge bare footprints.","Leave the area and warn the hunters","Wait for it by the cache"],
["abaasy","Abaasy","Yakutsk, Russia","ca",62.03,129.73,"skull",3,"Demons of Yakut legend with iron teeth and one eye, who live in the underworld and bring sickness.","An iron grin and a single eye shine from under the frozen floor.","Call the healer and keep the fire bright","Go down into the cellar"],
["dali","Dali","Svaneti, Georgia","ca",43.0,42.7,"hair",1,"The Georgian goddess of the hunt, golden-haired, who protects mountain animals. Hunters who take too much are punished.","High on the mountain, a golden-haired woman stands among the ibex.","Lower your bow and leave the herd","Shoot the white ibex","r"],
["ichetik","Ichetik","Udmurtia, Russia","ca",57.0,53.2,"water",2,"A water spirit of Udmurt belief who lives in pools under mill wheels.","Bubbles rise in the millpond, though there's no wind.","Toss in a small offering and stay out","Jump into the pool"],
["yoma","Yoma","Komi, Russia","ca",61.7,50.8,"hair",3,"A forest witch of Komi tales who lives in a hut in the woods, like a cousin of Baba Yaga.","An old woman in the taiga hut asks you to come in and warm up.","Thank her and keep walking","Go into the hut"],
["ochokochi","Ochokochi","Mingrelia, Georgia","ca",42.5,42.0,"beast",3,"A hairy forest being of Georgian legend with a chest shaped like an axe blade.","Something hairy steps from the trees, with a sharp bony chest.","Stay away from the forest at night","Walk to meet it"],
["albys","Albys","Tuva, Russia","ca",51.7,94.45,"fox",2,"A shape-shifting Tuvan spirit who appears as a beautiful woman or a fox and leads travellers astray.","A fox with a woman's eyes trots ahead of you on the steppe.","Stay on the trail you know","Follow the fox"],
["dev","Dev","Samarkand, Uzbekistan","ca",39.65,66.96,"horned",3,"A giant demon from Uzbek fairy tales who guards treasure and kidnaps princesses.","A horned giant sleeps on a pile of treasure in the cave.","Leave the treasure and sneak out","Take a ruby from the pile"],
/* ---- North America ---- */
["wampus","Wampus Cat","Great Smoky Mountains, Tennessee","na",35.6,-83.5,"beast",3,"A cat-like creature of Appalachian folklore whose scream is heard in the hills at night.","A scream echoes through the hollow. Eyes glow from the laurel.","Bolt the cabin door","Go out with a lantern"],
["skunkape","Skunk Ape","Everglades, Florida","na",25.8,-80.9,"beast",1,"A smelly ape-like creature reported in the Florida swamps.","A horrible smell, and something big pushing through the sawgrass.","Back away to the boat","Follow the smell"],
["whiterock","Lady of White Rock Lake","Dallas, Texas","na",32.83,-96.72,"water",2,"A soaked young woman in a 1930s evening dress asks drivers for a lift, then vanishes, leaving a wet seat.","A soaked woman in an old evening gown waves at you by the lake.","Drive on","Give her a lift"],
["hatman","The Hat Man","United States","na",39.0,-96.0,"tall",3,"A shadow figure in a wide-brimmed hat that many people describe seeing during sleep paralysis.","A tall shadow in a wide hat stands at the end of your bed.","Stay calm: move your toes and fingers until you wake","Try to speak to it"],
["brayroad","Beast of Bray Road","Elkhorn, Wisconsin","na",42.67,-88.54,"beast",3,"A wolf-like creature reported walking upright along a rural Wisconsin road since the 1980s.","Something kneeling by the road stands up on two legs.","Keep driving","Stop and get out"],

["chullachaqui","Chullachaqui","Loreto, Peru","la",-3.75,-73.25,"imp",3,"An Amazon trickster who takes the shape of a friend to lead people into the jungle. One of its feet is small and misshapen, and it hides it.","Your friend calls you to follow him off the trail. He keeps one foot hidden.","Look at his feet before you follow","Follow him into the jungle"],

let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function screech(kind,vol=.75){const a=audio();if(!a||SET.level!=='full'||!SET.sound)return;const t=a.currentTime,out=a.createGain();out.gain.value=vol;const comp=a.createDynamicsCompressor();out.connect(comp);comp.connect(a.destination);
  const len=a.sampleRate*1.3,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource();n.buffer=buf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=3;bp.frequency.setValueAtTime(kind==='water'?900:3200,t);bp.frequency.exponentialRampToValueAtTime(500,t+1.1);
  const ng=a.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.9,t+.015);ng.gain.exponentialRampToValueAtTime(.001,t+1.2);n.connect(bp);bp.connect(ng);ng.connect(out);n.start(t);n.stop(t+1.3);
  const ws=a.createWaveShaper(),cur=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cur[i]=Math.tanh(x*6)}ws.curve=cur;
  const base=kind==='beast'||kind==='horned'?240:kind==='imp'?1400:880;
  [1,1.063,1.5].forEach((m,i)=>{const o=a.createOscillator();o.type=i===2?'square':'sawtooth';o.frequency.setValueAtTime(base*m,t);o.frequency.exponentialRampToValueAtTime(base*m*.25,t+1);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.05);o.connect(ws);ws.connect(g);g.connect(out);o.start(t);o.stop(t+1.1)});
  const s=a.createOscillator();s.frequency.setValueAtTime(95,t);s.frequency.exponentialRampToValueAtTime(35,t+.35);const sg=a.createGain();sg.gain.setValueAtTime(1,t);sg.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(sg);sg.connect(out);s.start(t);s.stop(t+.45)}
function thump(v=.5){const a=audio();if(!a||!SET.sound||SET.level==='off')return;const t=a.currentTime;[0,.22].forEach((dt,i)=>{const o=a.createOscillator();o.frequency.setValueAtTime(70,t+dt);o.frequency.exponentialRampToValueAtTime(38,t+dt+.18);const g=a.createGain();g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v*(i?.6:1),t+dt+.01);g.gain.exponentialRampToValueAtTime(.001,t+dt+.25);o.connect(g);g.connect(a.destination);o.start(t+dt);o.stop(t+dt+.3)})}
let drone=null;
function ambience(on){const a=audio();if(!a)return;if(drone){try{drone.g.gain.setTargetAtTime(0,a.currentTime,.4);const d=drone;setTimeout(()=>{try{d.n.stop();d.o.stop()}catch(e){}},1500)}catch(e){}drone=null}
  if(!on||!SET.sound||SET.level==='off')return;const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
  const n=a.createBufferSource();n.buffer=buf;n.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const o=a.createOscillator();o.frequency.value=55;const og=a.createGain();og.gain.value=.025;const g=a.createGain();g.gain.value=0;g.gain.setTargetAtTime(.5,a.currentTime,1.5);n.connect(lp);lp.connect(g);o.connect(og);og.connect(g);g.connect(a.destination);n.start();o.start();drone={n,o,g}}

function fxDefs(){if(document.getElementById('nlfx'))return;const d=document.createElement('div');d.innerHTML=`<svg id="nlfx" width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rip"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="3"><animate attributeName="baseFrequency" dur="2.2s" values="0.012 0.04;0.02 0.07;0.012 0.04" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="34"/></filter></svg>`;document.body.appendChild(d.firstChild)}
function scare(g,big=true){return new Promise(res=>{
  const lvl=SET.level,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=document.createElement('div');el.id='scare';el.setAttribute('role','alertdialog');el.setAttribute('aria-label',g.name);
  const art=portrait(g,lvl!=='off'),ent=ENTRY[g.look]||'rush',c=cryOf(g),fx=fxOf(g);
  if(lvl==='off'){el.className='calm';el.innerHTML=`<div class="sc-calm">${art}<p>${esc(g.name)} found you.</p><small>Tap to continue</small></div>`;document.body.appendChild(el);const done=()=>{el.remove();res()};el.onclick=done;el.onkeydown=done;el.tabIndex=0;el.focus();return}
  const mild=lvl==='mild'||reduce||!big;fxDefs();
  el.className=`pre ${mild?'mild':'full'} e-${ent} fx-${fx}`;
  const word=c.w&&!mild?`<div class="sc-cry" aria-hidden="true">${[0,1,2].map(k=>`<span style="--k:${k}">${esc(c.w)}</span>`).join('')}</div>`:'';
  const over=mild?'':fx==='hair'?`<div class="sc-hair" aria-hidden="true">${Array.from({length:26},(_,k)=>`<i style="--x:${k*4}%;--d:${(k%5)*.04}s;--h:${60+(k*37%40)}%"></i>`).join('')}</div>`:fx==='blood'?`<div class="sc-blood" aria-hidden="true">${Array.from({length:14},(_,k)=>`<i style="--x:${4+k*7}%;--d:${(k%4)*.12}s;--h:${30+(k*29%55)}%"></i>`).join('')}</div>`:fx==='burn'?'<div class="sc-burn" aria-hidden="true"></div>':fx==='static'?'<div class="sc-scan" aria-hidden="true"></div>':'';
  el.innerHTML=`<div class="sc-stage"><div class="sc-l base">${art}</div>${mild?'':`<div class="sc-l r">${art}</div><div class="sc-l c">${art}</div><div class="sc-tear">${[0,1,2,3,4,5].map(i=>`<div class="sc-slice" style="--i:${i}">${art}</div>`).join('')}</div>`}</div>${over}${word}<div class="sc-name" data-t="${esc(g.name)}">${esc(g.name)}</div><div class="sc-grain"></div><small class="sc-tap">Tap to continue</small>`;
  el.style.background=`radial-gradient(circle at 50% 45%,${BGC[g.look]||'#1a2250'},#000 72%)`;document.body.appendChild(el);
  const wait=mild?350:900+Math.random()*900;
  if(!mild){thump(.5);setTimeout(()=>{if(el.isConnected)cry(g,'tease')},120)}
  setTimeout(()=>{el.classList.remove('pre');el.classList.add('go');if(!mild){screech(g.look,.4);cry(g,'scare');buzzPhone([80,40,220]);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),520)}},wait);
  if(!mild&&g.danger>=4)setTimeout(()=>{if(!el.isConnected)return;el.classList.add('again');cry(g,'scare');screech('imp',.35);buzzPhone([60,30,160]);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),520)},wait+1300);
  let can=false;setTimeout(()=>can=true,wait+700);
  const done=()=>{if(!can)return;el.classList.add('out');setTimeout(()=>{el.remove();res()},380)};
  el.onclick=done;el.tabIndex=0;el.onkeydown=done;el.focus();setTimeout(()=>{can=true;done()},wait+3400);
})}
/* fake-out: everything says it's coming... and then nothing does */
function fakeout(){return new Promise(res=>{if(SET.level!=='full'||matchMedia('(prefers-reduced-motion: reduce)').matches)return res();
  const el=document.createElement('div');el.id='fake';el.setAttribute('aria-hidden','true');document.body.appendChild(el);thump(.6);setTimeout(()=>thump(.7),900);buzzPhone(30);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();res()},700)},1900)})}

function rankOf(xp=ST.xp||0){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k});return{i,name:RANKS[i][LANG()==='id'?2:1],next:RANKS[i+1]?RANKS[i+1][0]:null,base:RANKS[i][0]}}
function addXP(n,why){const before=rankOf().i;ST.xp=(ST.xp||0)+n;save();const r=rankOf();if(r.i>before){toast(`<b>${T('New rank')}</b> ${esc(r.name)}${r.i===3?' · '+T('Nightmare difficulty unlocked'):''}`,'ach')}const b=$('.rank');b&&(b.textContent=r.name)}

function campfire(g){const L=LANG(),c=g.place.split(', ').pop(),low=s=>s.charAt(0).toLowerCase()+s.slice(1),R=rng(hsh(g.id+'cf'));
  if(L==='id')return[OPEN.id[g.reg].replace('{c}',c),g.story,`Katanya, kamu akan tahu ia sudah dekat ketika... ${low(g.sign)}`,`Kalau ia datang, para tetua bilang: ${low(g.rule)}. Dan apa pun yang terjadi, jangan pernah ${low(g.trap)}.`,CLOSE.id[R()*4|0]];

/* ---- share as image ---- */
function svgImg(svg){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="600" height="600" '))})}
function wrap(x,t,X,Y,w,lh,max=99){const ws=t.split(' ');let line='',n=0;for(const w2 of ws){const tt=line?line+' '+w2:w2;if(x.measureText(tt).width>w&&line){x.fillText(line,X,Y);Y+=lh;line=w2;if(++n>=max)return Y}else line=tt}if(line)x.fillText(line,X,Y);return Y+lh}
async function shareImage(kind,data){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  const gr=x.createRadialGradient(540,300,50,540,500,900);gr.addColorStop(0,'#1d2550');gr.addColorStop(1,'#05060d');x.fillStyle=gr;x.fillRect(0,0,1080,1350);
  x.fillStyle='#f2b54a';x.font='600 30px Karla, sans-serif';x.textAlign='center';x.fillText('NIGHTLORE',540,80);x.fillStyle='#ece4cf';
  if(kind==='ghost'){const g=data,img=await svgImg(portrait(g,false));x.save();x.beginPath();x.arc(540,380,230,0,7);x.clip();if(img)x.drawImage(img,310,150,460,460);x.restore();x.strokeStyle='#36437a';x.lineWidth=3;x.beginPath();x.arc(540,380,232,0,7);x.stroke();
    x.font='84px "IM Fell English", Georgia, serif';x.fillText(g.name,540,720);x.font='32px Karla, sans-serif';x.fillStyle='#a3a8c3';x.fillText(g.place,540,770);
    x.fillStyle='#ece4cf';x.font='36px "IM Fell English", Georgia, serif';let y=wrap(x,g.story,540,850,880,50,5);x.fillStyle='#8ff0dc';x.font='600 30px Karla, sans-serif';wrap(x,T('What the lore says to do')+': '+g.rule,540,y+30,880,42,3)}
  else{const N2=data;x.font='120px "IM Fell English", Georgia, serif';x.fillStyle=N2.ok?'#f2b54a':'#e0344f';x.fillText(N2.ok?T('Dawn'):T('Taken'),540,260);x.fillStyle='#a3a8c3';x.font='34px Karla, sans-serif';x.fillText(N2.where,540,320);
    let y=420;for(const l of N2.log){const g=GBY[l.id];if(!g)continue;const img=await svgImg(portrait(g,false));x.save();x.beginPath();x.arc(220,y,58,0,7);x.clip();if(img)x.drawImage(img,162,y-58,116,116);x.restore();x.textAlign='left';x.fillStyle='#ece4cf';x.font='48px "IM Fell English", Georgia, serif';x.fillText(g.name,310,y);x.fillStyle=l.ok?'#8ff0dc':'#ff8a9b';x.font='28px Karla, sans-serif';x.fillText((l.ok?'✓ ':'✗ ')+g.place,310,y+42);x.textAlign='center';y+=140;if(y>1180)break}}
  x.fillStyle='#6d7396';x.font='26px Karla, sans-serif';x.fillText(T('Made by')+' TheFrst · '+location.host+location.pathname.replace(/index\.html$/,''),540,1300);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const name=(kind==='ghost'?data.id:'night')+'-nightlore.png';
  try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(T('Image saved'))}

function tiltOn(){const l=$('#lantern');if(!l)return;const h=e=>{if(e.gamma==null)return;const x=Math.max(5,Math.min(95,50+e.gamma*1.4)),y=Math.max(5,Math.min(95,30+(e.beta-30)*1.2));const L=$('#lantern');if(!L){removeEventListener('deviceorientation',h);return}L.style.setProperty('--lx',x+'%');L.style.setProperty('--ly',y+'%')};
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')addEventListener('deviceorientation',h)}).catch(()=>{})}else addEventListener('deviceorientation',h)}

{t:{en:'The lantern lights itself',id:'Pelita yang menyala sendiri'},reg:'sea',where:{en:'Your grandmother\'s house, Jakarta',id:'Rumah nenekmu, Jakarta'},g:['jerukpurut','simanis','kuntilanak'],
 intro:{en:'Your grandmother was buried this afternoon. Tonight you are alone in her old house in Jakarta, and her brass lantern, the one she never let anyone touch, has lit itself on the table. Outside, something that waited a long time for her is now waiting for you.',id:'Nenekmu dimakamkan sore tadi. Malam ini kamu sendirian di rumah tuanya di Jakarta, dan pelita kuningannya, yang tak pernah boleh disentuh siapa pun, menyala sendiri di atas meja. Di luar, sesuatu yang lama menunggu nenekmu kini menunggumu.'},

 c:{q:{en:'What do you do with the lantern?',id:'Apa yang kamu lakukan dengan pelita itu?'},a:[{t:{en:'Take it with you, and keep it burning',id:'Bawa, dan jaga agar tetap menyala'},f:'lantern'},{t:{en:'Leave it with the neighbours',id:'Titipkan pada tetangga'},f:''}]}},
{t:{en:'The monk on the mountain',id:'Biksu di gunung'},reg:'ea',where:{en:'A mountain temple near Kyoto',id:'Kuil gunung dekat Kyoto'},g:['rokurokubi','yamauba','kuchisake'],
 intro:{en:'The address in her list leads to a mountain temple. An old monk recognises your face before you speak. "She came here fifty years ago, with the same lantern. Stay the night. You will see why she came."',id:'Alamat di daftarnya membawamu ke kuil di gunung. Seorang biksu tua mengenali wajahmu sebelum kamu bicara. "Dia datang ke sini lima puluh tahun lalu, membawa pelita yang sama. Menginaplah. Kamu akan tahu kenapa dia datang."'},

{t:{en:'The riddle in the desert',id:'Teka-teki di gurun'},reg:'sa',where:{en:'A ruined fort, Rajasthan',id:'Benteng runtuh, Rajasthan'},g:['bhangarh','chudail','vetala'],

function setVB(){const s=$('#msvg');if(!s)return;const r=ratio();vb.w=Math.max(40,Math.min(1000,vb.w));vb.h=vb.w*r;vb.x=Math.max(0,Math.min(1000-vb.w,vb.x));vb.y=Math.max(-40,Math.min(480-vb.h,vb.y));s.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);drawPins()}
function zoomAt(f,cx=.5,cy=.5){const nw=vb.w*f;vb.x+=(vb.w-nw)*cx;vb.y+=(vb.h-nw*ratio())*cy;vb.w=nw;setVB()}
function bindMap(){const s=$('#msvg'),P=new Map();let moved=0,pd=0;
  $$('[data-z]').forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='in')zoomAt(.6);else if(z==='out')zoomAt(1.6);else home()});
  s.addEventListener('wheel',e=>{e.preventDefault();const r=s.getBoundingClientRect();zoomAt(e.deltaY>0?1.15:.87,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
  s.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});

    if(P.size===1){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){s.setPointerCapture&&s.setPointerCapture(e.pointerId);vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;setVB()}}
    else if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){zoomAt(pd/d,((a[0]+b[0])/2-r.left)/r.width,((a[1]+b[1])/2-r.top)/r.height)}pd=d;moved=99}});
  const up=e=>{const was=P.size;P.delete(e.pointerId);pd=0;if(placing&&was===1&&moved<6){const pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(s.getScreenCTM().inverse());placing=false;legendForm(+(90-p.y/500*180).toFixed(2),+(p.x/1000*360-180).toFixed(2))}};

function startQuiz(reg){const pool=reg==='all'?GHOSTS:GHOSTS.filter(g=>g.reg===reg);QZ={pool,reg,score:0,streak:0,end:Date.now()+60000,miss:[],seen:new Set(),t:0};ST.quizGames++;save();qNext();QZ.t=setInterval(qTick,100)}
function stopQuiz(){if(QZ){clearInterval(QZ.t);QZ=null}}
function qTick(){if(!QZ)return;const left=Math.max(0,QZ.end-Date.now()),b=$('.qtime i'),s=$('.qtime span');if(b)b.style.width=(left/600)+'%';if(s)s.textContent=Math.ceil(left/1000)+'s';if(left<=0)qEnd()}
function qNext(){const avail=QZ.pool.filter(g=>!QZ.seen.has(g.id)),g=pick(avail.length?avail:QZ.pool);QZ.seen.add(g.id);const type=Math.random()<.55?'rule':'name';
  let opts,prompt;
  if(type==='rule'){prompt=`<p class="scene sign">${esc(g.sign)}</p><p class="q">What saves you?</p>`;opts=shuf([{ok:1,t:g.rule},...shuf(GHOSTS.filter(x=>x.id!==g.id&&x.rule!==g.rule)).slice(0,3).map(x=>({t:x.rule}))])}
  else{prompt=`<p class="scene">${esc(g.story.replace(new RegExp(g.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'This one'))}</p><p class="q">What is it? <small>${esc(g.place.split(', ').pop())}</small></p>`;const sm=GHOSTS.filter(x=>x.id!==g.id&&x.reg===g.reg);opts=shuf([{ok:1,t:g.name},...shuf(sm.length>=3?sm:GHOSTS.filter(x=>x.id!==g.id)).slice(0,3).map(x=>({t:x.name}))])}
  $('#main').innerHTML=`<section class="stage quiz"><div class="hud"><span>Rule or Ruin</span><span class="qscore"><b>${QZ.score}</b> ${QZ.streak>1?`· streak ×${QZ.streak}`:''}</span><span class="qtime"><span>60s</span><i></i></span></div>${prompt}<div class="choices">${opts.map((o,i)=>`<button data-q="${o.ok?1:0}">${esc(o.t)}</button>`).join('')}</div><button class="btn ghosty" data-qx>Stop</button></section>`;qTick();
  $$('[data-q]').forEach(b=>b.onclick=()=>{$$('[data-q]').forEach(x=>{x.disabled=true;if(x.dataset.q==='1')x.classList.add('right')});
    if(b.dataset.q==='1'){QZ.streak++;QZ.score+=QZ.streak>=5?2:1;b.classList.add('right');setTimeout(()=>QZ&&qNext(),450)}
    else{QZ.streak=0;QZ.end-=5000;QZ.miss.push(g.id);b.classList.add('wrong');document.body.classList.add('shake','redflash');setTimeout(()=>document.body.classList.remove('shake','redflash'),520);if(SET.level==='full'&&Math.random()<.18&&!g.rev){clearInterval(QZ.t);const pause=QZ.end-Date.now();scare(g,false).then(()=>{if(!QZ)return;QZ.end=Date.now()+pause;QZ.t=setInterval(qTick,100);qNext()})}else setTimeout(()=>QZ&&qNext(),900)}});
  $('[data-qx]').onclick=qEnd}
function qEnd(){if(!QZ)return;clearInterval(QZ.t);const z=QZ;QZ=null;const best=z.score>ST.quizBest;ST.quizBest=Math.max(ST.quizBest,z.score);save();addXP(z.score*3);checkAch();
  $('#main').innerHTML=`<section class="stage"><h1>${z.score}</h1><p class="scene">${best?'A new best. The old stories are in your blood.':z.score>=10?'The villagers would trust you with their children.':'You would not last long out there. Yet.'}</p>${z.miss.length?`<p class="q">Read up on the ones that got you</p><div class="rel">${[...new Set(z.miss)].map(id=>{const g=GBY[id];return`<button data-rel="${id}"><span class="mini">${portrait(g)}</span>${esc(g.name)}<small>${esc(g.place.split(', ').pop())}</small></button>`}).join('')}</div>`:''}<div class="row"><button class="btn primary" data-again autofocus>Play again</button><button class="btn" data-back2>Choose legends</button></div></section>`;
  $('[data-again]').onclick=()=>startQuiz(z.reg);$('[data-back2]').onclick=()=>quizSetup($('#main'));$$('[data-rel]').forEach(b=>b.onclick=()=>openGhost(b.dataset.rel))}

/* ---------- settings + title ---------- */
function openSettings(first){const d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Settings');
  d.innerHTML=`<div class="mbox"><h2>${first?'Before you go in':'Settings'}</h2><p>NIGHTLORE has sudden jumpscares with loud sounds and screen shake. There is a single bright flash in full mode, never a strobe. Choose what you can handle.</p>
  <div class="lv" role="radiogroup">${[['full','Full','Sound, shake, glitch and the slow build before it hits'],['mild','Mild','The ghost still appears, quietly, with no sound or shake'],['off','Off','No jumpscares at all, just a still picture']].map(([k,l,s])=>`<label><input type="radio" name="lv" value="${k}" ${SET.level===k?'checked':''}><span><b>${l}</b><small>${s}</small></span></label>`).join('')}</div>
  <label class="snd"><input type="checkbox" id="snd" ${SET.sound?'checked':''}> Ambient night sound and heartbeat</label>
  ${canSpeak?`<label class="snd"><input type="checkbox" id="vc" ${SET.voice?'checked':''}> Narrator voice on night walks</label>`:''}
  <div class="row"><button class="btn primary" data-ok>${first?'Enter':'Save'}</button>${first?'':'<button class="btn" data-test>Test a scare</button><button class="btn danger" data-reset>Erase progress</button>'}</div></div>`;
  document.body.appendChild(d);d.querySelector('[data-ok]').focus();
  const read=()=>{SET.level=d.querySelector('[name=lv]:checked').value;SET.sound=d.querySelector('#snd').checked;const v=d.querySelector('#vc');if(v)SET.voice=v.checked;save()};
  d.querySelector('[data-ok]').onclick=()=>{read();audio();ST.warned=true;save();d.remove();shell();render()};
  const t=d.querySelector('[data-test]');t&&(t.onclick=()=>{read();audio();scare(pick(GHOSTS.filter(g=>!g.rev)))});
  const r=d.querySelector('[data-reset]');r&&(r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent='Tap again: erase everything';return}const keep=ST.custom;ST={met:[],named:[],nights:0,dawns:0,taken:0,best:0,warned:true,stamps:{},ach:[],daily:{},quizBest:0,quizGames:0,charmsRight:0,hardDawns:0,perfect:0,custom:keep,respect:0,followUps:0,tours:0,spoken:0};save();d.remove();shell();render();toast('Progress erased. Your own legends were kept.')})}
function title(){const el=document.createElement('div');el.id='title';
  const g=pick(GHOSTS.filter(x=>!x.rev&&!x.mine)),dl=ST.daily[today()];
  el.innerHTML=`<canvas id="tc" aria-hidden="true"></canvas><div class="tin"><h1 class="logo" aria-label="Nightlore">${'NIGHTLORE'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</h1>
  <p class="tag">${GHOSTS.length} ghosts, spirits and legends from ${countries()} places. Learn their rules. Survive the night.</p>
  <p class="whisper">Tonight, somewhere in ${esc(g.place)}: <i>${esc(g.sign)}</i></p>
  <div class="row"><button class="btn primary" data-t="survive">Survive the night</button><button class="btn" data-t="daily">${dl?'Tonight\'s night: played':'Tonight\'s night'}</button><button class="btn" data-t="map">Explore the map</button><button class="btn" data-t="quiz">Rule or Ruin</button><button class="btn" data-t="story">${tx({en:'The Lantern',id:'Pelita'})}</button></div>
  ${ST.nights?`<p class="tstat">${ST.met.length} legends survived · ${ST.ach.length} achievements · ${Object.keys(ST.stamps).length} passport stamps</p>`:''}
  <p class="made">Made by <b>TheFrst</b></p><p class="ver">Folklore retold for fun. Many of these stories are part of living cultures; respect the places they come from.<br>version ${BUILD}</p></div>`;
  document.body.appendChild(el);el.querySelector('.btn').focus();
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;view=k==='daily'||k==='story'?'survive':k;el.classList.add('out');setTimeout(()=>el.remove(),600);shell();render();const go=()=>{if(k==='daily'&&!dl)startNight({daily:today()});if(k==='story')campView($('#main'))};if(!ST.warned){openSettings(true);const ok=$('.modal [data-ok]');const o=ok.onclick;ok.onclick=()=>{o();go()}}else{audio();go()}});
  const c=$('#tc'),x=c.getContext('2d');let W,H;const sz=()=>{W=c.width=innerWidth;H=c.height=innerHeight};sz();addEventListener('resize',sz);
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches,motes=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),v:.0003+Math.random()*.0008,r:.5+Math.random()*1.6,p:Math.random()*6}));let t=0;
  const eyes=Array.from({length:9},()=>({x:Math.random(),y:.55+Math.random()*.4,s:.6+Math.random(),o:Math.random()*400,c:pick(['255,42,74','143,240,220','255,176,46'])}));
  (function f(){if(!c.isConnected)return;x.clearRect(0,0,W,H);
    for(let i=0;i<5;i++){x.fillStyle=`rgba(8,11,24,${.5+i*.1})`;x.beginPath();x.moveTo(0,H);for(let k=0;k<=20;k++){const X=k/20*W,Y=H*(.72+i*.06)-Math.abs(Math.sin(k*1.7+i*3))*H*(.12-i*.015)-((k*37+i*11)%7)*6;x.lineTo(X,Y)}x.lineTo(W,H);x.fill()}
    motes.forEach(m=>{m.y-=m.v;if(m.y<0)m.y=1;x.fillStyle=`rgba(143,240,220,${.25+.25*Math.sin(t/30+m.p)})`;x.beginPath();x.arc(m.x*W+Math.sin(t/60+m.p)*8,m.y*H,m.r,0,6.3);x.fill()});
    eyes.forEach(e=>{const ph=(t+e.o)%420,a=ph<40?ph/40:ph<90?1:ph<120?(120-ph)/30:0;if(a<=0)return;const ex=e.x*W,ey=e.y*H,s=3*e.s,bl=ph>60&&ph<66?.15:1;x.fillStyle=`rgba(${e.c},${a*.85})`;[-1,1].forEach(d=>{x.beginPath();x.ellipse(ex+d*s*3,ey,s,s*bl,0,0,6.3);x.fill()})});
    t++;if(!red)requestAnimationFrame(f)})()}
function boot(){if(SET.lang==='id')setLang('id');shell();render();title()}
