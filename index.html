["geunteut","Geunteut","Aceh, Indonesia","sea",4.7,96.75,"beast",3,"A giant hairy forest being of Acehnese and Gayo folklore with enormous footprints.","Footprints longer than your arm cross the forest stream.","Leave the forest before dusk","Track the footprints deeper in"],
["poppo","Poppo","South Sulawesi, Indonesia","sea",-4.0,119.9,"bird",3,"A Bugis spirit with glowing red eyes that flies by night and preys on the sick.","Your fevered friend is asleep. Red eyes glow in the rafters.","Keep the lamp burning and sit beside them","Leave them alone in the dark"],
["orangpendek","Orang Pendek","Kerinci, Jambi","sea",-1.7,101.25,"beast",1,"The 'short person' of Sumatra's Kerinci forests: a small, upright, hairy creature that farmers and rangers still report.","A small hairy figure walking upright crosses the trail and looks back at you.","Let it go and keep to the trail","Chase it into the forest"],
["wongsamar","Wong Samar","Bali, Indonesia","sea",-8.4,115.3,"void",2,"The 'hidden people' of Balinese belief who live invisibly in forests, ravines and big trees. Rudeness in their places brings bad luck.","In the ravine, laughter and a gamelan play, but no one is there.","Ask permission softly and leave an offering","Shout and throw rubbish into the ravine"],
["ebugogo","Ebu Gogo","Flores, Indonesia","sea",-8.75,121.0,"imp",2,"Small hairy people from the stories of the Nage people of Flores, said to eat everything put in front of them and to repeat what they hear.","Something small mumbles your words back at you from the edge of the fields.","Bring the children inside and stay quiet","Offer it the village's food"],
["hantupemburu","Hantu Pemburu","Perak, Malaysia","sea",4.2,101.0,"beast",3,"The Malay Spectral Huntsman who rides through the night sky with his hounds, forever hunting.","Dogs baying high above the treetops, and the sound of a horn.","Get under a roof until the hounds pass","Stand in the open to see the hunt"],
["hantugalah","Hantu Galah","Johor, Malaysia","sea",1.85,103.5,"tall",3,"A Malay pole ghost, thin as a stick and taller than the trees, that grows when you look up at it.","Something as thin as a pole leans over the kampung path, higher than the coconut palms.","Look down and walk past calmly","Look up to see its face"],
["langsuir","Langsuir","Pahang, Malaysia","sea",3.4,102.5,"hair",4,"A Malay spirit with long nails and a hole in her neck hidden under her hair. Cutting her nails and stuffing her hair into the hole tames her.","A woman with very long green nails perches on the fence. Her hair hides her neck.","Cut her nails and press her hair into the hole","Run toward the forest"],
["polong","Polong","Kedah, Malaysia","sea",6.12,100.37,"imp",2,"A tiny spirit kept in a bottle and fed blood from its keeper's finger, sent out to cause harm.","A small glass bottle on the shelf rattles by itself.","Take the bottle to the bomoh","Uncork the bottle"],
["berberoka","Berberoka","Ifugao, Philippines","sea",16.83,121.1,"water",3,"A Philippine swamp creature that drinks a river dry to strand the fish, then releases the water to drown whoever wades in.","The river suddenly empties. Fish flap on the mud. It's easy to walk out and pick them up.","Stay on the bank and climb higher","Walk out onto the dry riverbed"],
["bungisngis","Bungisngis","Tagalog provinces, Philippines","sea",14.3,121.4,"beast",2,"A one-eyed giant with huge tusks who laughs all the time. If you laugh with it, it laughs harder and grabs you.","A one-eyed giant laughs so hard its tusks rattle. It wants you to laugh too.","Keep a straight face and back away","Laugh along with it"],
["wakwak","Wakwak","Surigao, Philippines","sea",9.78,125.5,"bird",4,"A bird-like aswang named for its cry. Like the tik-tik, a loud 'wak-wak' means it's far; a soft one means it's close.","'Wak... wak...' The call is soft now. Wings brush the thatch.","It's close: rub garlic on the door and stay in","Relax, it sounds far away"],
["phiam","Phi Am","Chiang Mai, Thailand","sea",18.79,98.98,"void",2,"The Thai spirit blamed for sleep paralysis, which sits on sleepers' chests.","You can't move. Something heavy and cold is sitting on you.","Stay calm and move your toes, then your fingers","Fight and panic"],
["phihuakat","Phi Hua Khat","Nakhon Pathom, Thailand","sea",13.82,100.06,"void",3,"A headless ghost of Thai stories who wanders where he died, looking for his head.","A figure without a head stumbles along the canal path, arms reaching.","Walk calmly back to the temple","Follow him along the canal"],
["matranh","Ma Tranh","Nghe An, Vietnam","sea",19.2,104.9,"beast",3,"The ghost of a tiger's victim who becomes its servant and leads other travellers to the tiger.","A friendly stranger offers to show you a shortcut through the forest at dusk.","Refuse and stay on the main road","Take the shortcut with him"],
["changi","Old Changi Hospital","Changi, Singapore","sea",1.39,103.98,"void",2,"An abandoned military hospital where explorers report footsteps, voices and figures in the empty wards.","Footsteps echo in the empty ward above you. A trolley rolls by itself.","Leave the building with your group","Go upstairs to check"],
/* ---- East Asia ---- */
["yamauba","Yamauba","Mount Ashigara, Japan","ea",35.33,139.03,"hair",3,"The mountain hag. In the tale of the three talismans, a young monk escapes her by throwing charms that become a river and a mountain.","The kind old woman of the mountain hut is sharpening a knife. She smiles too wide.","Throw the temple talismans and run","Fall asleep in her hut"],
["futakuchi","Futakuchi-onna","Fukushima, Japan","ea",37.75,140.47,"mouth",3,"A woman with a second mouth on the back of her head, hidden under her hair, which eats greedily with strands of hair for hands.","Your host eats nothing, but rice keeps disappearing. Her hair is moving.","Leave quietly in the night","Lift her hair to look"],
["hachishaku","Hachishakusama","Rural Japan","ea",36.2,138.0,"tall",4,"An internet legend from 2008: a woman eight feet tall in white who says 'po po po'. In the story, a boy survives one night in a room sealed with salt while voices try to trick him into opening the door.","'Po... po... po...' Your grandfather's voice calls from outside: 'Open up, it's me.'","Stay in the salted room until morning","Open the door for your grandfather"],
["kunekune","Kunekune","Akita, Japan","ea",39.72,140.1,"void",3,"A white shape that wiggles far away in rice fields on hot days. People say anyone who understands what it is goes mad.","Far across the rice field, something white is twisting in the heat.","Look away and don't think about it","Look through the binoculars"],
["tomino","Tomino's Hell","Tokyo, Japan","ea",35.71,139.76,"void",2,"A 1919 poem by Saijo Yaso, with an internet legend that reading it aloud brings misfortune.","Someone hands you a page with an old poem titled 'Tomino's Hell'. 'Read it out loud,' they dare you.","Read it in your head, not aloud","Read the whole poem out loud"],
["kokkuri","Kokkuri-san","Osaka, Japan","ea",34.69,135.52,"fox",2,"A Japanese spirit-board game played with a coin. The spirit must be asked to leave politely before anyone lets go.","The coin is sliding across the paper by itself. Your friend wants to stop.","Ask 'Kokkuri-san, please go home' before letting go","Let go of the coin and walk away"],
["umibozu","Umibozu","Niigata coast, Japan","ea",37.9,139.05,"water",4,"A huge black sea monk who rises beside boats and asks for a bucket. Give it one with no bottom, or it will fill your boat and sink it.","A huge black shape rises next to the boat. 'Give me a bucket.'","Hand over a bucket with no bottom","Hand over a normal bucket"],
["tsurube","Tsurube-otoshi","Kyoto, Japan","ea",35.03,135.78,"head",3,"A giant head that waits in tall trees and drops onto travellers walking beneath.","The tree above the road creaks. A huge face peers down through the leaves.","Cross to the other side of the road","Walk under the tree"],
["dalgyal","Dalgyal Gwishin","Gangwon, Korea","ea",37.8,128.2,"void",3,"The Korean egg ghost: a spirit with no face, no eyes, no mouth, the restless soul of someone with no one to remember them.","A figure in white turns. Its face is smooth as an egg.","Bow and say a prayer for the forgotten","Shine a light in its face"],
["bulgasari","Bulgasari","Songdo, Korea","ea",37.97,126.55,"beast",2,"A legendary beast of the late Goryeo period that ate iron and grew bigger with every bite.","Something is chewing through the iron gate. It's bigger than yesterday.","Hide the iron and keep away","Feed it more iron"],
["nian","Nian","Henan, China","ea",34.75,113.65,"beast",3,"The New Year beast. It fears the colour red, fire and loud noises, which is why families hang red banners and light firecrackers.","New Year's Eve. Something huge with a single horn prowls the village.","Hang red banners and light firecrackers","Hide in the dark and keep quiet"],
["yeren","Yeren","Shennongjia, China","ea",31.6,110.5,"beast",1,"The wild man of the Shennongjia mountains, a reddish-haired figure locals have reported for centuries.","Red hair snagged on a branch, high above the ground.","Leave it in peace","Set a trap"],
["tigeraunt","Tiger Aunt","Changhua, Taiwan","ea",24.08,120.54,"beast",3,"Hoo-ko-po: a tiger spirit who knocks pretending to be your aunt and eats children's fingers at night. In the tale, a clever sister escapes up a tree.","At night your 'aunt' is crunching something in the dark. 'Just peanuts, dear.'","Say you need the toilet, then climb a tree","Ask her for some peanuts"],
/* ---- South Asia ---- */
["yakshi","Yakshi","Thiruvananthapuram, Kerala","sa",8.52,76.94,"hair",4,"A beautiful spirit of Kerala who smells of pala flowers and asks lone travellers for lime. An iron nail is said to keep her away.","The scent of pala flowers on a dark road. A woman in white asks for a little lime.","Grip an iron nail and walk on","Give her the lime"],
["kuttichathan","Kuttichathan","Kerala, India","sa",10.0,76.3,"imp",1,"A mischievous little spirit of Kerala who throws stones, hides things and sets small fires. Offerings calm him.","Pebbles fall on the roof. Your keys are in the fridge again.","Leave a small offering and ask him to stop","Yell at the empty room"],
["naleba","Nale Ba","Bengaluru, India","sa",12.97,77.59,"void",3,"In 1990s Bangalore, people wrote 'Nale ba' ('come tomorrow' in Kannada) on their doors to fool a witch who knocked at night calling in a loved one's voice.","A knock at night. Your mother's voice: 'Open the door.' Your mother lives in another city.","Write 'Nale ba' on the door","Open the door"],
["murkatta","Murkatta","Uttar Pradesh, India","sa",26.85,80.95,"void",3,"A headless ghost of North India and Nepal, said to be someone beheaded, wandering near the place they died.","On the dark village road, a headless figure walks toward you.","Turn back and take another road","Keep walking toward it"],
["kalukumara","Kalu Kumaraya","Galle, Sri Lanka","sa",6.05,80.22,"horned",3,"The Black Prince of Sinhalese folk belief, a demon said to bother young women and cause bad dreams.","A dark princely figure stands in the doorway of your dream, smiling.","Light a lamp and call the family","Go back to sleep alone"],
["petni","Petni","Kolkata, India","sa",22.57,88.36,"hair",3,"The Bengali ghost of a woman who died unmarried, who lives in trees and calls to passers-by.","A woman sits on a high branch of the old tree, legs dangling and impossibly long.","Walk past without answering","Stop under the tree to talk"],
["beghobhoot","Begho Bhoot","Sundarbans, India","sa",21.95,88.85,"beast",4,"The ghost of someone killed by a tiger, said to roar like one to lure people into the mangroves. Sundarbans villagers call on Bonbibi for protection.","A tiger roars in the mangroves. Then it calls your name.","Call on Bonbibi and stay in the boat","Step off the boat into the mud"],
["kuldhara","Kuldhara","Jaisalmer, India","sa",26.8,70.8,"void",2,"A Rajasthani village said to have been abandoned in a single night by its people, who cursed it so no one could ever live there again.","Empty stone houses in the desert. A door creaks open in the dusk.","Leave before sunset","Spend the night in a house"],
["naag","Ichchhadhari Naag","Madhya Pradesh, India","sa",23.25,77.4,"water",3,"A shape-shifting cobra of Indian legend. In the stories, harm its mate and it will hunt you in human form.","A cobra lies hurt on the road. Its mate is watching from the grass.","Leave both snakes in peace","Kill the injured snake"],
/* ---- Middle East & North Africa ---- */
["bakhtak","Bakhtak","Tehran, Iran","me",35.69,51.39,"void",2,"The Persian nightmare spirit who sits on a sleeper's chest.","Something heavy presses on you. You can't call out.","Stay calm and move one finger at a time","Struggle and scream"],
["hortlak","Hortlak","Konya, Turkey","me",37.87,32.48,"skull",3,"The restless dead of Turkish folklore, said to rise from graves near crossroads.","A figure in a burial shroud stands at the crossroads, waiting.","Go home the long way","Cut across the old graveyard"],
["tepegoz","Tepegoz","Kazilik Mountain, Turkey","me",40.0,39.0,"beast",4,"The one-eyed giant from the Book of Dede Korkut. The hero Basat defeats him with cunning.","An enormous one-eyed giant sleeps across the mountain path.","Wrap yourself in a sheepskin and slip past","Climb over him"],
["sahmaran","Sahmaran","Tarsus, Turkey","me",36.92,34.9,"water",1,"A wise queen of snakes with a woman's head in Anatolian legend, betrayed by a man she trusted. Her image still hangs in many homes.","In the cave, a queen with a serpent's body asks you to keep her secret.","Promise to keep her secret","Tell the king where she is","r"],
["aburigl","Abu Rigl Masloukha","Cairo, Egypt","me",30.05,31.25,"imp",2,"The man with the skinned leg, a bogeyman Egyptian parents warn children about if they go out at nap time.","The street is empty at siesta. A shuffling, limping step comes closer.","Go home and lie down for the siesta","Keep playing outside"],
["teryel","Teryel","Hoggar, Algeria","me",23.3,5.5,"hair",3,"A Tuareg ogress of the desert who lures travellers. Tales say the clever ones outwit her.","A woman calls from the dark rocks: she has water, come closer.","Stay with the camels and the camp","Walk to the rocks for water"],
["tantal","Tantal","Basra, Iraq","me",30.5,47.8,"tall",3,"An Iraqi shapeshifter of marshes and dark alleys who stretches taller and taller to frighten people walking at night.","In the dark alley, a figure grows until it blocks out the stars.","Turn back to the lit street","Push past it"],
["div","Div","Mazandaran, Iran","me",36.5,52.5,"horned",3,"Giant demons of Persian legend, like the White Div defeated by the hero Rostam in the Shahnameh.","A white-haired giant with horns blocks the mountain pass. 'What will you give me?'","Turn back and find another pass","Make a deal with him"],
/* ---- Sub-Saharan Africa ---- */
["lukwata","Lukwata","Lake Victoria, Uganda","af",0.3,32.9,"water",2,"A great serpent said to live in Lake Victoria and to overturn fishing canoes.","The canoe rocks. Something long rolls beneath the water.","Paddle calmly back to the shore","Lean over the side to look"],
["kongamato","Kongamato","Jiundu Swamp, Zambia","af",-11.3,24.3,"bird",2,"An 'overwhelmer of boats': a winged creature said to attack canoes in Zambian swamps.","Leathery wings beat above the swamp. Something dives at the canoe.","Duck low and paddle out of the swamp","Stand up and swat at it"],
["mamlambo","Mamlambo","Mzintlava River, South Africa","af",-30.7,29.4,"water",3,"A river serpent in Zulu and Xhosa belief, sometimes said to bring wealth to those who keep it, at a terrible price.","A stranger offers you a 'lucky' snake in a box. It will make you rich, he says.","Refuse the snake","Take the box home"],
["mmoatia","Mmoatia","Kumasi, Ghana","af",6.7,-1.63,"imp",1,"Small forest folk of Akan belief with backward feet who talk by whistling.","Whistles answer each other in the forest. Tiny backward footprints.","Leave a little food and keep walking","Whistle back to them"],
["fanany","Fanany","Betsileo, Madagascar","af",-21.5,47.0,"water",3,"A Malagasy serpent with seven heads said to be born from the body of the dead, guarding the tombs.","Something with seven heads coils around the family tomb.","Leave the tomb and come back by day","Go closer at night"],
["kianda","Kianda","Luanda, Angola","af",-8.8,13.23,"water",1,"A sea spirit honoured by Angolan fishermen. When the sea is disrespected, the catch disappears.","The Luanda bay is calm and empty. Fishermen are laying offerings at the water.","Join the offering quietly","Throw rubbish into the bay","r"],
["agogwe","Agogwe","Usambara, Tanzania","af",-4.75,38.45,"imp",1,"Small hairy people of Tanzanian forests, reported by hunters and travellers.","Two small hairy figures watch from the long grass, then vanish.","Let them go","Chase them into the grass"],
["chemosit","Chemosit","Nandi, Kenya","af",0.2,35.0,"bird",3,"A half-man, half-bird devil of Nandi folklore who sings at night with a glowing mouth.","A song drifts from the bush. A red light glows where a mouth should be.","Stay inside and cover your ears","Go out to find the singer"],
["flyingdutchman","The Flying Dutchman","Cape of Good Hope, South Africa","af",-34.36,18.47,"fire",3,"A ghost ship doomed to sail forever, said to be seen off the Cape before a disaster.","A glowing ship with ragged sails moves against the wind, straight toward you.","Turn the bow away and make for the harbour","Signal it to come closer"],
["ojuju","Ojuju Calabar","Calabar, Nigeria","af",4.95,8.32,"mouth",2,"A huge-headed figure that Nigerian parents and older siblings warn children about, to keep them indoors after dark.","Something with a huge head lurks by the gate after dark.","Go back inside before dark","Sneak out to look"],
/* ---- Europe: east ---- */
["mavka","Mavka","Carpathians, Ukraine","eu",48.3,24.5,"hair",3,"A forest maiden of Ukrainian folklore with no back: behind her you can see her insides. She tickles travellers and leads them into the woods.","A beautiful girl dances in the clearing. When she turns, you can see through her back.","Keep walking without dancing","Join her dance"],
["vii","Viy","Poltava, Ukraine","eu",49.59,34.55,"eyes",4,"From Gogol's 1835 tale based on Ukrainian folklore: a monster whose eyelids reach the ground. Whatever it looks at, dies.","In the church, they are lifting the eyelids of something huge. 'Look at it,' a voice says.","Keep your eyes shut and don't look","Look into its eyes"],
["boruta","Boruta","Leczyca, Poland","eu",52.06,19.2,"horned",2,"A devil who lives in the cellars of Leczyca castle, guarding treasure. He sometimes appears as a nobleman.","A nobleman in old clothes shows you the castle's treasure. 'Take a coin, take two.'","Leave the treasure and go upstairs","Fill your pockets"],
["golem","Golem of Prague","Prague, Czechia","eu",50.09,14.42,"tall",2,"A clay giant made by Rabbi Loew to protect the Jewish quarter of Prague, brought to life by a holy word.","The clay giant is still walking at dusk on Friday. It must rest for the Sabbath.","Remove the word from its mouth","Order it to keep working"],
["moroi","Moroi","Wallachia, Romania","eu",44.43,26.1,"skull",3,"A Romanian restless dead, pale and hungry, said to visit family at night.","Your late uncle is sitting at the kitchen table. He looks very pale.","Rub garlic on the doors and windows","Sit and eat with him"],
["mumapadurii","Muma Padurii","Maramures, Romania","eu",47.65,23.6,"hair",3,"The Mother of the Forest, a hag who leads lost children deeper into the trees.","An old woman with bark for skin waves you deeper into the forest.","Turn your coat inside out and follow the stream out","Follow her"],
["pricolici","Pricolici","Oltenia, Romania","eu",44.32,23.8,"beast",3,"A Romanian werewolf spirit of the restless dead.","A wolf too large for any forest watches you from the road.","Walk to the village church","Run into the forest"],
["talasum","Talasum","Rhodopes, Bulgaria","eu",41.6,24.7,"void",3,"A Bulgarian spirit of someone whose shadow was built into a new house's foundation. Builders avoid letting a person's shadow fall on the stones.","The builders are laying the foundation. Your shadow is about to fall across it.","Step out of the sun and away from the stones","Stand there and watch"],
["sava","Sava Savanovic","Zarozje, Serbia","eu",44.05,19.65,"skull",3,"One of Serbia's most famous vampires, said to live in an old watermill and attack the millers.","The old mill on the river. The miller offers you a bed for the night.","Thank him and sleep somewhere else","Stay the night in the mill"],
["aitvaras","Aitvaras","Samogitia, Lithuania","eu",55.9,22.3,"fire",2,"A flying fiery rooster in Lithuanian folklore that brings its owner stolen wealth, and trouble.","A rooster with a burning tail lands on your roof holding gold.","Refuse the gold and send it away","Feed it and keep the gold"],
["koschei","Koschei the Deathless","Ryazan, Russia","eu",54.63,39.73,"skull",4,"A Russian sorcerer who cannot die because his death is hidden: in a needle, in an egg, in a duck, in a hare, in a chest under an oak.","The skeletal king laughs. 'You cannot kill me.' His death is somewhere far away.","Find the needle in the egg and break it","Fight him with your sword"],
["vodyanoy","Vodyanoy","Tver, Russia","eu",56.86,35.9,"water",3,"The old man of Russian rivers and mill ponds, with a green beard and webbed hands, who drags swimmers down.","An old man with a weedy green beard waits beside the mill wheel.","Stay out of the mill pond after sunset","Swim across the pond"],
["bukavac","Bukavac","Lika, Croatia","eu",44.75,15.3,"beast",3,"A six-legged lake monster of Croatian folklore with twisted horns that bellows at night.","A terrible bellowing comes from the lake. Something with six legs climbs onto the bank.","Get away from the lake","Wade in to look"],
["vilkacis","Vilkacis","Vidzeme, Latvia","eu",57.3,25.3,"beast",3,"A Latvian werewolf. Some stories say it guards treasure and helps those who treat it kindly.","A wolf with a man's eyes sits by your campfire.","Speak to it kindly and share your bread","Throw a burning stick at it"],
["shtriga","Shtriga","Shkoder, Albania","eu",42.07,19.5,"bird",3,"An Albanian witch who drains the life of sleeping children and flies as a moth or bird at night.","A large moth beats at the window over the sleeping baby.","Keep the window shut and stay awake","Open the window to let it out"],
["polevik","Polevik","Smolensk, Russia","eu",54.78,32.05,"imp",2,"A Slavic field spirit who punishes farmers working at noon or drinking in the fields.","Noon in the rye. A little man with grass for hair glares at your bottle.","Put down the bottle and rest in the shade","Keep drinking in the field"],
/* ---- Europe: west ---- */
["blackannis","Black Annis","Leicester, England","eu",52.64,-1.13,"hair",3,"A blue-faced hag with iron claws said to live in a cave in the Dane Hills.","Iron claws scrape on stone. A blue face peers out of a cave.","Go home before dark","Look inside the cave"],
["jennyg","Jenny Greenteeth","Lancashire, England","eu",53.8,-2.6,"water",3,"A river hag who pulls children under. Ponds covered in green duckweed are where she waits.","A pond is covered in bright green duckweed. It looks like solid ground.","Stay away from the duckweed water","Step onto the green"],
["redcap","Redcap","Scottish Borders","eu",55.55,-2.8,"imp",3,"A goblin of ruined border castles who dyes his cap in travellers' blood. Iron boots and scripture drive him off.","In the ruined tower, a little man in a dripping red cap grins at you.","Read out holy words and leave","Sleep in the ruined tower"],
["nuckelavee","Nuckelavee","Orkney, Scotland","eu",59.0,-3.0,"beast",4,"A skinless horse-demon from the sea in Orcadian legend. It cannot cross fresh running water.","Something skinless, half horse, half man, rises from the shore.","Run for the stream: it can't cross fresh water","Hide in the seaweed"],
["deargdue","Dearg Due","Waterford, Ireland","eu",52.26,-7.11,"skull",3,"An Irish revenant who rises from her grave to drain men. Villagers piled stones on her grave to keep her down.","A grave in the churchyard has been disturbed. The stones have rolled away.","Pile the stones back on the grave","Leave the grave open"],
["greyman","Grey Man of Ben Macdui","Cairngorms, Scotland","eu",57.07,-3.67,"tall",2,"A huge grey presence climbers report on the summit of Ben Macdui, with heavy footsteps behind them and a feeling of dread.","Fog on the summit. Footsteps behind you, much bigger than yours.","Walk down carefully, without running","Run blindly into the fog"],
["perchta","Perchta","Salzburg, Austria","eu",47.8,13.04,"hair",2,"An Alpine Christmas spirit who rewards hard workers and punishes the lazy. Eat the traditional fish and porridge on her night.","Twelfth Night. A tall woman with one goose foot inspects your kitchen.","Eat the porridge and fish of her night","Leave your chores undone"],
["piedpiper","Pied Piper","Hamelin, Germany","eu",52.1,9.36,"tall",2,"A piper in bright colours who rid Hamelin of rats in 1284. When the town refused to pay, he led its children away.","The piper has cleared the rats. Now he wants his pay.","Pay the piper","Refuse to pay him"],
["lorelei","Lorelei","St Goarshausen, Germany","eu",50.14,7.73,"water",3,"A siren on a high rock over the Rhine whose song makes boatmen forget the dangerous rocks below.","A golden-haired woman sings on the cliff. The boat drifts toward the rocks.","Keep your eyes on the river and steer","Look up at the singer"],
["tatzelwurm","Tatzelwurm","Bavarian Alps, Germany","eu",47.5,11.0,"beast",2,"A stubby lizard-like creature of Alpine legend with a cat's face and a deadly hiss.","A thick worm with a cat's face hisses from under the rock.","Back away slowly","Poke it with your stick"],
["belliegha","Il-Belliegha","Valletta, Malta","eu",35.9,14.51,"water",2,"A Maltese monster that lives at the bottom of wells and swallows children who lean over.","The well is very deep. Something below calls your name.","Step back from the well","Lean over to look"],
["melusine","Melusine","Lusignan, France","eu",46.43,0.12,"water",2,"A water fairy who married a nobleman on one condition: he must never look at her on Saturdays, when her legs became a serpent's tail.","It's Saturday. Your wife is locked in her bath. Water splashes oddly.","Respect the promise and stay away","Peek through the keyhole"],
["nutons","Nutons","Ardennes, Belgium","eu",50.0,5.7,"imp",1,"Little people of the Belgian Ardennes who mend shoes and tools at night in return for a bowl of food. Insult them and they never return.","In the morning your broken tools are fixed. Tiny footprints lead to the hills.","Leave a bowl of food out tonight","Hide and try to catch them"],
["huldufolk","Huldufolk","Hafnarfjordur, Iceland","eu",64.07,-21.95,"void",1,"The hidden people of Iceland, who live in rocks. Roads have been bent around their homes.","The digger is about to break the big rock. Workers' machines keep failing.","Build around the elf rock","Smash the rock anyway","r"],
["nisse","Nisse","Telemark, Norway","eu",59.3,9.0,"imp",1,"A farm spirit who protects the farm and its animals. On Christmas Eve he must have porridge with a pat of butter.","Christmas Eve. The cows are restless and the barn door is banging.","Leave porridge with butter in the barn","Forget the butter"],
["loupgarou","Loup-garou","Normandy, France","eu",49.1,0.3,"beast",3,"The French werewolf, said to roam the countryside at night for a set number of years.","A wolf on two legs crosses the moonlit lane.","Call his human name aloud","Shoot at him"],
/* ---- Central Asia, Caucasus & Siberia ---- */
["chuchuna","Chuchuna","Yakutia, Russia","ca",64.0,126.0,"beast",2,"A tall wild man of Yakut and Evenk stories, dressed in skins, said to steal food from hunters.","Someone has been eating from your cache in the taiga. Huge bare footprints.","Leave the area and warn the hunters","Wait for it by the cache"],

function scare(g,big=true){return new Promise(res=>{

  const mild=lvl==='mild'||reduce||!big;fxDefs();
  el.className=`pre ${mild?'mild':'full'} e-${ent} fx-${fx}`;
  const word=c.w&&!mild?`<div class="sc-cry" aria-hidden="true">${[0,1,2].map(k=>`<span style="--k:${k}">${esc(c.w)}</span>`).join('')}</div>`:'';
  const over=mild?'':fx==='hair'?`<div class="sc-hair" aria-hidden="true">${Array.from({length:26},(_,k)=>`<i style="--x:${k*4}%;--d:${(k%5)*.04}s;--h:${60+(k*37%40)}%"></i>`).join('')}</div>`:fx==='blood'?`<div class="sc-blood" aria-hidden="true">${Array.from({length:14},(_,k)=>`<i style="--x:${4+k*7}%;--d:${(k%4)*.12}s;--h:${30+(k*29%55)}%"></i>`).join('')}</div>`:fx==='burn'?'<div class="sc-burn" aria-hidden="true"></div>':fx==='static'?'<div class="sc-scan" aria-hidden="true"></div>':'';
  el.innerHTML=`<div class="sc-stage"><div class="sc-l base">${art}</div>${mild?'':`<div class="sc-l r">${art}</div><div class="sc-l c">${art}</div><div class="sc-tear">${[0,1,2,3,4,5].map(i=>`<div class="sc-slice" style="--i:${i}">${art}</div>`).join('')}</div>`}</div>${over}${word}<div class="sc-name" data-t="${esc(g.name)}">${esc(g.name)}</div><div class="sc-grain"></div><small class="sc-tap">Tap to continue</small>`;

  el.onclick=done;el.tabIndex=0;el.onkeydown=done;el.focus();setTimeout(()=>{can=true;done()},wait+3400);

 intro:{en:'Your grandmother was buried this afternoon. Tonight you are alone in her old house in Jakarta, and her brass lantern, the one she never let anyone touch, has lit itself on the table. Outside, something that waited a long time for her is now waiting for you.',id:'Nenekmu dimakamkan sore tadi. Malam ini kamu sendirian di rumah tuanya di Jakarta, dan pelita kuningannya, yang tak pernah boleh disentuh siapa pun, menyala sendiri di atas meja. Di luar, sesuatu yang lama menunggu nenekmu kini menunggumu.'},

 end:{en:'In the morning, by the rocks, you find his hat, and next to it a small coin that is not from any country you know. The sellers at the ghost market always want something back.',id:'Paginya, di dekat batu-batu, kamu menemukan topinya, dan di sebelahnya sekeping koin kecil yang bukan dari negara mana pun yang kamu kenal. Penjual di pasar hantu selalu meminta sesuatu kembali.'},
 c:{q:{en:'What do you do with the coin?',id:'Apa yang kamu lakukan dengan koin itu?'},a:[{t:{en:'Leave it on the rock where you found it',id:'Tinggalkan di batu tempat kamu menemukannya'},f:'nothing'},{t:{en:'Keep it; it might help you find him',id:'Simpan; mungkin bisa membantu menemukannya'},f:''}]}},
{t:{en:'The tiger\'s forest',id:'Hutan sang harimau'},reg:'sea',where:{en:'Kerinci, Sumatra',id:'Kerinci, Sumatra'},g:['cindaku','orangpendek','begu'],
 intro:{en:'The next voice note has birdsong and rain: "Kak, I\'m in the forest in Kerinci. Something with stripes keeps watching me." You fly to Jambi the same day.',id:'Pesan suara berikutnya berisi kicau burung dan hujan: "Kak, aku di hutan Kerinci. Ada yang belang terus mengawasiku." Hari itu juga kamu terbang ke Jambi.'},
 end:{en:'An old man in the village tells you: "The thing using your brother\'s voice is called Suara. It has no body. It lives in whatever answers it. Every time someone replies, it grows stronger. The forest is angry that it came here."',id:'Seorang kakek di desa memberitahumu: "Yang memakai suara adikmu bernama Suara. Ia tak punya tubuh. Ia hidup di dalam apa pun yang menjawabnya. Setiap kali ada yang membalas, ia makin kuat. Hutan marah karena ia datang ke sini."'},
 c:{q:{en:'The forest feels angry. What do you do?',id:'Hutan terasa marah. Apa yang kamu lakukan?'},a:[{t:{en:'Apologise to the forest and leave an offering',id:'Minta maaf pada hutan dan tinggalkan sesaji'},f:'forest'},{t:{en:'Ignore it and move on',id:'Abaikan dan lanjutkan perjalanan'},f:''}]}},
{t:{en:'The river people',id:'Orang-orang sungai'},reg:'sea',where:{en:'Mahakam River, Kalimantan',id:'Sungai Mahakam, Kalimantan'},g:['kuyang','kambe','juata'],
 intro:{en:'"Kak, there\'s a river here as wide as the sea." You take a longboat up the Mahakam. At night, the elders of a longhouse let you sleep by their fire.',id:'"Kak, ada sungai di sini selebar laut." Kamu naik perahu panjang menyusuri Mahakam. Malam hari, para tetua rumah panjang mengizinkanmu tidur di dekat api mereka.'},
 end:{en:'"It can copy any voice," the oldest woman says, "but it can only copy what it has heard. Call him by a name only the two of you know. A name it has never heard."',id:'"Ia bisa meniru suara apa pun," kata perempuan paling tua, "tapi hanya yang pernah ia dengar. Panggil adikmu dengan nama yang hanya kalian berdua tahu. Nama yang belum pernah ia dengar."'},
 c:{q:{en:'Is there a name only you two know?',id:'Adakah nama yang hanya kalian berdua tahu?'},a:[{t:{en:'Yes: the nickname you gave him when he was little',id:'Ada: nama panggilan yang kamu berikan waktu ia kecil'},f:'nickname'},{t:{en:'You can\'t remember one',id:'Kamu tidak ingat'},f:''}]}},
{t:{en:'The island of offerings',id:'Pulau sesaji'},reg:'sea',where:{en:'A village temple in Bali',id:'Pura desa di Bali'},g:['leak','wongsamar','tonya'],
 intro:{en:'The voice notes are getting shorter. "Kak. Bali. Temple. Hurry." In a village near Ubud, a priest is waiting for you at the gate, as if he knew you were coming.',id:'Pesan suaranya makin pendek. "Kak. Bali. Pura. Cepat." Di desa dekat Ubud, seorang pemangku menunggumu di gerbang, seakan ia tahu kamu akan datang.'},
 end:{en:'At dawn the priest gives you a small offering basket. "Carry this to where it lives. Suara feeds on answers, and on fear. Where it is not answered, it starves." The last voice note is just one word: "Purwo."',id:'Saat fajar pemangku memberimu canang kecil. "Bawa ini ke tempat ia tinggal. Suara makan dari jawaban, dan dari rasa takut. Di tempat ia tak dijawab, ia kelaparan." Pesan suara terakhir hanya satu kata: "Purwo."'},
 c:{q:{en:'Do you take the offering?',id:'Apakah kamu membawa sesajinya?'},a:[{t:{en:'Take it with both hands and thank him',id:'Terima dengan dua tangan dan berterima kasih'},f:'offering'},{t:{en:'You don\'t have room. Leave it.',id:'Tidak ada tempat. Tinggalkan.'},f:''}]}},
{t:{en:'Alas Purwo',id:'Alas Purwo'},reg:'sea',where:{en:'The oldest forest in Java',id:'Hutan tertua di Jawa'},g:['alaspurwo','kuntilanak','pocong'],final:true,
 intro:{en:'The oldest forest in Java. Your phone has no signal, but it keeps playing voice notes anyway: dozens of them, all in your brother\'s voice, all at once.',id:'Hutan tertua di Jawa. Ponselmu tak ada sinyal, tapi terus memutar pesan suara: puluhan, semuanya dengan suara adikmu, semuanya sekaligus.'}}];
const ENDINGS2={good:{t:{en:'Home',id:'Pulang'},x:{en:'You call him by the name only you two know. The forest goes silent: the voice has nothing to copy. In the grey light you find Dimas asleep under a banyan tree, thin and cold but breathing. He remembers nothing after the market. On the way home his phone shows no new messages, ever again.',id:'Kamu memanggilnya dengan nama yang hanya kalian berdua tahu. Hutan menjadi hening: suara itu tak punya apa pun untuk ditiru. Dalam cahaya kelabu kamu menemukan Dimas tertidur di bawah beringin, kurus dan dingin tapi bernapas. Ia tak ingat apa-apa setelah pasar itu. Dalam perjalanan pulang ponselnya tak pernah menerima pesan baru lagi.'}},
 mid:{t:{en:'Silence',id:'Hening'},x:{en:'You don\'t answer it, not once, until the sun rises. The voices fade. You find Dimas\'s footprints leading out of the forest, toward the road. You don\'t find him. But a week later, your mother gets a text: "I\'m okay. I\'m coming home."',id:'Kamu tidak menjawabnya, sekali pun, sampai matahari terbit. Suara-suara memudar. Kamu menemukan jejak kaki Dimas yang keluar dari hutan, menuju jalan. Kamu tidak menemukannya. Tapi seminggu kemudian, ibumu menerima pesan: "Aku baik-baik saja. Aku pulang."'}},
 bad:{t:{en:'Answered',id:'Dijawab'},x:{en:'"Dimas!" you shout, and something answers in his voice, right behind you. A week later, your mother gets a voice note. It\'s your voice. "Ma, come and get me."',id:'"Dimas!" kamu berteriak, dan sesuatu menjawab dengan suaranya, tepat di belakangmu. Seminggu kemudian, ibumu menerima pesan suara. Itu suaramu. "Ma, jemput aku."'}}};
const CAMPS={lantern:{t:{en:'The Lantern',id:'Pelita'},d:{en:'Six chapters across five countries, chasing what followed your grandmother.',id:'Enam bab di lima negara, mengejar apa yang mengikuti nenekmu.'},ch:CAMP,end:ENDINGS,villain:WAITER,

     sign:{en:'The lantern flares. Every face in the dark melts into one, standing in your grandmother\'s doorway. It has waited fifty years. It is waiting now.',id:'Pelita berkobar. Semua wajah dalam gelap meleleh menjadi satu, berdiri di ambang pintu nenekmu. Ia sudah menunggu lima puluh tahun. Kini ia menunggu.'},
     judge:k=>{const knows=F.includes('promise')||F.includes('honest'),lit=F.includes('lantern');if(k==='name'&&knows)return F.length>=4?'good':'mid';if(k==='lamp'&&lit)return F.length>=4&&knows?'good':'mid';return'bad'}})},
 kampung:{t:{en:'The Last Village',id:'Kampung Terakhir'},d:{en:'Your brother vanished on a hike. His phone keeps sending voice notes from places he has never been. Six chapters across Indonesia.',id:'Adikmu hilang saat mendaki. Ponselnya terus mengirim pesan suara dari tempat-tempat yang belum pernah ia datangi. Enam bab menjelajahi Indonesia.'},ch:CAMP2,end:ENDINGS2,villain:SUARA,

     judge:k=>{if(k==='nick'&&F.includes('nickname'))return F.length>=4?'good':'mid';if(k==='silent'&&F.includes('silent'))return F.length>=4&&F.includes('nickname')?'good':'mid';return'bad'}})}};

function campState(cid){ST.camps=ST.camps||{};if(!ST.camps.lantern&&ST.camp&&ST.camp.ch){ST.camps.lantern=ST.camp}return ST.camps[cid]=ST.camps[cid]||{ch:0,f:[]}}
function campView(m){m.innerHTML=`<section class="stage setup"><h1>${T('Story campaigns')}</h1><p class="lede">${T('Long stories. Your choices follow you to the end.')}</p>
  <div class="modes">${Object.entries(CAMPS).map(([k,c])=>{const C=campState(k);return`<button data-cmp="${k}"><b>${esc(tx(c.t))}</b><small>${esc(tx(c.d))}</small><small>${Math.min(C.ch,c.ch.length)}/${c.ch.length}${C.ending?' · '+esc(tx(c.end[C.ending].t)):''}</small></button>`}).join('')}</div></section>`;
  m.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=()=>campDetail(m,b.dataset.cmp))}
function campDetail(m,cid){const K=CAMPS[cid],C=campState(cid);
  m.innerHTML=`<section class="stage setup"><button class="back" data-cb>${T('Story campaigns')}</button><h1>${esc(tx(K.t))}</h1><p class="lede">${esc(tx(K.d))}</p>
  <ol class="chapters">${K.ch.map((c,i)=>`<li class="${i<C.ch?'done':i===C.ch?'now':'locked'}"><span class="chnum">${i+1}</span><span><b>${esc(tx(c.t))}</b><small>${esc(tx(c.where))}</small></span></li>`).join('')}</ol>
  ${C.ending?`<p class="find">${T('Your ending')}: <b>${esc(tx(K.end[C.ending].t))}</b></p>`:''}
  <div class="row left"><button class="btn primary" data-cp ${C.ch>=K.ch.length?'disabled':''}>${C.ch?T('Continue chapter')+' '+(Math.min(C.ch,K.ch.length-1)+1):T('Begin the story')}</button>${C.ch?`<button class="btn" data-cr>${T('Start over')}</button>`:''}</div></section>`;
  m.querySelector('[data-cb]').onclick=()=>campView(m);
  const b=m.querySelector('[data-cp]');b&&(b.onclick=()=>playChapter(cid,C.ch));const r=m.querySelector('[data-cr]');r&&(r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent=T('Tap again to restart');return}ST.camps[cid]={ch:0,f:[]};save();campDetail(m,cid)})}
function chapOf(o){return CAMPS[o.cid].ch[o.camp]}
function playChapter(cid,i){const c=CAMPS[cid].ch[i];campState(cid);
  startNight({list:c.g.map(id=>GBY[id]).filter(Boolean),reg:c.reg,label:tx(c.where),camp:i,cid,introText:tx(c.intro)})}
function chapterDone(){const i=N.camp,cid=N.cid,K=CAMPS[cid],c=K.ch[i];
  if(c.final)return finale(cid);
  frame(`<p class="you">${T('Chapter')} ${i+1}: ${esc(tx(c.t))}</p><p class="scene">${esc(tx(c.end))}</p><p class="q">${esc(tx(c.c.q))}</p><div class="choices">${c.c.a.map((a,k)=>`<button data-cc="${k}">${esc(tx(a.t))}</button>`).join('')}</div>`);
  $$('[data-cc]').forEach(b=>b.onclick=()=>{const a=c.c.a[+b.dataset.cc];const C=campState(cid);if(a.f&&!C.f.includes(a.f))C.f.push(a.f);C.ch=Math.max(C.ch,i+1);save();addXP(50);lantern(false);ambience(false);
    frame(`<h1>${T('Chapter complete')}</h1><p class="scene">${esc(tx(c.t))}</p><div class="row"><button class="btn primary" data-nx autofocus>${T('Next chapter')}</button><button class="btn" data-st>${T('Back to the story')}</button></div>`);
    $('[data-nx]').onclick=()=>playChapter(cid,i+1);$('[data-st]').onclick=()=>{view='survive';shell();campDetail($('#main'),cid)}})}
function finale(cid){const K=CAMPS[cid],C=campState(cid),F=K.finale(C.f);
  frame(`<p class="scene sign">${esc(tx(F.sign))}</p><p class="q">${T('What do you do?')}</p><div class="choices">${shuf(F.opts).map(([k,t])=>`<button data-fz="${k}">${esc(tx(t))}</button>`).join('')}</div>`);
  if(cid==='kampung')cry(SUARA,'tease');
  $$('[data-fz]').forEach(b=>b.onclick=async()=>{$$('[data-fz]').forEach(x=>x.disabled=true);let end=F.judge(b.dataset.fz);if(end==='bad')await scare(K.villain,true);
    if(end!=='bad'){C.ending=end;C.ch=K.ch.length;addXP(end==='good'?200:100)}save();checkAch();ambience(false);lantern(false);
    frame(`<h1 class="${end==='bad'?'lost':''}">${esc(tx(K.end[end].t))}</h1><p class="scene">${esc(tx(K.end[end].x))}</p>${end==='good'?'':`<p class="lorehint">${tx({en:'Choices you made along the way decide what you know at the end.',id:'Pilihan di sepanjang jalan menentukan apa yang kamu tahu di akhir.'})}</p>`}<div class="row"><button class="btn primary" data-st autofocus>${T('Back to the story')}</button>${end==='bad'?`<button class="btn" data-rt>${T('Try the last chapter again')}</button>`:''}</div>`);
    $('[data-st]').onclick=()=>{view='survive';shell();campDetail($('#main'),cid)};const rt=$('[data-rt]');rt&&(rt.onclick=()=>playChapter(cid,K.ch.length-1))})}

setInterval(nightTick,60000);

function peek(){if(!isNight()||SET.level!=='full'||SET.visits===false)return;if($('#scare,#cine,.modal,#fake,.peek,#title'))return;if(!(view==='map'||view==='book'))return;
  const pool=GHOSTS.filter(g=>!g.rev&&!g.mine&&(NIGHTONLY.includes(g.id)||g.danger>=4)),g=pick(pool);if(!g)return;
  const side=pick(['l','r','b']),el=document.createElement('div');el.className='peek p-'+side;el.setAttribute('aria-hidden','true');el.innerHTML=portrait(g,true);document.body.appendChild(el);
  cry(g,'tease');buzzPhone(20);setTimeout(()=>el.classList.add('back'),1300);setTimeout(()=>el.remove(),2300)}

function whisperName(){const nm=(SET.name||'').trim();if(!nm)return'';const p=isNight()?.22:.06;if(Math.random()>p)return'';
  setTimeout(()=>{if(canSpeak&&SET.sound&&SET.level==='full'){const u=new SpeechSynthesisUtterance(nm+'...');u.rate=.55;u.pitch=.3;u.volume=.35;speechSynthesis.speak(u)}},1400);

/* ===== The Book of Legends: origins, voices and a page-turning booklet ===== */
const ORIGIN={
kuntilanak:'The name is often linked to "kunti" and "anak" (child), and to the city of Pontianak in West Kalimantan, whose founding story in 1771 tells of Sultan Syarif Abdurrahman firing cannons to drive these spirits away. She belongs to a Malay-Indonesian family of ghosts of women who died in pregnancy or childbirth, a deep fear in societies where childbirth was dangerous.',
pontianak:'The Malaysian name for the same spirit as the kuntilanak, possibly from "perempuan mati beranak" (a woman who died giving birth). She became a star of Malay cinema with the 1957 film Pontianak, and the frangipani scent and the nail in the neck are fixed parts of her story.',
pocong:'The pocong comes straight from Islamic burial customs in Indonesia and Malaysia: the body is wrapped in a white kain kafan and tied at the head, neck and feet, and the ties are loosened before burial. The legend imagines what happens if they are forgotten. Pocong stories boomed with Indonesian horror films in the 2000s.',
genderuwo:'A Javanese spirit known from village stories for centuries, said to live in big trees, rocks and abandoned buildings. It is part of the wider Javanese world of makhluk halus (subtle beings) who share the land with people.',
tuyul:'Tuyul belong to Javanese stories about pesugihan, secret pacts made for wealth. When a neighbour got rich too quickly, people whispered that they kept a tuyul. The stories reflect worries about envy and sudden wealth in village life.',
leak:'Leak come from Balinese belief, where they are people who practise black magic and can change form at night. They are tied to the great sacred dramas of Bali, like the story of Calon Arang and the witch-queen Rangda, performed in temples to this day.',
sundelbolong:'"Sundel" is an old Javanese word for a woman of bad reputation, and "bolong" means hollow. She became famous through the 1981 Indonesian film Sundel Bolong starring Suzzanna, Indonesia\'s queen of horror.',
susterngesot:'A modern urban legend that spread in Indonesian hospitals and through films like Suster Ngesot (2007). Stories of night-shift nurses and empty wards made her one of the best-known new ghosts of Indonesia.',
wewegombel:'Named after Bukit Gombel, a hill in Semarang, Central Java. In the tale she was a woman driven to despair who now takes neglected children, and returns them once their parents learn to care for them. It is a ghost with a moral lesson for parents.',
nyiroro:'Nyi Roro Kidul is the Queen of the Southern Sea in Javanese and Sundanese tradition, said to be the spiritual consort of the sultans of Yogyakarta and Surakarta. Offerings are still made to her, and the Samudra Beach Hotel keeps room 308 for her.',
babingepet:'From Indonesian pesugihan stories: a person turns into a pig to steal by rubbing against people\'s walls, while a partner at home guards a candle that shows if the thief is in danger.',
jelangkung:'Jelangkung is an Indonesian spirit-calling game with a doll made from a coconut shell and sticks, often compared to a ouija board. The chant "datang tak dijemput, pulang tak diantar" became famous through the 2001 film Jelangkung.',
jerukpurut:'The headless priest of Jeruk Purut is one of Jakarta\'s best-known cemetery legends. The story spread by word of mouth and through Indonesian horror TV and films in the 2000s.',
simanis:'Si Manis Jembatan Ancol is a Betawi legend from North Jakarta about a woman killed near the old Ancol bridge. It became a popular TV series in the 1990s.',
lampor:'Lampor stories come from Javanese villages, especially Kulon Progo and the north coast. People described it as an invisible army or procession carrying a keranda (coffin) that brings disease, and they banged kentongan drums to drive it away.',
pasarbubrah:'Pasar Bubrah ("the broken market") is a real rocky plateau near Merapi\'s summit. Javanese belief says it is a market for the spirit world, and climbers still share stories of hearing it at night.',
butoijo:'Buto Ijo comes from Javanese folk tales, especially "Timun Mas" (Golden Cucumber), where a widow is given a daughter by the giant on the condition that he can eat her later. The girl escapes using magic gifts from a hermit.',
manananggal:'The manananggal comes from the Visayas in the Philippines, part of the large aswang family of shapeshifters. Spanish missionaries recorded aswang beliefs from the 1500s.',
aswang:'"Aswang" is a catch-all word in Philippine folklore for shapeshifting creatures. Capiz province is famous for aswang stories. Some historians think the Spanish used aswang fears to discredit traditional healers called babaylan.',
tikbalang:'A Tagalog creature of the forests, with a horse\'s head and long limbs. The practice of turning your shirt inside out to break its spell is still widely known in the Philippines.',
krasue:'The krasue is known across Thailand, Cambodia (as ap), Laos and Malaysia. She has been a regular star of Thai films since the 1970s, and is often said to be a woman cursed for a sin in a past life.',
maenak:'Mae Nak Phra Khanong is Thailand\'s most famous ghost story, set in the 19th century in what is now a district of Bangkok. A shrine to her at Wat Mahabut is still visited every day, and the story has been filmed more than 20 times.',
kuchisake:'The slit-mouthed woman has roots in Edo-period stories, but became a nationwide panic in Japan in 1979, when schoolchildren across the country believed she was real and some schools sent pupils home in groups.',
teketeke:'Teke Teke is a modern Japanese urban legend, likely from the 1990s or earlier, about a girl who fell onto railway tracks. The name copies the clicking sound her elbows make.',
hanako:'Hanako-san became one of Japan\'s best-known school legends in the 1980s. The ritual of knocking on the third stall on the third floor is still dared by schoolchildren.',
yukionna:'The snow woman appears in Japanese records from the 1400s. The best-known version was written down by Lafcadio Hearn in Kwaidan (1904), from a tale he heard in Musashi province.',
kappa:'Kappa are water creatures from all over Japan, recorded since the Edo period. Signs warning children about kappa still stand near rivers, and the creature is a mascot for river safety.',
gumiho:'The nine-tailed fox is shared by China (huli jing), Japan (kitsune) and Korea, where she is usually dangerous and longs to become human. Gumiho stories are a favourite of Korean TV dramas.',
jiangshi:'The jiangshi ("stiff corpse") comes from Qing dynasty China. One theory links it to the practice of "corpse-walking" in Xiangxi, where bodies of people who died far from home were carried back. It became a film icon in 1980s Hong Kong cinema like Mr. Vampire.',
egui:'Hungry ghosts come from Buddhist and Chinese tradition. The Hungry Ghost Festival, in the seventh lunar month, is celebrated across China, Taiwan, Malaysia, Singapore and beyond with food, paper offerings and opera.',
chudail:'The chudail (also churel) appears across India and Pakistan. Her backward-facing feet are a common sign of spirits across South Asia.',
vetala:'Vetalas come from Hindu tradition. The most famous text is the Vetala Panchavimshati, a collection of 25 riddle-stories in which King Vikramaditya carries a vetala, written down over a thousand years ago.',
bhangarh:'Bhangarh Fort was built in the 1500s. Legends blame its ruin on a curse by a sorcerer or a hermit, and the Archaeological Survey of India really does forbid entry between sunset and sunrise.',
ghoul:'The ghul comes from pre-Islamic Arabian folklore. It became known in the West through the Arabian Nights, translated into French in the early 1700s, which gave English the word "ghoul".',
tokoloshe:'The tokoloshe comes from Zulu and Xhosa belief in southern Africa. Raising beds on bricks to keep it away is a well-known custom, and the creature is still discussed in South African newspapers.',
ninkinanka:'The Ninki Nanka is a dragon-like creature of the Gambia and Senegal. In 2006 a group of British researchers even travelled to the Gambia to look for it.',
mamiwata:'Mami Wata is a water spirit honoured across West and Central Africa and the African diaspora. Images of her as a woman with a snake were influenced by a 19th-century European poster of a snake charmer that spread across Africa.',
bloodymary:'Bloody Mary is a sleepover ritual from the United States and Britain, recorded by folklorists from the 1970s. Some link her to Queen Mary I of England, but the ritual itself is mostly about scaring friends in the dark.',
banshee:'The bean sí ("woman of the fairy mound") comes from Irish tradition. She was said to follow certain old Irish families and keen, or lament, before a death.',
blackshuck:'Black Shuck is the ghostly dog of East Anglia. On 4 August 1577 a storm struck churches in Bungay and Blythburgh, and a pamphlet of the time blamed a fearsome black dog. Burn marks on Blythburgh church door are still called "the devil\'s fingerprints".',
dullahan:'The dullahan is an Irish headless rider. Washington Irving\'s Headless Horseman is often thought to draw on Irish and German legends like this one.',
krampus:'Krampus comes from Alpine traditions in Austria and Bavaria. Krampusnacht on 5 December, with masked runners in fur and horns, is still a huge event.',
babayaga:'Baba Yaga is the great witch of Slavic fairy tales, collected by Alexander Afanasyev in the 1850s and 1860s. She is sometimes helpful, sometimes deadly, and always unpredictable.',
rusalka:'Rusalki come from Slavic belief: drowned young women who return in early summer during Rusalka Week. Dvořák\'s 1901 opera Rusalka made her famous across the world.',
strigoi:'Strigoi are restless dead in Romanian folklore. Folklorists like Agnes Murgoci described these beliefs in the 1920s. They are part of the background to the vampire legend that Bram Stoker\'s Dracula (1897) made famous.',
draugr:'The draugr comes from Old Norse sagas, like the Grettis saga, where the hero Grettir wrestles a draugr named Glámr. These undead guard their burial mounds.',
kelpie:'The kelpie is a Scottish water horse, said to live in lochs and rivers. Two huge horse-head sculptures near Falkirk, called The Kelpies, were unveiled in 2013.',
llorona:'La Llorona is told across Mexico and Latin America. Some scholars link her to the Aztec goddess Cihuacoatl, who wept at night, and to the story of La Malinche after the Spanish conquest.',
silbon:'El Silbón comes from the plains (llanos) of Venezuela and Colombia. In the story, a spoiled young man killed his father, and his grandfather cursed him to carry the bones forever.',
chupacabra:'The chupacabra first appeared in Puerto Rico in 1995, when farmers found livestock drained of blood. The first eyewitness description may have been influenced by the alien in the film Species, released the same year.',
mothman:'Mothman sightings began in Point Pleasant, West Virginia, in November 1966, when two couples reported a winged creature with red eyes. After the Silver Bridge collapsed in 1967, the story grew into a legend. The town now has a Mothman statue and festival.',
jerseydevil:'The Jersey Devil legend says Mother Leeds, in 1735, cursed her 13th child, who turned into a winged creature and flew into the Pine Barrens. A wave of sightings in 1909 caused panic.',
bellwitch:'The Bell Witch haunting was reported by the Bell family in Adams, Tennessee, from 1817 to 1821. Accounts say the spirit could talk, sing and slap people.',
headless:'',horseman:'Washington Irving\'s "The Legend of Sleepy Hollow" (1820) is set in a real village in New York. The rider is said to be a Hessian soldier who lost his head to a cannonball during the American Revolution.',
nightmarchers:'Huaka\'i pō are part of Native Hawaiian tradition: processions of ancient warriors moving between sacred places. Hawaiians teach respect for them, and some old paths are still avoided at night.',
bunyip:'The bunyip comes from Aboriginal Australian stories in many regions, and was taken up by settlers in the 1800s, when newspapers reported sightings and strange bones.',
taniwha:'In Maori tradition taniwha are powerful beings of rivers, lakes and the sea, often guardians (kaitiaki) of a tribe. In 2002 a road project in Waikato was rerouted after local Maori raised concerns about a taniwha.',
fishersghost:'In 1826 Frederick Fisher disappeared near Campbelltown. A farmer named John Farley said he saw Fisher\'s ghost pointing to a creek, where the body was found. Campbelltown still holds a Fisher\'s Ghost festival.',
nyiblorong:'Nyi Blorong appears in Javanese stories about pesugihan (pacts for wealth), as a servant or relative of Nyi Roro Kidul. She was famously played by Suzzanna in the 1982 film Nyi Blorong.',
kuyang:'Kuyang stories come from Kalimantan, among Dayak and Banjar communities. Like the krasue and penanggalan, the kuyang is a woman practising dark magic whose head flies at night.',
orangpendek:'Orang Pendek ("short person") is a creature reported in the Kerinci forests of Sumatra. Scientists and conservation teams have searched for it since the 1990s, and some think it may be an unknown ape.',
ebugogo:'The Nage people of Flores tell of the Ebu Gogo, small hairy people. When fossils of a small human species, Homo floresiensis, were found on Flores in 2003, some scientists wondered if the legend was an ancient memory.',
badarawuhi:'Badarawuhi became famous through a viral 2019 Twitter thread, "KKN di Desa Penari", about students on a village community service trip who broke the village\'s rules. The story became one of Indonesia\'s biggest horror films in 2022.',
hachishaku:'Hachishakusama was posted on the Japanese forum 2channel in 2008. The story of a boy kept overnight in a room sealed with salt became a classic of Japanese internet horror.',
kisaragi:'Kisaragi Station was posted on 2channel in January 2004 by a user called "Hasumi", who posted live updates as she found herself at a station no one could find on any map. The posts stopped suddenly.',
smilingman:'The Smiling Man was posted on Reddit in 2012 as a true story. It became one of the best-known internet horror stories.',
slenderman:'',hitori:'Hitori Kakurenbo spread on Japanese internet forums in the 2000s as a ritual "game" with a doll, rice and salt water.',
elevatorgame:'The Elevator Game came from Korean internet forums and spread worldwide around 2014 and 2015. Players press floors in a fixed order to reach "another world".',
lechuza:'La Lechuza is told in northern Mexico and southern Texas: a witch who becomes a giant owl. People say to pray, or tie seven knots in a rope, to keep her away.',
qalupalik:'The qalupalik comes from Inuit oral tradition. It was used to teach children to stay away from dangerous sea ice. Inuit artists and writers still tell her story.',
golem:'The Golem of Prague is a Jewish legend of Rabbi Judah Loew ben Bezalel, who lived in the 1500s. Legend says the clay giant is stored in the attic of the Old New Synagogue.',
piedpiper:'In 1284, according to old records in Hamelin, 130 children were "led away". What really happened is unknown. The Brothers Grimm later wrote the version we know today, with the rats.',
koschei:'Koschei the Deathless is the villain of many Russian fairy tales. His death is hidden inside a needle, inside an egg, inside a duck, inside a hare, locked in a chest under an oak tree.',
vii:'Viy comes from Nikolai Gogol\'s 1835 story, which he said came from a Ukrainian folk tale. The creature, whose eyelids must be lifted for it to see, has been filmed many times.',
dybbuk:'The dybbuk comes from Jewish folklore in Eastern Europe. S. An-sky\'s play The Dybbuk (1920) made it famous worldwide.',
nian:'The Nian is linked to the origins of Chinese New Year traditions: red decorations, firecrackers and staying up late on New Year\'s Eve are said to have been ways to scare it off.',
umibozu:'Umibozu are giant sea spirits from Japanese folklore, recorded in the Edo period. Sailors said to give them a bucket without a bottom so they can\'t sink the boat.',
oiwa:'Oiwa comes from Tsuruya Nanboku IV\'s kabuki play Yotsuya Kaidan (1825). Actors and film crews still visit Oiwa\'s shrine in Yotsuya to ask permission before telling her story.',
lawang:'',redcap:'Redcaps come from the Anglo-Scottish border, where old castles saw centuries of fighting. Folklorists recorded the tradition in the 1800s.',
nuckelavee:'The nuckelavee comes from Orkney folklore, recorded in the 1800s. Islanders blamed it for plagues and crop failures, and it was said to fear fresh water.',
santelmo:'"Santelmo" comes from St Elmo\'s fire, the glow sailors saw on ship masts in storms. In the Philippines it became a wandering fireball spirit.',
mujina:'In 1959, a woman in Honolulu reported seeing a faceless woman in the restroom of a drive-in theatre. The story borrowed the Japanese name "mujina", from Lafcadio Hearn\'s faceless ghost tale.',
kumakatok:'Kumakatok ("those who knock") are a Philippine urban legend from the 1950s and 60s, about three hooded figures who bring death to whoever opens the door.'};
const REGION_NOTE={sea:'In Southeast Asia, ghosts are part of everyday life: people ask permission (tabi-tabi po, permisi) before entering forests or old buildings, and many spirits are tied to childbirth, wealth and the duty to bury the dead properly.',ea:'East Asian ghost lore mixes Buddhist ideas about rebirth, the duty to honour ancestors, and centuries of written collections like Japan\'s Edo-period yokai books and China\'s Strange Tales from a Chinese Studio.',sa:'South Asian ghost stories often involve souls who died with unfinished desires, cremation grounds, and great trees like the banyan and peepal. Backward feet are a common sign of a spirit.',me:'Middle Eastern and North African lore is shaped by ancient Mesopotamia, pre-Islamic Arabia, Persian epics and the deserts, where travellers feared shapeshifters that led them astray.',af:'Across Africa, many spirits are guardians of rivers, forests and communities, and are treated with respect rather than fear. Stories are often passed on by elders and storytellers as lessons.',eu:'European folklore was collected in the 1800s by people like the Brothers Grimm and Alexander Afanasyev. Many of its spirits guard rivers, forests and homes, and punish rudeness or laziness.',na:'North American legends mix Native traditions, European settler stories and modern urban legends spread by newspapers, campfires and, today, the internet.',la:'Latin American legends blend Indigenous, African and Spanish or Portuguese traditions. Many are moral tales: they punish cruelty, unfaithfulness and harm to nature.',cb:'Caribbean folklore draws on West African, European and Indigenous roots. Many stories come from the time of plantations and are told on porches at night.',ca:'The steppe, the mountains and the taiga shaped these stories: spirits who trouble travellers, new mothers and herders, often kept away by iron.',oc:'In the Pacific, many spirits are ancestral and sacred. These stories are told with respect, and visitors are asked to follow local customs.'};
const LOOK_NOTE={hair:'Long-haired women in white are one of the most widespread ghost types in the world, from Southeast Asia to Latin America. They are often tied to grief, betrayal or death in childbirth.',shroud:'Wrapped corpses reflect burial customs: when the rites are not done properly, the dead cannot rest.',beast:'Monstrous beasts often stand for the dangers of the wild: forests, swamps and mountains where people did not go alone.',imp:'Small tricksters are found everywhere. They steal, trick and play, and can usually be distracted or kept happy.',head:'Flying heads are found across Southeast Asia, nearly always women said to practise dark magic.',mouth:'Ghosts with terrible mouths are about hunger and secrets.',void:'Faceless and invisible spirits are about the fear of what you cannot see.',fire:'Ghost lights appear in marshes and fields across the world, sometimes explained today as natural gases.',water:'Water spirits are common wherever people drown: rivers, lakes, wells and the sea. Many stories teach children to stay away from dangerous water.',tall:'Impossibly tall figures play on the fear of being watched from above.',horned:'Horned beings are often devils, tricksters or punishers of bad behaviour.',skull:'The restless dead return when burial or justice has gone wrong.',eyes:'Spirits with many eyes are about the feeling of being watched.',bird:'Winged night creatures are tied to owls, bats and the fear of being taken in the dark.',fox:'Fox spirits are shapeshifters across East Asia, beautiful and dangerous.',doll:'Haunted dolls are a modern favourite: things that look human, but are not.',mirror:'Mirrors have long been thought of as doors to the other side.'};

function speakGhost(g,mode){if(!canSpeak||!SET.sound||SET.level!=='full'||SET.voice===false)return;const nm=(g&&g.id)||'';const v=VOICE[nm];if(!v||v[1]==='...')return;
  try{const u=new SpeechSynthesisUtterance(v[1]);u.lang=v[0];const vs=speechSynthesis.getVoices(),pick1=vs.find(x=>x.lang===v[0])||vs.find(x=>x.lang&&x.lang.slice(0,2)===v[0].slice(0,2));if(pick1)u.voice=pick1;
   u.rate=mode==='scare'?.75:.55;u.pitch=mode==='scare'?.2:.35;u.volume=mode==='scare'?1:.5;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- the booklet ---------- */
let BK=null;
function bookOrder(){const ord=Object.keys(REGIONS);return GHOSTS.filter(g=>!g.mine).slice().sort((a,b)=>ord.indexOf(a.reg)-ord.indexOf(b.reg)||a.name.localeCompare(b.name))}
function openBook(id){const list=bookOrder();let i=id?list.findIndex(g=>g.id===id):-1;BK={list,i};
  const el=document.createElement('div');el.id='booklet';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',T('Book of Legends'));
  el.innerHTML=`<div class="bk-wrap"><button class="bk-x" aria-label="${T('Close the book')}">✕</button><div class="bk-book" id="bkb"></div>
  <div class="bk-nav"><button class="btn" data-bp>‹ ${T('Previous')}</button><button class="btn ghosty" data-bc>${T('Contents')}</button><span class="bk-n" id="bkn"></span><button class="btn" data-bn>${T('Next')} ›</button></div></div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  const close=()=>{hush();el.remove();document.body.style.overflow='';removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='ArrowRight')turn(1);else if(e.key==='ArrowLeft')turn(-1);else if(e.key==='Escape')close()};addEventListener('keydown',kd);
  el.querySelector('.bk-x').onclick=close;el.querySelector('[data-bp]').onclick=()=>turn(-1);el.querySelector('[data-bn]').onclick=()=>turn(1);el.querySelector('[data-bc]').onclick=()=>{BK.i=-1;drawPage(0)};
  let sx=null;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)turn(dx<0?1:-1);sx=null});
  drawPage(0)}
function turn(d){if(!BK)return;BK.i=Math.max(-1,Math.min(BK.list.length-1,BK.i+d));drawPage(d)}
function drawPage(d){const b=$('#bkb');if(!b)return;hush();const {list,i}=BK;$('#bkn').textContent=i<0?T('Contents'):`${i+1} / ${list.length}`;
  if(i<0){b.innerHTML=`<div class="bk-page bk-left bk-cover"><h2>${T('The Book of Legends')}</h2><p>${list.length} ${T('legends')} · ${countries()} ${T('places')}</p><div class="bk-art">${portrait(GBY.kuntilanak)}</div><p class="bk-small">${T('Made by')} TheFrst</p></div>
   <div class="bk-page bk-right"><h3>${T('Contents')}</h3>${Object.entries(REGIONS).map(([k,l])=>{const first=list.findIndex(g=>g.reg===k);return first<0?'':`<button class="bk-toc" data-to="${first}"><span>${esc(l)}</span><i>${list.filter(g=>g.reg===k).length}</i></button>`}).join('')}</div>`;
   b.querySelectorAll('[data-to]').forEach(x=>x.onclick=()=>{BK.i=+x.dataset.to;drawPage(1)});anim(b,d);return}
  const g=list[i],org=ORIGIN[g.id],met=ST.met.includes(g.id),cf=campfire(g);
  b.innerHTML=`<div class="bk-page bk-left"><p class="bk-reg">${esc(REGIONS[g.reg])}</p><div class="bk-art">${portrait(g)}</div><h2>${esc(g.name)}</h2><p class="bk-place">${esc(g.place)}</p>${flames(g.danger)}
   ${g.rev?`<p class="rev">${T('This is a revered figure in living tradition. It appears here with respect, and it does not jump out at you.')}</p>`:''}<p class="bk-small">${met?T('You have survived it.'):T('You have not met it yet.')}</p>
   <div class="row left"><button class="btn primary" data-bf>${T('Face')} ${esc(g.name)}</button>${canSpeak?`<button class="btn" data-bs>${T('Read it aloud')}</button>`:''}<button class="btn" data-bm>${T('On the map')}</button></div></div>
   <div class="bk-page bk-right"><h3>${T('How the legend began')}</h3><p>${esc(org||REGION_NOTE[g.reg])}</p>${org?'':`<p class="bk-small">${esc(LOOK_NOTE[g.look]||'')}</p>`}
   <h3>${T('The legend')}</h3>${cf.map(p=>`<p>${esc(p)}</p>`).join('')}
   <dl class="lore"><div><dt>${T('What you notice')}</dt><dd>${esc(g.sign)}</dd></div><div class="ok"><dt>${T('What the lore says to do')}</dt><dd>${esc(g.rule)}</dd></div><div class="no"><dt>${T('What never to do')}</dt><dd>${esc(g.trap)}</dd></div>${g.charm?`<div class="ch"><dt>${T('Charm that works')}</dt><dd>${CHARMS[g.charm]}</dd></div>`:''}</dl>
   ${org?`<h3>${T('Where it is told')}</h3><p class="bk-small">${esc(REGION_NOTE[g.reg])}</p>`:''}
   <h3>${T('Kindred spirits elsewhere')}</h3><div class="rel">${cousins(g).map(x=>`<button data-bj="${x.id}"><span class="mini">${portrait(x)}</span>${esc(x.name)}<small>${esc(x.place.split(', ').pop())}</small></button>`).join('')}</div></div>`;
  b.querySelector('[data-bf]').onclick=()=>{$('.bk-x').click();startNight({solo:g})};b.querySelector('[data-bm]').onclick=()=>{$('.bk-x').click();openGhost(g.id)};
  const sp=b.querySelector('[data-bs]');sp&&(sp.onclick=()=>{speak(`${g.name}. ${org?org+' ... ':''}${cf.join(' ... ')}`);ST.spoken++;save();checkAch()});
  b.querySelectorAll('[data-bj]').forEach(x=>x.onclick=()=>{BK.i=BK.list.findIndex(y=>y.id===x.dataset.bj);drawPage(1)});
  b.querySelector('.bk-right').scrollTop=0;anim(b,d);ST.read=ST.read||[];if(!ST.read.includes(g.id)){ST.read.push(g.id);save()}}
function anim(b,d){b.classList.remove('flipL','flipR');void b.offsetWidth;if(d)b.classList.add(d>0?'flipR':'flipL')}
/* more origins */
Object.assign(ORIGIN,{
penanggal:'The penanggalan is a Malaysian creature first described to Western readers by colonial writers in the late 1800s, like Walter William Skeat in Malay Magic (1900). Thorny leaves at the windows to snag her trailing organs are part of the old protective customs.',
toyol:'The toyol is the Malay version of the tuyul, linked to stories of bomoh (healers) who raise child spirits for their masters. Malaysian newspapers still report toyol "sightings" from time to time.',
langsuir:'The langsuir was described by Skeat in Malay Magic (1900): a woman who died in childbirth and returned as a flying spirit. Cutting her nails and stuffing her hair into the hole in her neck was said to turn her back into a woman.',
hanturaya:'Hantu raya belongs to Malay beliefs about spirits passed down in families. Stories say a person who keeps one cannot die peacefully until it is passed on.',
orangminyak:'The "oily man" caused real panics in Malaysia in the 1960s and again in 2005 and 2012, with villagers forming night patrols. A 1958 Malay film, Sumpah Orang Minyak, helped make the legend famous.',
tiyanak:'The tiyanak is a Philippine creature recorded since the Spanish colonial period. Some stories describe it as the spirit of a child who died before baptism.',
kapre:'The kapre is a tree giant from Philippine folklore, sometimes linked by historians to Spanish-era stories about the Africans brought by colonial ships. Today kapre are a favourite of Filipino comics and films.',
balete:'Balete Drive is a real road in Quezon City named after the balete trees (a kind of fig) that grow there. Taxi drivers began telling the story of the White Lady in the 1950s, and it became one of Manila\'s most famous legends.',
phipop:'Phi pop come from northeastern Thailand and Laos. Belief in them was strong enough that whole villages were said to drive out suspected phi pop families, and the healer called mor phi is still part of village life.',
mada:'Ma da (or ma rà) are Vietnamese drowned spirits. Many families still avoid swimming during the 7th lunar month, the month of wandering souls.',
rokurokubi:'The rokurokubi appears in Edo-period books of yokai, especially those painted by Toriyama Sekien in the 1700s. Lafcadio Hearn also wrote a version in Kwaidan (1904).',
noppera:'The faceless noppera-bo became famous through Lafcadio Hearn\'s story "Mujina" (1904), set by the Akasaka moat in Tokyo, where a man runs from one faceless person straight into another.',
jorogumo:'Jorogumo stories come from the Edo period. Joren Falls in Izu has a legend of a spider woman who tried to drag a woodcutter into the water with her silk.',
dokkaebi:'Dokkaebi are goblins in Korean folklore, mischievous rather than evil. Their magic club (dokkaebi bangmangi) can make anything appear. They are often shown in modern Korean dramas.',
cheonyeo:'Cheonyeo gwishin are among the most famous Korean ghosts. Many stories, like Janghwa Hongryeon jeon, tell of a young woman wronged in life who appears to a magistrate to ask for justice.',
girlinred:'The Little Girl in Red comes from a Taiwanese TV programme in 1998 that showed home video from a hiking trip with a small girl in red no one recognised. It became one of Taiwan\'s best-known modern legends and a film series.',
nishi:'Nishi (night) ghosts come from Bengali folk belief in West Bengal and Bangladesh. The custom of waiting for a third call before answering at night is still known in many families.',
pichalperi:'Pichal peri belong to the mountain folklore of northern Pakistan and India. Like many South Asian spirits, their backward feet give them away.',
yeti:'The yeti has been part of Sherpa and Tibetan belief for centuries. Western climbers began reporting its footprints in the 1920s and 1950s, and expeditions searched for it in the Himalaya.',
ummduwais:'Umm al-Duwais is a legend of the Emirates and the Gulf, used to warn men against straying. She is famous for her perfume, a mix of sandalwood and oud.',
aisha:'Aisha Kandisha is a Moroccan spirit, sometimes linked to a 15th-century noblewoman who fought the Portuguese. Some scholars link her to older Mediterranean water goddesses.',
adze:'The adze is a vampire spirit of the Ewe people of Ghana and Togo. It flies as a firefly and slips through closed doors.',
asanbosam:'The asanbosam (or sasabonsam) comes from Ashanti folklore in Ghana. It was described by writers like R.S. Rattray in the 1920s.',
grootslang:'The grootslang ("great snake" in Afrikaans) is said to live in the Wonder Hole, a cave in the Richtersveld. Some stories mention an explorer who disappeared looking for it in 1917.',
popobawa:'The popobawa first appeared in reports from Pemba in 1965, with later waves of panic on Zanzibar in the 1970s, 1995 and 2007, when people slept outside in groups.',
krasue2:'',kikimora:'The kikimora is a Russian house spirit, often thought to be connected to the bad dreams and household troubles. In some stories she is the wife of the domovoi.',
nokken:'The nøkk (in Norway), näck (in Sweden) and nix (in Germany) are water spirits. The Swedish painter Ernst Josephson painted the näck playing the violin in a famous 1882 painting.',
huldra:'The huldra comes from Scandinavian folklore. Her hidden cow\'s tail and her back, hollow like a tree trunk, give her away.',
mara:'The mara is a nightmare spirit from Germanic and Slavic folklore. The English word "nightmare" comes from her name.',
wisp:'Will-o\'-the-wisps are lights seen over marshes and bogs. Today scientists think they may be caused by gases from rotting plants catching fire, but for centuries they were thought to be spirits.',
compana:'The Santa Compaña comes from Galicia in northwestern Spain, where processions of the dead were said to walk at night carrying candles and a cross.',
damblanche:'The white ladies of France and Europe are some of the oldest fairy-tale spirits. Stories of white ladies on bridges and ravines were common in Normandy.',
beannighe:'The bean nighe is a Scottish washer at the ford, one of the fairy women (bean sìth). In Gaelic tradition, if you catch her she must answer your questions.',

let vb={x:0,y:30,w:1000,h:420},placing=false;
const ratio=()=>{const s=document.getElementById('msvg');return s&&s.clientWidth?s.clientHeight/s.clientWidth:.42};
function home(){const r=ratio(),w=Math.min(1000,430/r);vb={x:(innerWidth<860?560:500)-w/2,y:240-w*r/2,w,h:w*r};setVB()}
const XY=g=>[(g.lon+180)/360*1000,(90-g.lat)/180*500];
function filtered(){const s=q.trim().toLowerCase(),night=isNight();return GHOSTS.filter(g=>(night||!NIGHTONLY.includes(g.id))&&(!countryF||countryOf(g)===countryF)&&(regF==='all'||g.reg===regF||(regF==='mine'&&g.mine))&&(!s||(g.name+' '+g.place+' '+g.story).toLowerCase().includes(s)))}
function mapView(m){
  m.innerHTML=`<section class="mapwrap ${isNight()?'midnight':''}"><div class="map ${placing?'placing':''}" id="map"><svg id="msvg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" role="img" aria-label="World map of legends">
