<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nightlore</title><meta name="description" content="A world map of ghosts and legends, and a game where folklore decides whether you survive the night.">
<meta name="theme-color" content="#0e1326"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0e1326;--deep:#080b18;--land:#1b2347;--edge:#36437a;--bone:#ece4cf;--dim:#a3a8c3;--faint:#6d7396;--candle:#f2b54a;--spirit:#8ff0dc;--blood:#e0344f;--f-old:'IM Fell English',Georgia,serif;--f-sc:'IM Fell English SC',Georgia,serif;--f-ui:'Karla',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--bone)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;min-height:100vh;background:radial-gradient(120% 80% at 70% -10%,#1d2550 0%,var(--night) 55%,var(--deep) 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--spirit);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{background:transparent;border:1px solid var(--edge);border-radius:999px;padding:11px 22px;font-weight:600;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--candle)}.btn.primary{background:var(--candle);border-color:var(--candle);color:#1b1206}.btn.primary:hover{background:#ffc768}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 18px;background:rgba(8,11,24,.86);backdrop-filter:blur(8px);border-bottom:1px solid #222a50}
.brand{background:none;border:0;font-family:var(--f-sc);font-size:24px;letter-spacing:.08em;padding:0;color:var(--bone)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--dim);white-space:nowrap;font-weight:600}
.tabs button.on{color:var(--bone);box-shadow:inset 0 -2px var(--candle)}.tabs button:hover{color:var(--bone)}
.set{background:none;border:1px solid #2b3463;border-radius:999px;padding:6px 12px;color:var(--dim);font-size:13px;white-space:nowrap}
main{outline:none}
/* map */
.mapwrap{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 57px)}
.map{position:relative;overflow:hidden;background:radial-gradient(90% 90% at 50% 50%,#0f1633,#070a17);touch-action:none}
#msvg{width:100%;height:100%;display:block;cursor:grab}#msvg:active{cursor:grabbing}
.grat line{stroke:#1a2247;stroke-width:.4}.land{fill:var(--land);stroke:var(--edge);stroke-width:.35;stroke-linejoin:round}
.pin{cursor:pointer}.pin .dot{fill:var(--candle);stroke:#1b1206;stroke-width:.3}.pin.rev .dot{fill:var(--spirit)}
.pin.dim{opacity:.13;pointer-events:none}.pin.sel .dot{fill:#fff}.pin:hover .dot,.pin:focus .dot{fill:#fff}.pin:focus{outline:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--edge);background:rgba(8,11,24,.85);font-size:18px}
.hint{position:absolute;left:14px;bottom:8px;margin:0;font-size:12px;color:var(--faint)}
.side{overflow-y:auto;border-left:1px solid #222a50;background:rgba(8,11,24,.6);padding:16px}
.filters{display:flex;flex-direction:column;gap:10px}
.srch input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--edge);background:#0a0e20;color:var(--bone);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #2b3463;background:none;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--dim)}.chip.on{border-color:var(--candle);color:var(--bone);background:rgba(242,181,74,.12)}
.count{color:var(--faint);font-size:13px;margin:12px 0 6px}
.glist{list-style:none;margin:0;padding:0}.glist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #1a2147;padding:8px 4px}
.glist button:hover{background:rgba(143,240,220,.05)}.glist b{display:block;font-family:var(--f-old);font-size:19px;font-weight:400;line-height:1.15}.glist small{color:var(--dim)}
.mini{width:42px;height:42px;flex:none;border-radius:50%;overflow:hidden;background:#05060c;display:block}.mini svg{width:100%;height:100%}
.met{margin-left:auto;font-style:normal;font-size:11px;color:var(--spirit);border:1px solid rgba(143,240,220,.4);border-radius:999px;padding:1px 7px}
.empty{color:var(--dim);padding:16px 0}
.back{background:none;border:0;color:var(--dim);padding:0 0 10px;font-weight:600}.back::before{content:'‹ '}
.gcard h2{font-family:var(--f-old);font-weight:400;font-size:38px;line-height:1;margin:12px 0 4px;outline:none}
.gart{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#05060c;box-shadow:0 0 0 1px #2b3463,0 20px 60px -20px rgba(224,52,79,.5)}.gart svg{width:100%;height:100%}
.place{margin:0;color:var(--dim)}.place span{display:block;font-size:13px;color:var(--faint)}
.danger{display:inline-flex;gap:4px;margin:10px 0}.danger i{width:7px;height:14px;border-radius:50% 50% 40% 40%;background:#2b3463}.danger i.on{background:var(--candle);box-shadow:0 0 8px var(--candle)}
.story{font-family:var(--f-old);font-size:19px;line-height:1.55}
.rev{border-left:2px solid var(--spirit);padding-left:12px;color:var(--spirit);font-size:14px}
.lore{margin:18px 0;display:grid;gap:12px}.lore div{padding-left:12px;border-left:2px solid #2b3463}.lore .ok{border-color:var(--spirit)}.lore .no{border-color:var(--blood)}
.lore dt{font-size:13px;color:var(--faint);font-weight:600}.lore dd{margin:2px 0 0;font-family:var(--f-old);font-size:18px}
.status{color:var(--dim);font-size:14px}
/* bestiary */
.book{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.bhead h1,.setup h1,.stage h1{font-family:var(--f-old);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1;margin:0 0 8px}
.bhead p{color:var(--dim);margin:0 0 20px}.book h2{font-family:var(--f-old);font-weight:400;font-size:26px;margin:30px 0 10px;border-bottom:1px solid #222a50;padding-bottom:6px}.book h2 small{font-family:var(--f-ui);font-size:13px;color:var(--faint)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.grid button{width:100%;background:none;border:0;text-align:center;padding:6px}.grid .art{display:block;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#05060c;filter:grayscale(.85) brightness(.55);transition:filter .3s;margin-bottom:6px}
.grid .got .art,.grid button:hover .art{filter:none}.grid .art svg{width:100%;height:100%}.grid b{display:block;font-family:var(--f-old);font-weight:400;font-size:17px;line-height:1.15}.grid small{color:var(--faint);font-size:12px}
/* survive */
.stage{max-width:640px;margin:0 auto;padding:30px 18px 60px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--faint);font-size:13px;border-bottom:1px solid #222a50;padding-bottom:10px;margin-bottom:26px}
.nerve{display:inline-flex;gap:6px}.nerve i{width:9px;height:18px;border-radius:50% 50% 40% 40%;background:#2b3463}.nerve i.lit{background:var(--candle);box-shadow:0 0 10px var(--candle);animation:flick 2.4s infinite}
.nerve i:nth-child(2){animation-delay:.7s}.nerve i:nth-child(3){animation-delay:1.3s}@keyframes flick{0%,100%{opacity:1}45%{opacity:.75}50%{opacity:1}}
.lede{font-family:var(--f-old);font-size:20px;color:var(--dim)}
.scene:focus{outline:none}.scene{font-family:var(--f-old);font-size:clamp(22px,4.2vw,28px);line-height:1.4;margin:0 0 18px}.scene.sign{color:#fff}.scene.ok{color:var(--spirit)}.scene.bad{color:#ff8a9b}
.air{font-style:italic;font-family:var(--f-old);color:var(--faint);margin:0 0 14px}
.q{font-weight:600;color:var(--dim);margin:22px 0 10px}
.choices{display:flex;flex-direction:column;gap:10px}.choices button{text-align:left;background:rgba(8,11,24,.6);border:1px solid #2b3463;border-radius:12px;padding:14px 16px;font-size:17px}
.choices button:hover:not(:disabled){border-color:var(--candle);background:rgba(242,181,74,.07)}.choices button:disabled{opacity:.5;cursor:default}
.you{color:var(--faint);font-size:14px}.lorehint{border-left:2px solid var(--spirit);padding-left:12px;color:var(--dim)}.lorehint b{color:var(--bone);font-weight:600}
.where{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.where button{text-align:left;background:rgba(8,11,24,.6);border:1px solid #2b3463;border-radius:12px;padding:12px 14px}.where button:hover{border-color:var(--candle)}
.where b{display:block}.where small{color:var(--faint);font-size:13px}.small{color:var(--faint);font-size:13px;margin-top:20px}
.nlog{list-style:none;padding:0;margin:20px 0;display:grid;gap:6px}.nlog li{display:grid;grid-template-columns:80px 1fr;column-gap:12px;padding:8px 12px;border-radius:10px;background:rgba(8,11,24,.6)}.nlog span{color:var(--faint);font-size:13px;grid-row:span 2}
.nlog b{font-family:var(--f-old);font-weight:400;font-size:18px}.nlog small{color:var(--faint)}.nlog li.ok{box-shadow:inset 2px 0 var(--spirit)}.nlog li.bad{box-shadow:inset 2px 0 var(--blood)}
.sun{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ffe0a8,#f2b54a 60%,transparent 70%);margin:0 0 10px;box-shadow:0 0 80px #f2b54a}
.lost{color:var(--blood)}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(3,4,10,.8);display:grid;place-items:center;padding:16px}
.mbox{max-width:480px;width:100%;background:#0d1228;border:1px solid var(--edge);border-radius:16px;padding:24px}.mbox h2{font-family:var(--f-old);font-weight:400;font-size:30px;margin:0 0 6px}.mbox p{color:var(--dim)}
.lv{display:grid;gap:8px;margin:14px 0}.lv label{display:flex;gap:12px;align-items:flex-start;border:1px solid #2b3463;border-radius:12px;padding:10px 12px;cursor:pointer}.lv label:has(input:checked){border-color:var(--candle)}
.lv input{accent-color:var(--candle);margin-top:5px}.lv small{display:block;color:var(--faint)}.snd{display:flex;gap:8px;align-items:center;color:var(--dim);margin:0 0 16px}.snd input{accent-color:var(--candle)}
/* title */
#title{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 70% at 50% 0%,#202a5c,#0b0f22 60%,#05060d);display:grid;place-items:center;overflow:hidden;transition:opacity .6s}
#title.out{opacity:0;pointer-events:none}#tc{position:absolute;inset:0;width:100%;height:100%}
.tin{position:relative;text-align:center;padding:24px 18px;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{font-family:var(--f-sc);font-weight:400;font-size:clamp(50px,13vw,128px);letter-spacing:.06em;line-height:.9;margin:0;display:flex}
.logo span{display:inline-block;animation:rise 1.2s calc(var(--i)*.07s) cubic-bezier(.2,.8,.2,1) both,haunt 7s calc(2s + var(--i)*.4s) infinite}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(8px)}}
@keyframes haunt{0%,92%,100%{transform:none;text-shadow:none}93%{transform:translate(2px,-1px);text-shadow:-3px 0 var(--blood),3px 0 var(--spirit)}95%{transform:translate(-2px,1px);text-shadow:3px 0 var(--blood),-3px 0 var(--spirit)}}
.tag{font-family:var(--f-old);font-size:20px;color:var(--dim);margin:0}
.whisper{font-size:14px;color:var(--faint);max-width:460px;margin:0}.whisper i{font-family:var(--f-old);font-size:16px;color:var(--dim)}
.made{margin:10px 0 0;color:var(--dim)}.made b{color:var(--candle)}.ver{font-size:12px;color:var(--faint);margin:0;max-width:440px}
/* jumpscare */
#scare{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden;cursor:pointer;outline:none}
#scare.pre{background:#000!important}#scare.pre .sc-stage,#scare.pre .sc-name{opacity:0}
.sc-stage{position:relative;width:min(92vmin,760px);aspect-ratio:1}.sc-l,.sc-slice{position:absolute;inset:0}.sc-l svg,.sc-slice svg{width:100%;height:100%}
.glow{filter:drop-shadow(0 0 3px currentColor)}
.full.go .sc-l.r{mix-blend-mode:screen;filter:sepia(1) saturate(9) hue-rotate(-50deg);opacity:.7;animation:chR .6s steps(3) both}
.full.go .sc-l.c{mix-blend-mode:screen;filter:sepia(1) saturate(6) hue-rotate(130deg);opacity:.6;animation:chC .6s steps(3) both}
@keyframes chR{0%{transform:translate(-30px,6px)}60%{transform:translate(-8px,0)}100%{transform:translate(-3px,0)}}@keyframes chC{0%{transform:translate(30px,-6px)}60%{transform:translate(8px,0)}100%{transform:translate(3px,0)}}
.sc-tear{position:absolute;inset:0;opacity:0}.full.go .sc-tear{animation:tearOn .7s .05s both}@keyframes tearOn{0%,90%{opacity:1}100%{opacity:0}}
.sc-slice{clip-path:inset(calc(var(--i)*16.6%) 0 calc(100% - (var(--i) + 1)*16.6%) 0);animation:slice .7s steps(5) both;animation-delay:calc(var(--i)*-.07s)}
@keyframes slice{0%{transform:translateX(-40px)}25%{transform:translateX(50px)}50%{transform:translateX(-20px)}75%{transform:translateX(12px)}100%{transform:none}}
.full.go::before{content:'';position:fixed;inset:0;background:#fff;animation:flash .16s both;z-index:3;pointer-events:none}@keyframes flash{from{opacity:.85}to{opacity:0}}
.go .sc-stage{animation:var(--ent) .26s cubic-bezier(.1,.9,.2,1.2) both,breathe 2.8s .3s ease-in-out infinite}
.e-rush{--ent:rush}.e-drop{--ent:drop}.e-rise{--ent:riseU}.e-split{--ent:split}.e-stretch{--ent:stretch}.e-burst{--ent:burst}.e-swarm{--ent:swarm}.e-slide{--ent:slide}
@keyframes rush{from{transform:scale(.15)}to{transform:scale(1.12)}}@keyframes drop{from{transform:translateY(-110%) scale(1.2)}to{transform:translateY(0) scale(1.12)}}
@keyframes riseU{from{transform:translateY(100%) scale(.9)}to{transform:scale(1.12)}}@keyframes split{from{clip-path:inset(0 50% 0 50%);transform:scale(1.4)}to{clip-path:inset(0);transform:scale(1.12)}}
@keyframes stretch{from{transform:scaleY(.1) scaleX(1.6)}to{transform:scaleY(1.25) scaleX(.95)}}@keyframes burst{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1.15) rotate(0)}}
@keyframes swarm{from{transform:scale(3);opacity:0}to{transform:scale(1.12);opacity:1}}@keyframes slide{from{transform:translateX(-120%) skewX(30deg)}to{transform:translateX(0) scale(1.12)}}
#scare.again .sc-stage{animation:snap .18s cubic-bezier(.1,.9,.2,1.3) both}@keyframes snap{from{transform:scale(1.12)}to{transform:scale(1.75)}}
@keyframes breathe{0%,100%{transform:scale(1.12)}50%{transform:scale(1.16)}}
.sc-name{position:absolute;bottom:5vh;left:16px;right:16px;text-align:center;font-family:var(--f-sc);font-size:clamp(26px,6.5vw,72px);line-height:1;letter-spacing:.1em;color:#fff;mix-blend-mode:difference;transition:opacity .2s}
.full.go .sc-name{animation:nm .9s steps(6) both}@keyframes nm{0%{letter-spacing:1em;opacity:0;transform:scaleY(3)}40%{opacity:1}100%{letter-spacing:.12em;transform:none}}
.sc-grain{position:absolute;inset:-50%;pointer-events:none;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;animation:grain .3s steps(3) infinite}@keyframes grain{to{transform:translate(7px,-5px)}}
.sc-tap{position:absolute;bottom:14px;color:#777;font-size:12px}
.mild.go .sc-stage{animation:mildIn 1s ease-out both}@keyframes mildIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.mild .sc-grain{display:none}
#scare.out{opacity:0;transition:opacity .35s}
#scare.calm{background:rgba(3,4,10,.92)}.sc-calm{text-align:center}.sc-calm svg{width:200px;height:200px;border-radius:50%;background:#05060c}.sc-calm p{font-family:var(--f-old);font-size:26px;margin:10px 0 4px}.sc-calm small{color:var(--faint)}
body.shake #app{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}#scare.go .sc-stage{will-change:transform}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-3px)}}
body.shake #scare{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}

/* ---- wave 2 ---- */
.maptools{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}.maptools button{background:rgba(8,11,24,.88);border:1px solid var(--edge);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}.maptools button:hover{border-color:var(--candle)}
.placing #msvg{cursor:crosshair}.placebar{position:absolute;left:50%;top:60px;transform:translateX(-50%);margin:0;background:var(--blood);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.pin.mine .dot{fill:#ff8aa0}.pin .ring{fill:none;stroke:var(--spirit);stroke-width:.25;opacity:.7}
.lore .ch{border-color:var(--candle)}
.row.left{justify-content:flex-start}.btn.danger{border-color:#5a2030;color:#ff9aab}.btn.danger:hover{border-color:var(--blood)}
.gcard h3{font-family:var(--f-old);font-weight:400;font-size:20px;margin:26px 0 8px;color:var(--dim)}
.rel{display:flex;flex-wrap:wrap;gap:8px}.rel button{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;background:none;border:1px solid #222a50;border-radius:12px;padding:8px 4px;font-family:var(--f-old);font-size:15px;line-height:1.1;text-align:center}.rel button:hover{border-color:var(--candle)}.rel small{font-family:var(--f-ui);font-size:11px;color:var(--faint)}
.meter{height:6px;border-radius:9px;background:#1a2147;overflow:hidden;margin:-8px 0 10px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--spirit),var(--candle))}
.passport,.achs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.passport li,.achs li{border:1px dashed #2b3463;border-radius:12px;padding:10px 12px;color:var(--faint)}.passport li.on,.achs li.on{border-style:solid;border-color:var(--candle);color:var(--bone);background:rgba(242,181,74,.06)}
.passport b,.achs b{display:block;font-family:var(--f-old);font-weight:400;font-size:18px}.passport small,.achs small{font-size:12px;color:var(--faint)}
.stamp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border:1.5px solid currentColor;border-radius:6px;padding:1px 6px;transform:rotate(-4deg);margin-bottom:4px}.passport li.on .stamp{color:var(--candle)}
.bf{margin:30px 0 0}.fold summary{cursor:pointer;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary h2::after{content:' +';color:var(--faint);font-family:var(--f-ui);font-size:16px}.fold[open] summary h2::after{content:' −'}
.daily{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(120deg,rgba(143,240,220,.08),rgba(242,181,74,.06));border:1px solid #2f4a6a;border-radius:16px;padding:14px 16px;margin:6px 0 10px}.daily:hover{border-color:var(--spirit)}.daily b{display:block;font-family:var(--f-old);font-weight:400;font-size:22px}.daily small{color:var(--dim)}
.moon{flex:none;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7e0,#d9cfae 60%,#8a8470);box-shadow:0 0 24px rgba(255,247,224,.35)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.seg button:disabled{opacity:.45;cursor:not-allowed}.seg button{text-align:left;background:rgba(8,11,24,.6);border:1px solid #2b3463;border-radius:12px;padding:10px 12px}.seg button.on{border-color:var(--candle);background:rgba(242,181,74,.08)}.seg b{display:block}.seg small{color:var(--faint);font-size:12px;line-height:1.3;display:block}
.where button{position:relative}.st{position:absolute;right:8px;top:8px;font-style:normal;font-size:10px;font-weight:700;color:var(--candle);border:1.5px solid var(--candle);border-radius:5px;padding:0 5px;transform:rotate(6deg)}
.pocket{font-size:14px;color:var(--faint)}.pocket span{display:inline-block;margin:2px 4px;padding:2px 9px;border:1px solid #4a4020;border-radius:999px;color:var(--candle)}

const RAW=[
["kuntilanak","Kuntilanak","West Kalimantan, Indonesia","sea",-0.03,109.33,"hair",4,"A woman in white who died before her child was born, perched high in the trees. Locals say a faint laugh means she is right beside you; a loud one means she is far away.","A woman's laugh drifts down from the trees. It is soft. Very soft.","Walk on without looking up","Look up into the branches"],
["pocong","Pocong","Central Java, Indonesia","sea",-7.0,110.4,"shroud",3,"A corpse whose burial shroud was never untied. Bound at the feet, it cannot walk, so it hops, and it wants the knot loosened so it can finally rest.","Thump. Thump. Something wrapped in white hops down the alley toward you.","Untie the knot at the top of its head","Run down the alley"],
["genderuwo","Genderuwo","Central Java, Indonesia","sea",-7.3,110.0,"beast",3,"A huge, hairy spirit of old banyan trees and abandoned buildings. It is a gifted mimic and likes to borrow the voices of people you trust.","Your friend's voice calls from the dark banyan tree. Your friend went home an hour ago.","Answer no one and leave the tree behind","Follow the familiar voice"],
["tuyul","Tuyul","West Java, Indonesia","sea",-6.9,107.6,"imp",1,"A small, bald child spirit kept by greedy people to steal money. It is still a child, and toys distract it from its errand.","Coins vanish from the table one by one. Tiny wet footprints cross the floor.","Leave toys and a crab out to distract it","Crawl under the bed to grab it"],
["wewegombel","Wewe Gombel","Semarang, Indonesia","sea",-7.03,110.4,"hair",2,"A long-armed spirit of Bukit Gombel who hides children that are mistreated at home, and gives them back once the parents change their ways.","A child stands at the edge of the palm grove. A long arm beckons from the dark.","Call the child home gently and promise to do better","Shout and scold the child"],
["leak","Leak","Bali, Indonesia","sea",-8.65,115.2,"head",4,"A practitioner of dark magic whose head roams the night trailing glowing organs. People see it as a floating light over cemeteries.","A pale light bobs over the cemetery. Then a head lifts with it.","Stay inside the temple courtyard until dawn","Follow the floating light"],
["susterngesot","Suster Ngesot","Jakarta, Indonesia","sea",-6.2,106.8,"hair",3,"The ghost of a nurse who drags herself along the corridors of old hospitals, still doing her rounds.","In the empty ward, something drags across the tiles. Scrape. Scrape.","Climb onto a bed and keep your feet off the floor","Hide under the bed"],
["sundelbolong","Sundel Bolong","Yogyakarta, Indonesia","sea",-7.8,110.36,"hair",3,"A beautiful woman in white whose long hair hides a hollow in her back. She is said to stop men on dark roads.","A beautiful woman asks to share your umbrella. Her hair hangs strangely heavy at the back.","Politely decline and keep to the lit street","Brush her hair aside"],
["banaspati","Banaspati","East Java, Indonesia","sea",-7.6,112.7,"fire",3,"A fire spirit that rolls along dark roads like a burning ball, and sometimes walks on its hands. It fears water.","A ball of fire rolls along the road, then rises on two flaming hands.","Step into the stream beside the road","Try to stamp it out"],
["babingepet","Babi Ngepet","West Java, Indonesia","sea",-6.6,106.8,"beast",2,"A person who turns into a black pig to steal from neighbours, while a partner at home guards a candle. If the flame shakes, the pig is in danger.","A black pig rubs against the shop door. Through a window, a single candle flickers.","Find the candle and blow it out","Corner the pig with a broom"],
["nyiroro","Nyi Roro Kidul","Parangtritis, Indonesia","sea",-8.02,110.33,"water",2,"The Queen of the Southern Sea in Javanese tradition, honoured with offerings to this day. Visitors to the south coast are asked not to wear green, her colour.","On the southern beach the waves turn emerald. You are wearing green.","Step back from the surf and bow your head","Wade in for a closer look","r"],
["palasik","Palasik","West Sumatra, Indonesia","sea",-0.95,100.35,"head",3,"A Minangkabau tale of a person who sends out their head at night to prey on infants. Families keep babies close and lamps lit.","A neighbour admired the baby too long today. Tonight, something taps at the window.","Keep the shutters closed and the lamp burning","Open the window to see"],
["begu","Begu Ganjang","North Sumatra, Indonesia","sea",2.7,98.9,"tall",4,"A Batak spirit that grows taller the longer you stare at it. Those who keep looking are said to fall sick.","A figure stands by the road. Each time you blink it is taller.","Look at your feet and walk away","Keep watching it"],
["bunian","Orang Bunian","Riau, Indonesia","sea",0.5,101.4,"void",2,"Invisible people of the deep forest who live in a hidden village. Travellers who wander toward their music may not come back for years.","Music drifts from deep in the jungle: a wedding you were never invited to.","Ask permission aloud and turn back","Follow the music"],
["pontianak","Pontianak","Selangor, Malaysia","sea",3.14,101.69,"hair",4,"The Malay cousin of the kuntilanak, announced by the scent of frangipani. A nail pressed into the nape of her neck is said to tame her.","Sweet frangipani hangs in the air, where no flowers grow.","Grip an iron nail and leave quickly","Search for the flowers"],
["toyol","Toyol","Perak, Malaysia","sea",4.6,101.1,"imp",1,"A tiny green child spirit sent to steal. It loves to play, and marbles scattered on the floor will keep it busy until dawn.","Your purse is lighter every morning. Something giggles under the cupboard.","Scatter marbles across the floor","Lock the money away and sleep"],
["penanggal","Penanggalan","Kelantan, Malaysia","sea",6.1,102.2,"head",4,"A woman whose head flies off at night with her organs dangling. Thorny leaves on windowsills catch the trailing entrails.","A wet, dragging sound outside. Something glistens as it rises past the window.","Put thorny pandan leaves on the windowsill","Leave the window open for the breeze"],
["manananggal","Manananggal","Capiz, Philippines","sea",11.58,122.75,"bird",4,"She splits at the waist and flies on bat wings, leaving her lower half behind. Salt or ash on the standing half means she cannot rejoin it.","Bat wings beat overhead. Behind the hut, half a body stands alone.","Pour salt on the standing lower half","Hide in the hut and wait"],
["aswang","Aswang","Capiz, Philippines","sea",11.4,122.6,"beast",4,"A shapeshifter of Visayan folklore. Its call goes 'tik-tik': the fainter it sounds, the closer it really is.","Tik-tik... tik-tik. The sound is faint. Something lands on the roof.","Rub garlic on the door and keep watch","Relax, it sounds far away"],
["tikbalang","Tikbalang","Batangas, Philippines","sea",14.0,121.0,"horned",2,"A tall horse-headed trickster that leads travellers in circles. Turning your shirt inside out breaks the spell.","You have passed this same tree three times. Hooves clop behind you.","Turn your shirt inside out","Keep walking the same path"],
["balete","White Lady of Balete Drive","Quezon City, Philippines","sea",14.61,121.03,"hair",3,"Drivers on Balete Drive tell of a woman in white who appears in the back seat, or steps out in front of the car.","Driving past the old balete trees, you see a woman in white in your rear-view mirror.","Eyes on the road, and don't stop","Pull over to offer her a ride"],
["kapre","Kapre","Cebu, Philippines","sea",10.3,123.9,"beast",2,"A tree giant who sits in old acacia and balete trees smoking a huge cigar. Polite people say 'tabi-tabi po' as they pass.","Cigar smoke drifts from an acacia. Two embers glow, too high to be human.","Say 'tabi-tabi po' and pass politely","Shout an insult at the tree"],
["tiyanak","Tiyanak","Pampanga, Philippines","sea",15.0,120.7,"imp",3,"A creature that cries like a lost baby in the forest, then shows its true face to whoever picks it up.","A baby is crying alone in the forest. It stops when you get close.","Turn your clothes inside out and walk on","Pick up the crying baby"],
["krasue","Krasue","Surin, Thailand","sea",15.2,104.85,"head",4,"A floating woman's head with glowing organs hanging beneath. Villagers fence their homes with thorny bamboo, which tangles her.","A greenish glow floats along the rice paddies, low, swaying.","Stay behind the thorn fence","Leave food scraps out for it"],
["phipop","Phi Pop","Udon Thani, Thailand","sea",16.4,102.8,"void",3,"A spirit from Isan that slips inside a person and eats them from within. Only a village healer, the mor phi, can drive it out.","Your travel companion is speaking in a voice that isn't theirs.","Fetch the village healer","Let them sleep it off"],
["maenak","Mae Nak","Phra Khanong, Bangkok","sea",13.7,100.6,"hair",3,"A devoted wife who died while her husband was at war, and kept house as if nothing had changed. Her arm stretched impossibly to fetch a dropped lime.","Your hostess drops a lime through the floorboards, and her arm reaches down. Longer. Longer.","Act as if you saw nothing, and leave at dawn","Scream and run through the house"],
["mada","Ma Da","Mekong Delta, Vietnam","sea",10.0,105.8,"water",3,"The spirits of the drowned, said to wait in rivers for someone to take their place.","At dusk, someone calls your name from the middle of the river.","Stay out of the river until morning","Swim toward the voice"],
["ap","Ahp","Kampong Speu, Cambodia","sea",11.55,104.3,"head",3,"The Khmer floating head, a close relative of the krasue, that hunts by night and hides its body by day.","Something hovers over the village well, dripping light.","Hang thorny branches over the doorway","Go out to draw water"],
["kuchisake","Kuchisake-onna","Gifu, Japan","ea",35.4,136.76,"mouth",4,"A woman in a surgical mask asks 'Am I pretty?' Yes and no are both fatal answers. Telling her she looks average confuses her long enough to escape.","A woman in a mask blocks the path. 'Am I pretty?' She reaches for the mask.","Say 'You look average'","Say 'No'"],
["teketeke","Teke Teke","Hokkaido, Japan","ea",43.06,141.35,"hair",4,"The upper half of a girl who scrapes along on her elbows near railway lines: teke, teke, teke.","Teke. Teke. Teke. Something is clattering along the tracks behind you.","Get off the tracks and into the lit station","Look back to see what it is"],
["hanako","Hanako-san","Tokyo, Japan","ea",35.68,139.69,"void",2,"A girl who lives in the third stall of a school's third-floor toilet. Knock three times and say her name, and she answers.","Third floor, third stall. The door is closed. Someone is waiting.","Leave the third stall alone","Knock three times and say her name"],
["yukionna","Yuki-onna","Niigata, Japan","ea",37.9,139.0,"hair",3,"The snow woman, pale as a blizzard. In the famous tale she spares a young man on one condition: he must never speak of her.","Snow fills the hut's doorway. A pale woman bends over you, breath like frost.","Promise never to speak of her","Fall back asleep"],
["kappa","Kappa","Tono, Iwate, Japan","ea",39.33,141.53,"water",2,"A river creature with a dish of water on its head that gives it strength. It is very polite: bow, and it bows back, spilling the water.","Something with a shell and a beak rises from the river and stares at you.","Bow deeply","Wade in to grab it"],
["rokurokubi","Rokurokubi","Kyoto, Japan","ea",35.0,135.77,"head",2,"By day a normal person. At night, as they sleep, their neck stretches across the room.","In the inn, the guest beside you is asleep, and her neck is sliding across the ceiling.","Pretend to sleep until dawn","Grab the stretching neck"],
["akamanto","Aka Manto","Osaka, Japan","ea",34.69,135.5,"void",3,"A voice in the last school toilet asks: 'Red paper or blue paper?' Every colour ends badly, so you need no paper at all.","'Red paper... or blue paper?' a voice asks from the next stall.","Say you need no paper","Choose red paper"],
["noppera","Noppera-bo","Akasaka, Tokyo","ea",35.67,139.73,"void",2,"A faceless ghost that likes to frighten more than harm. In the classic tale, the noodle seller you run to for help is faceless too.","A woman crouches by the moat, crying. She turns. There is no face, only smooth skin.","Stay calm and walk toward the lit street","Run to the noodle seller for help"],
["jorogumo","Jorogumo","Joren Falls, Shizuoka","ea",34.85,138.92,"eyes",3,"A spider that becomes a beautiful woman and invites tired travellers to rest by the waterfall, then binds them in silk.","By the waterfall, a lovely woman invites you to rest. Fine threads glint around your ankles.","Cut the threads and leave the falls","Accept her invitation to rest"],
["gumiho","Gumiho","Gyeongsang, Korea","ea",35.8,128.6,"fox",3,"A nine-tailed fox that takes the shape of a beautiful woman and tries to steal a human's life energy.","A striking stranger insists you walk with her into the hills. Her shadow has nine tails.","Make an excuse and stay among people","Walk with her into the hills"],
["cheonyeo","Cheonyeo Gwishin","Miryang, Korea","ea",35.5,128.75,"hair",3,"The ghost of a young woman in a white hanbok who died with a grievance no one heard. In old tales she only wants someone brave enough to listen.","A girl in white with loose black hair stands at the foot of your sleeping mat, crying.","Listen to her story and promise to tell it","Flee screaming"],
["dokkaebi","Dokkaebi","Chungcheong, Korea","ea",36.35,127.38,"horned",1,"A mischievous Korean goblin who loves buckwheat jelly and wrestling. Its left leg is weak: hook it and you win.","A horned goblin blocks the mountain path and demands a wrestling match.","Wrestle it and hook its left leg","Hand over your purse"],
["jiangshi","Jiangshi","Xiangxi, Hunan, China","ea",28.3,109.7,"shroud",3,"A stiff, hopping corpse in Qing official robes. It finds the living by their breath, so holding yours makes you invisible.","A stiff figure in old robes hops through the moonlit courtyard, sniffing the air.","Hold your breath and stand still","Run away, panting"],
["egui","Hungry Ghosts","Guangzhou, China","ea",23.13,113.26,"mouth",2,"During Ghost Month the gates of the underworld open and hungry ghosts roam. Offerings are left by the road. Money found on the ground is never picked up.","Ghost Month. Red banknotes lie scattered on the empty street.","Leave food by the road and keep walking","Pick up the money"],
["girlinred","The Little Girl in Red","Taichung, Taiwan","ea",24.1,120.7,"imp",3,"A small girl in red who appears in a hiking group's home video, walking just behind them, when no child was with them.","On the mountain trail, a little girl in red waves for you to follow her into the trees.","Stay with the group on the trail","Follow her into the trees"],
["chudail","Chudail","Rajasthan, India","sa",26.9,75.8,"hair",4,"A spirit who appears as a lovely woman calling travellers to the well. Her feet point backwards.","A woman at the well calls you by name. Her footprints point the wrong way.","Check her feet, then leave without answering","Follow her to the well"],
["vetala","Vetala","Ujjain, India","sa",23.18,75.78,"skull",3,"A spirit that lives in corpses on cremation grounds. In the Vikram-Betal tales it tells riddles, and if you speak, it flies back to its tree.","The corpse on your shoulder starts telling a riddle. You know the answer.","Stay silent, even though you know it","Answer the riddle"],
["bhangarh","Bhangarh Fort","Rajasthan, India","sa",27.1,76.29,"void",2,"A ruined fort said to be cursed. A sign from the Archaeological Survey of India bans entry between sunset and sunrise.","Bhangarh. The sun is setting. A guard's whistle sounds far away.","Leave before sunset, as the sign says","Stay inside after dark"],
["nishi","Nishi","West Bengal, India","sa",22.57,88.36,"void",3,"A Bengali night spirit that calls your name in a loved one's voice. It only calls twice, so people wait for a third call before answering.","Late at night, your mother's voice calls your name. Twice. Then silence.","Wait, and answer only a third call","Answer straight away"],
["mohini","Mohini","Kandy, Sri Lanka","sa",7.29,80.63,"hair",3,"A woman in white holding a baby who appears on lonely roads, asking strangers to hold the child for a moment.","A woman in white steps from the dark holding a baby. 'Please, hold her for me.'","Refuse kindly and walk on","Take the baby"],
["pichalperi","Pichal Peri","Gilgit-Baltistan, Pakistan","sa",35.9,74.3,"hair",2,"A mountain fairy with backward-facing feet. Hunters who follow her tracks walk the wrong way, away from home.","Small footprints in the snow lead up the pass. They point down it.","Go down the mountain the way you came","Follow her footprints"],

["kuyang","Kuyang","Central Kalimantan, Indonesia","sea",-2.2,113.9,"head",4,"A Dayak and Banjar tale of a floating head with its organs hanging free, said to hunt newborns. Thorny leaves hung at the door keep it out.","A faint red glow drifts over the river village where a baby was born today.","Hang thorny leaves over the door and window","Let the baby sleep by the open window"],
/* ---- East Asia ---- */
["kisaragi","Kisaragi Station","Shizuoka, Japan","ea",34.97,138.38,"void",3,"A 2004 internet legend: a woman on a late train finds herself at a station that isn't on any map, hearing drums in the dark.","The train stops at a station you've never heard of. The sign says Kisaragi. Drums sound in the hills.","Stay on the train and ride it back","Get off and follow the drums"],

["jangsan","Jangsan Tiger","Busan, Korea","ea",35.19,129.2,"beast",3,"A white tiger of Mount Jangsan that mimics people's voices to lure them into the forest.","Your sister's voice calls from the dark mountain path. She's asleep in the next room.","Ignore the voice","Go out to find who's calling"],

["jurigcai","Jurig Cai","Garut, West Java","sea",-7.2,107.9,"water",3,"A Sundanese water ghost (cai means water) said to wait in rivers and wells for people who bathe alone at dusk.","At dusk the river goes still, and something pale drifts just under the surface.","Get out of the water before maghrib","Bathe alone in the dark river","","f=drowned;h=long;s=blue;e=white;m=maw;sc=water","water","Jurig is the general Sundanese word for ghost. West Javan parents have long warned children not to bathe in rivers at dusk, when the jurig are said to come out."],
["ririwa","Ririwa","Bogor, West Java","sea",-6.6,106.8,"tall",2,"A Sundanese spirit that takes the shape of a tall shadow at the edge of the village, said to scare people who wander at night.","A tall shadow stands at the end of the village path, taller each time you look.","Go back and walk home with others","Walk toward the shadow","","f=tall;s=black;e=white;sc=road","hum","Ririwa is one of several Sundanese words for night spirits, part of the rich lore of the Priangan highlands collected in Sundanese folk tales."],
["niniante","Nini Anteh","West Java, Indonesia","sea",-6.9,107.6,"hair",1,"In Sundanese legend, an old woman who lives on the moon weaving cloth with her cat. Children say the shadows on the full moon are her and her cat.","The full moon is bright. You can almost see an old woman weaving on it.","Wave goodnight to Nini Anteh","Throw a stone at the moon","r","f=old;h=bun;hc=white;s=pale;d=white;e=closed;m=smile;sc=moon","flute","Nini Anteh is a gentle Sundanese moon legend, similar to the Chinese Chang\'e or the rabbit in the moon. She is told to children as a bedtime story."],
["maungbodas","Maung Bodas","Mount Salak, West Java","sea",-6.72,106.73,"beast",2,"The white tiger linked to Prabu Siliwangi, the legendary king of Pajajaran, said to have become tigers with his followers. The white tiger guards West Java.","A white tiger stands among the mist on the mountain path, completely still.","Bow your head and step aside","Run and shout","r","f=tiger;s=white;e=yellow;sc=mountain","roar","The Siliwangi tigers come from Sundanese legends about the fall of the Pajajaran kingdom in the 1500s. Prabu Siliwangi is said to have vanished into the forest with his men, who became tigers."],
["homang","Homang","Tapanuli, North Sumatra","sea",2.0,99.0,"imp",2,"Batak forest people who live hidden in the jungle and are said to hide lost travellers, sometimes for days.","A child\'s voice calls from deep in the jungle. You\'ve lost the path.","Stop, call your companions\' names, and wait","Follow the voice off the path","","f=child;h=wild;s=brown;e=yellow;m=smile;sc=forest","giggle","Homang appear in Batak tradition as forest beings with backward feet. When someone went missing in the forest, people said the homang had taken them."],
["bombo","Bombo","Tana Toraja, South Sulawesi","sea",-3.0,119.9,"shroud",2,"In Toraja belief, the spirit of the dead stays near the family until the great funeral ceremony sends it to Puya, the land of souls.","In the family house, beside the body waiting for its funeral, something moves under the cloth.","Speak to it respectfully, as family","Run out of the house","r","f=shroud;s=corpse;e=closed;sc=room","whisper","Toraja families keep the bodies of their dead at home, sometimes for years, until they can hold the great funeral (rambu solo). Until then the dead are treated as if they are only sick."],
["antugergasi","Antu Gergasi","Sarawak, Borneo","sea",1.5,111.0,"beast",4,"A huge, hairy giant of Iban legend that hunts in the forest with a pack of dogs, and eats people.","Dogs bark deep in the forest, and something huge crashes through the trees.","Climb high and stay silent","Shout to find out who it is","","f=giant;s=black;e=red;m=tusks;sc=forest","roar","Antu is the Iban word for spirit. The gergasi is a giant found in Malay and Iban stories; the word may come from the Sanskrit for a monstrous being."],
["nenekluhu","Nenek Luhu","Ambon, Maluku","sea",-3.7,128.18,"hair",2,"A princess of Luhu who vanished long ago. People in Ambon say she appears at dusk and takes children who are still playing outside.","Maghrib. A girl in old-fashioned clothes stands by the children still playing outside.","Call the children inside now","Let them keep playing","","f=woman;h=long;s=brown;d=red;e=void;m=none;sc=road","sob","Nenek Luhu is one of Maluku\'s best-known legends, tied to the old Luhu kingdom on Seram. Ambonese parents still call children inside at dusk with her name."],
["nitu","Nitu","Flores, East Nusa Tenggara","sea",-8.7,121.7,"void",1,"In many Flores communities, ancestors and nature spirits (nitu) live in stones, trees and springs, and are honoured with offerings.","A circle of old stones in the village, with fresh betel offerings on them.","Greet the ancestors and leave the stones alone","Climb on the stones","r","f=shadowman;e=none;sc=field","whisper","Ancestor stones and spirits are central to the traditions of Flores, alongside Catholic faith. Offerings at megalithic sites are still made."],
["celuluk","Celuluk","Gianyar, Bali","sea",-8.54,115.33,"beast",3,"A follower of Rangda in Balinese tradition, with bulging eyes, fangs and wild hair. It appears in sacred dances.","Bulging eyes and long fangs in the dark of the temple yard.","Stay in the light of the temple and keep calm","Laugh at its face","","f=demonmask;sc=temple","laugh","Celuluk appear in the Calon Arang dance-drama, as the students of the witch Rangda. The masks and costumes are kept in temples."],
["mbahpetruk","Mbah Petruk","Mount Merapi, Central Java","sea",-7.54,110.44,"beast",1,"A guardian spirit of Merapi volcano, named after a long-nosed wayang clown. Some villagers say he warns them before eruptions.","The ash cloud over Merapi looks like a face with a long nose.","Listen to the warning and leave the slope","Climb higher to take a photo","r","f=giant;s=brown;e=white;m=smile;sc=volcano","wind","In 2006 and 2010 some Merapi villagers said they saw the shape of Petruk, a wayang clown character, in the eruption clouds. Merapi is believed to be home to a spirit kingdom."],

["parakang","Parakang","Makassar, South Sulawesi","sea",-5.14,119.42,"beast",3,"A Bugis-Makassar tale of a person who turns into an animal at night and feeds on the sick. Families keep watch over anyone who is ill.","A strange cat sits on the windowsill of the sick room, staring.","Keep the lamp lit and sit with the sick","Leave the sick one alone","","f=cat;s=black;e=red;m=fangs;sc=room","chew","Parakang stories are told in South Sulawesi. Like many such tales, they reflect fears around illness and death before modern medicine."],

const ENDINGS={good:{t:{en:'Remembered',id:'Diingat'},x:{en:'You hold up the lantern and say his name, and the story of the man at the harbour. The thing in the doorway stops wearing other faces. For a moment you see just a tired man. He bows. The lantern goes out by itself, for the first time in fifty years. In the morning you put his name next to your grandmother\'s photo, and you keep your promise.',id:'Kamu mengangkat pelita dan menyebut namanya, juga cerita tentang lelaki di pelabuhan. Sosok di ambang pintu berhenti memakai wajah lain. Sesaat kamu hanya melihat seorang lelaki yang lelah. Ia membungkuk. Pelita padam sendiri, untuk pertama kalinya dalam lima puluh tahun. Paginya kamu menaruh namanya di samping foto nenekmu, dan kamu menepati janji.'}},

function campState(cid){ST.camps=ST.camps||{};if(!ST.camps.lantern&&ST.camp&&ST.camp.ch){ST.camps.lantern=ST.camp}return ST.camps[cid]=ST.camps[cid]||{ch:0,f:[]}}
function campView(m){m.innerHTML=`<section class="stage setup"><h1>${T('Story campaigns')}</h1><p class="lede">${T('Long stories. Your choices follow you to the end.')}</p>
  <div class="modes">${Object.entries(CAMPS).map(([k,c])=>{const C=campState(k);return`<button data-cmp="${k}"><b>${esc(tx(c.t))}</b><small>${esc(tx(c.d))}</small><small>${Math.min(C.ch,c.ch.length)}/${c.ch.length}${C.ending?' · '+esc(tx(c.end[C.ending].t)):''}</small></button>`}).join('')}</div></section>`;
  m.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=()=>campDetail(m,b.dataset.cmp))}
function campDetail(m,cid){const K=CAMPS[cid],C=campState(cid);
  m.innerHTML=`<section class="stage setup"><button class="back" data-cb>${T('Story campaigns')}</button><h1>${esc(tx(K.t))}</h1><p class="lede">${esc(tx(K.d))}</p>
  <ol class="chapters">${K.ch.map((c,i)=>`<li class="${i<C.ch?'done':i===C.ch?'now':'locked'}"><span class="chnum">${i+1}</span><span><b>${esc(tx(c.t))}</b><small>${esc(tx(c.where))}</small></span></li>`).join('')}</ol>
  ${C.ending?`<p class="find">${T('Your ending')}: <b>${esc(tx(K.end[C.ending].t))}</b></p>`:''}
  <div class="row left"><button class="btn primary" data-cp ${C.ch>=K.ch.length?'disabled':''}>${C.ch?T('Continue chapter')+' '+(Math.min(C.ch,K.ch.length-1)+1):T('Begin the story')}</button>${C.ch?`<button class="btn" data-cr>${T('Start over')}</button>`:''}</div></section>`;
  m.querySelector('[data-cb]').onclick=()=>campView(m);
  const b=m.querySelector('[data-cp]');b&&(b.onclick=()=>playChapter(cid,C.ch));const r=m.querySelector('[data-cr]');r&&(r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent=T('Tap again to restart');return}ST.camps[cid]={ch:0,f:[]};save();campDetail(m,cid)})}
function chapOf(o){return CAMPS[o.cid].ch[o.camp]}
function playChapter(cid,i){const c=CAMPS[cid].ch[i];campState(cid);
  startNight({list:c.g.map(id=>GBY[id]).filter(Boolean),reg:c.reg,label:tx(c.where),camp:i,cid,introText:tx(c.intro)})}
function chapterDone(){const i=N.camp,cid=N.cid,K=CAMPS[cid],c=K.ch[i];
  if(c.final)return finale(cid);
  frame(`<p class="you">${T('Chapter')} ${i+1}: ${esc(tx(c.t))}</p><p class="scene">${esc(tx(c.end))}</p><p class="q">${esc(tx(c.c.q))}</p><div class="choices">${c.c.a.map((a,k)=>`<button data-cc="${k}">${esc(tx(a.t))}</button>`).join('')}</div>`);
  $$('[data-cc]').forEach(b=>b.onclick=()=>{const a=c.c.a[+b.dataset.cc];const C=campState(cid);if(a.f&&!C.f.includes(a.f))C.f.push(a.f);C.ch=Math.max(C.ch,i+1);save();addXP(50);lantern(false);ambience(false);
    frame(`<h1>${T('Chapter complete')}</h1><p class="scene">${esc(tx(c.t))}</p><div class="row"><button class="btn primary" data-nx autofocus>${T('Next chapter')}</button><button class="btn" data-st>${T('Back to the story')}</button></div>`);
    $('[data-nx]').onclick=()=>playChapter(cid,i+1);$('[data-st]').onclick=()=>{view='survive';shell();campDetail($('#main'),cid)}})}
function finale(cid){const K=CAMPS[cid],C=campState(cid),F=K.finale(C.f);
  frame(`<p class="scene sign">${esc(tx(F.sign))}</p><p class="q">${T('What do you do?')}</p><div class="choices">${shuf(F.opts).map(([k,t])=>`<button data-fz="${k}">${esc(tx(t))}</button>`).join('')}</div>`);
  if(cid==='kampung')cry(SUARA,'tease');
  $$('[data-fz]').forEach(b=>b.onclick=async()=>{$$('[data-fz]').forEach(x=>x.disabled=true);let end=F.judge(b.dataset.fz);if(end==='bad')await scare(K.villain,true);
    if(end!=='bad'){C.ending=end;C.ch=K.ch.length;addXP(end==='good'?200:100)}save();checkAch();ambience(false);lantern(false);
    frame(`<h1 class="${end==='bad'?'lost':''}">${esc(tx(K.end[end].t))}</h1><p class="scene">${esc(tx(K.end[end].x))}</p>${end==='good'?'':`<p class="lorehint">${tx({en:'Choices you made along the way decide what you know at the end.',id:'Pilihan di sepanjang jalan menentukan apa yang kamu tahu di akhir.'})}</p>`}<div class="row"><button class="btn primary" data-st autofocus>${T('Back to the story')}</button>${end==='bad'?`<button class="btn" data-rt>${T('Try the last chapter again')}</button>`:''}</div>`);
    $('[data-st]').onclick=()=>{view='survive';shell();campDetail($('#main'),cid)};const rt=$('[data-rt]');rt&&(rt.onclick=()=>playChapter(cid,K.ch.length-1))})}

/* ===== The Book of Legends: origins, voices and a page-turning booklet ===== */
const ORIGIN={
kuntilanak:'The name is often linked to "kunti" and "anak" (child), and to the city of Pontianak in West Kalimantan, whose founding story in 1771 tells of Sultan Syarif Abdurrahman firing cannons to drive these spirits away. She belongs to a Malay-Indonesian family of ghosts of women who died in pregnancy or childbirth, a deep fear in societies where childbirth was dangerous.',
pontianak:'The Malaysian name for the same spirit as the kuntilanak, possibly from "perempuan mati beranak" (a woman who died giving birth). She became a star of Malay cinema with the 1957 film Pontianak, and the frangipani scent and the nail in the neck are fixed parts of her story.',
pocong:'The pocong comes straight from Islamic burial customs in Indonesia and Malaysia: the body is wrapped in a white kain kafan and tied at the head, neck and feet, and the ties are loosened before burial. The legend imagines what happens if they are forgotten. Pocong stories boomed with Indonesian horror films in the 2000s.',
genderuwo:'A Javanese spirit known from village stories for centuries, said to live in big trees, rocks and abandoned buildings. It is part of the wider Javanese world of makhluk halus (subtle beings) who share the land with people.',
tuyul:'Tuyul belong to Javanese stories about pesugihan, secret pacts made for wealth. When a neighbour got rich too quickly, people whispered that they kept a tuyul. The stories reflect worries about envy and sudden wealth in village life.',
leak:'Leak come from Balinese belief, where they are people who practise black magic and can change form at night. They are tied to the great sacred dramas of Bali, like the story of Calon Arang and the witch-queen Rangda, performed in temples to this day.',
sundelbolong:'"Sundel" is an old Javanese word for a woman of bad reputation, and "bolong" means hollow. She became famous through the 1981 Indonesian film Sundel Bolong starring Suzzanna, Indonesia\'s queen of horror.',
susterngesot:'A modern urban legend that spread in Indonesian hospitals and through films like Suster Ngesot (2007). Stories of night-shift nurses and empty wards made her one of the best-known new ghosts of Indonesia.',
wewegombel:'Named after Bukit Gombel, a hill in Semarang, Central Java. In the tale she was a woman driven to despair who now takes neglected children, and returns them once their parents learn to care for them. It is a ghost with a moral lesson for parents.',
nyiroro:'Nyi Roro Kidul is the Queen of the Southern Sea in Javanese and Sundanese tradition, said to be the spiritual consort of the sultans of Yogyakarta and Surakarta. Offerings are still made to her, and the Samudra Beach Hotel keeps room 308 for her.',
babingepet:'From Indonesian pesugihan stories: a person turns into a pig to steal by rubbing against people\'s walls, while a partner at home guards a candle that shows if the thief is in danger.',
jelangkung:'Jelangkung is an Indonesian spirit-calling game with a doll made from a coconut shell and sticks, often compared to a ouija board. The chant "datang tak dijemput, pulang tak diantar" became famous through the 2001 film Jelangkung.',
jerukpurut:'The headless priest of Jeruk Purut is one of Jakarta\'s best-known cemetery legends. The story spread by word of mouth and through Indonesian horror TV and films in the 2000s.',
simanis:'Si Manis Jembatan Ancol is a Betawi legend from North Jakarta about a woman killed near the old Ancol bridge. It became a popular TV series in the 1990s.',
lampor:'Lampor stories come from Javanese villages, especially Kulon Progo and the north coast. People described it as an invisible army or procession carrying a keranda (coffin) that brings disease, and they banged kentongan drums to drive it away.',
pasarbubrah:'Pasar Bubrah ("the broken market") is a real rocky plateau near Merapi\'s summit. Javanese belief says it is a market for the spirit world, and climbers still share stories of hearing it at night.',
butoijo:'Buto Ijo comes from Javanese folk tales, especially "Timun Mas" (Golden Cucumber), where a widow is given a daughter by the giant on the condition that he can eat her later. The girl escapes using magic gifts from a hermit.',
manananggal:'The manananggal comes from the Visayas in the Philippines, part of the large aswang family of shapeshifters. Spanish missionaries recorded aswang beliefs from the 1500s.',
aswang:'"Aswang" is a catch-all word in Philippine folklore for shapeshifting creatures. Capiz province is famous for aswang stories. Some historians think the Spanish used aswang fears to discredit traditional healers called babaylan.',
tikbalang:'A Tagalog creature of the forests, with a horse\'s head and long limbs. The practice of turning your shirt inside out to break its spell is still widely known in the Philippines.',
krasue:'The krasue is known across Thailand, Cambodia (as ap), Laos and Malaysia. She has been a regular star of Thai films since the 1970s, and is often said to be a woman cursed for a sin in a past life.',
maenak:'Mae Nak Phra Khanong is Thailand\'s most famous ghost story, set in the 19th century in what is now a district of Bangkok. A shrine to her at Wat Mahabut is still visited every day, and the story has been filmed more than 20 times.',
kuchisake:'The slit-mouthed woman has roots in Edo-period stories, but became a nationwide panic in Japan in 1979, when schoolchildren across the country believed she was real and some schools sent pupils home in groups.',
teketeke:'Teke Teke is a modern Japanese urban legend, likely from the 1990s or earlier, about a girl who fell onto railway tracks. The name copies the clicking sound her elbows make.',
hanako:'Hanako-san became one of Japan\'s best-known school legends in the 1980s. The ritual of knocking on the third stall on the third floor is still dared by schoolchildren.',
yukionna:'The snow woman appears in Japanese records from the 1400s. The best-known version was written down by Lafcadio Hearn in Kwaidan (1904), from a tale he heard in Musashi province.',
kappa:'Kappa are water creatures from all over Japan, recorded since the Edo period. Signs warning children about kappa still stand near rivers, and the creature is a mascot for river safety.',
gumiho:'The nine-tailed fox is shared by China (huli jing), Japan (kitsune) and Korea, where she is usually dangerous and longs to become human. Gumiho stories are a favourite of Korean TV dramas.',
jiangshi:'The jiangshi ("stiff corpse") comes from Qing dynasty China. One theory links it to the practice of "corpse-walking" in Xiangxi, where bodies of people who died far from home were carried back. It became a film icon in 1980s Hong Kong cinema like Mr. Vampire.',
egui:'Hungry ghosts come from Buddhist and Chinese tradition. The Hungry Ghost Festival, in the seventh lunar month, is celebrated across China, Taiwan, Malaysia, Singapore and beyond with food, paper offerings and opera.',
chudail:'The chudail (also churel) appears across India and Pakistan. Her backward-facing feet are a common sign of spirits across South Asia.',
vetala:'Vetalas come from Hindu tradition. The most famous text is the Vetala Panchavimshati, a collection of 25 riddle-stories in which King Vikramaditya carries a vetala, written down over a thousand years ago.',
bhangarh:'Bhangarh Fort was built in the 1500s. Legends blame its ruin on a curse by a sorcerer or a hermit, and the Archaeological Survey of India really does forbid entry between sunset and sunrise.',
ghoul:'The ghul comes from pre-Islamic Arabian folklore. It became known in the West through the Arabian Nights, translated into French in the early 1700s, which gave English the word "ghoul".',
tokoloshe:'The tokoloshe comes from Zulu and Xhosa belief in southern Africa. Raising beds on bricks to keep it away is a well-known custom, and the creature is still discussed in South African newspapers.',
ninkinanka:'The Ninki Nanka is a dragon-like creature of the Gambia and Senegal. In 2006 a group of British researchers even travelled to the Gambia to look for it.',
mamiwata:'Mami Wata is a water spirit honoured across West and Central Africa and the African diaspora. Images of her as a woman with a snake were influenced by a 19th-century European poster of a snake charmer that spread across Africa.',
bloodymary:'Bloody Mary is a sleepover ritual from the United States and Britain, recorded by folklorists from the 1970s. Some link her to Queen Mary I of England, but the ritual itself is mostly about scaring friends in the dark.',
banshee:'The bean sí ("woman of the fairy mound") comes from Irish tradition. She was said to follow certain old Irish families and keen, or lament, before a death.',
blackshuck:'Black Shuck is the ghostly dog of East Anglia. On 4 August 1577 a storm struck churches in Bungay and Blythburgh, and a pamphlet of the time blamed a fearsome black dog. Burn marks on Blythburgh church door are still called "the devil\'s fingerprints".',
dullahan:'The dullahan is an Irish headless rider. Washington Irving\'s Headless Horseman is often thought to draw on Irish and German legends like this one.',
krampus:'Krampus comes from Alpine traditions in Austria and Bavaria. Krampusnacht on 5 December, with masked runners in fur and horns, is still a huge event.',
babayaga:'Baba Yaga is the great witch of Slavic fairy tales, collected by Alexander Afanasyev in the 1850s and 1860s. She is sometimes helpful, sometimes deadly, and always unpredictable.',
rusalka:'Rusalki come from Slavic belief: drowned young women who return in early summer during Rusalka Week. Dvořák\'s 1901 opera Rusalka made her famous across the world.',
strigoi:'Strigoi are restless dead in Romanian folklore. Folklorists like Agnes Murgoci described these beliefs in the 1920s. They are part of the background to the vampire legend that Bram Stoker\'s Dracula (1897) made famous.',
draugr:'The draugr comes from Old Norse sagas, like the Grettis saga, where the hero Grettir wrestles a draugr named Glámr. These undead guard their burial mounds.',
kelpie:'The kelpie is a Scottish water horse, said to live in lochs and rivers. Two huge horse-head sculptures near Falkirk, called The Kelpies, were unveiled in 2013.',
llorona:'La Llorona is told across Mexico and Latin America. Some scholars link her to the Aztec goddess Cihuacoatl, who wept at night, and to the story of La Malinche after the Spanish conquest.',
silbon:'El Silbón comes from the plains (llanos) of Venezuela and Colombia. In the story, a spoiled young man killed his father, and his grandfather cursed him to carry the bones forever.',
chupacabra:'The chupacabra first appeared in Puerto Rico in 1995, when farmers found livestock drained of blood. The first eyewitness description may have been influenced by the alien in the film Species, released the same year.',
mothman:'Mothman sightings began in Point Pleasant, West Virginia, in November 1966, when two couples reported a winged creature with red eyes. After the Silver Bridge collapsed in 1967, the story grew into a legend. The town now has a Mothman statue and festival.',
jerseydevil:'The Jersey Devil legend says Mother Leeds, in 1735, cursed her 13th child, who turned into a winged creature and flew into the Pine Barrens. A wave of sightings in 1909 caused panic.',
bellwitch:'The Bell Witch haunting was reported by the Bell family in Adams, Tennessee, from 1817 to 1821. Accounts say the spirit could talk, sing and slap people.',
headless:'',horseman:'Washington Irving\'s "The Legend of Sleepy Hollow" (1820) is set in a real village in New York. The rider is said to be a Hessian soldier who lost his head to a cannonball during the American Revolution.',
nightmarchers:'Huaka\'i pō are part of Native Hawaiian tradition: processions of ancient warriors moving between sacred places. Hawaiians teach respect for them, and some old paths are still avoided at night.',
bunyip:'The bunyip comes from Aboriginal Australian stories in many regions, and was taken up by settlers in the 1800s, when newspapers reported sightings and strange bones.',
taniwha:'In Maori tradition taniwha are powerful beings of rivers, lakes and the sea, often guardians (kaitiaki) of a tribe. In 2002 a road project in Waikato was rerouted after local Maori raised concerns about a taniwha.',
fishersghost:'In 1826 Frederick Fisher disappeared near Campbelltown. A farmer named John Farley said he saw Fisher\'s ghost pointing to a creek, where the body was found. Campbelltown still holds a Fisher\'s Ghost festival.',
nyiblorong:'Nyi Blorong appears in Javanese stories about pesugihan (pacts for wealth), as a servant or relative of Nyi Roro Kidul. She was famously played by Suzzanna in the 1982 film Nyi Blorong.',
kuyang:'Kuyang stories come from Kalimantan, among Dayak and Banjar communities. Like the krasue and penanggalan, the kuyang is a woman practising dark magic whose head flies at night.',
orangpendek:'Orang Pendek ("short person") is a creature reported in the Kerinci forests of Sumatra. Scientists and conservation teams have searched for it since the 1990s, and some think it may be an unknown ape.',
ebugogo:'The Nage people of Flores tell of the Ebu Gogo, small hairy people. When fossils of a small human species, Homo floresiensis, were found on Flores in 2003, some scientists wondered if the legend was an ancient memory.',
badarawuhi:'Badarawuhi became famous through a viral 2019 Twitter thread, "KKN di Desa Penari", about students on a village community service trip who broke the village\'s rules. The story became one of Indonesia\'s biggest horror films in 2022.',
hachishaku:'Hachishakusama was posted on the Japanese forum 2channel in 2008. The story of a boy kept overnight in a room sealed with salt became a classic of Japanese internet horror.',
kisaragi:'Kisaragi Station was posted on 2channel in January 2004 by a user called "Hasumi", who posted live updates as she found herself at a station no one could find on any map. The posts stopped suddenly.',
smilingman:'The Smiling Man was posted on Reddit in 2012 as a true story. It became one of the best-known internet horror stories.',
slenderman:'',hitori:'Hitori Kakurenbo spread on Japanese internet forums in the 2000s as a ritual "game" with a doll, rice and salt water.',
elevatorgame:'The Elevator Game came from Korean internet forums and spread worldwide around 2014 and 2015. Players press floors in a fixed order to reach "another world".',
lechuza:'La Lechuza is told in northern Mexico and southern Texas: a witch who becomes a giant owl. People say to pray, or tie seven knots in a rope, to keep her away.',
qalupalik:'The qalupalik comes from Inuit oral tradition. It was used to teach children to stay away from dangerous sea ice. Inuit artists and writers still tell her story.',
golem:'The Golem of Prague is a Jewish legend of Rabbi Judah Loew ben Bezalel, who lived in the 1500s. Legend says the clay giant is stored in the attic of the Old New Synagogue.',
piedpiper:'In 1284, according to old records in Hamelin, 130 children were "led away". What really happened is unknown. The Brothers Grimm later wrote the version we know today, with the rats.',
koschei:'Koschei the Deathless is the villain of many Russian fairy tales. His death is hidden inside a needle, inside an egg, inside a duck, inside a hare, locked in a chest under an oak tree.',
vii:'Viy comes from Nikolai Gogol\'s 1835 story, which he said came from a Ukrainian folk tale. The creature, whose eyelids must be lifted for it to see, has been filmed many times.',
dybbuk:'The dybbuk comes from Jewish folklore in Eastern Europe. S. An-sky\'s play The Dybbuk (1920) made it famous worldwide.',
nian:'The Nian is linked to the origins of Chinese New Year traditions: red decorations, firecrackers and staying up late on New Year\'s Eve are said to have been ways to scare it off.',
umibozu:'Umibozu are giant sea spirits from Japanese folklore, recorded in the Edo period. Sailors said to give them a bucket without a bottom so they can\'t sink the boat.',
oiwa:'Oiwa comes from Tsuruya Nanboku IV\'s kabuki play Yotsuya Kaidan (1825). Actors and film crews still visit Oiwa\'s shrine in Yotsuya to ask permission before telling her story.',
lawang:'',redcap:'Redcaps come from the Anglo-Scottish border, where old castles saw centuries of fighting. Folklorists recorded the tradition in the 1800s.',
nuckelavee:'The nuckelavee comes from Orkney folklore, recorded in the 1800s. Islanders blamed it for plagues and crop failures, and it was said to fear fresh water.',
santelmo:'"Santelmo" comes from St Elmo\'s fire, the glow sailors saw on ship masts in storms. In the Philippines it became a wandering fireball spirit.',
mujina:'In 1959, a woman in Honolulu reported seeing a faceless woman in the restroom of a drive-in theatre. The story borrowed the Japanese name "mujina", from Lafcadio Hearn\'s faceless ghost tale.',
kumakatok:'Kumakatok ("those who knock") are a Philippine urban legend from the 1950s and 60s, about three hooded figures who bring death to whoever opens the door.'};
const REGION_NOTE={sea:'In Southeast Asia, ghosts are part of everyday life: people ask permission (tabi-tabi po, permisi) before entering forests or old buildings, and many spirits are tied to childbirth, wealth and the duty to bury the dead properly.',ea:'East Asian ghost lore mixes Buddhist ideas about rebirth, the duty to honour ancestors, and centuries of written collections like Japan\'s Edo-period yokai books and China\'s Strange Tales from a Chinese Studio.',sa:'South Asian ghost stories often involve souls who died with unfinished desires, cremation grounds, and great trees like the banyan and peepal. Backward feet are a common sign of a spirit.',me:'Middle Eastern and North African lore is shaped by ancient Mesopotamia, pre-Islamic Arabia, Persian epics and the deserts, where travellers feared shapeshifters that led them astray.',af:'Across Africa, many spirits are guardians of rivers, forests and communities, and are treated with respect rather than fear. Stories are often passed on by elders and storytellers as lessons.',eu:'European folklore was collected in the 1800s by people like the Brothers Grimm and Alexander Afanasyev. Many of its spirits guard rivers, forests and homes, and punish rudeness or laziness.',na:'North American legends mix Native traditions, European settler stories and modern urban legends spread by newspapers, campfires and, today, the internet.',la:'Latin American legends blend Indigenous, African and Spanish or Portuguese traditions. Many are moral tales: they punish cruelty, unfaithfulness and harm to nature.',cb:'Caribbean folklore draws on West African, European and Indigenous roots. Many stories come from the time of plantations and are told on porches at night.',ca:'The steppe, the mountains and the taiga shaped these stories: spirits who trouble travellers, new mothers and herders, often kept away by iron.',oc:'In the Pacific, many spirits are ancestral and sacred. These stories are told with respect, and visitors are asked to follow local customs.'};
const LOOK_NOTE={hair:'Long-haired women in white are one of the most widespread ghost types in the world, from Southeast Asia to Latin America. They are often tied to grief, betrayal or death in childbirth.',shroud:'Wrapped corpses reflect burial customs: when the rites are not done properly, the dead cannot rest.',beast:'Monstrous beasts often stand for the dangers of the wild: forests, swamps and mountains where people did not go alone.',imp:'Small tricksters are found everywhere. They steal, trick and play, and can usually be distracted or kept happy.',head:'Flying heads are found across Southeast Asia, nearly always women said to practise dark magic.',mouth:'Ghosts with terrible mouths are about hunger and secrets.',void:'Faceless and invisible spirits are about the fear of what you cannot see.',fire:'Ghost lights appear in marshes and fields across the world, sometimes explained today as natural gases.',water:'Water spirits are common wherever people drown: rivers, lakes, wells and the sea. Many stories teach children to stay away from dangerous water.',tall:'Impossibly tall figures play on the fear of being watched from above.',horned:'Horned beings are often devils, tricksters or punishers of bad behaviour.',skull:'The restless dead return when burial or justice has gone wrong.',eyes:'Spirits with many eyes are about the feeling of being watched.',bird:'Winged night creatures are tied to owls, bats and the fear of being taken in the dark.',fox:'Fox spirits are shapeshifters across East Asia, beautiful and dangerous.',doll:'Haunted dolls are a modern favourite: things that look human, but are not.',mirror:'Mirrors have long been thought of as doors to the other side.'};

function speakGhost(g,mode){if(!canSpeak||!SET.sound||SET.level!=='full'||SET.voice===false)return;const nm=(g&&g.id)||'';const v=VOICE[nm];if(!v||v[1]==='...')return;

/* ---------- the booklet ---------- */
let BK=null;
function bookOrder(){const ord=Object.keys(REGIONS);return GHOSTS.filter(g=>!g.mine).slice().sort((a,b)=>ord.indexOf(a.reg)-ord.indexOf(b.reg)||a.name.localeCompare(b.name))}
function openBook(id){const list=bookOrder();let i=id?list.findIndex(g=>g.id===id):-1;BK={list,i};
  const el=document.createElement('div');el.id='booklet';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',T('Book of Legends'));
  el.innerHTML=`<div class="bk-wrap"><button class="bk-x" aria-label="${T('Close the book')}">✕</button><div class="bk-book" id="bkb"></div>
  <div class="bk-nav"><button class="btn" data-bp>‹ ${T('Previous')}</button><button class="btn ghosty" data-bc>${T('Contents')}</button><span class="bk-n" id="bkn"></span><button class="btn" data-bn>${T('Next')} ›</button></div></div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  const close=()=>{hush();el.remove();document.body.style.overflow='';removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='ArrowRight')turn(1);else if(e.key==='ArrowLeft')turn(-1);else if(e.key==='Escape')close()};addEventListener('keydown',kd);
  el.querySelector('.bk-x').onclick=close;el.querySelector('[data-bp]').onclick=()=>turn(-1);el.querySelector('[data-bn]').onclick=()=>turn(1);el.querySelector('[data-bc]').onclick=()=>{BK.i=-1;drawPage(0)};
  let sx=null;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)turn(dx<0?1:-1);sx=null});
  drawPage(0)}
function turn(d){if(!BK)return;BK.i=Math.max(-1,Math.min(BK.list.length-1,BK.i+d));drawPage(d)}
function drawPage(d){const b=$('#bkb');if(!b)return;hush();const {list,i}=BK;$('#bkn').textContent=i<0?T('Contents'):`${i+1} / ${list.length}`;
  if(i<0){b.innerHTML=`<div class="bk-page bk-left bk-cover"><h2>${T('The Book of Legends')}</h2><p>${list.length} ${T('legends')} · ${countries()} ${T('places')}</p><div class="bk-art">${portrait(GBY.kuntilanak)}</div><p class="bk-small">${T('Made by')} TheFrst</p></div>
   <div class="bk-page bk-right"><h3>${T('Contents')}</h3>${Object.entries(REGIONS).map(([k,l])=>{const first=list.findIndex(g=>g.reg===k);return first<0?'':`<button class="bk-toc" data-to="${first}"><span>${esc(l)}</span><i>${list.filter(g=>g.reg===k).length}</i></button>`}).join('')}</div>`;
   b.querySelectorAll('[data-to]').forEach(x=>x.onclick=()=>{BK.i=+x.dataset.to;drawPage(1)});anim(b,d);return}
