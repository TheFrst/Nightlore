Object.assign(ORIGIN,{
penanggal:'The penanggalan is a Malaysian creature first described to Western readers by colonial writers in the late 1800s, like Walter William Skeat in Malay Magic (1900). Thorny leaves at the windows to snag her trailing organs are part of the old protective customs.',
toyol:'The toyol is the Malay version of the tuyul, linked to stories of bomoh (healers) who raise child spirits for their masters. Malaysian newspapers still report toyol "sightings" from time to time.',
langsuir:'The langsuir was described by Skeat in Malay Magic (1900): a woman who died in childbirth and returned as a flying spirit. Cutting her nails and stuffing her hair into the hole in her neck was said to turn her back into a woman.',
hanturaya:'Hantu raya belongs to Malay beliefs about spirits passed down in families. Stories say a person who keeps one cannot die peacefully until it is passed on.',
orangminyak:'The "oily man" caused real panics in Malaysia in the 1960s and again in 2005 and 2012, with villagers forming night patrols. A 1958 Malay film, Sumpah Orang Minyak, helped make the legend famous.',
tiyanak:'The tiyanak is a Philippine creature recorded since the Spanish colonial period. Some stories describe it as the spirit of a child who died before baptism.',
kapre:'The kapre is a tree giant from Philippine folklore, sometimes linked by historians to Spanish-era stories about the Africans brought by colonial ships. Today kapre are a favourite of Filipino comics and films.',
balete:'Balete Drive is a real road in Quezon City named after the balete trees (a kind of fig) that grow there. Taxi drivers began telling the story of the White Lady in the 1950s, and it became one of Manila\'s most famous legends.',
phipop:'Phi pop come from northeastern Thailand and Laos. Belief in them was strong enough that whole villages were said to drive out suspected phi pop families, and the healer called mor phi is still part of village life.',
mada:'Ma da (or ma rà) are Vietnamese drowned spirits. Many families still avoid swimming during the 7th lunar month, the month of wandering souls.',
rokurokubi:'The rokurokubi appears in Edo-period books of yokai, especially those painted by Toriyama Sekien in the 1700s. Lafcadio Hearn also wrote a version in Kwaidan (1904).',
noppera:'The faceless noppera-bo became famous through Lafcadio Hearn\'s story "Mujina" (1904), set by the Akasaka moat in Tokyo, where a man runs from one faceless person straight into another.',
jorogumo:'Jorogumo stories come from the Edo period. Joren Falls in Izu has a legend of a spider woman who tried to drag a woodcutter into the water with her silk.',
dokkaebi:'Dokkaebi are goblins in Korean folklore, mischievous rather than evil. Their magic club (dokkaebi bangmangi) can make anything appear. They are often shown in modern Korean dramas.',
cheonyeo:'Cheonyeo gwishin are among the most famous Korean ghosts. Many stories, like Janghwa Hongryeon jeon, tell of a young woman wronged in life who appears to a magistrate to ask for justice.',
girlinred:'The Little Girl in Red comes from a Taiwanese TV programme in 1998 that showed home video from a hiking trip with a small girl in red no one recognised. It became one of Taiwan\'s best-known modern legends and a film series.',
nishi:'Nishi (night) ghosts come from Bengali folk belief in West Bengal and Bangladesh. The custom of waiting for a third call before answering at night is still known in many families.',
pichalperi:'Pichal peri belong to the mountain folklore of northern Pakistan and India. Like many South Asian spirits, their backward feet give them away.',
yeti:'The yeti has been part of Sherpa and Tibetan belief for centuries. Western climbers began reporting its footprints in the 1920s and 1950s, and expeditions searched for it in the Himalaya.',
ummduwais:'Umm al-Duwais is a legend of the Emirates and the Gulf, used to warn men against straying. She is famous for her perfume, a mix of sandalwood and oud.',
aisha:'Aisha Kandisha is a Moroccan spirit, sometimes linked to a 15th-century noblewoman who fought the Portuguese. Some scholars link her to older Mediterranean water goddesses.',
adze:'The adze is a vampire spirit of the Ewe people of Ghana and Togo. It flies as a firefly and slips through closed doors.',
asanbosam:'The asanbosam (or sasabonsam) comes from Ashanti folklore in Ghana. It was described by writers like R.S. Rattray in the 1920s.',
grootslang:'The grootslang ("great snake" in Afrikaans) is said to live in the Wonder Hole, a cave in the Richtersveld. Some stories mention an explorer who disappeared looking for it in 1917.',
popobawa:'The popobawa first appeared in reports from Pemba in 1965, with later waves of panic on Zanzibar in the 1970s, 1995 and 2007, when people slept outside in groups.',
krasue2:'',kikimora:'The kikimora is a Russian house spirit, often thought to be connected to the bad dreams and household troubles. In some stories she is the wife of the domovoi.',
nokken:'The nøkk (in Norway), näck (in Sweden) and nix (in Germany) are water spirits. The Swedish painter Ernst Josephson painted the näck playing the violin in a famous 1882 painting.',
huldra:'The huldra comes from Scandinavian folklore. Her hidden cow\'s tail and her back, hollow like a tree trunk, give her away.',
mara:'The mara is a nightmare spirit from Germanic and Slavic folklore. The English word "nightmare" comes from her name.',
wisp:'Will-o\'-the-wisps are lights seen over marshes and bogs. Today scientists think they may be caused by gases from rotting plants catching fire, but for centuries they were thought to be spirits.',
compana:'The Santa Compaña comes from Galicia in northwestern Spain, where processions of the dead were said to walk at night carrying candles and a cross.',
damblanche:'The white ladies of France and Europe are some of the oldest fairy-tale spirits. Stories of white ladies on bridges and ravines were common in Normandy.',
beannighe:'The bean nighe is a Scottish washer at the ford, one of the fairy women (bean sìth). In Gaelic tradition, if you catch her she must answer your questions.',
vrykolakas:'Vrykolakas are Greek restless dead. Travellers in the 1600s and 1700s, like the botanist Joseph Pitton de Tournefort, described vrykolakas panics on Greek islands.',
monaciello:'The munaciello is the "little monk" of Naples, told about since the 1400s. Some say the legend began with a real boy of the Frezza family who was raised dressed as a monk.',
poludnica:'Poludnica (Lady Midday) is a Slavic field spirit who punishes people working in the fields in the hottest part of the day. She is known from Poland to Russia.',
vodnik:'The vodník is a Czech water goblin. The poet Karel Jaromír Erben wrote a famous ballad about him in 1853, and Antonín Dvořák turned it into a symphonic poem.',
charro:'The Charro Negro comes from Mexican folklore, a story about greed and deals with the devil.',
sayona:'La Sayona is a Venezuelan legend. In the story, a jealous woman killed her mother after being told a lie, and was cursed to punish unfaithful men.',
pishtaco:'The pishtaco legend dates back to the Spanish conquest of the Andes. It reflects real fears of outsiders who took from Andean communities.',
cadejo:'The cadejo is told across Central America, especially Guatemala and El Salvador. The white cadejo protects night travellers; the black one leads them astray.',
curupira:'The curupira is a forest guardian of Brazilian Tupi-Guarani tradition, recorded by the Jesuit José de Anchieta in 1560. His backward feet confuse hunters who harm the forest.',
saci:'The saci is one of the best-known figures in Brazilian folklore, a mix of Indigenous, African and Portuguese stories. Brazil celebrates "Saci Day" on 31 October.',
boitata:'The boitatá is a fire serpent from Tupi tradition, recorded by José de Anchieta in the 1500s. It protects fields from people who set fires.',
soucouyant:'The soucouyant comes from Trinidad and the French-speaking Caribbean, a mix of West African and European folklore. She sheds her skin at night and flies as a ball of fire.',
duppy:'"Duppy" is a Caribbean word for a ghost or spirit, from West African roots. Silk cotton trees are said to be their homes.',
qalupalik:'The qalupalik comes from Inuit oral tradition. Inuit families told the story to keep children away from dangerous sea ice.',
ogopogo:'Ogopogo is said to live in Okanagan Lake in British Columbia. It comes from the Syilx (Okanagan) people\'s n\'ha-a-itk, a lake spirit who was offered gifts by travellers.',
yukionna2:'',
tokoloshe2:'',
eltio:'El Tío is honoured by miners in Bolivia\'s Cerro Rico, a mountain mined since the Spanish colonial era. Miners offer coca, cigarettes and alcohol to his statues in the tunnels.',
tunda:'La Tunda comes from the Afro-Colombian and Afro-Ecuadorian communities of the Pacific coast, linked to African traditions and to the history of escaped slaves in the forest.',
chonchon:'The chonchón comes from Mapuche tradition in Chile. Its call is "tue tue", and some people say it is a sorcerer who takes this form.',
krampus2:'',
wendigo:'',
nyaminyami:'Nyami Nyami is the river god of the Tonga people of the Zambezi. When the Kariba Dam was built in the 1950s, floods destroyed the works twice, and many people believed it was his anger.',
vanhunks:'The legend says Jan van Hunks, a retired pirate, smoked on Devil\'s Peak with a stranger who turned out to be the devil. The tablecloth cloud over Table Mountain is their smoke.',
uniondale:'The Uniondale hitchhiker is one of South Africa\'s most famous ghost stories. Drivers have reported her since the 1970s, on the road near where a young woman died in a car crash in 1968.',
chupacabra2:'',
dowhill:'Dow Hill in Kurseong, near Darjeeling, is known for its misty forest and an old boarding school. Locals and visitors tell stories of a headless boy walking the forest road.',
shaniwarwada:'Shaniwar Wada was the palace of the Peshwas in Pune, built in 1732. In 1773, the young Peshwa Narayanrao was murdered there. Legend says his cry "Kaka, save me!" is heard on full-moon nights.',
mummy:'After Howard Carter opened Tutankhamun\'s tomb in 1922, Lord Carnarvon, who paid for the dig, died in 1923. Newspapers spread the story of a curse.',
lilitu:'Lilitu were demons of ancient Mesopotamia. Amulets of the demon Pazuzu, who protected mothers and babies, have been found in many excavations.',
kisaragi2:'',
okiku:'The Okiku doll has been kept at Mannenji temple in Iwamizawa, Hokkaido since the 1930s. Monks have said its hair keeps growing and must be trimmed.',
hitori2:'',
ubume:'Ubume are Japanese ghosts of mothers who died in childbirth. In some tales, people who hold the baby until she returns are given great strength.',
umibozu2:'',
kunekune:'Kunekune was posted on Japanese internet forums around 2003, inspired by stories of something white seen far away in rice fields.',
nian2:'',
yakshi:'Yakshi are spirits of Kerala tradition, associated with the pala tree (Alstonia scholaris) and its strong scent at night. The 1968 Malayalam film Yakshi made her famous.',
naleba:'In the 1990s, many homes in Bangalore had "Nale ba" written on their doors. The idea was that the witch would read it, think she should come back tomorrow, and leave. The 2018 Hindi film Stree was based on this legend.',
kuldhara:'Kuldhara was a Paliwal Brahmin village near Jaisalmer. Legend says that in the 1800s its people left in a single night to escape a cruel minister, cursing it as they left.',
tepegoz:'Tepegöz is the one-eyed giant from the Book of Dede Korkut, the great epic of the Oghuz Turks. The hero Basat kills him with cunning.',
sahmaran:'Şahmaran is the queen of snakes in Anatolian and Kurdish legend, especially in Mardin and Tarsus. Her image, painted on glass or copper, is still sold as a lucky charm.',
koschei2:'',
golem2:'',
gevaudan:'Between 1764 and 1767, a beast attacked people in the Gévaudan region of France, killing many. King Louis XV sent hunters, and the story became famous across Europe.',
piedpiper2:'',
lorelei:'The Lorelei is a real cliff on the Rhine. Clemens Brentano created the legend of the siren in 1801, and Heinrich Heine\'s poem "Die Lorelei" (1824) made it famous.',
melusine:'Melusine is a French legend written down by Jean d\'Arras in 1393. Noble families, including the House of Lusignan, claimed her as their ancestor.',
huldufolk:'Belief in the huldufólk (hidden people) is still common in Iceland. Roads have been rerouted to avoid damaging their rocks.',
nisse:'The nisse (or tomte in Sweden) is a Scandinavian farm spirit. Families still leave a bowl of porridge with butter for him on Christmas Eve.',
redroom2:'',
highgate:'In 1970, newspapers reported a "vampire" in London\'s Highgate Cemetery, and crowds of amateur vampire hunters climbed the walls one night.',
borley:'Borley Rectory in Essex became famous in the 1930s through the investigator Harry Price, who called it "the most haunted house in England". It burned down in 1939.',
brownlady:'The Brown Lady of Raynham Hall became world famous when Country Life magazine published a photograph in 1936 showing a faint figure on the staircase.',
houska:'Houska Castle in the Czech Republic was built in the 1200s. Legend says it was built over a hole leading to hell, and its chapel faces inward to keep something in.',
leapcastle:'Leap Castle in County Offaly was a seat of the O\'Carroll clan, with a history of murder. Its "bloody chapel" is where a priest was said to have been killed by his brother.',
wildhunt:'The Wild Hunt is a European legend of ghostly riders who storm across the sky in winter, led by Odin in Norse versions. The Brothers Grimm recorded many versions.',
cindaku:'Cindaku belong to the Kerinci people of Jambi, Sumatra. They are seen as guardians of the forest, linked to the deep respect for tigers in Sumatran tradition.',
alaspurwo:'Alas Purwo National Park at the eastern tip of Java is famous for its ancient forest and caves. Many Javanese believe it is a spiritual place, and people come to meditate there.',
inyiakbalang:'Inyiak Balang reflects the Minangkabau and Sumatran respect for the tiger as a guardian spirit. People avoid saying the word for tiger in the forest, and call it "inyiak" (grandfather).',
keretahantu:'Ghost-train stories are told around Jakarta\'s railway stations, like Manggarai. They grew with Indonesian horror culture and social media.',
amalanhig:'The amalanhig is a Visayan legend from the Philippines: a dead aswang who rises to hunt. Its stiff body means it can only chase in a straight line.',
smilingman2:'',
clownstatue:'The clown statue story is an American urban legend that spread by email and the internet in the 2000s.',
manupstairs:'The "babysitter and the man upstairs" legend was recorded by American folklorists in the 1960s. It inspired the film When a Stranger Calls (1979).',
backseat:'The killer in the backseat is an American urban legend from the 1960s and 70s, about a driver flashing his headlights to warn a woman of danger.',
lickinghand:'The "licking hand" is an urban legend found in many countries, often called "Humans Can Lick Too". It was popular at sleepovers in the 1990s.',
charlie:'Charlie Charlie went viral on social media in 2015. It is a version of an older Spanish-language game called "Juego de la Lapicera".',
chullachaqui:'The chullachaqui is a forest spirit from the Peruvian Amazon. Its name means "uneven foot" in Quechua, and it is said to be a guardian of the forest.',
boto:'The boto, or pink river dolphin, is part of Amazonian folklore. Stories say it becomes a handsome man at festivals, always wearing a hat to hide the blowhole on his head.',
difunta:'Deolinda Correa is said to have died in the desert of San Juan, Argentina in the 1840s while searching for her husband. Her baby survived. Her shrine at Vallecito is visited by hundreds of thousands of people every year.',
jasyjatere:'Jasy Jatere is one of the seven mythical sons of Tau and Kerana in Guarani mythology. He comes out during the siesta and lures children away.',
flyingdutchman:'The Flying Dutchman is a ghost ship from 18th-century sailors\' stories, said to be doomed to sail forever off the Cape of Good Hope. Richard Wagner wrote an opera about it in 1843.',
ojuju:'Ojuju Calabar is a figure Nigerian parents use to scare children into behaving, and it appears in many jokes and stories.',
mavka:'Mavka is a forest spirit from Ukrainian folklore. Lesya Ukrainka\'s play The Forest Song (1911) made her a famous heroine.'});
Object.assign(ORIGIN,{
toyol:'The toyol is the Malaysian cousin of the Indonesian tuyul, usually said to be made from the spirit of a dead fetus by a bomoh (shaman). Malaysian newspapers still occasionally report "toyol" theft panics.',
penanggal:'The penanggalan is a Malay version of the flying-head spirit. Stories say she soaks her body in a tub of vinegar so it will shrink back into place when she returns.',
palasik:'Palasik belong to Minangkabau tradition in West Sumatra. They are said to inherit their power through family lines, and mothers protect babies with charms and by keeping them indoors at dusk.',
begu:'"Begu" is a Batak word for spirit, and "ganjang" means tall. In Batak communities of North Sumatra, accusations of keeping a begu ganjang have caused real conflicts, a reminder of how powerful these beliefs are.',
bunian:'Orang bunian are known in Malay, Minangkabau and Bornean traditions as a hidden people living in a parallel world in the forest. Stories of people "disappearing" into their villages for years are common.',
banaspati:'Banaspati is a Javanese fire spirit whose name may come from the Sanskrit "vanaspati" (lord of the forest). It is said to be summoned by black magic.',
inyiakbalang:'In Minangkabau tradition the tiger is respected as a forest elder and guardian, called Inyiak (grandfather). Many villagers still avoid saying "harimau" in the forest.',
cindaku:'Cindaku stories come from Kerinci in Jambi, where some families are said to be descended from tigers. The tradition links people, tigers and the forest closely together, and is part of local conservation stories today.',
wongsamar:'Balinese belief describes many invisible beings who share the island with people. Offerings (canang sari) placed daily at homes, temples and crossroads keep the balance between the seen and unseen worlds.',
alaspurwo:'Alas Purwo is a national park in Banyuwangi, East Java. Its name means "first forest", and in Javanese belief it is where the island began. Many people visit its caves to meditate.',
keretahantu:'Ghost-train stories are told around many Jakarta stations. They often draw on the long history of Jakarta\'s railways, which date back to Dutch colonial times.',
casablanca:'Jalan Casablanca in South Jakarta passes near what was once a large public cemetery, Menteng Pulo. Drivers\' stories of a woman in white in the underpass spread in the 2000s.',
nonibelanda:'Noni Belanda ("Dutch miss") stories are told about colonial-era buildings across Indonesia, from Lawang Sewu in Semarang to old schools and hospitals. They reflect how the colonial past still haunts these places.',
amalanhig:'Amalanhig are Visayan undead, said to be aswang who could not pass on their powers before dying. They are stiff, so they can only run in a straight line, which is why people run in a zigzag.',
santelmo2:'',tiyanak:'The tiyanak comes from Tagalog folklore and is often said to be the spirit of a baby who died before baptism. The 1988 Filipino film Tiyanak made it famous across the Philippines.',
kapre:'The kapre is a tree giant of Philippine folklore, smoking a huge cigar in big trees like the balete and acacia. Some scholars think the name came from "cafre", an old Spanish word.',
balete:'Balete Drive in Quezon City is named after the huge balete trees that once lined it. The White Lady stories, told by taxi drivers since the 1950s, are among the most famous in the Philippines.',
duwende:'Duwende comes from the Spanish "duende". In the Philippines they live in anthills and old trees, and people say "tabi-tabi po" (excuse me) to avoid disturbing them.',
phitaihong:'In Thai belief, people who die suddenly or violently (tai hong) become especially restless spirits. Shrines are often set up at accident sites to calm them.',
mada:'Ma da are water ghosts in Vietnamese belief. Families sometimes perform rituals at rivers to release a drowned relative\'s spirit, so it does not need to take another life.',
rokurokubi:'Rokurokubi appear in Edo-period yokai books by artists like Toriyama Sekien. Some stories say they are women cursed for the sins of their husbands or fathers.',
noppera:'The faceless noppera-bo became famous through Lafcadio Hearn\'s story "Mujina" (1904), set on a slope near Akasaka in Tokyo.',
jorogumo:'Jorogumo ("binding bride") stories are told at waterfalls like Joren Falls in Izu, where a woodcutter is said to have escaped a spider woman.',
dokkaebi:'Dokkaebi are Korean goblins, mischievous rather than evil. They appear in old tales with magic clubs (dokkaebi bangmangi) that can conjure anything.',
cheonyeo:'Cheonyeo gwishin are the ghosts of young women who died unmarried, a strong fear in traditional Korean society where marriage was expected. The tale of Arang, a wronged girl who appears to a magistrate, is one of the most famous.',
girlinred:'In 1998 a Taiwanese TV show aired a hiking family\'s home video showing a little girl in red that no one remembered being there. The video made "Mo-sin-a", mountain spirits, a national talking point.',
bajiaogui:'Banana-tree ghosts are told in southern China, Hong Kong, Malaysia and Singapore, often linked to women who died tragically.',
nishi:'Nishi stories come from rural Bengal, in India and Bangladesh. The rule of waiting for a third call before answering is still widely known.',
yeti:'The yeti, or meh-teh, is part of Sherpa and Tibetan tradition. Western interest exploded after mountaineers photographed large footprints in 1951.',
mechho:'Mechho bhoot appear in Bengali folk stories and children\'s books, often comic as much as scary: ghosts who love fish and hang around ponds and markets.',
naleba:'In the 1990s a panic spread in Bangalore about a witch who called people from outside their doors. Writing "Nale Ba" (come tomorrow) became so common that the city still remembers it, and it inspired the Hindi film Stree (2018).',
shaniwarwada:'Shaniwar Wada was the seat of the Peshwa rulers in Pune, built in 1732. In 1773 the young Peshwa Narayanrao was murdered there, and the legend says his cry for his uncle can still be heard.',
yakshi:'Yakshis come from ancient Indian tradition, where yakshas and yakshis were nature spirits. In Kerala they became dangerous seductresses; the Kalliyankattu Neeli legend is one of the best known.',
kuldhara:'Kuldhara was a village of Paliwal Brahmins near Jaisalmer. Legend says they all left in one night around 1825 to escape a cruel minister, cursing the land as they went.',
ummduwais:'Umm al-Duwais is an Emirati legend told to warn young men against chasing beautiful strangers. She is part of a family of Gulf folklore creatures used as moral warnings.',
al:'The Al is feared across Armenia, Iran, Turkey and the Caucasus. Protecting new mothers with iron and charms is one of the oldest folk customs of the region.',
karakoncolos:'Karakoncolos is a winter creature of Turkish and Balkan folklore, said to roam during the coldest 40 days of winter, called "zemheri".',
naddaha:'El Naddaha ("the caller") is an Egyptian Nile legend told in villages along the river.',
aisha:'Aisha Kandisha is one of Morocco\'s most famous spirits. Some stories say she was a real woman who fought the Portuguese in the 1500s.',
lilitu:'Lilitu appears in Mesopotamian texts thousands of years old. Clay figures of the demon Pazuzu were placed in homes to protect mothers from another demon, Lamashtu.',
mummy:'The "curse of the pharaohs" became famous after Lord Carnarvon, who funded the opening of Tutankhamun\'s tomb in 1922, died months later. Newspapers turned the coincidence into a legend.',
adze:'The adze comes from the folklore of the Ewe people of Ghana and Togo, a spirit that travels as a firefly.',
asanbosam:'Asanbosam (or sasabonsam) come from Akan folklore in Ghana, Ivory Coast and Togo. Hunters told of them hanging from trees in the deep forest.',
grootslang:'The grootslang ("big snake") legend comes from the Richtersveld in South Africa. Stories say it lives in the "Wonder Hole", a cave full of diamonds.',
popobawa:'The popobawa was first reported on Pemba Island in the 1960s and caused major panics in Zanzibar in 1995 and 2007, when many people slept outside to avoid it.',
impundulu:'The impundulu or lightning bird comes from Zulu, Xhosa and Pondo traditions. It is said to appear in thunderstorms and to be a witch\'s servant.',
mokele:'Mokele-mbembe ("one who stops the flow of rivers") comes from the Congo Basin. Since the 1900s, expeditions have searched the Likouala swamps for it.',
cwnannwn:'The Cŵn Annwn are the hounds of Annwn, the Welsh otherworld, from the Mabinogion, written down in medieval Wales.',
nokken:'The nøkk is known across Scandinavia and the Germanic world (nix, nixie). Theodor Kittelsen\'s 1904 painting of the Nøkken made it an icon of Norwegian folklore.',
huldra:'The huldra comes from Norwegian and Swedish folklore, a forest woman with a cow\'s tail. She appears in Edvard Grieg\'s music for Peer Gynt.',
mara:'The mara gives English the word "nightmare". She is known across Scandinavia and the Germanic world as a spirit who sits on sleepers\' chests.',
wisp:'Will-o\'-the-wisps appear in folklore all over Europe. Scientists think many sightings were caused by marsh gases catching fire.',
compana:'The Santa Compaña is a Galician legend of a procession of souls. Galicia has a rich tradition of spirits and "meigas" (witches).',
damblanche:'Dames blanches appear across France and Belgium, often seen on bridges and in ravines.',
beannighe:'The bean nighe is the washer at the ford from Scottish Highland folklore, a version of the "washer at the ford" figure also found in Ireland and Brittany.',
vrykolakas:'The vrykolakas is the Greek undead. A French botanist, Joseph Pitton de Tournefort, described a vrykolakas panic on the island of Mykonos in 1701.',
kikimora:'The kikimora comes from Slavic folklore as a house spirit, often said to appear before misfortune.',
domovoi:'The domovoi is the guardian spirit of the Slavic home. When families moved, they would carry embers from the old stove to bring him along.',
leshy:'The leshy is the lord of the forest in Slavic belief. Hunters and herders left offerings to keep him friendly.',
bannik:'The bannik lives in the banya (bathhouse) in Slavic tradition. The banya was seen as a place between worlds, used for births, healing and fortune-telling.',
kallikantzaros:'Kallikantzaroi come from Greek and Balkan folklore. They come up from under the earth for the twelve days of Christmas, when they stop sawing at the World Tree.',
liderc:'The lidérc is a Hungarian spirit that can hatch from the first egg of a black hen kept warm under a person\'s arm.',
jure:'Jure Grando was recorded in 1689 by the writer Johann Weikhard von Valvasor in "The Glory of the Duchy of Carniola", one of Europe\'s first written accounts of a vampire.',
sava:'Sava Savanović is a Serbian legend, written about by Milovan Glišić in 1880. In 2012 the mill where he was said to live collapsed, and the local council made a half-joking public warning.',
gevaudan:'Between 1764 and 1767 a beast killed many people in the Gévaudan region of France. King Louis XV sent hunters, and historians still argue about what the animal was.',
lorelei:'The Lorelei is a real rock on the Rhine where many boats were wrecked. Clemens Brentano wrote her story in 1801, and Heinrich Heine\'s 1824 poem made it famous.',
blackannis:'Black Annis was said to live in a cave in the Dane Hills of Leicester. Folklorists recorded her in the 1700s and 1800s.',
jennyg:'Jenny Greenteeth comes from Lancashire, Cheshire and Shropshire. Parents used her to keep children away from ponds covered in duckweed.',
redcap2:'',baobhansith:'The baobhan sith comes from Scottish Highland folklore, a fairy woman who appears to hunters in green dresses.',
puca:'The púca is an Irish shapeshifter. Some say the last of the harvest left in the fields on 1 November is the "púca\'s share".',
yulecat:'The Yule Cat comes from Iceland, where workers who finished processing the autumn wool were rewarded with new clothes. Those who did not would be eaten by the cat.',
vila:'Vilas are South Slavic fairies, said to live in forests and mountains. They appear in Serbian epic poetry as fierce helpers of heroes.',
nachtkrapp:'The Nachtkrapp is a German bogeyman bird, told to children in Swabia and Austria to make them go to sleep.',
poludnica:'Lady Midday (Południca) comes from Slavic folklore. She punished people who worked in the fields at the hottest hour of the day, a warning against sunstroke.',
vodnik:'The vodník is the Czech water goblin, famous from Karel Jaromír Erben\'s 1853 poem, and Dvořák\'s symphonic poem "The Water Goblin".',
monaciello:'The munaciello is a Neapolitan legend, possibly inspired by the "pozzari", men who maintained Naples\' underground wells and could slip into houses through the shafts.',
charro:'The Charro Negro is told in many parts of Mexico, often as a devil in the elegant clothes of a horseman, who tempts the poor with gold.',
sayona:'La Sayona is a Venezuelan legend about a woman who took revenge on an unfaithful husband, and now haunts men who cheat.',
pishtaco:'Pishtaco legends in the Andes go back to the Spanish conquest, and reflect fears of outsiders who came to take from Indigenous communities.',
cadejo:'El Cadejo is told across Central America. The white dog protects night travellers; the black dog leads them astray.',
curupira:'The curupira is a forest guardian of Tupi-Guarani tradition in Brazil. Its backward feet trick hunters who try to follow it.',
saci:'The saci comes from Tupi-Guarani, African and Portuguese influences in Brazil. Since 2005 Brazil has celebrated "Saci Day" on 31 October.',
boitata:'The boitatá ("fire snake" in Tupi) is one of the oldest Brazilian legends, recorded by the Jesuit José de Anchieta in 1560.',
luzmala:'La Luz Mala is told across Argentina, Uruguay and Paraguay. Some say it marks a buried treasure or a lost soul.',
tunda:'La Tunda comes from the Afro-Colombian and Afro-Ecuadorian communities of the Pacific coast, where she is told to keep children close to home.',
chonchon:'The chonchon comes from the Mapuche people of Chile and Argentina, the head of a sorcerer that flies on its ears.',
soucouyant:'The soucouyant comes from Trinidad and the Eastern Caribbean, with roots in West African and French folklore.',
duppy:'"Duppy" is a word for ghost in Jamaica and the Caribbean, from West African traditions. Silk cotton trees are said to be their homes.',
rougarou:'The rougarou comes from French Louisiana and the "loup-garou" (werewolf) of France, adapted to the bayous by Cajun and Creole communities.',
ogopogo:'Ogopogo comes from Syilx (Okanagan) tradition, where the lake spirit N\'ha-a-itk had to be given offerings before crossing. The name "Ogopogo" came from a 1924 song.',
yara:'Yara-ma-yha-who stories are from Aboriginal Australian traditions of New South Wales, recorded by settlers in the 1800s.',
minmin:'Min Min lights are reported in western Queensland, near the town of Boulia. Scientists have suggested they may be mirages of distant lights.',
oiwa2:'',ubume:'The ubume appears in Japanese records from the 1100s, a mother who died in childbirth. In some stories, a man who holds her baby gains great strength.',
gashadokuro:'The gashadokuro is a modern yokai, created in the 1960s from older legends. It is often pictured using a famous 1844 print by Utagawa Kuniyoshi of a giant skeleton.',
nureonna:'Nure-onna appears in Edo-period scrolls, a sea serpent with a woman\'s head found on the coasts of Kyushu.',
okiku:'The Okiku doll is kept at Mannenji temple in Iwamizawa, Hokkaido. The story says it belonged to a girl named Okiku who died young, and its hair began to grow after her death.',
mulgwishin:'Water ghosts are common in Korean folklore, especially along the coast. Shamans perform rituals (gut) for those who drowned.',
tigeraunt:'The Tiger Aunt (Hóo-kóo-pô) is a classic Taiwanese bedtime story, related to the Chinese tale "Grandaunt Tiger".',
nian2:'',nyaminyami:'Nyami Nyami is the river god of the Tonga people of the Zambezi. When the Kariba Dam was built in the 1950s, floods destroyed parts of the works twice, and many saw it as Nyami Nyami\'s anger.',
kolmanskop:'Kolmanskop was a German diamond-mining town in the Namib Desert, abandoned in the 1950s. Today sand fills its houses, and it is a favourite of photographers.',
flyingdutchman:'The Flying Dutchman legend began among sailors in the 1700s. Richard Wagner\'s 1843 opera made it famous.',
springheel:'Spring-heeled Jack was reported across England from 1837 into the 1900s, a figure who could leap over walls and breathe blue flames.',
lampor2:'',kelpie2:'',chupacabra2:'',hairyhands:'From the 1920s, drivers on the B3212 road across Dartmoor reported invisible hands grabbing their wheels. The road was later rebuilt.',
borley:'Borley Rectory in Essex was investigated by the ghost hunter Harry Price in the 1930s, who called it "the most haunted house in England". It burned down in 1939.',
houska:'Houska Castle, north of Prague, was built in the 1200s in a remote spot with no water source. Legend says it was built to seal a hole to hell.',
highgate:'In 1970 two men claimed to be hunting a vampire in Highgate Cemetery, and a TV report drew crowds of people with stakes and crosses.',
blackaggie:'Black Aggie was a bronze statue in Druid Ridge Cemetery near Baltimore, a copy of a famous memorial. Teenagers dared each other to sit on her lap, and it was moved in 1967.',
stanley2:'',winchester:'Sarah Winchester, widow of the gun maker, kept building her mansion in San Jose from 1886 until her death in 1922. Legend says she was trying to confuse the ghosts of people killed by Winchester rifles.',
matusita:'Casa Matusita is a house in central Lima with many legends, including a story of a dinner party gone terribly wrong.',
boto:'The boto is the pink river dolphin of the Amazon. Legend says it becomes a handsome man at festivals, and a child with an unknown father was sometimes called a "son of the boto".',
iara:'Iara comes from Tupi-Guarani tradition in Brazil, a river siren whose song lures fishermen under the water.',
loira:'Loira do Banheiro is one of Brazil\'s most famous school legends, possibly based on a young woman from the 1800s.',
mulasem:'The headless mule is a Brazilian legend said to be a woman cursed for a relationship with a priest. She gallops on Thursday nights to Friday.',
difunta:'Deolinda Correa is said to have died in the desert of San Juan, Argentina, in the 1840s while following her husband\'s army. Her shrine at Vallecito is visited by hundreds of thousands of people a year.',
papabois:'Papa Bois comes from Trinidad and Tobago, a forest guardian with roots in West African and French Caribbean traditions.',
douen:'Douens come from Trinidad and Tobago. Parents never call their children\'s names out loud at night, in case a douen learns them.',
chickcharney:'The chickcharney comes from Andros Island in the Bahamas. The story says it made Neville Chamberlain\'s sisal farm fail in the 1890s.',
taotaomona:'Taotaomona are ancestral spirits of the Chamorro people of Guam and the Mariana Islands. Asking permission before entering the jungle is a living custom.',
pele:'Pele is the goddess of volcanoes and fire in Hawaiian religion, living in Halemaʻumaʻu crater at Kīlauea. Park rangers receive packages of returned lava rocks every year.',
menehune:'Menehune are small people of Hawaiian tradition, credited with building fishponds and walls like the Alekoko fishpond on Kauaʻi.',
kehua:'Kehua are ghosts in Maori belief. Washing or sprinkling water when leaving an urupā (burial ground) is a common custom.',
teinesa:'Teine sā are spirit women of Samoan belief, like Saumaiafe. Advice to keep hair tied and avoid red at night is still common in Samoa.',
dropbear:'Drop bears are an Australian joke, told to tourists with a straight face. The Australian Museum once published a mock scientific page about them.',
deathworm:'The olgoi-khorkhoi ("large intestine worm") is a Mongolian legend. Several expeditions have searched the Gobi for it.'});

Object.assign(ORIGIN,{
ap:'The ahp is the Cambodian name for the flying-head spirit known as krasue in Thailand. Cambodian villages traditionally protect homes with thorny branches, and the ahp often appears in Khmer horror films.',
akamanto:'Aka Manto ("red cape") is a Japanese school legend that spread from the 1930s onward. Variations say the answer "red" ends in blood and "blue" in being drained pale.',
mohini:'Mohini is one of Sri Lanka\'s best-known ghost stories, often linked to a woman who died on the road with her baby. The name Mohini also belongs to a beautiful form of the god Vishnu in Hindu myth.',
kalanoro:'Kalanoro appear in the folklore of Madagascar as small forest beings with backward feet, sometimes said to live by rivers and in caves.',
dhegdheer:'Dhegdheer ("long ears") is the best-known villain of Somali folk tales, a cannibal woman who lived alone in the bush with her daughter. Somali children grow up hearing her story.',
gwrach:'Gwrach-y-Rhibyn ("hag of the dribble") appears in Welsh folklore as a death omen, similar to the Irish banshee. Folklorist Marie Trevelyan described her in 1909.',
lagahoo:'The lagahoo, also called loup-garou, came to Guyana and Trinidad through French and West African influences. Its coffin and chains make it a uniquely Caribbean werewolf.',
cuco:'El Coco or Cuco is the bogeyman of Spain and Portugal, recorded since the 1600s. The famous lullaby "Duérmete niño, duérmete ya, que viene el Coco y te comerá" is still sung today.',
resmary:'Resurrection Mary is linked to Resurrection Cemetery on Archer Avenue in Chicago. Sightings of the girl in the white dress have been reported since the 1930s.',
chassegalerie:'La Chasse-galerie comes from French Canadian lumber camps. Honoré Beaugrand wrote the famous version in 1891, and the flying canoe appears on the label of a Quebec beer.',
bajang:'The bajang is a Malay familiar spirit, often described in early colonial accounts like Walter Skeat\'s Malay Magic (1900).',
phikrahang:'Phi Krahang is a Thai male ghost, usually said to be a man who practises dark magic. Unlike the krasue, he flies with rice-winnowing baskets.',
nangtakian:'Takian trees (Hopea odorata) are believed to house female spirits in Thailand. Boat builders traditionally made offerings before cutting them.',
nangtani:'Nang Tani is a Thai banana-tree spirit. Banana trees with her ribbons and offerings can still be seen in Thailand.',
malai:'Ma Lai is the Vietnamese name for the flying-head spirit, related to the krasue and penanggal.',
kongkoi:'Phi Kongkoi is known in Laos and northern Thailand. Its name copies its call, and people say it hops on one leg through the forest.',
thaye:'Thaye are part of Burmese ghost lore, said to be the spirits of people who died violently. They are often seen near cemeteries.',
peiktha:'Peik-tha (from the Pali "peta", hungry ghost) are giant hungry ghosts in Burmese Buddhist belief, suffering for greed in past lives.',
jenglot:'Jenglot became famous in Indonesia in the 1990s and 2000s, when "real" jenglots were shown on TV and in exhibitions. Researchers who studied some found them to be made by hand.',
dodomeki:'Dodomeki appears in Toriyama Sekien\'s yokai books of the 1700s. Her name plays on "a hundred eyes", which grew on her arms after she stole money.',
jangsan:'The Jangsan tiger is a modern Korean urban legend from around 2013, about a white beast on Mount Jangsan in Busan that mimics human voices.',
shuigui:'Shui gui (water ghosts) are part of Chinese folk belief. Water ghost stories are also used to warn children away from rivers during Ghost Month.',
aleya:'Aleya are the ghost lights of Bengal\'s marshes, said by fishermen to lead boats astray in the Sundarbans.',
shakchunni:'The shakchunni is a Bengali ghost of a married woman. She is said to wear the white conch-shell bangles (shankha) that married Bengali women traditionally wear.',
ririyaka:'Riri Yaka is one of the demons of Sinhalese folk religion. The thovil ceremony, with masks and drumming, is performed to drive such demons out.',
mahasohona:'Maha Sohona ("great cemetery demon") appears in Sinhalese folklore. One story says he was a giant warrior whose head was replaced with a bear\'s.',
kandufureytha:'Kandu fureytha are sea spirits in Maldivian folklore, part of a rich tradition of spirits tied to the islands and the ocean.',
gechho:'Gechho bhoot are Bengali tree ghosts, one of many kinds of bhoot named in Bengali folk tales and stories by writers like Upendrakishore Ray.',
migoi:'The migoi is Bhutan\'s yeti. The Sakteng Wildlife Sanctuary in eastern Bhutan is sometimes said to have been set up partly to protect it.',
lakhey:'Lakhey are demons in Newar culture of Kathmandu. The Lakhey dance is performed at the Indra Jatra festival every year.',
nasnas:'The nasnas appears in Arabic writings from the Middle Ages, described as half a human being, with one eye, one arm and one leg.',
gulyabani:'The gulyabani is a desert ghoul of Turkish folklore. Hüseyin Rahmi Gürpınar wrote a famous novel called Gulyabani in 1912.',
boughatate:'Boughatate is the Moroccan name for the spirit blamed for sleep paralysis, sometimes said to be a jinn sitting on the sleeper.',
nhang:'The nhang appears in Armenian mythology as a river serpent, mentioned by the historian Movses Khorenatsi in the 400s or later.',
budarya:'Bu Darya stories come from Gulf pearl diving, when crews spent months at sea. Diving songs and stories were part of life on the dhows.',
kishi:'The kishi is a two-faced demon in Angolan folklore, charming from the front with a hyena face behind.',
eloko:'Biloko (plural of eloko) come from the folklore of the Mongo people of the Congo, guarding the forest and its game.',
inkanyamba:'The inkanyamba is a storm serpent of Zulu belief, said to live in the pool below Howick Falls in KwaZulu-Natal.',
mngwa:'The mngwa ("strange one") is a large grey cat reported on the coast of Tanzania. Reports in the 1920s and 30s made it famous.',
nandibear:'The Nandi bear was reported by colonial officials and hunters in Kenya in the early 1900s. Some think it might have been a large hyena.',
jengu:'Miengu (plural) are water spirits honoured by the Sawa peoples of coastal Cameroon, especially during the Ngondo festival in Douala.',
mamecoumba:'Mame Coumba Bang is the protective spirit of the city of Saint-Louis in Senegal. People still pour curdled milk into the river for her.',
kinoly:'Kinoly are undead creatures of Malagasy folklore. Famadihana, the turning of the bones, is a real Malagasy ceremony honouring the dead.',
laume:'Laumės are Lithuanian fairies, linked to the rainbow (laumės juosta, "laumė\'s belt"). They punish people who spin on Thursday evenings.',
kratt:'The kratt is an Estonian treasure-bearer made from hay and old tools. It appears in the 1940s Estonian ballet Kratt and the 2020 film Kratt.',
nakki:'Näkki is the Finnish water spirit. The rhyme "Näkki maalle, minä veteen" ("Näkki on land, me in the water") is still said by children before swimming.',
draugen:'Draugen is the sea ghost of northern Norway, from stories of fishermen lost at sea. The writer Jonas Lie made him famous in the 1890s.',
helhest:'The helhest is a three-legged horse of the dead in Danish folklore. It was said to be buried alive in churchyards to guard them.',
wittewieven:'Witte wieven (white women or wise women) come from the Netherlands, especially Drenthe and Twente, linked to prehistoric burial mounds.',
kludde:'Kludde is a shapeshifter from Flemish folklore, especially around Dendermonde. It often appears as a black dog with chains and blue flames.',
langewapper:'Lange Wapper is the giant of Antwerp. His statue stands in front of the Steen, the old castle by the river Scheldt.',
nachzehrer:'Nachzehrer ("after-devourer") appear in German and Silesian folklore. Archaeologists have found graves where stones or coins were placed in the mouths of the dead.',
vouivre:'The vouivre is a winged serpent of the French Jura, with a gem for an eye. Marcel Aymé wrote a novel about her in 1943.',
lavandieres:'The night washerwomen appear in Breton and French folklore. George Sand wrote about them in Légendes rustiques (1858).',
ankou:'The Ankou is the servant of death in Breton tradition, often shown with a scythe on church carvings. Anatole Le Braz recorded many Ankou stories in 1893.',
janara:'The janara is a witch of Benevento, a city famous in Italian folklore for its witches who gathered under a walnut tree.',
nuberu:'The nuberu is the storm spirit of Asturias. Ringing church bells to drive off storms was a real practice in rural Spain.',
albasty:'Albasty are feared across Kazakhstan, Kyrgyzstan and among Turkic peoples. Iron objects like scissors are still placed near new mothers in some families.',
jeztyrnak:'Jeztyrnak ("copper claws") appear in Kazakh and Kyrgyz fairy tales as witches who drink blood.',
almas:'The almas is a wild man of Mongolian folklore, described by travellers and scientists in the 1900s.',
ajina:'Ajina are spirits in Tajik and Uzbek folk belief, often said to haunt water mills and riverbanks at night.',
shurale:'Shurale is the forest spirit of Tatar folklore, made famous by Gabdulla Tukay\'s 1907 poem. A famous ballet, Shurale, was written in 1945.',
zhalmauyz:'Zhalmauyz kempir is the many-headed witch of Kazakh fairy tales, the great enemy of the hero in many stories.',
menk:'Menk are forest giants in the folklore of the Mansi people of western Siberia.',
bunnyman:'The Bunny Man legend comes from Fairfax County, Virginia. In 1970 two people reported a man in a white suit with an axe. The Colchester Overpass is now called "Bunny Man Bridge".',
popelick:'The Pope Lick trestle in Louisville is a real, dangerous railway bridge. The Goatman story is often told as a warning, as several people have died there.',
flatwoods:'On 12 September 1952, a group in Flatwoods, West Virginia reported a glowing figure after a light fell from the sky. The town now has a museum about it.',
doverdemon:'The Dover Demon was reported by teenagers in Dover, Massachusetts over two nights in April 1977.',
bek:'The black-eyed children legend began with a 1998 online post by journalist Brian Bethel, about an encounter in Abilene, Texas.',
goatman:'Maryland\'s Goatman legend began in the 1970s in Prince George\'s County, with stories of a creature near Lottsford Road.',
sasquatch:'"Sasquatch" comes from the Halkomelem word sásq\'ets. A 1958 newspaper story about tracks in California gave the world the name Bigfoot.',
