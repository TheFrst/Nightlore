/* ===== NIGHTLORE — Tales by Candlelight: original short stories built on the old legends ===== */
const TALES=[
{id:'t_kunti',t:'The Smell of Frangipani',reg:'sea',g:['kuntilanak'],p:[
'My grandmother had one rule for the house in Bogor, and she said it every evening before the call to prayer: if you smell frangipani after dark, and there is no frangipani tree, you do not go outside. You do not open the window. You do not even look at the window.',
'There was no frangipani tree. I checked when I was nine. I walked around the whole garden twice, and there was a mango, a rambutan, a big old banyan by the back wall, and a lot of my grandfather\'s orchids. No frangipani. When I told her, she nodded as if I had confirmed something terrible.',
'I was sixteen the first time I smelled it. It was the rainy season, the power had gone out, and my cousins were playing cards by candlelight in the front room. The smell came in slowly, so sweet that it felt sticky in my throat. My cousin Dewi stopped with a card in her hand. Nobody said anything. My grandmother put out the candle with her fingers.',
'Then we heard the laugh. If you have never heard it, I cannot describe it properly. It was a woman\'s laugh, high and soft, coming from very far away. That is the thing you have to understand. It sounded far away. It sounded like it was coming from the other side of the river.',
'My cousin Agus, who was older and thought he was brave, whispered, "It\'s far. It\'s fine." And my grandmother grabbed his wrist so hard that he cried out, and she said, very quietly, "When she is far, she is close. When she is close, she is far."',
'The laugh came again. It was softer now. Farther away. Almost gone.',
'And something tapped on the window, very gently, three times, with what sounded like a long fingernail.',
'Nobody looked. We sat there in the dark, eight people holding hands, until the call to prayer at dawn, and the smell went away with the light. In the morning, on the outside of the window glass, there were three long scratches, high up, much higher than a person could reach standing on the ground.',
'My grandmother has passed away now. I live in that house. I still have never planted a frangipani tree, and every few years, in the rainy season, I smell one anyway.']},
{id:'t_pocong',t:'Untie the Knot',reg:'sea',g:['pocong'],p:[
'Pak Harun was the caretaker of the cemetery at the edge of our village for thirty-one years, and in all that time, he said, he only made one mistake.',
'It was the burial of an old man nobody liked very much. It rained so hard that the grave kept filling with water, and the men were in a hurry, and the imam was in a hurry, and when they lowered the body in its white shroud, nobody remembered to loosen the knots at the head and feet. Pak Harun remembered that night, lying in bed. He told himself he would fix it in the morning. You cannot open a grave in the morning. You cannot open a grave at all.',
'Forty days later, he was locking the cemetery gate when he heard it. Thump. A pause. Thump. Something heavy, landing on wet ground. He turned around with his torch.',
'It was standing between the graves, about twenty metres away, wrapped in white from head to foot, tied at the top like a sweet in a wrapper. The cloth over its face was grey and stained, and there were two dark shapes where the eyes were. It did not have arms, or rather, its arms were wrapped inside the shroud. It could not walk. Its feet were tied together.',
'Thump. It came closer.',
'Everyone in the village tells children to run from a pocong. But Pak Harun had been a caretaker for a long time, and he understood something that the children did not. The pocong was not chasing him. It was asking him. It was asking the only person who knew what had been forgotten.',
'He said that walking toward it was the hardest thing he ever did in his life. The smell was earth and camphor and something sweeter underneath. Up close, he could hear it breathing, a dry whistle through the cloth. He reached out with shaking hands, found the knot at the top of its head, and pulled it loose.',
'The shroud collapsed like a sheet with nobody inside it. It lay on the wet grass, empty, and Pak Harun sat down next to it and cried for an hour.',
'He never forgot a knot again. When he retired, he made the new caretaker promise, three times, with his hand on the Qur\'an. "The dead are patient," he told him. "But not forever."']},
{id:'t_tuyul',t:'The Neighbour\'s Good Luck',reg:'sea',g:['tuyul'],p:[
'Everyone noticed when Bu Sri got rich. In our street, you notice everything: whose motorbike is new, whose son is getting married, whose mother-in-law is visiting again. Bu Sri had sold fried tofu from a cart for twenty years, and then one spring she bought a car. Then a second floor on her house. Then gold bracelets, three on each arm.',
'At the same time, the rest of us started losing money. Small amounts. Ten thousand rupiah from a wallet left on the table. Coins from the jar by the door. My mother counted the money in her purse every night, and every morning it was a little less.',
'"Tuyul," said my uncle, and laughed, because he was a modern man who worked in an office in Jakarta. But that night he left his wallet on the table with a crab tied up next to it, because his own mother had told him that tuyul are children, and children get distracted by crabs.',
'In the morning, the money was all there. And the crab was gone. Just the string, neatly untied.',
'My uncle stopped laughing. He said nothing all day. In the evening, he went to the market and bought a bag of marbles, the cheap glass ones, and he scattered them all over the floor of the front room. "They have to count them," he said. "They\'re children. They can\'t help it."',
'I woke up at two in the morning to a very small sound. Click. Click. Click. Glass marbles being rolled across the tiles, one by one, slowly, carefully. I opened my bedroom door a crack.',
'There was nobody there. Just the marbles moving by themselves, gathered into neat lines of ten. And a soft little voice, a child\'s voice, counting in a whisper. "Seratus dua puluh satu. Seratus dua puluh dua..."',
'It was still counting at dawn. When the sun came up, it stopped, and there were small wet footprints going out under the door, toward Bu Sri\'s house.',
'Bu Sri sold her car the next year. People say the tuyul stopped bringing her money, or maybe it got tired of counting marbles. I don\'t know. I still keep a bag of them by the door.']},
{id:'t_manananggal',t:'Half of Her',reg:'sea',g:['manananggal'],p:[
'In my lola\'s province in Capiz, there was a woman everyone called Aling Rosa, who sold the best puto in the market and was the kindest person in the barangay. She remembered every child\'s name. She gave sweets to anyone who looked sad. She was very beautiful for her age, and she never seemed to get older.',
'The week my auntie was pregnant with my cousin, Aling Rosa came to the house every day with food. Rice cakes, soup, fruit. She sat with my auntie and held her hand and asked how the baby was. She always put her hand on my auntie\'s belly when she said goodbye.',
'My lola did not like it. She said nothing, but every evening after Aling Rosa left, she went around the house and hung bunches of garlic in the windows, and put a little dish of salt on every windowsill, and a sharp bolo knife under my auntie\'s bed.',
'On the ninth night, my lola woke me up at midnight and put her finger to her lips. She took my hand and led me out of the house, very quietly, through the banana trees, to the back of Aling Rosa\'s house. There was a light on in the kitchen. We crouched in the dark and looked through the gap in the bamboo wall.',
'Aling Rosa was standing in the middle of her kitchen, rubbing oil on her skin from a coconut shell. Then she arched her back, and made a sound like tearing cloth, and the top half of her body lifted away from the bottom half. Her legs stayed standing there, on the floor, with nothing on top of them. The top half of her grew huge leathery wings, like a bat\'s, out of her shoulders. Her guts hung down beneath her, glistening. She flew out through the window into the night, toward our house.',
'I would have screamed, but my lola had her hand over my mouth. She had a bag with her. Inside the bag was salt, and ash, and crushed garlic. She went into the kitchen, walked right up to the legs that were still standing there, and she poured it all over the place where the top half should have been.',
'We ran back home. We heard her coming back before dawn, the sound of wings beating, then a terrible scream from her house, a scream that went on and on, and then stopped. In the morning Aling Rosa did not come to the market. She never came again. Nobody ever found her. Her house was empty.',
'My cousin was born healthy a month later. My lola never talked about that night again, except once, when I was grown up and asked her how she knew. She said, "A kind woman who never gets old. A kind woman who always touches the baby. Some kindness is just hunger, wearing a nice face."']},
{id:'t_kappa',t:'Bow Deeply',reg:'ea',g:['kappa'],p:[
'Next to my grandparents\' house in the countryside outside Tono, in Iwate, there is a little river with a little shrine beside it, and a sign that says, in hand-painted letters: BEWARE OF KAPPA.',
'Tourists take photos of the sign and laugh. Tono is famous for its kappa. The souvenir shops sell green cucumber-flavoured sweets and little kappa dolls with dishes on their heads. There is even a man in town who gives out kappa-catching licences for 220 yen. Everyone thinks it is cute.',
'My grandfather did not think it was cute. When I was a child he took me to the river every summer and made me practise bowing. Deeply. All the way down, so that my head was lower than my waist. "If you meet one," he said, "bow like that. A kappa has a dish of water on the top of its head. That is where its strength is. It is very polite. If you bow, it must bow back. And when it bows, the water spills out, and it becomes weak."',
'I was nine the summer I went down to the river alone to catch frogs. It was very hot. The cicadas were screaming. I was crouching on a rock at the edge of the water, looking down, when the water in front of me went still. Very still, like glass. And then a head rose out of it.',
'It was the size of a child\'s head. Green and scaly, with a beak like a turtle, and a ring of wet black hair around a flat, round dish on top that was full of water, shining in the sun. Its eyes were yellow. Its hands, coming up out of the water onto the rock, were webbed. It smelled like a fish market. It was looking at me the way a cat looks at a bird.',
'It reached out one webbed hand toward my ankle, and I remembered. I stood up straight, and I put my hands on my knees, and I bowed to it as deeply as I possibly could. All the way down. I held it there, staring at my own feet, counting.',
'When I lifted my head, the kappa was bowing back. Very deeply. Very politely. And water was spilling out of the dish on its head, running down its face, over its beak, back into the river. It straightened up slowly. It looked confused, and tired, and much smaller. It slid back under the water without a sound.',
'I ran home and told my grandfather. He did not laugh. He went to the fridge and took out three cucumbers, and wrote my name on each of them with a marker pen, and walked down to the river and threw them in. "Now it knows your name," he said. "Now it will not take you. It owes you for the bow, and you have paid it for the fright." I still go back every summer. I still take cucumbers.']},
{id:'t_kelpie',t:'The Horse by the Loch',reg:'eu',g:['kelpie'],p:[
'My grandfather kept sheep on the hills above a loch in the Highlands, and he said that in the eighty years he lived there, he saw the each-uisge three times, and two of those times, it was trying to kill someone.',
'The first time, he was a boy. A beautiful grey horse came up out of the mist by the water\'s edge. It had no saddle and no bridle. Its mane dripped. It walked right up to him and lowered its head, and he felt a terrible need to climb onto its back, the way you feel the need to look over the edge of a cliff.',
'His father saw it from the top of the field and came running down, roaring and throwing stones, and the horse turned and walked back into the loch, and went under, and did not come up. "If you had touched it," said his father, "your hand would have stuck to it like glue. And it would have run into the water with you, and drowned you, and eaten you, all but your liver, which would wash up on the shore in the morning."',
'The second time was in 1951. A young man from Glasgow, a hiker, was staying at the inn. He went out walking and saw a grey pony grazing by the loch, and thought it would be funny to take a photo of himself sitting on it. My grandfather saw it from the hill and shouted, but he was too far away.',
'He said the young man climbed on, laughing, and the horse stood very still for a moment. Then the young man stopped laughing. He tried to get off. He could not. His hands were stuck to the mane, and his legs were stuck to its sides, and the grey horse turned toward the water, and began to walk, and then to run.',
'It went into the loch at a gallop, and the young man went with it, screaming, and they both went under, and the water closed over them, and that was all. They searched the loch for a week. They never found anything. Except, on the eighth day, on the shingle at the edge of the water, they found something small and dark, and they did not tell his mother what it was.',
'The third time, my grandfather was very old, and the horse came up out of the mist in the evening and stood at the gate of his field and looked at him. He said he understood that it had come for him, at last. He went inside and got a bridle, an old iron bridle that had been his father\'s, and went out to the gate.',
'The horse saw the bridle, and screamed, and fled. Because everyone knows that if you can get a bridle on the each-uisge, it must work for you for the rest of its life. My grandfather lived another six years after that. He kept the iron bridle hanging by the door. When he died, we buried it with him.']},
{id:'t_albasty',t:'The Woman in the Yurt',reg:'ca',g:['albasty'],p:[
'My mother was born in a yurt in the Kazakh steppe, in 1961, in the middle of winter. My grandmother told me that on the night she was born, every woman in the camp sat around her bed until morning, and none of them was allowed to sleep, and none of them was allowed to leave her alone for even a moment.',
'"Because of the albasty," my grandmother said. "She comes for women who have just given birth, and for their babies. She is a woman with long yellow hair, and breasts that hang down over her shoulders, and feet that point backwards. She comes in the night when the new mother is alone, and she steals her liver and takes it to the river to wash it. If she washes it before anyone catches her, the mother dies."',
'Around three in the morning, my grandmother said, all the women were very tired. The fire had burned low. The baby was sleeping. And one by one, despite everything, the women began to doze. My grandmother was the last to fall asleep. She said it was like being pushed under water.',
'She woke up because the yurt was very cold. The fire was out. All the other women were asleep in a circle, breathing slowly, as if they had been drugged. And standing over her bed, looking down at her, was a woman she had never seen before. Tall. With long, dirty yellow hair down to the floor. Her feet, on the felt rug, were turned around backwards.',
'The woman reached down toward her with a hand that had very long nails. My grandmother could not move. She could not shout. She could only watch. And then, from outside the yurt, her husband\'s horse screamed and kicked the wall.',
'The albasty jerked back. The other women woke up all at once, as if the scream had broken a spell. They lit a lamp. There was nobody standing by the bed. But the felt door of the yurt was flapping open in the wind, and on the snow outside, there was a line of footprints, small and bare, with the toes pointing back toward the yurt, leading away toward the frozen river.',
'My grandfather came in with his whip, and cracked it over my grandmother\'s bed three times, and laid it across the doorway, and put a knife under the baby\'s pillow, and nobody slept again until the sun came up.',
'My mother has her own children now. All of us were born in hospitals in Almaty, in nice modern rooms. But on the night each of us was born, my grandmother came to the hospital, and sat by my mother\'s bed all night with her husband\'s old whip across her knees, and would not let anyone turn off the lights.']},
{id:'t_kuchisake',t:'Am I Pretty?',reg:'ea',g:['kuchisake'],p:[
'In 1979, my mother was eleven years old and living in Gifu, and she did not walk home from school alone for three months.',
'Nobody did. The whole town, and then, it seemed, the whole of Japan, was talking about the woman in the mask. She stood on corners at dusk, wearing a long coat and a white surgical mask, and she stopped children on their way home. She asked them one question. "Watashi, kirei?" Am I pretty?',
'If you said no, she killed you with a pair of scissors. If you said yes, she pulled down the mask. Her mouth was cut from ear to ear, a red grin that went all the way back to her jaw. And she asked again: "Kore demo?" Even now?',
'Schools sent children home in groups. Teachers walked with them. Police patrolled. My mother says that every woman wearing a mask, and in Japan, many women wore masks when they had a cold, became something to cross the street to avoid.',
'And then my mother\'s group was delayed, and she walked the last part of the way alone, and a woman in a long coat was standing under the street light at the corner by the rice shop.',
'My mother did what every child in Japan had been taught to do that spring. When the woman asked, "Am I pretty?" she did not say yes and she did not say no. She said, "You\'re average." And the woman stood very still, the way a person stands when they are trying to understand a word in a foreign language.',
'My mother walked past her. She did not run, because you are not supposed to run. She walked all the way home, and closed the door, and then she ran upstairs and hid under her futon until her father came home.',
'She says that when she looked back, just once, from the corner, the woman was still standing under the light. Her mask was down around her chin. And she was smiling at my mother. Ear to ear.',
'My mother is sixty now. She is a practical woman, a pharmacist. She does not believe in ghosts. But she has never in her life worn a surgical mask, not even during the pandemic, and when I asked her why, she just said, "I don\'t like how it looks from the outside."']},
{id:'t_hanako',t:'The Third Stall',reg:'ea',g:['hanako'],p:[
'Every school in Japan has a Hanako-san, and every child knows the rules. You go to the girls\' bathroom on the third floor. You knock three times on the third stall. You say, "Hanako-san, are you there?"',
'At our school, the bathroom on the third floor was closed for repairs for my whole first year. That made it worse. Everyone knew why it was closed, even though the teachers said it was plumbing. Plumbing. In a bathroom that nobody used.',
'Yuki and I went on the last day before summer break. It was hot, and the cicadas were screaming outside, and the corridor on the third floor smelled of floor wax and dust. The bathroom door was taped shut, but the tape was old and came off easily.',
'Inside, it was cooler. All the stall doors were open except one. The third. It was closed. Yuki said, "Maybe someone\'s in there," and then we both laughed, too loudly, because of course nobody was in there.',
'Yuki knocked. Once. Twice. Three times. "Hanako-san," she said, in a silly voice, "are you there?"',
'Nothing. The cicadas. A tap dripping somewhere. Yuki shrugged and turned to me, and opened her mouth to say something, and behind her, from inside the third stall, a small voice said, "Hai." Yes.',
'We ran. We ran all the way down three flights of stairs and out of the school gate and halfway to the station before we stopped. We never told anyone. Yuki moved to Osaka the next year.',
'But I went back. Years later, when I became a teacher, I was given a job at the same school. On my first day, I went up to the third floor. The bathroom had been reopened years ago. It was bright and clean and new. Girls were washing their hands and laughing.',
'The third stall had a sign on it. OUT OF ORDER. I asked the caretaker how long it had been out of order. He thought about it. "Since before I started," he said. "We fix it. It breaks again." And then, more quietly: "Don\'t knock on it, sensei. Please."']},
{id:'t_gumiho',t:'The Hundredth Liver',reg:'ea',g:['gumiho'],p:[
'In the mountains of Gangwon, there was a woodcutter\'s son who married a woman he met on the road. She was so beautiful that people in the village stopped working to watch her walk to the well, and she was kind, and she was clever, and she laughed at his terrible jokes. He could not believe his luck.',
'His mother could not believe it either. She watched her new daughter-in-law very carefully. She noticed that the girl never ate meat at the table, but that she was never hungry. She noticed that the village dogs, who barked at everyone, went silent and crawled under the houses when she walked past. And she noticed that, in the year since the wedding, young men had started to go missing from the villages along the mountain road. Ninety-nine of them, people said, though nobody had really counted.',
'One night, the old woman pretended to sleep and watched through a crack in the paper door. At midnight her son\'s wife got up, very quietly, and went out into the yard. In the moonlight, she knelt and touched her forehead to the ground, and her shadow on the wall behind her grew nine long tails.',
'The old woman knew the story every Korean grandmother knows. A fox that lives a thousand years becomes a gumiho. A gumiho that eats one hundred human livers becomes human, forever. And a gumiho who is seen in her true form before the hundredth will stay a fox forever.',
'The old woman could have opened the door. She could have shouted. One look from a human, at the wrong moment, would have ended it.',
'Instead she lay awake until dawn, thinking about her son, about how happy he had been, about the ninety-nine young men. Then, in the morning, she went into the kitchen and found her daughter-in-law making breakfast, humming. She sat down at the table.',
'"I saw you," she said.',
'The girl stopped humming. She put down the knife. For a long moment, neither of them said anything. Then the girl said, "Thank you for telling me before your son," and she walked out of the house, and up into the mountain, and did not come back.',
'The woodcutter\'s son waited for her for the rest of his life. On some nights, he said, a white fox came and sat at the edge of the forest and watched the house until morning. It never came closer. It had nine tails.']},
{id:'t_jiangshi',t:'Hold Your Breath',reg:'ea',g:['jiangshi'],p:[
'My great-grandfather was a corpse walker in Hunan, which was a real job, though nobody believes me when I tell them. When a man died far from home, his family paid a corpse walker to bring the body back to be buried with his ancestors. They travelled at night, on back roads, and they rang a bell to warn people to stay indoors.',
'The bodies hopped. That is what the villagers said, anyway. In the dark, with the bodies tied upright to long bamboo poles carried on two men\'s shoulders, they bounced as the men walked, and from a distance, by moonlight, it looked like a line of stiff dead men in long robes, hopping down the road with their arms out.',
'My great-grandfather said that was the trick of it. That was all it was. Bamboo poles and moonlight.',
'Except once.',
'They were crossing a pass in winter with three bodies, and they stopped for the day at an inn where the innkeeper would not let the dead inside, so they leaned them against the wall of the stable, each with a yellow paper talisman stuck to its forehead to keep it still. In the night, the wind came up. In the morning, one talisman was gone.',
'And one body was gone.',
'They found it two days later in the next village. A man had been found dead in his bed, with no mark on him, and his face blue and his mouth open as if all the breath had been sucked out of him. And in the corner of the room, stiff and upright, facing the wall, was the body from the stable, with its arms held straight out in front of it.',
'My great-grandfather put a new talisman on its forehead. He said that when he did it, he held his breath the whole time, because everyone knows a jiangshi finds you by your breath, and when he finally let it out, outside, in the cold, he looked back through the doorway and saw the body\'s head turn toward the sound.',
'He gave up the job after that. He became a tailor. But he never in his life slept without a bowl of sticky rice beside his bed, and when he died, he made the family promise to bury him close to home, so nobody would ever have to carry him.']},
{id:'t_chudail',t:'Feet That Face Backwards',reg:'sa',g:['chudail'],p:[
'The road between our village and the town in Rajasthan is eleven kilometres long, and in the old days, before the bus, men walked it after dark when they had been drinking in town and had to be home for the morning.',
'My grandfather was one of them. He used to tell this story at weddings, when he had also been drinking, and my grandmother would leave the room.',
'He said it was the night of a new moon. He was halfway home, past the dry well, when he saw a woman ahead of him on the road. She was walking slowly, in a red sari, with her long hair down her back. She had anklets that rang with every step. He said she was the most beautiful walk he had ever seen, and he did not even need to see her face to know it.',
'She stopped and looked back at him over her shoulder. She smiled. And she walked off the road, into the fields, toward the old banyan tree, and he followed.',
'He said he followed her for a long time, through the millet, getting no closer, the anklets ringing. He said he did not think about anything at all. And then she walked across a patch of soft sand by the irrigation ditch, and the moonlight, what little there was, fell on her footprints.',
'Her toes pointed backwards. Every print. Her heels pointed the way she was going. And he understood, in one cold second, that she had not been walking away from him at all. She had been walking toward him, the whole time, backwards, with her face turned around over her shoulder, smiling.',
'He ran. He said he did not look back once, and he ran the whole five kilometres home and fell through the door and could not speak until morning.',
'And then, at every wedding, he would lift his glass and laugh and say, "And that is why I married your grandmother, who has nice normal feet!" And everyone would laugh, and my grandmother, in the other room, would bang a pot very loudly.',
'Years later, after he died, she told me the end he never told. That he did not come home alone that night. That when he fell through the door, she saw, out on the road behind him, standing very still in a red sari, a woman. Facing the house. Or facing away from it. In the dark, she said, it was impossible to tell.']},
{id:'t_bhangarh',t:'After Sunset',reg:'sa',g:['bhangarh'],p:[
'The sign at the gate of Bhangarh Fort, put there by the Archaeological Survey of India, says that entering the area before sunrise and after sunset is strictly prohibited. It is a real sign. You can see it. Tourists take selfies with it.',
'We were three students from Delhi, and we had seen all the videos, and we decided we would be the ones to stay. We hid in the old market street, among the broken walls, while the guards blew their whistles and the last visitors left. We heard the gate close. The sun went down behind the hills, very fast, the way it does in the desert.',
'At first it was just an empty ruin, which is spooky enough. Monkeys moved on the walls. An owl. The temples were black shapes against a sky full of stars. Rahul filmed everything on his phone, narrating in a whisper like a television presenter.',
'Around ten o\'clock, Priya said she could hear music. We all listened. It was faint, from the direction of the palace at the top of the hill. Bells, and a drum, and a woman singing. We told ourselves it was a wedding in one of the villages. We walked toward it anyway.',
'The closer we got to the palace, the louder it got, and the more wrong it sounded. It was not a song. It was the same three notes, over and over, too slowly, like a recording running down. And under it, a sound like many people talking at once, in a language we did not know, very quietly, all around us.',
'Rahul stopped filming. He said his phone had turned itself off. Mine too. Priya\'s too. All at full battery.',
'We left. We walked down to the gate in the dark, holding hands, and the voices followed us all the way down the hill, never louder, never quieter, always just behind us. At the gate, we climbed the wall. The guard was asleep in his chair. He woke up when we dropped down beside him, and he looked at us, and he did not shout or ask any questions. He just put his hand on his heart and said, "Thank God. Three came out."',
'We asked him what he meant. He told us that some nights, people go in after dark. Some nights, they come out. On the bus back to Delhi, Rahul turned his phone on and found the video. Everything until ten o\'clock was fine. After that, there was forty minutes of footage none of us remembered taking. All of it was of the three of us, from behind, walking down the hill, filmed from about two metres away.']},
{id:'t_ghoul',t:'The Last Caravan Stop',reg:'me',g:['ghoul'],p:[
'In the old days, said the man who ran the tea stall at the edge of the desert, there were caravanserais every thirty kilometres along the road, and everyone knew which ones not to stop at.',
'He was very old, and the tea was very sweet, and the tourists in their jeeps did not usually stay to listen. But I had missed the bus, and the next one was in the morning, so I listened.',
'There was a caravanserai, he said, two days east, built of yellow stone around a deep well. A merchant came to it once with his son, very late, after a sandstorm had separated them from their caravan. There was nobody else there, which was strange. But there was a fire burning in the courtyard, and a pot of stew on the fire, and an old woman stirring it.',
'She welcomed them. She fed them. She asked them many questions about the people in their caravan: their names, how many camels, which way they were travelling. The merchant was tired and grateful and answered them all.',
'The son was not tired. The son was watching the old woman\'s feet, which were hidden under her long dress, and the way she never stepped into the light of the fire. And he noticed, as she leaned over the pot, that her shadow on the wall had the long, narrow head of a hyena.',
'In the night, the son woke his father. "We are leaving," he said. "Now." The merchant did not want to go. The son made him. They took their camels and went out into the dark, and at dawn they caught up with their caravan, and the merchant told everyone about the kind old woman at the empty caravanserai, and the son said nothing at all.',
'Three days later, a man rode into their camp at night. He said he was a traveller from the west. He knew everyone\'s names. He asked for the merchant by name, and the son, who had been watching, saw that the stranger\'s shadow on the side of the tent had the long, narrow head of a hyena.',
'The old man stopped there and poured more tea. I asked him what happened next. He said, "The boy threw sand in its face and called it by its true name, and it ran into the desert screaming." I asked him how the boy knew its true name.',
'He smiled at me. He had very long teeth for such an old man. "Because I told him," he said. "Drink your tea."']},
{id:'t_jinn',t:'Ask Permission',reg:'me',g:['jinn'],p:[
'My aunt in Cairo was very strict about water. You do not pour hot water down a drain without saying "Bismillah" first, she said, and better, you say "Excuse me" as well, because you do not know who is living down there.',
'We laughed at her, my brother and I. We were teenagers from London, staying for the summer. She was a chemistry teacher, which made it funnier. "You believe in germs, Auntie," my brother said, "and you also believe in jinn in the plumbing?"',
'"I believe in both," she said, "because I have seen both." And she would not say anything more.',
'On the last night of our visit, she went out to a wedding and left us alone in the flat. My brother made tea. He boiled the kettle, and then, looking straight at me with a big grin, he poured the whole thing down the kitchen sink and said loudly, in English, "Sorry, nobody!"',
'The pipes knocked. It was an old building, and the pipes knocked all the time, so we laughed. They knocked again, louder, three times. Then the tap turned on, all by itself, full force, with nobody touching it.',
'My brother turned it off. It turned on again. He turned it off and held it, and I saw the muscles in his arm straining as something turned it on against his hand.',
'All the lights in the flat went off. In the dark, from inside the sink, there was a sound like someone breathing out through a straw. A long, hot breath that smelled of burnt sugar. And a voice, not in English and not quite in Arabic, said something very close to my brother\'s ear.',
'He never told me what it said. When my aunt came home, she found us sitting on the stairs outside the flat. She went in and turned on the lights, and went to the sink, and leaned over it, and spoke to it quietly in Arabic for a long time, very politely, the way you would apologise to an old neighbour. Then she came out and said it was all right now.',
'My brother is a doctor now. He believes in germs. And every time he pours anything down a sink, anywhere in the world, he says "Excuse me" under his breath first.']},
{id:'t_tokoloshe',t:'Bricks Under the Bed',reg:'af',g:['tokoloshe'],p:[
'My gogo\'s bed stood on bricks. Four bricks under each leg, so the mattress was so high that she needed a little wooden stool to climb into it. When I was small, I thought this was the funniest thing in the world, my tiny grandmother climbing into her bed like a mountain.',
'"It is for the tokoloshe," she told me. "He is small. He cannot climb. If your bed is high enough, he cannot reach you."',
'I asked her what the tokoloshe did if he did reach you. She thought about it, and then said, "Have you ever woken up with a bruise and you don\'t know where it came from?" I had. Everyone has. "That is him," she said. "That is the little one. Pinching. Checking if you are ready."',
'When I was twelve, my parents moved us to Johannesburg, to a flat with a new bed and no bricks. I forgot about the tokoloshe. Or I thought I did.',
'In my first year at university, I was living alone for the first time. I started waking up with bruises. Small ones, on my ankles and the backs of my legs. Little round marks in pairs, like fingers. I thought it was my bed. I thought I was kicking the frame in my sleep.',
'Then one night I woke up at three in the morning, completely awake, with the feeling that someone was in the room. I did not move. I listened. And from under the bed, I heard breathing. Small, quick breathing, like a child who has been running. And a very small hand, cold and leathery, closed around my ankle where it hung over the edge of the mattress.',
'I pulled my foot up so fast I kicked the wall. I turned on every light. There was nothing under the bed. Nothing at all, except dust, and, in the dust, a lot of very small footprints, round and wide, with long toes.',
'I went to the hardware shop the next morning and bought sixteen bricks. The man at the counter did not ask what they were for. He just helped me carry them to the car, and when I thanked him, he said, "My mother uses twelve. Sixteen is better."',
'My bed is very high now. I need a stool to get into it. I have not had a bruise in years. But sometimes, at three in the morning, I hear a small sound from under the bed, like someone very short standing on tiptoe, and reaching up, and not quite reaching.']},
{id:'t_mamiwata',t:'The Woman on the Beach at Lagos',reg:'af',g:['mamiwata'],p:[
'Every fisherman at Bar Beach knows not to take anything from the sand that you didn\'t bring, and every fisherman has a cousin who did.',
'My cousin was Tunde. He was nineteen and thought he knew everything. One morning, very early, he went down to the water alone and came back with a comb. It was beautiful, gold-coloured, shaped like a fish, and he showed it to everybody. "Somebody\'s lost it," he said. "Rich lady. I\'ll sell it."',
'My uncle went very quiet. He said, "Take it back. Put it exactly where you found it. Today."',
'Tunde laughed. He said he would sell it at the market on Saturday. He put it under his pillow that night.',
'He told me what happened next himself, much later, so I believe him. He said he woke up to the sound of the sea, which was strange, because our house was a long way from the beach. The sound was in his room. He could smell salt water. His floor was wet. And at the foot of his bed stood a woman.',
'She was taller than any woman he had ever seen, and dark and beautiful, with long hair down to her waist that was dripping on the floor. Around her shoulders, very slowly, moved a snake as thick as his arm. She did not say anything. She held out her hand.',
'Tunde gave her the comb. He said he did not decide to. His hand just did it. She took it and smiled, and the smile was the most beautiful and most frightening thing he ever saw, because it was the smile of someone who was choosing whether to forgive him.',
'Then she was gone, and the sound of the sea was gone, but his floor was still wet, and there was sand in his bed, and in his hand, where the comb had been, there was a single silver fish scale, bigger than a coin.',
'Tunde is a fisherman now. A very successful one. People say he has never had a bad catch in twenty years. He wears the scale on a string around his neck, and every year, on the same night, he goes down to the beach alone and leaves a mirror and a bottle of perfume at the edge of the water, and in the morning they are always gone.']},
{id:'t_banshee',t:'Three Nights of Crying',reg:'eu',g:['banshee'],p:[
'My grandmother was an O\'Brien, and the O\'Briens have a banshee. Not every family does. She only follows the old families, the ones whose names start with O or Mac. My grandmother was very proud of it, in the way that some people are proud of having a duke in the family.',
'"She cried for my father," she told me. "Three nights before. And she cried for my brother in the war, even though he was in France and we were in Clare. She knows. She always knows."',
'My grandmother lived to ninety-four. In the last week of her life, she was in a hospital in Limerick, and I sat with her in the evenings. She was very calm. On the fourth night, she held my hand and said, "Listen."',
'I listened. I heard the hospital: machines beeping, a trolley in the corridor, someone laughing at the nurses\' station. Nothing else. I told her so.',
'"Not yet," she said, and smiled. "But soon."',
'The next night, at about two in the morning, I was half asleep in the chair when I heard it. It came from outside the window, from the car park, or from the fields beyond the car park. It was a woman, crying. Not sobbing. Keening. A long, rising, falling wail, so full of sorrow that I felt my eyes fill with tears before I even understood what I was hearing.',
'I went to the window. The car park was empty, lit orange by the street lights. Beyond it, in the dark field, I thought I saw something pale. Long white hair, maybe. A grey cloak. It was very far away. The crying went on and on.',
'Behind me, my grandmother laughed, very softly, like a girl. "There she is," she said. "Hello, love. I\'m nearly ready."',
'She cried for three nights. Nobody else on the ward heard her, the nurses said. On the third night, my grandmother died at four in the morning, very peacefully, holding my hand. And at four in the morning the crying outside stopped, all at once, and in the silence that followed, I heard the sound of someone walking away across the wet grass.']},
{id:'t_krampus',t:'The Fifth of December',reg:'eu',g:['krampus'],p:[
'In the village in Tyrol where my father grew up, Krampusnacht was the best night of the year, and the most terrifying, and my father said that was the whole point.',
'Every fifth of December, the young men of the village dressed as Krampus: carved wooden masks with horns and fangs, sheepskin suits, cowbells on their belts and bundles of birch sticks in their hands. They ran through the streets in the dark, ringing their bells and roaring and swiping at people\'s legs with the sticks. Saint Nicholas walked ahead of them handing out sweets. Krampus came behind, for the children who had been bad.',
'My father counted the Krampuses every year. There were always twelve, because there were twelve masks in the village, carved by his great-grandfather and passed down. One year, when he was ten, he counted thirteen.',
'The thirteenth was taller than the others. Its mask was older. The others had painted faces, red and black, but this one was plain dark wood, so old it was almost black, with real goat horns. It did not roar like the others. It did not ring its bells. It just walked, slowly, at the back, and its head turned to look at every child it passed.',
'My father said he looked at it, and it looked at him, and he knew that it knew every single bad thing he had done all year. He thought of the money he had taken from his mother\'s purse. He thought of the dog he had kicked. He thought of the lie he had told about his brother.',
'It stopped in front of him. Up close, he could smell it: wet fur, smoke, and something like rotten apples. It leaned down. Through the eyeholes of the mask, there was nothing. Not eyes. Not darkness. Just more of the mask, wood all the way through.',
'Then Saint Nicholas, the baker in his bishop\'s robes and fake beard, put his hand on my father\'s head and said loudly, "This one has been good." And the thirteenth Krampus stood up straight, and looked at the baker for a long moment, and walked away into the snow.',
'The next day, all twelve of the young men swore they had seen only twelve. My father told his mother about the money, and his brother about the lie. He never kicked a dog again. And every year after that, he counted. He said that most years there were twelve. He said that some years, there were thirteen, and that those years, the baker always walked a little closer to the children.']},
{id:'t_blackshuck',t:'The Coast Road',reg:'eu',g:['blackshuck'],p:[
'I was driving home along the coast road in Norfolk, late, after my shift at the hospital in Cromer. The road is narrow there, with hedges on both sides and the sea on your left behind the dunes. There are no street lights. You drive slowly.',
'At first I thought it was a deer. Something big and dark crossed the road in front of me, right at the edge of my headlights, and stopped on the verge. I slowed down. And as I passed it, my lights caught its eyes, and they did not shine back green or yellow the way an animal\'s eyes do. They were red. Not reflecting red. Glowing red, from the inside, like two coals.',
'It was a dog. A black dog, as big as a calf, with a shaggy coat that dripped as if it had come out of the sea. It watched me drive past. Then, in my mirror, I saw it start to trot after the car.',
'I sped up. Forty. Fifty. On that road, that\'s far too fast. In the mirror, the red eyes were still there, keeping pace, never closer and never further, about twenty metres behind me.',
'I have lived in Norfolk all my life. I know the stories. Old Shuck, the black dog of the east coast, who runs along the lanes at night. My nan used to say if you see him, you\'ll be dead within the year. My mum used to say the opposite: that he guards women walking home alone, and that if you see him, he\'s seeing you home.',
'I didn\'t know which story was true. I drove the last six miles with my heart pounding and the red eyes in my mirror. When I turned into my village, they stopped, at the edge of the last streetlight, and watched me pull into my drive. Then they were gone.',
'In the morning, I heard on the local news that there had been a crash on the coast road the night before, about two miles from where I first saw the dog. A lorry had come round a bend on the wrong side of the road. It hit the hedge where it would have hit me, if I had been driving at my usual time, and my usual slow speed.',
'That was nine years ago. I\'m still alive. I think my mum was right. But I\'ve never driven the coast road at night again, and on the anniversary every year, I leave a bone at the edge of the last streetlight. In the morning, it\'s always gone.']},
{id:'t_baba',t:'Ask Nicely',reg:'eu',g:['babayaga'],p:[
'When I was a little girl in Siberia, my grandmother told me one rule about Baba Yaga, and only one: be polite.',
'"Everyone thinks she eats children," she said. "She does, sometimes. But only the rude ones. Vasilisa went to her hut and asked politely, and she came home with fire. Remember this. If you ever find yourself in front of the hut on chicken legs, you say, \'Hut, hut, turn your back to the forest and your front to me, please.\' And you say please."',
'I thought it was a nice story. Then, when I was eight, I got lost in the forest behind our dacha.',
'I had been picking mushrooms with my cousins and followed a squirrel too far. By the time I looked up, the paths had all disappeared and the birch trees all looked the same. It was getting dark. It was getting cold. I cried for a while, and then I walked, because my grandmother also said that crying never found anyone\'s way home.',
'I came to a clearing. In the clearing was a fence made of bones. Real bones, I remember thinking, like the ones in the museum, with a skull on every post, and in every skull, a candle burning in the eye sockets. And behind the fence, a little wooden hut with its back to me, standing on two enormous, scaly, yellow chicken legs.',
'I stood there with my basket of mushrooms for a very long time. Then I took a deep breath, the way my grandmother taught me, and I said, in my best, clearest voice, "Hut, hut, turn your back to the forest and your front to me, please."',
'The hut creaked. It shifted from one huge foot to the other. And it turned, slowly, until the door faced me. The door opened. A very old woman with a long nose and iron teeth looked out at me, and at my basket, and smiled.',
'"Such good manners," she said. "And such good mushrooms. Is that a honey fungus? Give it here." I gave her the whole basket. She went inside, and came back, and handed me a little wooden doll. "That way," she said, and pointed. And she shut the door, and the hut turned its back to me, and I followed the way she pointed and was home in ten minutes.',
'My grandmother did not seem surprised at all. She took the doll and put it on the shelf above the stove, and she made me eat a bowl of soup, and then she said, "Did you say please?" I said yes. She said, "Good girl. She remembers the ones who say please." I still have the doll. My daughter is learning to say please.']},
{id:'t_llorona',t:'Ay, Mis Hijos',reg:'la',g:['llorona'],p:[
'Every child in our barrio in Mexico City knew where La Llorona walked. She walked along the old canal at the bottom of our street, the one that has been covered with concrete since the 1970s, and she walked at midnight, and she was looking for her children.',
'"Don\'t go near the water at night," my mother said. "She can\'t find her own children, so she takes other people\'s." I said there was no water. The canal was a road now. My mother said, "She doesn\'t know that."',
'When I was fourteen, my little brother Beto had a fever, and my mother sent me to the pharmacy at the corner at eleven at night. To get to it, I had to walk along the road that used to be the canal. It was empty. A dog barked somewhere. A street light flickered.',
'And then, from a long way off, I heard it. "Aaaay... mis hijos..."',
'It was a woman\'s voice, a wail, so full of pain that I stopped walking. It came from somewhere down the road, in the dark. And then again, "Aaaay... mis hijos..." And this time, it was closer, and this time I saw her.',
'She was walking down the middle of the road, where the water used to be. A woman in a long white dress, with long black hair, walking very slowly with her arms out in front of her. Her feet did not touch the road. Under her, I swear this, the concrete looked wet, as if water was flowing there that nobody else could see.',
'I did what my grandmother told me to do. I did not run, because she runs faster. I did not hide, because she finds you. I crossed myself, and I said, as loudly as I could, "Your children are not here, señora. They are with God. Go home."',
'She stopped. She turned her face toward me. I won\'t describe her face. I can\'t. I will only say that she had been crying for five hundred years, and it showed. Then she turned away, and walked on, and the wailing faded down the road toward the old cathedral.',
'I got the medicine. Beto got better. When I told my mother, she didn\'t scold me for being afraid. She held me and said that in all the years she had lived there, she had never heard of anyone speaking to La Llorona. "What did you say?" she asked. I told her. She cried a little, and then she said, "Good. Somebody had to tell her."']},
{id:'t_sombreron',t:'The Man Who Braids Hair',reg:'la',g:['sombreron'],p:[
'In Antigua, Guatemala, when a girl has long, beautiful hair, the old women tell her mother to watch out for El Sombrerón.',
'He is a little man, they say, no taller than a child, in a huge black hat and a suit with silver buttons. He has a guitar. He comes at night to the windows of girls with long hair and big eyes, and he sings to them. And while they sleep, he goes in and braids their hair. Hundreds of tiny braids, so tight and so many that no one can undo them.',
'My cousin Ana had the longest hair in the family. It went past her waist. My aunt was very proud of it. My grandmother kept saying, "Cut it. Or put it up at night." My aunt laughed at her.',
'Then, one morning, Ana came to breakfast with her hair in braids. Hundreds of them. Tiny, perfect, tight braids, all over her head, so intricate it would have taken a hairdresser a week. Ana said she had not done it. She said she had heard music in the night, a guitar, so beautiful that she could not stop smiling, and she had fallen asleep.',
'My aunt tried to undo them. She could not. They were too tight. My grandmother said nothing, but she went out into the yard, and in the stable, the horse\'s mane was braided too. The same tiny, perfect braids.',
'Every night after that, Ana heard the guitar outside her window. Every morning there were new braids. She stopped eating. She sat by the window all day, waiting for night, smiling at nothing. She got thinner and thinner. The doctor could not find anything wrong.',
'It was my grandmother who saved her. She took a pair of the big kitchen scissors, and she sat Ana down in the kitchen, and while Ana screamed and fought and my aunt held her, my grandmother cut off all her hair. Every braid. Right to her scalp. And she threw the braids in the fire.',
'That night, the guitar played outside the window for a long time. It sounded angry. Then it stopped. In the morning, on the windowsill outside, there was a tiny pair of silver spurs, left there like a gift, or a warning.',
'Ana is fine now. She is a lawyer in Guatemala City. She keeps her hair very short, and she told me that sometimes, when she hears a guitar on the radio, she has to turn it off, because for a moment she can\'t stop smiling.']},
{id:'t_duppy',t:'Count the Rice',reg:'cb',g:['soucouyant'],p:[
'My grandmother in Trinidad kept a bag of rice by the front door. Not for cooking. For the soucouyant.',
'"She is an old woman by day," she told me. "She lives in the village. You might buy fish from her. You might say good morning. But at night she takes off her skin and hangs it on a hook and goes out as a ball of fire, looking for young blood."',
'"And the rice?" I asked.',
'"She has to count it," said my grandmother, as if this was obvious. "Every grain. If you spill rice at your door, she must stop and count it before she can come in. And there are many grains in a bag. By the time she finishes, the sun comes up, and she has to go back to her skin."',
'I was staying with her one summer when I was twelve. One night, I woke up because my room was glowing. Through the window, a ball of orange fire was floating over the yard. Slowly. Silently. Like a lantern with no one holding it. It drifted over the mango tree, and over the chicken coop, and stopped above the front door.',
'And then it came down, to the doorstep, where my grandmother had spilled a whole bag of rice the night before. The fire got smaller and dimmer, the way a candle does when you cup your hands around it. And I heard, very quietly, an old woman\'s voice, counting. "One. Two. Three..."',
'I watched it all night. I could not sleep. At four o\'clock, it was still counting. "Twenty-one thousand and six. Twenty-one thousand and seven." It sounded so tired. It sounded like it wanted to cry.',
'At dawn, the fire rose up and flew away fast over the cane fields. In the morning, my grandmother swept up the rice and put it back in the bag. That afternoon we went to the market, and the old lady who sold us fish looked very tired, and had a little rice stuck in her hair.',
'My grandmother smiled at her and said, "Good morning, Miss Agatha. Long night?" And the old lady looked at her for a long time, and then smiled back, with very sharp teeth, and said, "Very long, Miss Ruby. Very long." And she gave us an extra fish, for free.']},
{id:'t_rollingcalf',t:'Chains on the Road',reg:'cb',g:['rollingcalf'],p:[
'My grandfather drove a minibus between Spanish Town and the hills of St. Catherine for forty years, and he would not drive the last stretch after midnight. Not for double fare. Not for triple. If you missed the eleven-thirty, you slept in town.',
'"Rolling calf," he said, when I asked him why. And then he laughed, because he knew I had grown up in Kingston, with television and the internet, and thought he was a silly old country man. "You laugh," he said. "Me laugh too. In the daytime."',
'He told me about the night in 1983 when he broke his own rule. A woman was in labour, up in the hills, and her husband came running to his house at one in the morning, begging. So my grandfather drove. The road climbed through the bush, no lights, just his headlights on the red dirt and the sound of the tree frogs.',
'Halfway up, the frogs stopped. Then he heard the chain. A heavy iron chain, dragging on the road behind the bus. Clank. Scrape. Clank. Getting closer. The husband, in the front seat, began to pray out loud.',
'In the mirror, my grandfather saw it. A great black bull calf, bigger than a cow, running behind the bus. A chain hung around its neck, dragging behind it, striking sparks off the stones. And its eyes were fire. Not red. Fire, burning, like two torches in its head. It ran with its head down, and with every step, it came closer.',
'My grandfather knew the old ways. A rolling calf is a wicked man who could not rest, a butcher, a thief, a murderer. It cannot cross running water. And it must stop and count anything you throw down. So he grabbed the bag of rice he had bought in town for his wife, tore it open with his teeth, and flung the whole thing out of the window behind him across the road.',
'In the mirror, he saw the rolling calf skid to a stop. It lowered its burning eyes to the road. And he heard it, over the engine, a deep, grumbling voice, like a man talking in his sleep. Counting. "One. Two. Three. Four."',
'He drove on. He crossed the little bridge over the gully, where the stream runs all year, and he did not stop again until the house. The baby was born at four in the morning. A girl. They named her after the bus. My grandfather drove home at noon, in sunshine, and on the road where he had thrown the rice, there was not a single grain left. Just a long line of deep hoofprints, and a groove in the dirt where a chain had dragged.']},
{id:'t_bloodymary',t:'Three Times in the Mirror',reg:'na',g:['bloodymary'],p:[
'At every sleepover I went to as a kid in Ohio, someone wanted to do Bloody Mary. You turned off the lights. You stood in front of the bathroom mirror with a candle. You said her name three times. And then, depending on who was telling it, she appeared in the mirror behind you, or she scratched your face, or she pulled you in.',
'Nobody ever actually did it. Someone always chickened out at "Bloody Mary, Bloody Mary..." and everyone screamed and ran back to their sleeping bags, laughing.',
'At Kayla\'s twelfth birthday, Kayla said she would do it. She said it was babyish to be scared. We all crowded in the bathroom doorway, five of us, and Kayla stood in front of the mirror with a candle, and turned off the light.',
'"Bloody Mary," she said. "Bloody Mary." She stopped and grinned at us in the mirror. "Bloody Mary."',
'Nothing happened. Kayla rolled her eyes. We all laughed, a little too loud. We went back to the sleeping bags and ate cake and watched a movie and forgot about it.',
'Around three in the morning I woke up because I needed to pee. Everyone else was asleep. The house was dark. I went down the hall to the bathroom and turned on the light, and in the mirror, I saw Kayla standing behind me, very close, in the doorway.',
'"You scared me," I said, and turned around. There was nobody in the doorway. I turned back to the mirror. Kayla was still there. Standing behind me. Smiling. But I could see, past her reflection, through the open bathroom door, into the living room, where Kayla was lying in her sleeping bag, asleep, with her mouth open.',
'The Kayla in the mirror raised one finger to her lips. Shh.',
'I didn\'t scream. I don\'t know why. I turned off the light and went back to my sleeping bag and lay there until the sun came up, staring at the real Kayla, asleep. In the morning she was totally normal. She\'s still totally normal. She\'s a dental hygienist in Columbus. We\'re friends on Facebook. But she\'s never once, in any photo, stood next to a mirror, and I\'ve noticed that in every photo of her, there\'s something slightly wrong about her smile.']},
{id:'t_hookman',t:'Lovers\' Lane',reg:'na',g:['hookman'],p:[
'This is the oldest one. Your parents told it. Their parents told it. It\'s in every collection of urban legends. You probably already know how it ends. Hear it anyway.',
'A boy and a girl drive up to a dark spot on a hill above town to park. Lovers\' lane. They turn off the engine and turn on the radio. After a while, the music stops and a news announcer comes on. A man has escaped from the state hospital nearby. He is dangerous. He has a hook instead of a right hand.',
'The girl wants to leave. The boy laughs at her. She hears something outside, a scratching sound, on the car. The boy says it\'s a branch. She insists. Finally, angry, he starts the car and drives off too fast, spinning his tyres in the gravel, and drives her home without talking.',
'When he walks around to open her door, he stops. He goes white. Hanging from the door handle on her side of the car is a bloody metal hook.',
'That\'s the story. Everybody knows it. Here is the part nobody tells.',
'My dad was the boy. 1974. Lake Road, outside Albany, Georgia. He swears it\'s true. And he says the story always gets one thing wrong. In the story, the scratching stops when they drive away. In real life, my dad says, as they drove off, the scratching sound got louder. All the way down the hill. Scrape. Scrape. Scrape. On the roof of the car.',
'"The hook wasn\'t on the door handle," he said. "It was on the roof rack. It was holding on. He rode down the hill with us." When they stopped in front of my mom\'s house, there was a long, deep scratch the length of the roof, and the hook hanging from the end of it. And a little way back down the road, my dad saw a shape picking itself up out of the ditch.',
'My mom married him anyway. I asked her once if it was true. She said, "Ask your father why he still won\'t park anywhere he can\'t see behind the car." I asked him. He didn\'t answer. He just went outside and checked the roof.']},
{id:'t_wendigo2',t:'The Hungry Winter',reg:'ca',g:['abaasy'],p:[
'In Yakutia, the winters are so cold that if you throw a cup of boiling water into the air, it turns to snow before it hits the ground. My grandfather was a reindeer herder there, and he said that cold like that does things to the world. It makes the walls between things thin.',
'He told me about the winter of 1969, when the temperature fell below minus sixty and stayed there for a month. The herders were camped far from any village. Food ran low. And on the twentieth night, one of the herders, a quiet man called Semyon, went out to check the reindeer and did not come back.',
'They found his tracks in the morning. They went out across the snow toward the forest, and then they changed. The steps got longer. Much longer. Three metres apart. Then five. Then the tracks did not look like a man\'s any more. They looked like something with one leg, hopping.',
'My grandfather said that was when the old woman in their group, who was a shaman\'s daughter, told them to put out all the fires but one, and to say nothing, and to keep the children inside.',
'"It is an abaasy," she said. "A demon from the lower world. It has one leg and one arm and one eye in the middle of its forehead. In the hungry winters, it comes up through the ice. Semyon went out alone, and it got into him, and now it is wearing him."',
'That night, they heard Semyon\'s voice outside the tent. He was calling them by name. He said he was cold. He said he had got lost and found his way back. He asked them to let him in, please, just to warm his hands.',
'Nobody moved. The voice went on for hours, going around and around the tent. It knew everyone\'s name. It knew things Semyon knew, stories, jokes. And then my grandfather, who was nineteen, saw through a gap in the reindeer skins: Semyon, standing in the snow, smiling. He had one eye in the middle of his forehead. He was standing on one leg.',
'At dawn, the old woman went out with a drum and a knife and walked into the forest, and came back an hour later, and said it was done. They never found Semyon. In the spring, when the snow melted, they found a single boot at the edge of the forest. It was frozen solid. It was filled with ice, all the way up. Under the ice, there was nothing at all.']},
{id:'t_yowie',t:'Something on the Ridge',reg:'oc',g:['yowie'],p:[
'We were camping in the Blue Mountains, four of us, on a long weekend in winter. It was my mate Craig\'s idea. Craig was a bushwalker, one of those blokes with a GPS watch and opinions about tents, and he knew a spot off the track, a flat bit of ground above a creek, with no other campers for miles.',
'The first night was fine. Cold, clear, a thousand stars. We cooked sausages and drank beer and laughed about nothing.',
'The second night, everything went quiet. That\'s the first thing I noticed. In the Australian bush, at night, there is always noise: frogs, possums screaming, birds. And then, around ten, it all stopped. All of it. At once. Like someone had pressed a button. Craig stopped talking mid-sentence.',
'Then we smelled it. A terrible smell, like a wet dog that had been dead for a week, rolled in rubbish. It came from up the ridge behind us. And with it came a sound: something big moving through the scrub, not trying to be quiet. Branches snapping. Heavy steps. Two legs, not four.',
'Craig had a big torch. He pointed it up the ridge. At the edge of the beam, about fifty metres away, between two gum trees, something was standing. It was tall. Maybe two and a half metres. Covered in dark, matted hair. Its arms hung down past its knees. Its eyes shone yellow in the torchlight.',
'It did not move. We did not move. Nobody said anything for what felt like a full minute. Then it made a sound, low, like a grunt and a growl at once, and it picked up a rock the size of a football and threw it, overarm, like a person. The rock hit a tree three metres from our fire and broke in half.',
'We packed up in the dark and walked out to the car, six kilometres, and drove back to Sydney without stopping. I didn\'t tell anyone for years.',
'When I finally told my grandmother, who grew up near Katoomba, she wasn\'t surprised. She said her father used to leave a little food at the edge of the bush when he went camping, and say out loud, "We\'re just passing through, mate. We\'ll be gone in the morning." She said he never had any trouble. I go back every year now. I leave a sausage on a rock, and I say it out loud. Every year, in the morning, the sausage is gone.']},
{id:'t_nightmarch',t:'Lie Face Down',reg:'oc',g:['nightmarchers'],p:[
'My tūtū (grandmother) lived on the north shore of Oʻahu, and she told me that if I ever heard drums at night, coming from the mountains when there was no festival, I should lie down on the ground, face down, and not look up. Not for anything. Not for anyone.',
'"They are the nightmarchers," she said. "The old warriors. The huaka\'i pō. They march along the old paths to the sea, the same way they marched a thousand years ago. If you look at them, you die. Unless one of them is your ancestor, and calls out for you to be spared."',
'I was seventeen, and I had a car, and I thought I knew everything. One night, my friends and I drove up into the hills above Kahuku to look at the stars. We parked on a dirt road and lay on the hood of the car. It was perfect. The sky was full of stars, and the ocean was a black line in the distance, and the night was so quiet you could hear the surf.',
'Then we heard the drums.',
'They came from higher up the valley. Slow, heavy drums, like a heartbeat. With them came a smell, like smoke and flowers, and a sound of conch shells blowing, and many voices chanting. And on the ridge above us, coming down the old path toward the sea, we saw torches. Dozens of them. In a long line. Moving toward us.',
'My friends laughed and pulled out their phones to film it. I didn\'t. I heard my tūtū\'s voice in my head, and I slid off the hood of the car and lay face down in the red dirt, and I put my arms over my head, and I shut my eyes, and I prayed.',
'The drums came closer. The chanting came closer. I heard feet, hundreds of bare feet, walking past me so close I felt the wind of them. I smelled the smoke. And then, right next to my ear, an old man\'s voice said something in Hawaiian. Not to me. To the others. It sounded like a name. My name, the Hawaiian name my tūtū gave me that nobody uses.',
'And the feet went on, past me, down the hill toward the sea, and the drums faded.',
'When I looked up, my friends were lying on the ground too. All of them had dropped their phones. None of the videos had anything on them but darkness. My tūtū did not say anything when I told her. She just went into her room and came back with an old photo of a man I had never seen, her grandfather. "He was a chanter," she said. "He always had a loud voice. I\'m glad he used it."']}

const TALE_BY=Object.fromEntries(TALES.map(t=>[t.id,t]));
function talesView(m){ST.tales=ST.tales||{};
  m.innerHTML=`<section class="stage setup"><h1>Tales by candlelight</h1><p class="lede">${TALES.length} short stories, written for Nightlore and built on the old legends. Read them alone, late, with the lights off. Or have them read aloud to you.</p>
  <div class="tales">${TALES.map(t=>`<button class="tale ${ST.tales[t.id]?'read':''}" data-tale="${t.id}"><span class="tale-r">${esc(REGIONS[t.reg]||'')}</span><b>${esc(t.t)}</b><small>${esc(t.g.map(x=>GBY[x]?GBY[x].name:x).join(', '))} · ${Math.max(2,Math.round(t.p.join(' ').split(/\s+/).length/200))} min${ST.tales[t.id]?' · read':''}</small></button>`).join('')}</div>
  <p class="small">${Object.keys(ST.tales).length}/${TALES.length} tales read.</p></section>`;
  m.querySelectorAll('[data-tale]').forEach(b=>b.onclick=()=>readTale(m,b.dataset.tale))}
function readTale(m,id){const t=TALE_BY[id];if(!t)return;hush();
  m.innerHTML=`<section class="stage tale-read"><button class="btn ghost" data-back>← All tales</button><p class="kicker">${esc(REGIONS[t.reg]||'')}</p><h1>${esc(t.t)}</h1>
  <div class="row"><button class="btn" data-aloud>Read it to me</button>${t.g.map(x=>GBY[x]?`<button class="btn ghost" data-meet="${x}">Meet ${esc(GBY[x].name)}</button>`:'').join('')}</div>
  <article class="tale-body">${t.p.map((p,i)=>`<p data-pi="${i}">${esc(p)}</p>`).join('')}</article>
  <p class="tale-end">— the end —</p><div class="row"><button class="btn primary" data-next>Next tale</button><button class="btn ghost" data-back>← All tales</button></div></section>`;
  window.scrollTo(0,0);
  m.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{hush();talesView(m)});
  m.querySelectorAll('[data-meet]').forEach(b=>b.onclick=()=>{hush();openGhost(b.dataset.meet)});
  m.querySelector('[data-next]').onclick=()=>{const i=TALES.indexOf(t);readTale(m,TALES[(i+1)%TALES.length].id)};
  let reading=false;m.querySelector('[data-aloud]').onclick=e=>{if(!canSpeak){toast('Your browser can\'t read aloud.');return}if(reading){hush();reading=false;e.target.textContent='Read it to me';return}reading=true;e.target.textContent='Stop reading';
    const ps=[...m.querySelectorAll('.tale-body p')];let i=0;const nxt=()=>{if(!reading||i>=ps.length){reading=false;return}ps.forEach(x=>x.classList.remove('now'));const p=ps[i++];p.classList.add('now');p.scrollIntoView({behavior:'smooth',block:'center'});
      const u=new SpeechSynthesisUtterance(p.textContent);u.rate=.88;u.pitch=.7;const v=speechSynthesis.getVoices().find(v=>/en(-|_)(GB|US)/.test(v.lang));if(v)u.voice=v;u.onend=nxt;speechSynthesis.speak(u)};speechSynthesis.cancel();nxt()};
  /* the last line lands with a soft shiver when you reach it */
  const last=m.querySelector('.tale-body p:last-child');let fired=false;
  const io='IntersectionObserver' in window?new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting&&!fired){fired=true;ST.tales[id]=1;save();if(typeof addXP==='function')addXP(15);if(typeof checkAch==='function')checkAch();if(isNight()&&SET.level!=='off'&&GBY[t.g[0]]&&Math.random()<.5)setTimeout(()=>{try{cry(GBY[t.g[0]],'tease')}catch(e){}},1400);io.disconnect()}})},{threshold:.9}):null;if(io)io.observe(last);else{ST.tales[id]=1;save()}}

function setVB(){const s=$('#msvg');if(!s)return;const r=ratio();vb.w=Math.max(40,Math.min(1000,vb.w));vb.h=vb.w*r;vb.x=Math.max(0,Math.min(1000-vb.w,vb.x));vb.y=Math.max(-40,Math.min(480-vb.h,vb.y));s.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);drawPins()}
function zoomAt(f,cx=.5,cy=.5){const nw=vb.w*f;vb.x+=(vb.w-nw)*cx;vb.y+=(vb.h-nw*ratio())*cy;vb.w=nw;setVB()}
function bindMap(){const s=$('#msvg'),P=new Map();let moved=0,pd=0;
  $$('[data-z]').forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='in')zoomAt(.6);else if(z==='out')zoomAt(1.6);else home()});
  s.addEventListener('wheel',e=>{e.preventDefault();const r=s.getBoundingClientRect();zoomAt(e.deltaY>0?1.15:.87,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
  s.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
  s.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const r=s.getBoundingClientRect(),prev=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===1){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){s.setPointerCapture&&s.setPointerCapture(e.pointerId);vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;setVB()}}
    else if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd){zoomAt(pd/d,((a[0]+b[0])/2-r.left)/r.width,((a[1]+b[1])/2-r.top)/r.height)}pd=d;moved=99}});

/* ================= GHOST CARDS ================= */
function rarityOf(g){if(g.rev)return'blessed';if(g.danger>=5)return'legendary';if(g.danger>=4)return'epic';if(g.danger>=3)return'rare';return'common'}
const RAR={common:['Common','#8c94a8'],rare:['Rare','#4aa3ff'],epic:['Epic','#b45cff'],legendary:['Legendary','#ff4a5c'],blessed:['Blessed','#f2c14a']};
function cardsOwned(){ST.cards=ST.cards||{};(ST.met||[]).forEach(id=>{if(!ST.cards[id])ST.cards[id]=1});return ST.cards}
function giveCard(id,quiet){const c=cardsOwned();const fresh=!c[id];c[id]=(c[id]||0)+1;save();if(fresh&&!quiet&&GBY[id])toast(`<b>New card</b> ${esc(GBY[id].name)} · ${RAR[rarityOf(GBY[id])][0]}`,'ach');checkAch();return fresh}
function packsAvail(){ST.packs=ST.packs||0;const earned=Math.floor((ST.dawns||0)/1)+Math.floor((ST.hunts||0))+(ST.seances||0)+(ST.hides||0);ST.packEarned=ST.packEarned||0;
  if(earned>ST.packEarned){ST.packs+=earned-ST.packEarned;ST.packEarned=earned;save()}const free=ST.packDay!==today();return ST.packs+(free?1:0)}
function rollCard(){const r=Math.random(),want=r<.02?'blessed':r<.07?'legendary':r<.2?'epic':r<.45?'rare':'common';const pool=GHOSTS.filter(g=>rarityOf(g)===want&&!g.mine);return pickA(pool.length?pool:GHOSTS)}
function cardHTML(g,own,n,inner){const r=rarityOf(g),T=inner?'div':'button';return own?`<${T} class="gcard r-${r}" ${inner?'':`data-card="${g.id}"`} style="--rc:${RAR[r][1]}"><span class="gc-art">${portrait(g)}</span><b>${esc(g.name)}</b><small>${esc(REGIONS[g.reg]||'')} · ${RAR[r][0]}${n>1?' ×'+n:''}</small></${T}>`:`<div class="gcard locked"><span class="gc-art">?</span><b>???</b><small>${esc(REGIONS[g.reg]||'')}</small></div>`}
function cardsView(m,filter='all',reg='all'){const c=cardsOwned(),own=Object.keys(c).filter(id=>GBY[id]).length,av=packsAvail();

  const order={blessed:0,legendary:1,epic:2,rare:3,common:4};list.sort((a,b)=>(c[b.id]?1:0)-(c[a.id]?1:0)||order[rarityOf(a)]-order[rarityOf(b)]);
  m.innerHTML=`<section class="stage setup"><button class="btn ghost" data-back>← Back</button><h1>Ghost cards</h1>
  <p class="lede">${own} of ${GHOSTS.filter(g=>!g.mine).length} collected. Survive a ghost to win its card. Every dawn, hunt, séance and hide earns a pack, and there is a free pack every day.</p>

  <div class="cf">${['all','own','common','rare','epic','legendary','blessed'].map(k=>`<button class="${filter===k?'on':''}" data-cf="${k}"><b>${k==='all'?'All':k==='own'?'Mine':RAR[k][0]}</b></button>`).join('')}</div>
  <div class="cf">${[['all','Everywhere'],...Object.entries(REGIONS)].map(([k,l])=>`<button class="${reg===k?'on':''}" data-cr="${k}"><b>${esc(l)}</b></button>`).join('')}</div>
  <div class="gcards">${list.slice(0,160).map(g=>cardHTML(g,!!c[g.id],c[g.id])).join('')}</div>${list.length>160?`<p class="small">Showing 160 of ${list.length}. Filter by region to see more.</p>`:''}</section>`;
  m.querySelector('[data-back]').onclick=backM;m.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>cardsView(m,b.dataset.cf,reg));m.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>cardsView(m,filter,b.dataset.cr));

    if(start===null&&holding)start=now;const el=start===null?0:now-start;$('.air i').style.width=Math.max(0,100-used/air*100)+'%';
    if(now-stepT>650&&el<steps){stepT=now;sfx('thump',.12+.2*(el/steps),Math.sin(el/600))}
    if(start===null&&now-t0>2600)return fin(false,'It heard you breathe.');
    if(used>=air)return fin(false,'You gasped for air.');
    if(start!==null&&el<steps&&!holding&&el>400)return fin(false,'It heard you breathe.');
    if(start!==null&&el>=steps){$('[data-st]').textContent='The footsteps are gone.';if(found&&Math.random()<.45)return fin(false,'It knew exactly where you were.');if(!holding||el>steps+600)fin(true)}},50)}

  $('[data-again]').onclick=()=>{view='survive';shell();hideSetup($('#main'))};$('[data-back]').onclick=backM}

const ID_G={
kuntilanak:['Perempuan bergaun putih yang meninggal sebelum anaknya lahir, bertengger tinggi di pepohonan. Kata orang, tawa yang pelan berarti ia tepat di sampingmu; tawa yang keras berarti ia jauh.','Tawa perempuan terdengar dari pepohonan. Pelan. Sangat pelan.','Terus berjalan tanpa menengadah','Menengadah ke dahan-dahan'],
pocong:['Jenazah yang tali kafannya tak pernah dilepas. Kakinya terikat sehingga tak bisa berjalan, maka ia melompat, dan ia ingin talinya dilepas agar bisa beristirahat.','Duk. Duk. Sesuatu terbungkus kain putih melompat di gang menuju ke arahmu.','Lepaskan ikatan di atas kepalanya','Lari menyusuri gang'],
genderuwo:['Makhluk besar berbulu penghuni pohon beringin tua dan bangunan kosong. Ia pandai meniru, dan suka meminjam suara orang yang kamu percaya.','Suara temanmu memanggil dari beringin yang gelap. Padahal temanmu sudah pulang sejam lalu.','Jangan jawab siapa pun dan tinggalkan pohon itu','Ikuti suara yang kamu kenal'],
