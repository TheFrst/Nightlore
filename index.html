wewegombel:['Makhluk berlengan panjang dari Bukit Gombel yang menyembunyikan anak-anak yang ditelantarkan di rumah, dan mengembalikannya ketika orang tuanya berubah.','Seorang anak berdiri di tepi kebun kelapa. Sebuah lengan panjang melambai dari kegelapan.','Panggil anak itu pulang dengan lembut dan berjanji akan lebih baik','Membentak dan memarahi anak itu'],
leak:['Penganut ilmu hitam yang kepalanya berkeliaran malam hari dengan organ yang menyala menjuntai. Orang melihatnya sebagai cahaya melayang di atas kuburan.','Cahaya pucat melayang di atas kuburan. Lalu sebuah kepala ikut terangkat.','Tetap di halaman pura sampai fajar','Ikuti cahaya yang melayang'],
susterngesot:['Hantu suster yang menyeret tubuhnya di lorong rumah sakit tua, masih menjalankan tugas jaganya.','Di bangsal kosong, sesuatu terseret di atas ubin. Sret. Sret.','Naik ke ranjang dan jauhkan kakimu dari lantai','Sembunyi di kolong ranjang'],
sundelbolong:['Perempuan cantik bergaun putih yang rambut panjangnya menutupi lubang di punggungnya. Katanya ia mencegat lelaki di jalan sepi.','Perempuan cantik minta numpang payungmu. Rambutnya terlihat berat aneh di bagian belakang.','Tolak dengan sopan dan tetap di jalan yang terang','Sibakkan rambutnya'],
banaspati:['Makhluk api yang menggelinding di jalan gelap seperti bola api, kadang berjalan dengan tangannya. Ia takut air.','Bola api menggelinding di jalan, lalu berdiri di atas dua tangan menyala.','Masuk ke sungai kecil di tepi jalan','Mencoba menginjak padamkan apinya'],
babingepet:['Orang yang berubah menjadi babi hitam untuk mencuri dari tetangga, sementara pasangannya menjaga lilin di rumah. Kalau apinya bergoyang, babinya dalam bahaya.','Babi hitam menggesek pintu toko. Lewat jendela, sebatang lilin berkedip.','Cari lilinnya dan tiup sampai padam','Pojokkan babinya dengan sapu'],
nyiroro:['Ratu Pantai Selatan dalam tradisi Jawa, yang hingga kini dihormati dengan sesaji. Pengunjung pantai selatan diminta tidak memakai hijau, warnanya.','Di pantai selatan, ombak berubah hijau zamrud. Kamu memakai baju hijau.','Mundur dari ombak dan tundukkan kepala','Masuk ke air untuk melihat lebih dekat'],
palasik:['Cerita Minangkabau tentang orang yang melepas kepalanya malam hari untuk memangsa bayi. Keluarga menjaga bayi tetap dekat dan lampu tetap menyala.','Tetangga terlalu lama memuji bayimu hari ini. Malam ini, sesuatu mengetuk jendela.','Tutup jendela dan biarkan lampu menyala','Buka jendela untuk melihat'],

bunian:['Orang-orang tak kasatmata di hutan dalam yang tinggal di kampung tersembunyi. Pengembara yang mendekati musik mereka bisa tak kembali bertahun-tahun.','Musik terdengar dari dalam hutan: pesta pernikahan yang tak pernah mengundangmu.','Minta izin dengan suara keras lalu berbalik','Ikuti musiknya'],
jenglot:['Makhluk mumi kecil yang disimpan kolektor di dalam kotak, konon meminum darah. Orang Indonesia masih berdebat apakah ia nyata.','Kotak kecil di toko barang antik terasa hangat. Sesuatu di dalamnya menggaruk.','Biarkan di kotaknya dan kembalikan','Beri setetes darahmu'],
kuyang:['Cerita Dayak dan Banjar tentang kepala melayang dengan organ menjuntai, konon memburu bayi baru lahir. Daun berduri digantung di pintu untuk menangkalnya.','Cahaya merah samar melayang di atas kampung sungai tempat bayi lahir hari ini.','Gantung daun berduri di pintu dan jendela','Biarkan bayi tidur dekat jendela terbuka'],
nyiblorong:['Perempuan berekor ular, abdi Ratu Pantai Selatan. Katanya ia memberi kekayaan lewat perjanjian rahasia, dan harganya selalu ditagih.','Perempuan bersisik emas di bawah pinggang menawarkan peti penuh koin emas. "Hanya harga kecil," katanya.','Tolak perjanjiannya dan pergi','Terima emasnya'],
kemamang:['Api hantu Jawa yang melayang di atas kolam dan sungai malam hari, memancing orang mendekati air.','Nyala api melayang di atas kolam yang gelap, menyala tanpa kayu, makin dekat.','Mundur dari tepi air','Ikuti apinya ke kolam'],
butoijo:['Raksasa hijau dari cerita Jawa. Dalam kisah Timun Mas, seorang gadis lolos dengan melempar biji ajaib, jarum, garam dan terasi ke belakang.','Tanah bergetar. Raksasa hijau berlari mengejarmu melintasi sawah.','Lempar garam ke belakang: ia menjadi lautan','Sembunyi di kebun timun'],
jelangkung:['Boneka dari batok kelapa dan kayu untuk memanggil arwah. "Datang tak dijemput, pulang tak diantar", kecuali kamu memulangkannya dengan benar.','Permainan jelangkung sepupumu jadi sunyi. Kayu bonekanya menulis sendiri.','Ucapkan kata-kata untuk memulangkan arwahnya','Simpan bonekanya dan pergi tidur'],
jerukpurut:['Legenda kuburan paling terkenal di Jakarta: pastor tanpa kepala berjalan di antara makam Jeruk Purut malam hari bersama seekor anjing.','Kuburan Jeruk Purut, tengah malam. Seorang berjubah panjang berjalan dengan anjing. Ia mengepit kepalanya.','Tinggalkan kuburan lewat jalan tadi','Ikuti ia di antara makam'],
simanis:['Perempuan cantik yang dibunuh dekat jembatan Ancol lama, dikenal dalam cerita Betawi sebagai Si Manis. Ia menunggu lelaki yang menyeberang malam hari.','Di jembatan Ancol, perempuan cantik berkebaya tersenyum dan minta diantar pulang.','Tersenyum sopan dan terus menyetir','Berhenti dan tawarkan tumpangan'],
casablanca:['Terowongan Jakarta yang dibangun dekat bekas pemakaman. Pengemudi bilang perempuan berbaju putih muncul di sana larut malam.','Terowongan Casablanca pukul 2 pagi. Sosok putih berdiri di dinding berubin.','Terus menyetir dan jangan menoleh','Hentikan mobil untuk melihat'],
nonibelanda:['Hantu noni Belanda yang katanya menghuni bangunan zaman kolonial seperti Lawang Sewu, terlihat di tangga dan lorong panjang.','Seorang noni bergaun Eropa kuno menunggu di puncak tangga kolonial.','Tetap di lantai dasar bersama rombonganmu','Ikuti ia naik tangga'],
inyiakbalang:['Si kakek belang: roh harimau yang dihormati dalam tradisi Minangkabau sebagai penjaga kampung dan hutan. Di hutan orang tidak menyebut "harimau"; mereka menyebut Inyiak.','Di jalan hutan, seekor harimau besar berdiri diam, menatapmu dengan tenang.','Sapa ia dengan hormat sebagai "Inyiak" dan menepi','Teriak "harimau!" dan lempari batu'],
geunteut:['Makhluk raksasa berbulu di hutan dalam cerita Aceh dan Gayo, dengan jejak kaki sangat besar.','Jejak kaki lebih panjang dari lenganmu melintasi sungai hutan.','Tinggalkan hutan sebelum senja','Ikuti jejaknya lebih dalam'],
poppo:['Makhluk Bugis bermata merah menyala yang terbang malam hari dan memangsa orang sakit.','Temanmu yang demam tertidur. Mata merah menyala di kasau.','Biarkan lampu menyala dan duduk di sampingnya','Tinggalkan ia sendirian dalam gelap'],

wongsamar:['"Orang samar" dalam kepercayaan Bali yang hidup tak kasatmata di hutan, jurang dan pohon besar. Bersikap kasar di tempat mereka mendatangkan sial.','Di jurang terdengar tawa dan gamelan, tapi tak ada siapa pun.','Minta izin pelan-pelan dan tinggalkan sesaji','Teriak dan buang sampah ke jurang'],
ebugogo:['Makhluk kecil berbulu dari cerita orang Nage di Flores, katanya memakan semua yang disajikan dan menirukan apa yang mereka dengar.','Sesuatu yang kecil menggumamkan ulang kata-katamu dari tepi ladang.','Bawa anak-anak masuk dan tetap diam','Tawarkan makanan desa padanya'],
pontianak:['Sepupu Melayu kuntilanak, ditandai harum bunga kemboja. Paku yang ditancapkan di tengkuknya konon menjinakkannya.','Harum bunga kemboja di udara, padahal tak ada bunga.','Genggam paku besi dan cepat pergi','Cari bunganya'],
toyol:['Makhluk kecil hijau seperti anak yang disuruh mencuri. Ia suka bermain, dan kelereng yang ditebar di lantai membuatnya sibuk sampai pagi.','Dompetmu makin ringan setiap pagi. Sesuatu terkikik di bawah lemari.','Tebar kelereng di lantai','Kunci uangmu dan tidur'],
penanggal:['Perempuan yang kepalanya lepas malam hari dengan organ menjuntai. Daun berduri di ambang jendela menjerat isi perutnya.','Suara basah terseret di luar. Sesuatu berkilau saat naik melewati jendela.','Taruh daun pandan berduri di ambang jendela','Biarkan jendela terbuka agar sejuk'],
orangminyak:['"Orang minyak" dalam kepanikan di Malaysia tahun 1960-an dan 2000-an: sosok hitam licin yang lolos dari genggaman mana pun dan menyusup ke rumah malam hari.','Seorang lelaki berkilat minyak hitam berjongkok di ambang jendela. Tanganmu meleset darinya.','Nyalakan semua lampu dan bangunkan seisi rumah','Coba tangkap dia'],
hanturaya:['Roh kuat yang terikat pada garis keluarga dan bisa menyerupai tuannya. Saat pemiliknya meninggal ia mencari tuan baru, dan menerimanya berarti terikat.','Lelaki tua yang sekarat menekan sesuatu ke tanganmu. "Ambillah. Ia akan melayanimu."','Tolak apa yang ia coba wariskan','Terima pemberiannya'],
bajang:['Makhluk peliharaan yang disimpan dalam tabung bambu tertutup, berwujud musang, membawa penyakit pada anak-anak.','Bayangan berbentuk musang menyelinap keluar dari tabung bambu di rak.','Tutup tabungnya dan bawa ke bomoh','Buka tabung untuk melihat isinya'],
hantupemburu:['Pemburu Hantu Melayu yang berkuda melintasi langit malam bersama anjing-anjingnya, terus berburu selamanya.','Anjing melolong tinggi di atas pucuk pohon, dan bunyi terompet.','Berlindung di bawah atap sampai anjingnya lewat','Berdiri di tempat terbuka untuk melihat perburuan'],
hantugalah:['Hantu galah Melayu, kurus seperti tongkat dan lebih tinggi dari pepohonan, yang makin tinggi kalau kamu mendongak.','Sesuatu setipis galah membungkuk di atas jalan kampung, lebih tinggi dari pohon kelapa.','Menunduk dan lewati dengan tenang','Mendongak untuk melihat wajahnya'],
langsuir:['Hantu Melayu berkuku panjang dengan lubang di leher yang tertutup rambut. Memotong kukunya dan menyumpal lubangnya dengan rambut akan menjinakkannya.','Perempuan berkuku hijau sangat panjang bertengger di pagar. Rambutnya menutupi lehernya.','Potong kukunya dan sumpal lubang dengan rambutnya','Lari ke hutan'],
polong:['Makhluk kecil yang disimpan dalam botol dan diberi darah dari jari pemiliknya, dikirim untuk mencelakai orang.','Botol kaca kecil di rak bergetar sendiri.','Bawa botolnya ke bomoh','Buka sumbat botolnya']};
